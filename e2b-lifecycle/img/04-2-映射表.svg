<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="612" viewBox="0 0 1600 612" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="612" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">映射表：一块数据在哪一代、哪个偏移</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">数据文件只是紧凑地首尾相接的块；映射表按设备地址排序、完整覆盖整个设备，每一行说“这一段在第几代的文件里、从哪个偏移开始”。</text>
<text x="48.0" y="156.0" font-size="14" fill="#57606A" text-anchor="start">设备（内存或磁盘），单位 MiB</text>
<rect x="48.0" y="171.0" width="373.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="234.5" y="193.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">第 1 代</text>
<text x="234.5" y="215.6" font-size="12" fill="#57606A" text-anchor="middle">0～4 MiB</text>
<rect x="424.0" y="171.0" width="185.0" height="60.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="516.5" y="193.0" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="middle">第 3 代</text>
<text x="516.5" y="215.6" font-size="12" fill="#57606A" text-anchor="middle">4～6 MiB</text>
<rect x="612.0" y="171.0" width="373.0" height="60.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="798.5" y="193.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">第 2 代</text>
<text x="798.5" y="215.6" font-size="12" fill="#57606A" text-anchor="middle">6～10 MiB</text>
<rect x="988.0" y="171.0" width="561.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1268.5" y="193.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">第 1 代</text>
<text x="1268.5" y="215.6" font-size="12" fill="#57606A" text-anchor="middle">10～16 MiB</text>
<line x1="706.0" y1="161.0" x2="706.0" y2="241.0" stroke="#D6603D" stroke-width="2" stroke-linecap="round"/>
<text x="712.0" y="256.0" font-size="13.5" fill="#9A3215" font-weight="600" text-anchor="start">要读 7 MiB</text>
<rect x="48.0" y="296.0" width="1120.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="318.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">设备偏移</text>
<text x="318.0" y="318.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">长度</text>
<text x="518.0" y="318.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">在哪一代</text>
<text x="798.0" y="318.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">那一代文件里的偏移</text>
<line x1="48.0" y1="378.5" x2="1168.0" y2="378.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="361.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">0</text>
<text x="318.0" y="361.1" font-size="13.5" fill="#1F2328" text-anchor="start">4 MiB</text>
<text x="518.0" y="361.1" font-size="13.5" fill="#1F2328" text-anchor="start">第 1 代（模板）</text>
<text x="798.0" y="361.1" font-size="13.5" fill="#1F2328" text-anchor="start">0</text>
<line x1="48.0" y1="420.8" x2="1168.0" y2="420.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="403.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">4 MiB</text>
<text x="318.0" y="403.3" font-size="13.5" fill="#1F2328" text-anchor="start">2 MiB</text>
<text x="518.0" y="403.3" font-size="13.5" fill="#1F2328" text-anchor="start">第 3 代（本代）</text>
<text x="798.0" y="403.3" font-size="13.5" fill="#1F2328" text-anchor="start">0</text>
<rect x="48.0" y="422.8" width="1120.0" height="38.2" rx="6" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="58.0" y="445.6" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">6 MiB</text>
<text x="318.0" y="445.6" font-size="13.5" fill="#0E6B4F" text-anchor="start">4 MiB</text>
<text x="518.0" y="445.6" font-size="13.5" fill="#0E6B4F" text-anchor="start">第 2 代</text>
<text x="798.0" y="445.6" font-size="13.5" fill="#0E6B4F" text-anchor="start">2 MiB</text>
<line x1="48.0" y1="505.2" x2="1168.0" y2="505.2" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="487.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">10 MiB</text>
<text x="318.0" y="487.8" font-size="13.5" fill="#1F2328" text-anchor="start">……</text>
<text x="518.0" y="487.8" font-size="13.5" fill="#1F2328" text-anchor="start">第 1 代</text>
<text x="798.0" y="487.8" font-size="13.5" fill="#1F2328" text-anchor="start">10 MiB</text>
<rect x="1228.0" y="296.0" width="324.0" height="220.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1390.0" y="365.6" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">读 7 MiB</text>
<text x="1390.0" y="390.8" font-size="14" fill="#57606A" text-anchor="middle">落在 6 MiB 起那一行</text>
<text x="1390.0" y="411.8" font-size="14" fill="#57606A" text-anchor="middle">7 − 6 = 1 MiB</text>
<text x="1390.0" y="432.8" font-size="14" fill="#57606A" text-anchor="middle">去读第 2 代文件的</text>
<text x="1390.0" y="453.8" font-size="14" fill="#57606A" text-anchor="middle">2 + 1 = 3 MiB 处</text>
<line x1="48.0" y1="546.0" x2="1552.0" y2="546.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="572.0" font-size="13" fill="#8C959F" text-anchor="start">每一代的映射表都是完整的：新一代 = 上一代的表 + 本代写过的块覆盖上去。从没写过的地方标成“空”，读出来是全零。</text></svg>