<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="582" viewBox="0 0 1600 582" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="582" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">原生快照的适用场景</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">成本模型和场景匹配就合适：产物自足、能搬走、不依赖活着的进程。不擅长的是高频、低延迟、沙箱不能中断，那是快照回滚的场景。</text>
<rect x="48.0" y="156.0" width="722.0" height="330.0" rx="14" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="68.0" y="186.0" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="start">擅长</text>
<circle cx="76.0" cy="231.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="88.0" y="236.0" font-size="14.5" fill="#1F2328" text-anchor="start">跨节点迁移：产物进对象存储，任何节点都能加载</text>
<circle cx="76.0" cy="277.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="88.0" y="282.0" font-size="14.5" fill="#1F2328" text-anchor="start">长期保存：不依赖任何活着的资源</text>
<circle cx="76.0" cy="323.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="88.0" y="328.0" font-size="14.5" fill="#1F2328" text-anchor="start">进程崩溃后恢复：本来就是新建进程</text>
<circle cx="76.0" cy="369.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="88.0" y="374.0" font-size="14.5" fill="#1F2328" text-anchor="start">沙箱离场再回来：停掉本来就是场景的一部分</text>
<circle cx="76.0" cy="415.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="88.0" y="420.0" font-size="14.5" fill="#1F2328" text-anchor="start">低频：几百毫秒的固定开销摊得开</text>
<rect x="830.0" y="156.0" width="722.0" height="330.0" rx="14" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="850.0" y="186.0" font-size="15" fill="#9A3215" font-weight="600" text-anchor="start">不擅长</text>
<circle cx="858.0" cy="231.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="870.0" y="236.0" font-size="14.5" fill="#1F2328" text-anchor="start">高频回退：每存一次停一次、拆一次</text>
<circle cx="858.0" cy="277.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="870.0" y="282.0" font-size="14.5" fill="#1F2328" text-anchor="start">低延迟：暂停 250 ms 起，恢复 100 ms 起，再加缺页</text>
<circle cx="858.0" cy="323.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="870.0" y="328.0" font-size="14.5" fill="#1F2328" text-anchor="start">沙箱不能中断：暂停一定会停掉沙箱</text>
<rect x="854.0" y="386.0" width="674.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1191.0" y="415.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">快照回滚</text>
<text x="1191.0" y="439.2" font-size="12.5" fill="#57606A" text-anchor="middle">同一进程原地存档读档：950 上 0 MiB 档约 17 / 22 ms</text>
<line x1="48.0" y1="516.0" x2="1552.0" y2="516.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="542.0" font-size="13" fill="#8C959F" text-anchor="start">不是“原生实现得慢”，而是成本模型和场景不匹配。</text></svg>