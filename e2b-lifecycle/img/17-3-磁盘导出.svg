<text x="605.8" y="221.2" font-size="12.5" fill="#57606A" text-anchor="middle">另起协程关沙箱，等 NBD 释放</text>
<path d="M779.0 206.0 L821.0 206.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
