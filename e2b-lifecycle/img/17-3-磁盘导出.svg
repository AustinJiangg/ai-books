<text x="217.2" y="221.2" font-size="12.5" fill="#57606A" text-anchor="middle">根盘就此作废</text>
<path d="M390.5 206.0 L432.5 206.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
