<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="492" viewBox="0 0 1600 492" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m8C959F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#8C959F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="492" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">一个沙箱的一生</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">模板只构建一次；之后每台沙箱都从它启动。运行中可以暂停离场，以后再恢复；最后销毁。本书详讲其中三个操作：构建模板、启动沙箱、暂停与恢复。</text>
<rect x="48.0" y="156.0" width="217.3" height="110.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="156.7" y="193.1" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">1. 构建模板</text>
<text x="156.7" y="217.0" font-size="13" fill="#57606A" text-anchor="middle">Template.build</text>
<text x="156.7" y="236.5" font-size="13" fill="#57606A" text-anchor="middle">只做一次</text>
<path d="M269.3 211.0 L301.3 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="305.3" y="156.0" width="217.3" height="110.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="414.0" y="193.1" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">2. 启动沙箱</text>
<text x="414.0" y="217.0" font-size="13" fill="#57606A" text-anchor="middle">Sandbox.create</text>
<text x="414.0" y="236.5" font-size="13" fill="#57606A" text-anchor="middle">一百多毫秒</text>
<path d="M526.7 211.0 L558.7 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="562.7" y="156.0" width="217.3" height="110.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="671.3" y="193.1" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">3. 运行</text>
<text x="671.3" y="217.0" font-size="13" fill="#57606A" text-anchor="middle">commands.run</text>
<text x="671.3" y="236.5" font-size="13" fill="#57606A" text-anchor="middle">读写文件</text>
<path d="M784.0 211.0 L816.0 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="820.0" y="156.0" width="217.3" height="110.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="928.7" y="193.1" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">4. 暂停</text>
<text x="928.7" y="217.0" font-size="13" fill="#57606A" text-anchor="middle">pause()</text>
<text x="928.7" y="236.5" font-size="13" fill="#57606A" text-anchor="middle">存盘并离场</text>
<path d="M1041.3 211.0 L1073.3 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1077.3" y="156.0" width="217.3" height="110.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1186.0" y="193.1" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">5. 恢复</text>
<text x="1186.0" y="217.0" font-size="13" fill="#57606A" text-anchor="middle">Sandbox.connect</text>
<text x="1186.0" y="236.5" font-size="13" fill="#57606A" text-anchor="middle">读盘重建</text>
<path d="M1298.7 211.0 L1330.7 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1334.7" y="156.0" width="217.3" height="110.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1443.3" y="202.9" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">6. 销毁</text>
<text x="1443.3" y="226.8" font-size="13" fill="#57606A" text-anchor="middle">kill()</text>
<path d="M1186.0 270.0 L1186.0 316.0 L671.3 316.0 L671.3 270.0" fill="none" stroke="#8C959F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m8C959F)"/>
<text x="928.7" y="340.0" font-size="13" fill="#57606A" text-anchor="middle">恢复后接着运行，可以再次暂停</text>
