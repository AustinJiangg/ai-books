<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">每一层都是同一个动作：从上一层快照恢复一台虚拟机，在里面干活，再暂停成新一层。用的是和用户沙箱同一套 ResumeSandbox 和 Pause。</text>
