<text x="1386.5" y="426.2" font-size="12.5" fill="#57606A" text-anchor="middle">49983 端口</text>
<text x="48.0" y="496.0" font-size="13.5" fill="#57606A" text-anchor="start">地址形如 49983-&lt;沙箱ID&gt;.&lt;域名&gt;：沙箱 ID 就在地址里，不需要额外的请求头。</text>
<line x1="48.0" y1="526.0" x2="1552.0" y2="526.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="552.0" font-size="13" fill="#8C959F" text-anchor="start">两处交叉：启动的最后要确认 envd 能应答；恢复后的沙箱少带两个路由头，数据面上按请求头路由的服务不通（第 18 篇）。</text></svg>