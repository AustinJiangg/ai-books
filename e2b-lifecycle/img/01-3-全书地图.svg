<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="668" viewBox="0 0 1600 668" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="668" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">全书地图：五个部分与三类修改</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">左边是五个部分；右边是我们对上游 E2B 的三类修改，标出它们主要落在哪几篇。</text>
<rect x="48.0" y="152.0" width="960.0" height="74.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="68.0" y="184.0" font-size="17" fill="#1F2328" font-weight="600" text-anchor="start">一、先打底</text>
<rect x="68.0" y="196.0" width="69.5" height="20.5" rx="10.25" fill="#EEF0F2" stroke="none" stroke-width="0"/>
<text x="102.8" y="210.0" font-size="11.5" fill="#57606A" text-anchor="middle">第 1～4 篇</text>
<text x="298.0" y="196.0" font-size="13.5" fill="#57606A" text-anchor="start">沙箱组成 · 页、缺页、块设备、命名空间 · 快照三件套与映射表</text>
<rect x="48.0" y="240.0" width="960.0" height="74.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="68.0" y="272.0" font-size="17" fill="#1F2328" font-weight="600" text-anchor="start">二、构建模板</text>
<rect x="68.0" y="284.0" width="69.5" height="20.5" rx="10.25" fill="#EEF0F2" stroke="none" stroke-width="0"/>
<text x="102.8" y="298.0" font-size="11.5" fill="#57606A" text-anchor="middle">第 5～9 篇</text>
<text x="298.0" y="284.0" font-size="13.5" fill="#57606A" text-anchor="start">流水线五阶段 · base · 指令与缓存 · finalize 与 optimize · 搬到 ARM</text>
<rect x="48.0" y="328.0" width="960.0" height="74.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="68.0" y="360.0" font-size="17" fill="#1F2328" font-weight="600" text-anchor="start">三、启动沙箱</text>
<rect x="68.0" y="372.0" width="83.3" height="20.5" rx="10.25" fill="#EEF0F2" stroke="none" stroke-width="0"/>
<text x="109.6" y="386.0" font-size="11.5" fill="#57606A" text-anchor="middle">第 10～15 篇</text>
<text x="298.0" y="372.0" font-size="13.5" fill="#57606A" text-anchor="start">启动就是恢复 · 拉起 Firecracker · 内存 · 磁盘网络 envd · 测量 · 优化</text>
<rect x="48.0" y="416.0" width="960.0" height="74.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="68.0" y="448.0" font-size="17" fill="#1F2328" font-weight="600" text-anchor="start">四、暂停与恢复</text>
<rect x="68.0" y="460.0" width="83.3" height="20.5" rx="10.25" fill="#EEF0F2" stroke="none" stroke-width="0"/>
<text x="109.6" y="474.0" font-size="11.5" fill="#57606A" text-anchor="middle">第 16～20 篇</text>
<text x="298.0" y="460.0" font-size="13.5" fill="#57606A" text-anchor="start">暂停六步 · 增量与成本 · 恢复 · ARM 上读即脏 · 精确增量</text>
<rect x="48.0" y="504.0" width="960.0" height="74.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="68.0" y="536.0" font-size="17" fill="#1F2328" font-weight="600" text-anchor="start">五、和快照回滚共存</text>
<rect x="68.0" y="548.0" width="83.3" height="20.5" rx="10.25" fill="#EEF0F2" stroke="none" stroke-width="0"/>
<text x="109.6" y="562.0" font-size="11.5" fill="#57606A" text-anchor="middle">第 21～23 篇</text>
<text x="298.0" y="548.0" font-size="13.5" fill="#57606A" text-anchor="start">共用部件 · 三处被撞坏 · 全景与修改清单</text>
<rect x="1058.0" y="152.0" width="494.0" height="132.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1305.0" y="209.9" font-size="16" fill="#8A5300" font-weight="600" text-anchor="middle">搬到 ARM</text>
<text x="1305.0" y="233.8" font-size="13" fill="#57606A" text-anchor="middle">镜像架构、busybox、发行版脚本、cgroup、内核参数、uffd 写保护</text>
<rect x="1436.3" y="162.0" width="101.7" height="20.5" rx="10.25" fill="#EEF0F2" stroke="none" stroke-width="0"/>
<text x="1487.2" y="176.0" font-size="11.5" fill="#57606A" text-anchor="middle">第 9、11、19 篇</text>
<rect x="1058.0" y="298.0" width="494.0" height="132.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1305.0" y="355.9" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">更快、更稳</text>
<text x="1305.0" y="379.8" font-size="13" fill="#57606A" text-anchor="middle">netns-exec、并发参数、超时、网络池、精确增量、埋点</text>
<rect x="1429.5" y="308.0" width="108.5" height="20.5" rx="10.25" fill="#EEF0F2" stroke="none" stroke-width="0"/>
<text x="1483.7" y="322.0" font-size="11.5" fill="#57606A" text-anchor="middle">第 14、15、20 篇</text>
<rect x="1058.0" y="444.0" width="494.0" height="132.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1305.0" y="501.9" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">和快照回滚共存</text>
<text x="1305.0" y="525.8" font-size="13" fill="#57606A" text-anchor="middle">跟踪开关、压平层导出、累积位图、路由头、兼容矩阵</text>
<rect x="1454.7" y="454.0" width="83.3" height="20.5" rx="10.25" fill="#EEF0F2" stroke="none" stroke-width="0"/>
<text x="1496.4" y="468.0" font-size="11.5" fill="#57606A" text-anchor="middle">第 21、22 篇</text>
<line x1="48.0" y1="602.0" x2="1552.0" y2="602.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="628.0" font-size="13" fill="#8C959F" text-anchor="start">每处修改都按同一顺序讲：原来怎样 → 出了什么问题 → 改成了什么 → 改对了的证据。</text></svg>