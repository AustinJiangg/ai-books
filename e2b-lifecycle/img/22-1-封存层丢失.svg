<text x="48.0" y="572.0" font-size="13" fill="#8C959F" text-anchor="start">从没存过档的沙箱只有一层，仍走原来的单层导出，逐字节不变。验证：修复前 3 次里 3 次磁盘损坏，修复后回滚 59 项检查全过。</text></svg>