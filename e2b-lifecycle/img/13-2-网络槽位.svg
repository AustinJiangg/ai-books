<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="582" viewBox="0 0 1600 582" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="582" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">网络槽位：命名空间 + tap + veth + iptables</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">所有沙箱的 guest IP 相同（同一张快照）；区分它们靠外面那层：每个槽位的 veth 有不同的宿主侧地址，地址转换把流量送进对应的命名空间。槽位提前建好放进池子。</text>
