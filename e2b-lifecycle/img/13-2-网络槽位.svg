<text x="418.0" y="293.1" font-size="14.5" fill="#3D3C38" font-weight="600" text-anchor="middle">tap0</text>
<text x="418.0" y="315.7" font-size="12" fill="#57606A" text-anchor="middle">接 guest 网卡</text>
<rect x="318.0" y="366.0" width="200.0" height="70.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="418.0" y="405.6" font-size="14.5" fill="#3D3C38" font-weight="600" text-anchor="middle">veth 一端</text>
<rect x="608.0" y="366.0" width="230.0" height="70.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="723.0" y="393.0" font-size="14" fill="#3D3C38" font-weight="600" text-anchor="middle">e2bv-N（宿主侧）</text>
<text x="723.0" y="415.6" font-size="12" fill="#57606A" text-anchor="middle">每槽一个宿主地址</text>
<rect x="608.0" y="246.0" width="230.0" height="90.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="723.0" y="283.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">iptables</text>
<text x="723.0" y="305.6" font-size="12" fill="#57606A" text-anchor="middle">地址转换 · 转发 · 端口重定向</text>
<path d="M522.0 401.0 L604.0 401.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#m1F2328)" marker-end="url(#m1F2328)"/>
<path d="M300.0 301.0 L314.0 301.0" fill="none" stroke="#1F2328" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#m1F2328)" marker-end="url(#m1F2328)"/>
<rect x="918.0" y="156.0" width="634.0" height="330.0" rx="14" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="938.0" y="186.0" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="start">槽位池</text>
<rect x="938.0" y="216.0" width="594.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="1168.0" y="238.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">上游</text>
<text x="1355.0" y="238.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">我们</text>
<line x1="938.0" y1="298.5" x2="1532.0" y2="298.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="948.0" y="281.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">新建池</text>
<text x="1168.0" y="281.1" font-size="13.5" fill="#1F2328" text-anchor="start">32</text>
<text x="1355.0" y="281.1" font-size="13.5" fill="#1F2328" text-anchor="start">300</text>
<line x1="938.0" y1="340.8" x2="1532.0" y2="340.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="948.0" y="323.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">复用池</text>
<text x="1168.0" y="323.3" font-size="13.5" fill="#1F2328" text-anchor="start">100</text>
<text x="1355.0" y="323.3" font-size="13.5" fill="#1F2328" text-anchor="start">1000</text>
<text x="938.0" y="376.0" font-size="13.5" fill="#57606A" text-anchor="start">建一个槽位要几十毫秒，提前建好</text>
<text x="938.0" y="404.0" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">启动时直接领：平均 0.7 ms</text>
<text x="938.0" y="432.0" font-size="13.5" fill="#9A3215" font-weight="600" text-anchor="start">强杀 orchestrator：整池泄漏，只能停—清—启</text>
<line x1="48.0" y1="516.0" x2="1552.0" y2="516.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="542.0" font-size="13" fill="#8C959F" text-anchor="start">从进程外面看，池子里闲着的槽位和泄漏的槽位一模一样：都没进程、都没被打开、名字地址规则相同。</text></svg>