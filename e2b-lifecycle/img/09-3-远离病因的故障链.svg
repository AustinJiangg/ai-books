<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="732" viewBox="0 0 1600 732" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="732" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">一次远离病因的故障链</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">症状在 api（503、部署超时），病因在 template-manager 的内存上限，中间隔了 Nomad。终点的报错里没有一个字提到内存。</text>
<rect x="48.0" y="156.0" width="272.0" height="130.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="184.0" y="203.5" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">病因</text>
<text x="184.0" y="226.8" font-size="12.5" fill="#57606A" text-anchor="middle">200 MB 镜像、跳过缓存构建；解包的页缓</text>
<text x="184.0" y="245.5" font-size="12.5" fill="#57606A" text-anchor="middle">存 + tmpfs 页记在 8 GiB 上限里</text>
<path d="M324.0 221.0 L352.0 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="356.0" y="156.0" width="272.0" height="130.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="492.0" y="212.9" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">内核杀进程</text>
<text x="492.0" y="236.2" font-size="12.5" fill="#57606A" text-anchor="middle">tmpfs 页不能回收，交换分区无余量</text>
<path d="M632.0 221.0 L660.0 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="664.0" y="156.0" width="272.0" height="130.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="800.0" y="212.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">Nomad 反复重启</text>
<text x="800.0" y="236.2" font-size="12.5" fill="#57606A" text-anchor="middle">次数用完，任务标记失败</text>
<path d="M940.0 221.0 L968.0 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="972.0" y="156.0" width="272.0" height="130.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1108.0" y="212.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">api 发现 0 个节点</text>
<text x="1108.0" y="236.2" font-size="12.5" fill="#57606A" text-anchor="middle">/health 一直 503</text>
<path d="M1248.0 221.0 L1276.0 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1280.0" y="156.0" width="272.0" height="130.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1416.0" y="212.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">部署脚本</text>
<text x="1416.0" y="236.2" font-size="12.5" fill="#57606A" text-anchor="middle">等 api 健康超时</text>
<text x="48.0" y="336.0" font-size="17" fill="#1F2328" font-weight="600" text-anchor="start">修法的来回</text>
<circle cx="62.0" cy="388.4" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="392.9" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<rect x="88.0" y="356.0" width="1464.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="380.2" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">8 GiB → 32 GiB</text>
<text x="102.0" y="403.5" font-size="12.5" fill="#57606A" text-anchor="start">实测能通过一次 200 MB 基础镜像的完整重建</text>
<circle cx="62.0" cy="465.3" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="469.8" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<rect x="88.0" y="432.9" width="1464.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="457.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">32 GiB → 256 GiB</text>
<text x="102.0" y="480.3" font-size="12.5" fill="#57606A" text-anchor="start">在 1 TB 内存的机器上当作“跑飞了也不拖垮整机”的护栏</text>
<circle cx="62.0" cy="542.2" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="546.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<rect x="88.0" y="509.8" width="1464.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="534.0" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">换到 128 GiB 的机器：256 GiB 调度不上</text>
<text x="102.0" y="557.2" font-size="12.5" fill="#57606A" text-anchor="start">orchestrator 永远起不来，症状与第一次一模一样</text>
<circle cx="62.0" cy="619.1" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="623.6" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<rect x="88.0" y="586.7" width="1464.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="610.9" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">回到 32 GiB</text>
<text x="102.0" y="634.1" font-size="12.5" fill="#57606A" text-anchor="start">配置旁写明：太小会被杀，太大会调度不上</text>
<line x1="48.0" y1="666.0" x2="1552.0" y2="666.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="692.0" font-size="13" fill="#8C959F" text-anchor="start">这个上限不包括虚拟机内存（大页另记账）；“同时跑几十台沙箱没事”不能说明它够用。</text></svg>