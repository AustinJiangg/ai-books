<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="562" viewBox="0 0 1600 562" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="562" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">内存增量的三层，被 2 MiB 大页锁成一根链</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">判决定“读算不算脏”；存和填决定“最小能存多细”。只换判，存和填仍把一切归并到 2 MiB。</text>
<rect x="48.0" y="156.0" width="268.8" height="110.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="182.4" y="203.2" font-size="16" fill="#4B3FA8" font-weight="600" text-anchor="middle">guest 页 = 2 MiB</text>
<text x="182.4" y="226.5" font-size="12.5" fill="#57606A" text-anchor="middle">hugetlbfs 大页</text>
<path d="M320.8 211.0 L352.8 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="356.8" y="156.0" width="268.8" height="110.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="491.2" y="203.2" font-size="16" fill="#8A5300" font-weight="600" text-anchor="middle">填</text>
<text x="491.2" y="226.5" font-size="12.5" fill="#57606A" text-anchor="middle">一次缺页只能填一整页</text>
<path d="M629.6 211.0 L661.6 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="665.6" y="156.0" width="268.8" height="110.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="800.0" y="203.2" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">填的硬检查</text>
<text x="800.0" y="226.5" font-size="12.5" fill="#57606A" text-anchor="middle">guest 页大小 = 映射块大小</text>
<path d="M938.4 211.0 L970.4 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="974.4" y="156.0" width="268.8" height="110.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="1108.8" y="203.2" font-size="16" fill="#3D3C38" font-weight="600" text-anchor="middle">存</text>
<text x="1108.8" y="226.5" font-size="12.5" fill="#57606A" text-anchor="middle">映射块 2 MiB，逐代继承</text>
<path d="M1247.2 211.0 L1279.2 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1283.2" y="156.0" width="268.8" height="110.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1417.6" y="203.2" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">判</text>
<text x="1417.6" y="226.5" font-size="12.5" fill="#57606A" text-anchor="middle">位图再细也要归并到 2 MiB</text>
<rect x="48.0" y="306.0" width="1500.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="328.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">层</text>
<text x="258.0" y="328.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">做什么</text>
<text x="738.0" y="328.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">粒度由谁决定</text>
<text x="1118.0" y="328.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">修复前</text>
<line x1="48.0" y1="388.5" x2="1548.0" y2="388.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="371.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">判</text>
<text x="258.0" y="371.1" font-size="13.5" fill="#1F2328" text-anchor="start">算出这一代哪些页要导出</text>
<text x="738.0" y="371.1" font-size="13.5" fill="#1F2328" text-anchor="start">判据给出的位图</text>
<text x="1118.0" y="371.1" font-size="13.5" fill="#1F2328" text-anchor="start">按 2 MiB 给出（GET /memory/dirty）</text>
<line x1="48.0" y1="430.8" x2="1548.0" y2="430.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="413.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">存</text>
<text x="258.0" y="413.3" font-size="13.5" fill="#1F2328" text-anchor="start">块拷进差分文件，映射表记下位置</text>
<text x="738.0" y="413.3" font-size="13.5" fill="#1F2328" text-anchor="start">映射表的块大小</text>
<text x="1118.0" y="413.3" font-size="13.5" fill="#1F2328" text-anchor="start">模板 2 MiB，之后每代 2 MiB</text>
<line x1="48.0" y1="473.0" x2="1548.0" y2="473.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="455.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">填</text>
<text x="258.0" y="455.6" font-size="13.5" fill="#1F2328" text-anchor="start">恢复时缺页，从映射链取内容填入</text>
<text x="738.0" y="455.6" font-size="13.5" fill="#1F2328" text-anchor="start">guest 页大小</text>
<text x="1118.0" y="455.6" font-size="13.5" fill="#1F2328" text-anchor="start">2 MiB，且要求等于映射块大小</text>
<line x1="48.0" y1="496.0" x2="1552.0" y2="496.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="522.0" font-size="13" fill="#8C959F" text-anchor="start">所以要分两半治：判换成写跟踪位图；存和填降到 4 KiB 存、2 MiB 拼。</text></svg>