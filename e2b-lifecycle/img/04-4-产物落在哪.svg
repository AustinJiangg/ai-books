<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="692" viewBox="0 0 1600 692" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="692" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">快照产物落在哪：三层目录</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">持久化存储是“家”；本地缓存是启动、恢复时实际读的副本；沙箱运行态放正在跑的沙箱的写层和临时产物。</text>
<rect x="48.0" y="156.0" width="260.0" height="100.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="178.0" y="211.4" font-size="17" fill="#3D3C38" font-weight="600" text-anchor="middle">持久化存储</text>
<text x="338.0" y="186.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">/tmp/templates（我们部署实际用的本地目录）或 MinIO 桶</text>
<text x="338.0" y="214.0" font-size="13.5" fill="#57606A" text-anchor="start">每个 build ID 一个目录：三件套 + 两张映射表 + metadata.json</text>
<text x="338.0" y="240.0" font-size="13.5" fill="#57606A" text-anchor="start">生命周期：直到删除模板或快照</text>
<rect x="48.0" y="276.0" width="260.0" height="100.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="178.0" y="331.4" font-size="17" fill="#1F2328" font-weight="600" text-anchor="middle">本地缓存</text>
<text x="338.0" y="306.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">/orchestrator/build、/orchestrator/template</text>
<text x="338.0" y="334.0" font-size="13.5" fill="#57606A" text-anchor="start">从持久化存储拉下来的副本</text>
<text x="338.0" y="360.0" font-size="13.5" fill="#57606A" text-anchor="start">生命周期：有过期时间；orchestrator 一重启就清空</text>
<rect x="48.0" y="396.0" width="260.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="178.0" y="451.4" font-size="17" fill="#1F2328" font-weight="600" text-anchor="middle">沙箱运行态</text>
<text x="338.0" y="426.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">/orchestrator/sandbox、/mnt/snapshot-cache</text>
<text x="338.0" y="454.0" font-size="13.5" fill="#57606A" text-anchor="start">正在跑的沙箱的写层、暂停时的临时产物</text>
<text x="338.0" y="480.0" font-size="13.5" fill="#57606A" text-anchor="start">生命周期：沙箱销毁即清</text>
<rect x="48.0" y="526.0" width="1504.0" height="70.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="800.0" y="552.6" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">注意</text>
<text x="800.0" y="576.5" font-size="13" fill="#57606A" text-anchor="middle">openEuler 上 /tmp 是 tmpfs：宿主一重启，/tmp/templates 里的模板全部丢失，要重新构建</text>
<line x1="48.0" y1="626.0" x2="1552.0" y2="626.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="652.0" font-size="13" fill="#8C959F" text-anchor="start">上游支持 Google、AWS 对象存储和本地目录；我们新增 MinIO 后端并设为默认，但单节点部署脚本把 template-manager 写死成了本地目录。</text></svg>