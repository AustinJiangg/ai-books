<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="582" viewBox="0 0 1600 582" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="582" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">冷启动与快照恢复：省掉了什么</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">快照恢复省掉的是 guest 内部的全部初始化；省不掉的是宿主侧的准备。所以启动的时间几乎全花在宿主侧。</text>
<rect x="48.0" y="156.0" width="1500.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="178.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">步骤</text>
<text x="538.0" y="178.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">冷启动</text>
<text x="1038.0" y="178.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">快照恢复</text>
<rect x="48.0" y="198.2" width="1500.0" height="38.2" rx="6" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="58.0" y="221.1" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">内核引导</text>
<text x="538.0" y="221.1" font-size="13.5" fill="#0E6B4F" text-anchor="start">要（几百毫秒到一秒）</text>
<text x="1038.0" y="221.1" font-size="13.5" fill="#0E6B4F" text-anchor="start">不要，在快照里</text>
<rect x="48.0" y="240.5" width="1500.0" height="38.2" rx="6" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="58.0" y="263.3" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">systemd 拉起几十个服务</text>
<text x="538.0" y="263.3" font-size="13.5" fill="#0E6B4F" text-anchor="start">要（几秒）</text>
<text x="1038.0" y="263.3" font-size="13.5" fill="#0E6B4F" text-anchor="start">不要</text>
<rect x="48.0" y="282.8" width="1500.0" height="38.2" rx="6" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="58.0" y="305.6" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">envd 初始化</text>
<text x="538.0" y="305.6" font-size="13.5" fill="#0E6B4F" text-anchor="start">要</text>
<text x="1038.0" y="305.6" font-size="13.5" fill="#0E6B4F" text-anchor="start">不要，envd 进程本来就在跑</text>
<rect x="48.0" y="325.0" width="1500.0" height="38.2" rx="6" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="58.0" y="347.8" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">用户服务启动</text>
<text x="538.0" y="347.8" font-size="13.5" fill="#0E6B4F" text-anchor="start">要</text>
<text x="1038.0" y="347.8" font-size="13.5" fill="#0E6B4F" text-anchor="start">不要，构建时已启动</text>
<rect x="48.0" y="367.2" width="1500.0" height="38.2" rx="6" fill="#FCEDE8" stroke="#D6603D" stroke-width="1"/>
<text x="58.0" y="390.1" font-size="13.5" fill="#9A3215" font-weight="600" text-anchor="start">宿主准备五样东西</text>
<text x="538.0" y="390.1" font-size="13.5" fill="#9A3215" text-anchor="start">要</text>
<text x="1038.0" y="390.1" font-size="13.5" fill="#9A3215" text-anchor="start">要</text>
<line x1="48.0" y1="449.8" x2="1548.0" y2="449.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="432.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">加载快照</text>
<text x="538.0" y="432.3" font-size="13.5" fill="#1F2328" text-anchor="start">不要</text>
<text x="1038.0" y="432.3" font-size="13.5" fill="#1F2328" text-anchor="start">要，几十毫秒</text>
<line x1="48.0" y1="516.0" x2="1552.0" y2="516.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="542.0" font-size="13" fill="#8C959F" text-anchor="start">Sandbox.create 和 Sandbox.connect 走同一个 ResumeSandbox，只是用的快照不同。</text></svg>