<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="692" viewBox="0 0 1600 692" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="692" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">优化前后的启动管线：只换掉最后一环</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">其余部分原封不动，和上游相比只有一个变量。在脚本模板里生成命令，不做字符串替换；模板构建的虚拟机不走这条路。</text>
