<text x="538.0" y="478.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">行为</text>
<line x1="48.0" y1="538.5" x2="1548.0" y2="538.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="521.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">不设置（默认）</text>
<text x="538.0" y="521.1" font-size="13.5" fill="#1F2328" text-anchor="start">开启：/opt/e2b-infra/bin/fc-netns-exec</text>
<line x1="48.0" y1="580.8" x2="1548.0" y2="580.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="563.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">disabled、ip-netns-exec 或空</text>
<text x="538.0" y="563.3" font-size="13.5" fill="#1F2328" text-anchor="start">退回 ip netns exec</text>
