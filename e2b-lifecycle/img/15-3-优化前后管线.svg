<text x="538.0" y="605.6" font-size="13.5" fill="#1F2328" text-anchor="start">用那个路径下的小程序</text>
<line x1="48.0" y1="626.0" x2="1552.0" y2="626.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="652.0" font-size="13" fill="#8C959F" text-anchor="start">LockOSThread 不能省：setns 只改当前系统线程，必须保证 setns 和 execve 在同一个线程上。</text></svg>