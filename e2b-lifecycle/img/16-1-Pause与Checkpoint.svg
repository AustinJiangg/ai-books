<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="662" viewBox="0 0 1600 662" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="662" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">Pause 与原生 Checkpoint：同一段存盘，后面是否再拉起一台</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">两者都先存盘、停掉旧沙箱。Pause 到此为止，沙箱离场；原生 Checkpoint 再从刚存的快照拉起一台新的。这个原生 Checkpoint 和我们的快照回滚不是一回事。</text>
<text x="48.0" y="166.0" font-size="17" fill="#1D4F91" font-weight="600" text-anchor="start">Pause（sbx.pause()）</text>
<rect x="48.0" y="182.0" width="338.5" height="90.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="217.2" y="218.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">存盘</text>
<text x="217.2" y="242.2" font-size="12.5" fill="#57606A" text-anchor="middle">snapfile + 内存增量 + 磁盘增量</text>
<path d="M390.5 227.0 L432.5 227.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="436.5" y="182.0" width="338.5" height="90.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="605.8" y="231.8" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">停掉沙箱</text>
<path d="M779.0 227.0 L821.0 227.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="825.0" y="182.0" width="338.5" height="90.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="994.2" y="218.9" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">上传</text>
<text x="994.2" y="242.2" font-size="12.5" fill="#57606A" text-anchor="middle">等上传完才返回</text>
<path d="M1167.5 227.0 L1209.5 227.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1213.5" y="182.0" width="338.5" height="90.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1382.8" y="218.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">离场</text>
<text x="1382.8" y="242.2" font-size="12.5" fill="#57606A" text-anchor="middle">以后 Sandbox.connect 恢复</text>
<text x="48.0" y="336.0" font-size="17" fill="#1D4F91" font-weight="600" text-anchor="start">原生 Checkpoint（sbx.create_snapshot()）</text>
<rect x="48.0" y="352.0" width="338.5" height="90.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="217.2" y="388.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">存盘</text>
<text x="217.2" y="412.2" font-size="12.5" fill="#57606A" text-anchor="middle">同上</text>
<path d="M390.5 397.0 L432.5 397.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="436.5" y="352.0" width="338.5" height="90.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="605.8" y="401.8" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">停掉旧沙箱</text>
<path d="M779.0 397.0 L821.0 397.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="825.0" y="352.0" width="338.5" height="90.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="994.2" y="401.8" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">上传</text>
<path d="M1167.5 397.0 L1209.5 397.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1213.5" y="352.0" width="338.5" height="90.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1382.8" y="388.9" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">从新快照拉起一台</text>
<text x="1382.8" y="412.2" font-size="12.5" fill="#57606A" text-anchor="middle">新的 Firecracker 进程</text>
<rect x="48.0" y="496.0" width="1504.0" height="70.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="800.0" y="522.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">对比：我们的快照回滚</text>
<text x="800.0" y="546.2" font-size="12.5" fill="#57606A" text-anchor="middle">在同一个活着的 Firecracker 进程里原地存档读档，沙箱一刻都不停（另一本书）</text>
<line x1="48.0" y1="596.0" x2="1552.0" y2="596.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="622.0" font-size="13" fill="#8C959F" text-anchor="start">原生 Checkpoint 看起来沙箱一直在，底下其实是一次销毁加一次重建。</text></svg>