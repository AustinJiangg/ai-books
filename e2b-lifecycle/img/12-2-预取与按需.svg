<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="492" viewBox="0 0 1600 492" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="492" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">预取与按需：两组工作者 + 真实缺页</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">取数据的工作者立刻开始，甚至早于 Firecracker 启动；填内存的工作者等 uffd 就绪才开始。真实缺页和预取走同一个填页函数，谁先填上，另一个就跳过。</text>
<text x="48.0" y="178.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">拉起 Firecracker</text>
<rect x="248.0" y="156.0" width="717.2" height="34.0" rx="6" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.2"/>
<text x="258.0" y="178.0" font-size="12.5" fill="#8A5300" font-weight="600" text-anchor="start">启动脚本 → API 就绪 → 加载快照</text>
<text x="48.0" y="228.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">预取：取数据</text>
<rect x="248.0" y="206.0" width="912.8" height="34.0" rx="6" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.2"/>
<text x="258.0" y="228.0" font-size="12.5" fill="#3D3C38" font-weight="600" text-anchor="start">按预取表把块读进本地缓存（并发 16 → 32）</text>
<text x="48.0" y="278.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">预取：填内存</text>
<rect x="834.8" y="256.0" width="586.8" height="34.0" rx="6" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.2"/>
<text x="844.8" y="278.0" font-size="12.5" fill="#1D4F91" font-weight="600" text-anchor="start">uffd 就绪后才开始（并发 8 → 16）</text>
<text x="48.0" y="328.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">真实缺页</text>
<rect x="1030.4" y="306.0" width="521.6" height="34.0" rx="6" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.2"/>
<text x="1040.4" y="328.0" font-size="12.5" fill="#4B3FA8" font-weight="600" text-anchor="start">guest 恢复运行，缺哪页补哪页</text>
<line x1="834.8" y1="142.0" x2="834.8" y2="356.0" stroke="#1F9E77" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="834.8" y="376.0" font-size="13" fill="#0E6B4F" font-weight="600" text-anchor="middle">uffd 就绪</text>
<line x1="1030.4" y1="142.0" x2="1030.4" y2="356.0" stroke="#D6603D" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="1030.4" y="396.0" font-size="13" fill="#9A3215" font-weight="600" text-anchor="middle">vCPU 恢复</text>
<line x1="48.0" y1="426.0" x2="1552.0" y2="426.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="452.0" font-size="13" fill="#8C959F" text-anchor="start">示意图，不按比例。预取的目标：guest 真正用到时，常用的页已经在了。</text></svg>