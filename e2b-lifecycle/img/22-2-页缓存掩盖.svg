<text x="874.0" y="378.2" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<rect x="900.0" y="342.0" width="632.0" height="63.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="914.0" y="365.7" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">存档之后再写 16 MiB after.bin</text>
<text x="914.0" y="388.3" font-size="12" fill="#57606A" text-anchor="start">对照组</text>
<circle cx="874.0" cy="436.7" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="874.0" y="441.2" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<rect x="900.0" y="417.4" width="632.0" height="38.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="914.0" y="441.2" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">暂停 → 恢复</text>
<circle cx="874.0" cy="499.7" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="874.0" y="504.2" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<rect x="900.0" y="467.9" width="632.0" height="63.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="914.0" y="491.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">O_DIRECT 读回两份，比哈希</text>
<text x="914.0" y="514.2" font-size="12" fill="#57606A" text-anchor="start">before 抓缺陷，after 证明脚本正常</text>
<line x1="48.0" y1="606.0" x2="1552.0" y2="606.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="632.0" font-size="13" fill="#8C959F" text-anchor="start">三道本应抓住它的防线都失效：映射表从导出内容推出，自己跟自己对得上；已有测试不做暂停；第一版验证被缓存盖住。</text></svg>