<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="612" viewBox="0 0 1600 612" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="612" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">两个放大叠在一起：每一代的下限约等于工作集</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">每一代都是新的 Firecracker 进程，guest 一跑就要把工作集重新缺页换入；而换入即被判脏。两者一乘，改了多少都至少导出一个工作集。</text>
<rect x="48.0" y="156.0" width="338.5" height="130.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="217.2" y="203.7" font-size="15.5" fill="#8A5300" font-weight="600" text-anchor="middle">放大一：每代新进程</text>
<text x="217.2" y="227.0" font-size="12.5" fill="#57606A" text-anchor="middle">恢复、原生 Checkpoint 都新建进程</text>
<text x="217.2" y="245.7" font-size="12.5" fill="#57606A" text-anchor="middle">guest 内存一开始是空的</text>
<path d="M390.5 221.0 L432.5 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="436.5" y="156.0" width="338.5" height="130.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="605.8" y="213.1" font-size="15.5" fill="#4B3FA8" font-weight="600" text-anchor="middle">工作集重新换入</text>
<text x="605.8" y="236.3" font-size="12.5" fill="#57606A" text-anchor="middle">内核、systemd、envd、后台进程碰过的页</text>
<path d="M779.0 221.0 L821.0 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="825.0" y="156.0" width="338.5" height="130.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="994.2" y="213.1" font-size="15.5" fill="#9A3215" font-weight="600" text-anchor="middle">放大二：换入即判脏</text>
<text x="994.2" y="236.3" font-size="12.5" fill="#57606A" text-anchor="middle">在内存里 = 脏</text>
<path d="M1167.5 221.0 L1209.5 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1213.5" y="156.0" width="338.5" height="130.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1382.8" y="213.1" font-size="15.5" fill="#9A3215" font-weight="600" text-anchor="middle">每代导出 ≥ 工作集</text>
<text x="1382.8" y="236.3" font-size="12.5" fill="#57606A" text-anchor="middle">与改了多少无关</text>
<rect x="48.0" y="336.0" width="1500.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="358.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">连拍三次（1 vCPU / 1 GiB 模板）</text>
<text x="358.0" y="358.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">场景</text>
<text x="858.0" y="358.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">内存差分</text>
<text x="1158.0" y="358.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">磁盘差分</text>
<line x1="48.0" y1="418.5" x2="1548.0" y2="418.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="401.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">#1</text>
<text x="358.0" y="401.1" font-size="13.5" fill="#1F2328" text-anchor="start">沙箱刚起来</text>
<text x="858.0" y="401.1" font-size="13.5" fill="#1F2328" text-anchor="start">112 MiB</text>
<text x="1158.0" y="401.1" font-size="13.5" fill="#1F2328" text-anchor="start">0</text>
<rect x="48.0" y="420.5" width="1500.0" height="38.2" rx="6" fill="#FCEDE8" stroke="#D6603D" stroke-width="1"/>
<text x="58.0" y="443.3" font-size="13.5" fill="#9A3215" font-weight="600" text-anchor="start">#2</text>
<text x="358.0" y="443.3" font-size="13.5" fill="#9A3215" text-anchor="start">中间什么都没做</text>
<text x="858.0" y="443.3" font-size="13.5" fill="#9A3215" text-anchor="start">112 MiB</text>
<text x="1158.0" y="443.3" font-size="13.5" fill="#9A3215" text-anchor="start">0</text>
<line x1="48.0" y1="503.0" x2="1548.0" y2="503.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="485.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">#3</text>
<text x="358.0" y="485.6" font-size="13.5" fill="#1F2328" text-anchor="start">写了 200 MiB 随机数据</text>
<text x="858.0" y="485.6" font-size="13.5" fill="#1F2328" text-anchor="start">338 MiB</text>
<text x="1158.0" y="485.6" font-size="13.5" fill="#1F2328" text-anchor="start">201 MiB</text>
<line x1="48.0" y1="546.0" x2="1552.0" y2="546.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="572.0" font-size="13" fill="#8C959F" text-anchor="start">磁盘那一列是精确的：写层只记写入。x86 上换进来的是带写保护的干净页，不算脏，没有这个问题。</text></svg>