<text x="1018.0" y="411.1" font-size="13.5" fill="#1F2328" text-anchor="start">代码默认 500，部署 30，可调</text>
<rect x="48.0" y="430.5" width="1500.0" height="38.2" rx="6" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="58.0" y="453.3" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">从模板创建、拿不到名额</text>
<text x="498.0" y="453.3" font-size="13.5" fill="#0E6B4F" text-anchor="start">立即拒绝，让 api 换节点</text>
<text x="1018.0" y="453.3" font-size="13.5" fill="#0E6B4F" text-anchor="start">排队等待</text>
<line x1="48.0" y1="513.0" x2="1548.0" y2="513.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="495.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">从暂停快照恢复、拿不到名额</text>
<text x="498.0" y="495.6" font-size="13.5" fill="#1F2328" text-anchor="start">排队，最多 15 秒</text>
<text x="1018.0" y="495.6" font-size="13.5" fill="#1F2328" text-anchor="start">排队，最多 300 秒</text>
<line x1="48.0" y1="555.2" x2="1548.0" y2="555.2" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="537.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">整个请求超时</text>
<text x="498.0" y="537.8" font-size="13.5" fill="#1F2328" text-anchor="start">60 秒</text>
<text x="1018.0" y="537.8" font-size="13.5" fill="#1F2328" text-anchor="start">300 秒</text>
<line x1="48.0" y1="597.5" x2="1548.0" y2="597.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="580.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">节点沙箱总数上限</text>
<text x="498.0" y="580.1" font-size="13.5" fill="#1F2328" text-anchor="start">200</text>
<text x="1018.0" y="580.1" font-size="13.5" fill="#1F2328" text-anchor="start">10000</text>
<line x1="48.0" y1="616.0" x2="1552.0" y2="616.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="642.0" font-size="13" fill="#8C959F" text-anchor="start">上游的设计适合多节点：一个节点忙就换一个。单节点部署无处可换，所以一律排队。</text></svg>