<text x="1420.0" y="241.5" font-size="12.5" fill="#57606A" text-anchor="middle">/init：身份、令牌、环境变量</text>
<rect x="48.0" y="346.0" width="1500.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
