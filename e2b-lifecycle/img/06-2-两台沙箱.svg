<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="762" viewBox="0 0 1600 762" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="762" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">base 阶段的两台虚拟机</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">基础镜像里通常没有 systemd，要装它又得先有一个在运行的系统。解法是开两次机：第一次 busybox 当 1 号进程装好 systemd，第二次 systemd 正式开机，等 envd 就绪后暂停成第一层。两台共用同一个磁盘文件。</text>
<rect x="48.0" y="156.0" width="712.0" height="430.0" rx="14" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="68.0" y="186.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">第一台：busybox 当 1 号进程</text>
<circle cx="82.0" cy="235.2" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="82.0" y="239.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<rect x="108.0" y="216.0" width="632.0" height="38.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="122.0" y="239.7" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">挂载 /proc /sys /dev /tmp /run</text>
<circle cx="82.0" cy="298.2" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="82.0" y="302.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<rect x="108.0" y="266.5" width="632.0" height="63.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="122.0" y="290.2" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">运行 provision.sh</text>
<text x="122.0" y="312.8" font-size="12" fill="#57606A" text-anchor="start">输出加 [external] 前缀，宿主过滤后转成构建日志</text>
<circle cx="82.0" cy="361.2" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="82.0" y="365.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<rect x="108.0" y="342.0" width="632.0" height="38.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="122.0" y="365.7" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">sync，冻结根文件系统</text>
<circle cx="82.0" cy="424.2" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="82.0" y="428.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<rect x="108.0" y="392.4" width="632.0" height="63.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="122.0" y="416.2" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">打印 E2B_PROVISIONING_EXIT:&lt;码&gt;</text>
<text x="122.0" y="438.8" font-size="12" fill="#57606A" text-anchor="start">没有 envd，只能靠一行文本回报</text>
<circle cx="82.0" cy="487.2" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="82.0" y="491.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<rect x="108.0" y="467.9" width="632.0" height="38.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="122.0" y="491.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">sleep infinity，等宿主关机</text>
<text x="68.0" y="571.0" font-size="13" fill="#1F2328" font-weight="600" text-anchor="start">唯一允许上网；限时 5 分钟</text>
<rect x="840.0" y="156.0" width="712.0" height="430.0" rx="14" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="860.0" y="186.0" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="start">第二台：systemd 正式开机</text>
<circle cx="874.0" cy="235.2" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="874.0" y="239.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<rect x="900.0" y="216.0" width="632.0" height="38.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="914.0" y="239.7" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">检查磁盘完整性，扩到要求的空闲空间</text>
<circle cx="874.0" cy="285.7" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="874.0" y="290.2" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<rect x="900.0" y="266.5" width="632.0" height="38.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="914.0" y="290.2" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">systemd 当 1 号进程开机</text>
<circle cx="874.0" cy="336.2" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="874.0" y="340.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<rect x="900.0" y="317.0" width="632.0" height="38.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="914.0" y="340.7" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">拉起 envd 等服务</text>
<circle cx="874.0" cy="386.7" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="874.0" y="391.2" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<rect x="900.0" y="367.4" width="632.0" height="38.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="914.0" y="391.2" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">等 envd 能应答，刷盘</text>
<circle cx="874.0" cy="437.2" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="874.0" y="441.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<rect x="900.0" y="417.9" width="632.0" height="38.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="914.0" y="441.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">暂停 → 第一层快照</text>
<path d="M766.0 371.0 L834.0 371.0" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="800.0" y="361.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">关机</text>
<rect x="48.0" y="616.0" width="1504.0" height="56.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="800.0" y="648.0" font-size="13.5" fill="#57606A" text-anchor="middle">两台虚拟机用宿主上同一个磁盘文件：第一台装好的软件，第二台开机时就在</text>
<line x1="48.0" y1="696.0" x2="1552.0" y2="696.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="722.0" font-size="13" fill="#8C959F" text-anchor="start">模板若从另一个模板派生，base 阶段整段不跑，直接拿那个模板的最后一层当起点。</text></svg>