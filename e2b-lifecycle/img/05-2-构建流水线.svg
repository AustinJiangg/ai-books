<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="642" viewBox="0 0 1600 642" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="642" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">构建流水线：五个阶段</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">顺序固定。每个阶段先算 hash 查层缓存，命中就整段跳过；没命中才起虚拟机干活。finalize 产出模板本身，optimize 只改元数据。</text>
<rect x="48.0" y="156.0" width="272.0" height="120.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="184.0" y="198.4" font-size="17" fill="#1D4F91" font-weight="600" text-anchor="middle">base</text>
<text x="184.0" y="222.3" font-size="13" fill="#57606A" text-anchor="middle">镜像 → ext4；busybox 装系统；</text>
<text x="184.0" y="241.8" font-size="13" fill="#57606A" text-anchor="middle">systemd 开机</text>
<path d="M324.0 216.0 L352.0 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="356.0" y="156.0" width="272.0" height="120.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="492.0" y="208.2" font-size="17" fill="#1D4F91" font-weight="600" text-anchor="middle">默认用户</text>
<text x="492.0" y="232.1" font-size="13" fill="#57606A" text-anchor="middle">建 user，加 sudo 权限</text>
<path d="M632.0 216.0 L660.0 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="664.0" y="156.0" width="272.0" height="120.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="208.2" font-size="17" fill="#1D4F91" font-weight="600" text-anchor="middle">steps</text>
<text x="800.0" y="232.1" font-size="13" fill="#57606A" text-anchor="middle">每条指令一层</text>
<path d="M940.0 216.0 L968.0 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="972.0" y="156.0" width="272.0" height="120.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1108.0" y="208.2" font-size="17" fill="#0E6B4F" font-weight="600" text-anchor="middle">finalize</text>
<text x="1108.0" y="232.1" font-size="13" fill="#57606A" text-anchor="middle">配置、启动命令、等就绪、拍快照</text>
<path d="M1248.0 216.0 L1276.0 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1280.0" y="156.0" width="272.0" height="120.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1416.0" y="208.2" font-size="17" fill="#1F2328" font-weight="600" text-anchor="middle">optimize</text>
<text x="1416.0" y="232.1" font-size="13" fill="#57606A" text-anchor="middle">恢复两次，记预取表</text>
<rect x="140.5" y="297.0" width="87.0" height="26.0" rx="13.0" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1"/>
<text x="184.0" y="314.7" font-size="13" fill="#3D3C38" font-weight="600" text-anchor="middle">第一层快照</text>
<rect x="455.0" y="297.0" width="74.0" height="26.0" rx="13.0" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1"/>
<text x="492.0" y="314.7" font-size="13" fill="#3D3C38" font-weight="600" text-anchor="middle">一层快照</text>
<rect x="763.0" y="297.0" width="74.0" height="26.0" rx="13.0" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1"/>
<text x="800.0" y="314.7" font-size="13" fill="#3D3C38" font-weight="600" text-anchor="middle">每条一层</text>
<rect x="1049.7" y="297.0" width="116.7" height="26.0" rx="13.0" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1"/>
<text x="1108.0" y="314.7" font-size="13" fill="#3D3C38" font-weight="600" text-anchor="middle">最终快照 = 模板</text>
<rect x="1379.0" y="297.0" width="74.0" height="26.0" rx="13.0" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1"/>
<text x="1416.0" y="314.7" font-size="13" fill="#3D3C38" font-weight="600" text-anchor="middle">不产新层</text>
<rect x="48.0" y="376.0" width="1500.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="398.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">阶段</text>
<text x="318.0" y="398.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">hash 由什么决定</text>
<text x="818.0" y="398.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">缓存效果</text>
<line x1="48.0" y1="458.5" x2="1548.0" y2="458.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="441.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">base</text>
<text x="318.0" y="441.1" font-size="13.5" fill="#1F2328" text-anchor="start">镜像名、磁盘大小、provision 版本</text>
<text x="818.0" y="441.1" font-size="13.5" fill="#1F2328" text-anchor="start">最贵、最易错；基础镜像不变就整段跳过</text>
<line x1="48.0" y1="500.8" x2="1548.0" y2="500.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="483.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">steps</text>
<text x="318.0" y="483.3" font-size="13.5" fill="#1F2328" text-anchor="start">上一层 hash + 指令文本 + 上传文件的 hash</text>
<text x="818.0" y="483.3" font-size="13.5" fill="#1F2328" text-anchor="start">改了第 N 条，从第 N 条起重做</text>
<line x1="48.0" y1="543.0" x2="1548.0" y2="543.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="525.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">finalize / optimize</text>
<text x="318.0" y="525.6" font-size="13.5" fill="#1F2328" text-anchor="start">—</text>
<text x="818.0" y="525.6" font-size="13.5" fill="#1F2328" text-anchor="start">从不查缓存，每次都重做</text>
<line x1="48.0" y1="576.0" x2="1552.0" y2="576.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="602.0" font-size="13" fill="#8C959F" text-anchor="start">每个阶段的时限：provision 5 分钟、base 层 10 分钟、每条指令 1 小时、等就绪 10 分钟。</text></svg>