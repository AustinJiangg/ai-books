<text x="48.0" y="316.0" font-size="13.5" fill="#57606A" text-anchor="start">下面的小方块 = 这一代数据文件里的块：base 层最多，后面每代只有改过的几块。</text>
<rect x="851.8" y="343.0" width="152.0" height="26.0" rx="13.0" fill="#F4F5F7" stroke="#57606A" stroke-width="1"/>
<text x="927.8" y="360.7" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">几百台沙箱共享到这里</text>
<rect x="1248.3" y="343.0" width="126.0" height="26.0" rx="13.0" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="1311.3" y="360.7" font-size="13" fill="#0E6B4F" font-weight="600" text-anchor="middle">某一台沙箱自己的</text>
<circle cx="52.0" cy="401.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="64.0" y="406.0" font-size="14.5" fill="#1F2328" text-anchor="start">只追加，不修改：同一个模板的沙箱放心共享模板那几代</text>
<circle cx="52.0" cy="433.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="64.0" y="438.0" font-size="14.5" fill="#1F2328" text-anchor="start">改得少，存得少：一代的大小正比于这一代改了多少</text>
<circle cx="52.0" cy="465.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="64.0" y="470.0" font-size="14.5" fill="#1F2328" text-anchor="start">内存“改了多少”要靠脏页判据，判得准不准决定每一代多大（第 17、19、20 篇）</text>
<line x1="48.0" y1="516.0" x2="1552.0" y2="516.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="542.0" font-size="13" fill="#8C959F" text-anchor="start">每一代有自己的 build ID；用户启动沙箱时，api 把模板名翻译成模板最后一代的 build ID。</text></svg>