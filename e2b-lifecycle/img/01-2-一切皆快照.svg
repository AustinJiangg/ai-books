<text x="68.0" y="646.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">构建内部也在转圈</text>
<rect x="348.0" y="642.0" width="351.3" height="56.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="523.7" y="674.6" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">从上一层恢复</text>
<path d="M703.3 670.0 L755.3 670.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="759.3" y="642.0" width="351.3" height="56.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="935.0" y="674.6" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">执行一条指令</text>
<path d="M1114.7 670.0 L1166.7 670.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1170.7" y="642.0" width="351.3" height="56.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1346.3" y="674.6" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">暂停成新一层</text>
<line x1="48.0" y1="756.0" x2="1552.0" y2="756.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="782.0" font-size="13" fill="#8C959F" text-anchor="start">三个操作共用同一套部件：Firecracker、内存懒加载、磁盘写层、映射表。</text></svg>