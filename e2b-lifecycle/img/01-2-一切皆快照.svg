<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="822" viewBox="0 0 1600 822" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="822" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">一切皆快照：三个操作首尾相接</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">构建的终点是拍一张快照；启动从这张快照恢复；暂停在当前状态上再拍一张；恢复又从那一张恢复。构建本身也在这个圈里反复转：每条指令都是“恢复—执行—暂停”。</text>
<rect x="650.0" y="331.0" width="300.0" height="110.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="800.0" y="368.8" font-size="18" fill="#3D3C38" font-weight="600" text-anchor="middle">快照</text>
<text x="800.0" y="392.7" font-size="13" fill="#57606A" text-anchor="middle">snapfile + memfile + rootfs</text>
<text x="800.0" y="412.2" font-size="13" fill="#57606A" text-anchor="middle">+ 映射表</text>
<rect x="160.0" y="196.0" width="360.0" height="100.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="340.0" y="238.2" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">构建模板</text>
<text x="340.0" y="261.5" font-size="12.5" fill="#57606A" text-anchor="middle">开机、装软件、跑启动命令，就绪那一刻拍快照</text>
<rect x="1080.0" y="196.0" width="360.0" height="100.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1260.0" y="238.2" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">启动沙箱</text>
<text x="1260.0" y="261.5" font-size="12.5" fill="#57606A" text-anchor="middle">把模板快照加载进新的 Firecracker</text>
<rect x="1080.0" y="476.0" width="360.0" height="100.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1260.0" y="518.2" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">暂停</text>
<text x="1260.0" y="541.5" font-size="12.5" fill="#57606A" text-anchor="middle">只存改过的部分，长出新的一代</text>
<rect x="160.0" y="476.0" width="360.0" height="100.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="340.0" y="518.2" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">恢复</text>
<text x="340.0" y="541.5" font-size="12.5" fill="#57606A" text-anchor="middle">从暂停那一代加载，和启动同一条路</text>
<path d="M524.0 246.0 L690.0 246.0 L690.0 327.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="577.0" y="237.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">拍下</text>
<path d="M910.0 327.0 L910.0 246.0 L1076.0 246.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="960.0" y="236.0" font-size="13" fill="#57606A" font-weight="600" text-anchor="start">读</text>
<path d="M1260.0 300.0 L1260.0 472.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="1330.0" y="390.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">运行一段时间</text>
<path d="M1076.0 526.0 L910.0 526.0 L910.0 445.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="960.0" y="548.0" font-size="13" fill="#57606A" font-weight="600" text-anchor="start">拍下新一代</text>
<path d="M690.0 445.0 L690.0 526.0 L524.0 526.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="640.0" y="548.0" font-size="13" fill="#57606A" font-weight="600" text-anchor="end">读</text>
