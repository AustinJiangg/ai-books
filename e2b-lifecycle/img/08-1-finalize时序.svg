<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="562" viewBox="0 0 1600 562" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="562" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">finalize 的时序：最后一次开机</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">总是重新开一台虚拟机（最终层的磁盘路径要指向最终 build ID）。跑配置脚本，启动用户服务，每 2 秒检查一次就绪，确认服务没崩，刷盘，拍快照。</text>
<rect x="48.0" y="156.0" width="196.0" height="130.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="146.0" y="225.6" font-size="14.5" fill="#0E6B4F" font-weight="600" text-anchor="middle">重新开机</text>
<path d="M248.0 221.0 L262.0 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="266.0" y="156.0" width="196.0" height="130.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="364.0" y="195.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">configure.sh</text>
<text x="364.0" y="217.7" font-size="12" fill="#57606A" text-anchor="middle">确保用户、复制默认文件、权</text>
<text x="364.0" y="235.7" font-size="12" fill="#57606A" text-anchor="middle">限、swap</text>
<text x="364.0" y="253.7" font-size="12" fill="#57606A" text-anchor="middle">5 分钟</text>
<path d="M466.0 221.0 L480.0 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="484.0" y="156.0" width="196.0" height="130.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="582.0" y="213.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">start 命令</text>
<text x="582.0" y="235.7" font-size="12" fill="#57606A" text-anchor="middle">后台一直跑</text>
<path d="M684.0 221.0 L698.0 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="702.0" y="156.0" width="196.0" height="130.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="800.0" y="204.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">ready 命令</text>
<text x="800.0" y="226.7" font-size="12" fill="#57606A" text-anchor="middle">每 2 秒一次</text>
<text x="800.0" y="244.7" font-size="12" fill="#57606A" text-anchor="middle">最多 10 分钟</text>
<path d="M902.0 221.0 L916.0 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="920.0" y="156.0" width="196.0" height="130.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1018.0" y="225.6" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">确认 start 仍在跑</text>
<path d="M1120.0 221.0 L1134.0 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1138.0" y="156.0" width="196.0" height="130.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="1236.0" y="213.1" font-size="14.5" fill="#3D3C38" font-weight="600" text-anchor="middle">刷盘</text>
<text x="1236.0" y="235.7" font-size="12" fill="#57606A" text-anchor="middle">缓存落到磁盘</text>
<path d="M1338.0 221.0 L1352.0 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1356.0" y="156.0" width="196.0" height="130.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1454.0" y="213.1" font-size="14.5" fill="#1D4F91" font-weight="600" text-anchor="middle">拍快照</text>
<text x="1454.0" y="235.7" font-size="12" fill="#57606A" text-anchor="middle">= 模板</text>
<rect x="48.0" y="326.0" width="1500.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="348.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">情况</text>
<text x="518.0" y="348.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">行为</text>
<line x1="48.0" y1="408.5" x2="1548.0" y2="408.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="391.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">没有 start 也没有 ready</text>
<text x="518.0" y="391.1" font-size="13.5" fill="#1F2328" text-anchor="start">跑完配置脚本就拍快照：冻住的那一刻是“系统刚配好”</text>
<line x1="48.0" y1="450.8" x2="1548.0" y2="450.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="433.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">有 start 没写 ready</text>
<text x="518.0" y="433.3" font-size="13.5" fill="#1F2328" text-anchor="start">默认 sleep 20：固定等 20 秒，可能等不够也可能等太久</text>
<line x1="48.0" y1="493.0" x2="1548.0" y2="493.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="475.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">都有</text>
<text x="518.0" y="475.6" font-size="13.5" fill="#1F2328" text-anchor="start">ready 成功、start 仍在运行，才拍快照</text>
<line x1="48.0" y1="496.0" x2="1552.0" y2="496.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="522.0" font-size="13" fill="#8C959F" text-anchor="start">刷盘不能省：内存和磁盘必须一致；文件缓存里没落盘的写，在磁盘上就是缺的。</text></svg>