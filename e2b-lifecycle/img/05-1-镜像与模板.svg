<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="782" viewBox="0 0 1600 782" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="782" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">镜像与模板：一堆文件 vs 一台开到一半就冻住的机器</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">镜像只是文件层；虚拟机要从开机走到 envd 就绪，要几秒甚至更久。模板把这几秒提前做掉，在就绪那一刻存成快照。</text>
<rect x="48.0" y="156.0" width="702.0" height="330.0" rx="14" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="68.0" y="186.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">Docker 镜像</text>
<rect x="78.0" y="226.0" width="642.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="399.0" y="258.1" font-size="13.5" fill="#57606A" text-anchor="middle">第 3 层：pip install pandas</text>
<rect x="78.0" y="296.0" width="642.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="399.0" y="328.1" font-size="13.5" fill="#57606A" text-anchor="middle">第 2 层：apt-get install python3</text>
<rect x="78.0" y="366.0" width="642.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="399.0" y="398.1" font-size="13.5" fill="#57606A" text-anchor="middle">第 1 层：ubuntu:22.04</text>
<text x="78.0" y="466.0" font-size="13.5" fill="#57606A" text-anchor="start">只是文件；容器启动 = 起一个进程</text>
<rect x="850.0" y="156.0" width="702.0" height="330.0" rx="14" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="870.0" y="186.0" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="start">E2B 模板</text>
<rect x="880.0" y="226.0" width="642.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="1201.0" y="258.1" font-size="13.5" fill="#57606A" text-anchor="middle">内核已启动 · systemd 已拉起服务</text>
<rect x="880.0" y="296.0" width="642.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="1201.0" y="328.1" font-size="13.5" fill="#57606A" text-anchor="middle">envd 已在运行 · 用户服务已启动</text>
<rect x="880.0" y="366.0" width="642.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="1201.0" y="398.1" font-size="13.5" fill="#57606A" text-anchor="middle">内存 + 磁盘 + CPU 状态，存成快照</text>
<text x="880.0" y="466.0" font-size="13.5" fill="#4B3FA8" font-weight="600" text-anchor="start">一台冻住的机器；启动 = 从这一刻接着跑</text>
<path d="M758.0 321.0 L842.0 321.0" fill="none" stroke="#1F2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="800.0" y="311.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">构建</text>
<rect x="48.0" y="526.0" width="1500.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="548.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">启动一台沙箱时</text>
<text x="418.0" y="548.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">如果每次从镜像开机</text>
<text x="1018.0" y="548.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">用模板快照</text>
<line x1="48.0" y1="608.5" x2="1548.0" y2="608.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="591.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">开机、内核初始化</text>
<text x="418.0" y="591.1" font-size="13.5" fill="#1F2328" text-anchor="start">要</text>
<text x="1018.0" y="591.1" font-size="13.5" fill="#1F2328" text-anchor="start">构建时做掉</text>
<line x1="48.0" y1="650.8" x2="1548.0" y2="650.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="633.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">systemd 拉起几十个服务</text>
<text x="418.0" y="633.3" font-size="13.5" fill="#1F2328" text-anchor="start">要</text>
<text x="1018.0" y="633.3" font-size="13.5" fill="#1F2328" text-anchor="start">构建时做掉</text>
<line x1="48.0" y1="693.0" x2="1548.0" y2="693.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="675.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">envd 与用户服务启动</text>
<text x="418.0" y="675.6" font-size="13.5" fill="#1F2328" text-anchor="start">要</text>
<text x="1018.0" y="675.6" font-size="13.5" fill="#1F2328" text-anchor="start">构建时做掉</text>
<line x1="48.0" y1="716.0" x2="1552.0" y2="716.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="742.0" font-size="13" fill="#8C959F" text-anchor="start">这就是 Sandbox.create 能在一百多毫秒内可用的根本原因。</text></svg>