<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="668" viewBox="0 0 1600 668" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m8C959F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#8C959F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="668" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">一台沙箱的组成：虚拟机里四样，宿主上五样</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">虚拟机里是内核、根文件系统、systemd 和 envd；宿主为它准备 Firecracker 进程和四样家当。启动就是把这五样准备好再加载快照，暂停反过来把它们拆掉。</text>
