<text x="92.0" y="252.0" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="start">虚拟机（guest）</text>
<rect x="96.0" y="282.0" width="524.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="358.0" y="302.8" font-size="14.5" fill="#4B3FA8" font-weight="600" text-anchor="middle">Linux 内核</text>
<text x="358.0" y="326.0" font-size="12.5" fill="#57606A" text-anchor="middle">E2B 编译的精简内核</text>
<rect x="96.0" y="348.0" width="524.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="358.0" y="368.8" font-size="14.5" fill="#4B3FA8" font-weight="600" text-anchor="middle">根文件系统 rootfs</text>
<text x="358.0" y="392.0" font-size="12.5" fill="#57606A" text-anchor="middle">ext4：发行版 + 用户软件</text>
<rect x="96.0" y="414.0" width="524.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="358.0" y="434.8" font-size="14.5" fill="#4B3FA8" font-weight="600" text-anchor="middle">systemd</text>
<text x="358.0" y="458.0" font-size="12.5" fill="#57606A" text-anchor="middle">1 号进程</text>
<rect x="96.0" y="480.0" width="524.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="358.0" y="500.8" font-size="14.5" fill="#4B3FA8" font-weight="600" text-anchor="middle">envd（49983）</text>
<text x="358.0" y="524.0" font-size="12.5" fill="#57606A" text-anchor="middle">唯一的管家：跑命令、读写文件</text>
<rect x="748.0" y="152.0" width="804.0" height="420.0" rx="14" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="768.0" y="182.0" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="start">宿主为它准备的四样家当</text>
