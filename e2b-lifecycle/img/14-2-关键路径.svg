<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="662" viewBox="0 0 1600 662" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="662" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">100 路并发的关键路径：拉起 Firecracker 占 82%</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">并行段只算最长一路。等 uffd（13.2 ms）和准备根盘（0.2 ms）被拉起 Firecracker 的 241.6 ms 盖住了。</text>
<text x="48.0" y="176.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">获取网络槽位</text>
<rect x="308.0" y="160.0" width="3.1" height="24.0" rx="4" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.2"/>
<text x="321.1" y="177.0" font-size="13" fill="#1F2328" font-weight="600" text-anchor="start">0.68 ms</text>
<text x="48.0" y="214.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">获取模板元数据</text>
<rect x="308.0" y="198.0" width="3.0" height="24.0" rx="4" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.2"/>
<text x="321.0" y="215.0" font-size="13" fill="#1F2328" font-weight="600" text-anchor="start">0.09 ms</text>
<text x="48.0" y="252.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">创建进程对象</text>
<rect x="308.0" y="236.0" width="69.6" height="24.0" rx="4" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.2"/>
<text x="387.6" y="253.0" font-size="13" fill="#1F2328" font-weight="600" text-anchor="start">15.45 ms</text>
<text x="48.0" y="290.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">等待 Firecracker 启动</text>
<rect x="308.0" y="274.0" width="1088.7" height="24.0" rx="4" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.2"/>
<text x="1406.7" y="291.0" font-size="13" fill="#1F2328" font-weight="600" text-anchor="start">241.61 ms</text>
<text x="48.0" y="328.0" font-size="14" fill="#8C959F" text-anchor="start">等待 uffd 套接字</text>
<rect x="308.0" y="312.0" width="59.4" height="24.0" rx="4" fill="#F4F5F7" stroke="#57606A" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="377.4" y="329.0" font-size="13" fill="#8C959F" text-anchor="start">13.18 ms（被盖住）</text>
<text x="48.0" y="366.0" font-size="14" fill="#8C959F" text-anchor="start">准备根盘</text>
<rect x="308.0" y="350.0" width="3.0" height="24.0" rx="4" fill="#F4F5F7" stroke="#57606A" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="321.0" y="367.0" font-size="13" fill="#8C959F" text-anchor="start">0.19 ms（被盖住）</text>
<text x="48.0" y="404.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">加载快照</text>
<rect x="308.0" y="388.0" width="131.4" height="24.0" rx="4" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.2"/>
<text x="449.4" y="405.0" font-size="13" fill="#1F2328" font-weight="600" text-anchor="start">29.15 ms</text>
<text x="48.0" y="442.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">恢复 vCPU</text>
<rect x="308.0" y="426.0" width="3.0" height="24.0" rx="4" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.2"/>
<text x="321.0" y="443.0" font-size="13" fill="#1F2328" font-weight="600" text-anchor="start">0.58 ms</text>
<text x="48.0" y="480.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">写 MMDS</text>
<rect x="308.0" y="464.0" width="3.0" height="24.0" rx="4" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.2"/>
<text x="321.0" y="481.0" font-size="13" fill="#1F2328" font-weight="600" text-anchor="start">0.4 ms</text>
<text x="48.0" y="518.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">envd /init 与零碎</text>
<rect x="308.0" y="502.0" width="30.6" height="24.0" rx="4" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.2"/>
<text x="348.6" y="519.0" font-size="13" fill="#1F2328" font-weight="600" text-anchor="start">6.8 ms</text>
<text x="48.0" y="566.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">总耗时 294.69 ms ≈ 0.7 + 0.1 + 15.5 + max(241.6, 13.2, 0.2) + 29.1 + 0.6 + 0.4 + 约 6.8</text>
<line x1="48.0" y1="596.0" x2="1552.0" y2="596.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="622.0" font-size="13" fill="#8C959F" text-anchor="start">p99：等待 Firecracker 启动 329 ms，远大于平均 242 ms，是资源争用的典型特征。优化只有这一个主战场。</text></svg>