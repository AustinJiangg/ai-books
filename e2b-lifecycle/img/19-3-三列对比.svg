<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="550" viewBox="0 0 1600 550" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="550" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">三列对比（950，修复前）：正确的位图其实就在旁边</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">每一步之间沙箱经历一次暂停加恢复。左列是原生暂停的判据，中列是 Firecracker 的写跟踪位图，右列是实际导出量。左列等于右列；中列才是真实写入。</text>
<text x="48.0" y="186.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">刚建好</text>
