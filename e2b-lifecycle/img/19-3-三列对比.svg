<text x="1344.3" y="275.0" font-size="13.5" fill="#9A3215" font-weight="600" text-anchor="start">324 MiB  原判据 = 实际导出</text>
<rect x="378.0" y="288.0" width="44.3" height="26.0" rx="4" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.2"/>
<text x="432.3" y="307.0" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">15 MiB  写跟踪位图</text>
<text x="48.0" y="378.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">只改 12 MiB</text>
<rect x="378.0" y="352.0" width="436.8" height="26.0" rx="4" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.2"/>
