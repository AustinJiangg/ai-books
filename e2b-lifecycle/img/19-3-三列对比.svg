<text x="446.1" y="403.0" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">19.7 MiB  写跟踪位图</text>
<rect x="48.0" y="443.0" width="16.0" height="16.0" rx="4" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.2"/>
<text x="72.0" y="456.0" font-size="13" fill="#57606A" text-anchor="start">原判据 GET /memory/dirty（= 实际导出）</text>
<rect x="357.7" y="443.0" width="16.0" height="16.0" rx="4" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.2"/>
<text x="381.7" y="456.0" font-size="13" fill="#57606A" text-anchor="start">写跟踪位图（真实写入 + 几 MiB 本底）</text>
<line x1="48.0" y1="484.0" x2="1552.0" y2="484.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="510.0" font-size="13" fill="#8C959F" text-anchor="start">920B 上形状完全一样，只是本底大几十 MiB。修复前的方向是安全的：在内存里是写过的超集，只会多导，不会少导。</text></svg>