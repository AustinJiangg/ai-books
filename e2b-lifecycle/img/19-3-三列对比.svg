<text x="401.6" y="211.0" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">4.6 MiB  写跟踪位图</text>
<text x="48.0" y="282.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">只读 192 MiB，一字节没改</text>
