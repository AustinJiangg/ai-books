<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">本层 hash = SHA-256(上一层 hash ; 指令类型 ; 参数 ; 上传文件的 hash)。hash 只看文本，不看结果：软件源更新了，文本没变，仍然命中。</text>
