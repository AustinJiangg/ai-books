<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="722" viewBox="0 0 1600 722" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="722" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">两种快照共用的部件</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">暂停恢复和快照回滚是两套独立机制，但管的是同一台沙箱。中间一列是两者都会碰的部件；改动原则是纯加法：不用回滚的沙箱行为不变。</text>
<rect x="48.0" y="156.0" width="360.0" height="470.0" rx="14" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="68.0" y="186.0" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="start">只属于暂停恢复</text>
<circle cx="76.0" cy="231.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="88.0" y="236.0" font-size="14.5" fill="#1F2328" text-anchor="start">Pause / Checkpoint RPC</text>
<circle cx="76.0" cy="275.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="88.0" y="280.0" font-size="14.5" fill="#1F2328" text-anchor="start">process_vm_readv 导出内存</text>
<circle cx="76.0" cy="319.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="88.0" y="324.0" font-size="14.5" fill="#1F2328" text-anchor="start">ExportDiff 导出磁盘</text>
<circle cx="76.0" cy="363.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="88.0" y="368.0" font-size="14.5" fill="#1F2328" text-anchor="start">上传到存储</text>
<circle cx="76.0" cy="407.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="88.0" y="412.0" font-size="14.5" fill="#1F2328" text-anchor="start">新进程重建</text>
<rect x="448.0" y="156.0" width="620.0" height="470.0" rx="14" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="468.0" y="186.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">共用</text>
<rect x="468.0" y="216.0" width="580.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="758.0" y="238.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">Firecracker</text>
<text x="758.0" y="260.6" font-size="12" fill="#57606A" text-anchor="middle">回滚加了三处扩展：快照时导出位图、随时导出写跟踪位图、原地回滚</text>
<rect x="468.0" y="282.0" width="580.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="758.0" y="304.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">启动配置</text>
<text x="758.0" y="326.6" font-size="12" fill="#57606A" text-anchor="middle">按硬件决定是否开脏页跟踪，从快照加载时也要开</text>
<rect x="468.0" y="348.0" width="580.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="758.0" y="370.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">磁盘写层</text>
<text x="758.0" y="392.6" font-size="12" fill="#57606A" text-anchor="middle">回滚存档会封存写层，变成一叠</text>
<rect x="468.0" y="414.0" width="580.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="758.0" y="436.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">脏页位图</text>
<text x="758.0" y="458.6" font-size="12" fill="#57606A" text-anchor="middle">回滚靠它；每次存档读档都清零</text>
<rect x="468.0" y="480.0" width="580.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="758.0" y="502.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">proxy</text>
<text x="758.0" y="524.6" font-size="12" fill="#57606A" text-anchor="middle">拦截发往 49984 的回滚请求</text>
