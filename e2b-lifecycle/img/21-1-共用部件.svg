<text x="758.0" y="590.6" font-size="12" fill="#57606A" text-anchor="middle">每槽多一个 conntrack 句柄</text>
<rect x="1108.0" y="156.0" width="444.0" height="470.0" rx="14" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1128.0" y="186.0" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="start">只属于快照回滚</text>
