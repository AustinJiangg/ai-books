<text x="1148.0" y="280.0" font-size="14.5" fill="#1F2328" text-anchor="start">账本（只在内存）</text>
<circle cx="1136.0" cy="319.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1148.0" y="324.0" font-size="14.5" fill="#1F2328" text-anchor="start">原地回滚九阶段</text>
<circle cx="1136.0" cy="363.1" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1148.0" y="368.0" font-size="14.5" fill="#1F2328" text-anchor="start">层折叠与回收</text>
<line x1="48.0" y1="656.0" x2="1552.0" y2="656.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="682.0" font-size="13" fill="#8C959F" text-anchor="start">分工：原生管离场与重建（暂停约 250 ms、恢复约 110 ms）；回滚管活沙箱里的高频回退（存档约 17 ms、读档约 22 ms，950 · 0 MiB 档）。</text></svg>