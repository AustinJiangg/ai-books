<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="812" viewBox="0 0 1600 812" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="812" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">快照拍在就绪那一刻</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">快照记下的是那一刻的全部状态；以后每次恢复都从同一刻接着跑。拍得越晚，每次恢复省下的越多，只花一次。</text>
<line x1="48.0" y1="226.0" x2="1552.0" y2="226.0" stroke="#1F2328" stroke-width="2" stroke-linecap="round" marker-end="url(#m1F2328)"/>
<circle cx="93.1" cy="226.0" r="6" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="93.1" y="206.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">开机</text>
<circle cx="378.9" cy="226.0" r="6" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="378.9" y="206.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">内核就绪</text>
<circle cx="679.7" cy="226.0" r="6" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="679.7" y="206.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">systemd 拉起服务</text>
<circle cx="980.5" cy="226.0" r="6" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="980.5" y="206.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">envd 就绪</text>
<circle cx="1281.3" cy="226.0" r="6" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="1281.3" y="206.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">用户服务就绪</text>
<line x1="1341.4" y1="186.0" x2="1341.4" y2="266.0" stroke="#D6603D" stroke-width="2.5" stroke-linecap="round"/>
<rect x="1309.4" y="272.5" width="64.0" height="27.0" rx="13.5" fill="#FCEDE8" stroke="#D6603D" stroke-width="1"/>
<text x="1341.4" y="291.0" font-size="14" fill="#9A3215" font-weight="600" text-anchor="middle">拍快照</text>
<rect x="48.0" y="336.0" width="1500.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="358.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">快照拍在</text>
<text x="518.0" y="358.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">每次恢复后</text>
<text x="1038.0" y="358.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">效果</text>
<line x1="48.0" y1="418.5" x2="1548.0" y2="418.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="401.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">开机前</text>
<text x="518.0" y="401.1" font-size="13.5" fill="#1F2328" text-anchor="start">每次恢复都要从头开机</text>
<text x="1038.0" y="401.1" font-size="13.5" fill="#1F2328" text-anchor="start">几秒</text>
<line x1="48.0" y1="460.8" x2="1548.0" y2="460.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="443.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">envd 就绪</text>
<text x="518.0" y="443.3" font-size="13.5" fill="#1F2328" text-anchor="start">恢复出来 envd 就能接命令</text>
<text x="1038.0" y="443.3" font-size="13.5" fill="#1F2328" text-anchor="start">省掉开机与服务启动</text>
<rect x="48.0" y="462.8" width="1500.0" height="38.2" rx="6" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="58.0" y="485.6" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">用户服务就绪（E2B 的做法）</text>
<text x="518.0" y="485.6" font-size="13.5" fill="#0E6B4F" text-anchor="start">恢复出来 Jupyter 等服务已经可用</text>
<text x="1038.0" y="485.6" font-size="13.5" fill="#0E6B4F" text-anchor="start">连用户服务的启动也省了</text>
<rect x="48.0" y="546.0" width="1500.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="568.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">副作用</text>
<text x="518.0" y="568.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">原因</text>
<text x="1038.0" y="568.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">处理</text>
<line x1="48.0" y1="628.5" x2="1548.0" y2="628.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="611.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">所有沙箱内存一模一样</text>
<text x="518.0" y="611.1" font-size="13.5" fill="#1F2328" text-anchor="start">从同一张快照恢复</text>
<text x="1038.0" y="611.1" font-size="13.5" fill="#1F2328" text-anchor="start">/init 注入不同身份、令牌、环境变量</text>
<line x1="48.0" y1="670.8" x2="1548.0" y2="670.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="653.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">时钟停在构建那一刻</text>
<text x="518.0" y="653.3" font-size="13.5" fill="#1F2328" text-anchor="start">快照冻结了时间</text>
<text x="1038.0" y="653.3" font-size="13.5" fill="#1F2328" text-anchor="start">恢复后校时</text>
<line x1="48.0" y1="713.0" x2="1548.0" y2="713.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="695.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">看门狗误判服务卡死</text>
<text x="518.0" y="695.6" font-size="13.5" fill="#1F2328" text-anchor="start">时钟跳变</text>
<text x="1038.0" y="695.6" font-size="13.5" fill="#1F2328" text-anchor="start">构建时就关掉看门狗</text>
<line x1="48.0" y1="746.0" x2="1552.0" y2="746.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="772.0" font-size="13" fill="#8C959F" text-anchor="start">构建比启动贵几个数量级，但对一个模板只做一次；之后成千上万次启动都直接享用成果。</text></svg>