<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="552" viewBox="0 0 1600 552" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="552" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">页、大页与页表</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">同样 2 MiB 的数据：4 KiB 小页要 512 个页表项，2 MiB 大页只要 1 个。TLB 只能缓存有限的表项，大页让它覆盖的范围扩大 512 倍。代价是一次读、补、存都至少 2 MiB。</text>
