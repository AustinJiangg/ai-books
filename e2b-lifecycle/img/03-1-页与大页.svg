<text x="72.0" y="326.0" font-size="13.5" fill="#57606A" text-anchor="start">2 MiB = 512 页（图中只画 32 格示意）</text>
<text x="72.0" y="361.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">页表项：512 个</text>
<text x="72.0" y="391.0" font-size="13.5" fill="#9A3215" text-anchor="start">TLB 很快装不下，查表变多</text>
<text x="72.0" y="421.0" font-size="13.5" fill="#57606A" text-anchor="start">缺页时一次补 4 KiB</text>
<rect x="840.0" y="156.0" width="712.0" height="300.0" rx="14" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="860.0" y="186.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">2 MiB 大页</text>
