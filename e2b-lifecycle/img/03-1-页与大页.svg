<text x="864.0" y="361.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">页表项：1 个</text>
<text x="864.0" y="391.0" font-size="13.5" fill="#0E6B4F" text-anchor="start">TLB 覆盖范围大 512 倍，运行更快</text>
<text x="864.0" y="421.0" font-size="13.5" fill="#9A3215" text-anchor="start">缺页时一次补 2 MiB：读、补、存都按 2 MiB</text>
<line x1="48.0" y1="486.0" x2="1552.0" y2="486.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="512.0" font-size="13" fill="#8C959F" text-anchor="start">E2B 沙箱的内存默认由 2 MiB 大页背衬（hugetlbfs），大页池在宿主上提前预留。</text></svg>