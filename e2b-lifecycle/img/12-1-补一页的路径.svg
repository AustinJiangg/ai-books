<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="552" viewBox="0 0 1600 552" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="552" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">补一页的路径</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">guest 访问一页还没有内容的内存 → 内核挂起 vCPU、通知 orchestrator → 算出 memfile 偏移、查映射表 → 读本地缓存（没有就从存储拉）→ UFFDIO_COPY 填 2 MiB → 唤醒 vCPU。</text>
<rect x="48.0" y="156.0" width="196.0" height="110.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="146.0" y="203.0" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="middle">guest 缺页</text>
<text x="146.0" y="225.6" font-size="12" fill="#57606A" text-anchor="middle">访问地址 X</text>
<path d="M248.0 211.0 L262.0 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="266.0" y="156.0" width="196.0" height="110.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="364.0" y="203.0" font-size="14" fill="#8A5300" font-weight="600" text-anchor="middle">内核挂起 vCPU</text>
<text x="364.0" y="225.6" font-size="12" fill="#57606A" text-anchor="middle">发缺页消息</text>
<path d="M466.0 211.0 L480.0 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="484.0" y="156.0" width="196.0" height="110.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="582.0" y="203.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">uffd 处理器</text>
<text x="582.0" y="225.6" font-size="12" fill="#57606A" text-anchor="middle">X → memfile 偏移</text>
<path d="M684.0 211.0 L698.0 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="702.0" y="156.0" width="196.0" height="110.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="203.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">查映射表</text>
<text x="800.0" y="225.6" font-size="12" fill="#57606A" text-anchor="middle">在哪一代哪个偏移</text>
<path d="M902.0 211.0 L916.0 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="920.0" y="156.0" width="196.0" height="110.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="1018.0" y="203.0" font-size="14" fill="#3D3C38" font-weight="600" text-anchor="middle">本地缓存</text>
<text x="1018.0" y="225.6" font-size="12" fill="#57606A" text-anchor="middle">没有就从存储拉</text>
<path d="M1120.0 211.0 L1134.0 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1138.0" y="156.0" width="196.0" height="110.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1236.0" y="203.0" font-size="14" fill="#8A5300" font-weight="600" text-anchor="middle">UFFDIO_COPY</text>
<text x="1236.0" y="225.6" font-size="12" fill="#57606A" text-anchor="middle">填一整页 2 MiB</text>
<path d="M1338.0 211.0 L1352.0 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1356.0" y="156.0" width="196.0" height="110.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="1454.0" y="203.0" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="middle">唤醒，重做</text>
<text x="1454.0" y="225.6" font-size="12" fill="#57606A" text-anchor="middle">这次成功</text>
<rect x="48.0" y="306.0" width="1500.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<line x1="48.0" y1="388.5" x2="1548.0" y2="388.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="371.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">一次缺页填多少</text>
<text x="478.0" y="371.1" font-size="13.5" fill="#1F2328" text-anchor="start">一整个 guest 页</text>
<text x="1018.0" y="371.1" font-size="13.5" fill="#1F2328" text-anchor="start">大页背衬：2 MiB</text>
<line x1="48.0" y1="430.8" x2="1548.0" y2="430.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="413.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">400 MiB 工作集要缺页几次</text>
<text x="478.0" y="413.3" font-size="13.5" fill="#1F2328" text-anchor="start">2 MiB 大页：约 200 次</text>
<text x="1018.0" y="413.3" font-size="13.5" fill="#1F2328" text-anchor="start">4 KiB 小页：约 10 万次</text>
<line x1="48.0" y1="473.0" x2="1548.0" y2="473.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="455.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">大页池</text>
<text x="478.0" y="455.6" font-size="13.5" fill="#1F2328" text-anchor="start">部署时预留，按需落地</text>
<text x="1018.0" y="455.6" font-size="13.5" fill="#1F2328" text-anchor="start">只增不减；沙箱销毁即归还</text>
<line x1="48.0" y1="486.0" x2="1552.0" y2="486.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="512.0" font-size="13" fill="#8C959F" text-anchor="start">加载快照时一页内存都没读；内存是在 guest 跑起来之后，一次次缺页回来的。</text></svg>