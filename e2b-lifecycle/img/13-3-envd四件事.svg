<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="412" viewBox="0 0 1600 412" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="412" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">envd 醒过来之后的四件事</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">envd 没有重新启动，它从构建那一刻接着往下跑，只需要醒过来、接收新的身份。</text>
<rect x="48.0" y="156.0" width="338.5" height="150.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="217.2" y="213.9" font-size="16" fill="#4B3FA8" font-weight="600" text-anchor="middle">拿身份</text>
<text x="217.2" y="237.1" font-size="12.5" fill="#57606A" text-anchor="middle">从 MMDS 读沙箱信息</text>
<text x="217.2" y="255.9" font-size="12.5" fill="#57606A" text-anchor="middle">（客户端改为复用连接）</text>
<path d="M390.5 231.0 L432.5 231.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="436.5" y="156.0" width="338.5" height="150.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="605.8" y="204.5" font-size="16" fill="#4B3FA8" font-weight="600" text-anchor="middle">收配置</text>
<text x="605.8" y="227.7" font-size="12.5" fill="#57606A" text-anchor="middle">orchestrator 调 /init：</text>
<text x="605.8" y="246.5" font-size="12.5" fill="#57606A" text-anchor="middle">令牌、环境变量、默认用户</text>
<text x="605.8" y="265.2" font-size="12.5" fill="#57606A" text-anchor="middle">（超时 50 ms → 120 s）</text>
<path d="M779.0 231.0 L821.0 231.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="825.0" y="156.0" width="338.5" height="150.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="994.2" y="213.9" font-size="16" fill="#4B3FA8" font-weight="600" text-anchor="middle">对时</text>
<text x="994.2" y="237.1" font-size="12.5" fill="#57606A" text-anchor="middle">时钟停在构建那一刻</text>
<text x="994.2" y="255.9" font-size="12.5" fill="#57606A" text-anchor="middle">chrony 从宿主时钟设备同步</text>
<path d="M1167.5 231.0 L1209.5 231.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1213.5" y="156.0" width="338.5" height="150.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1382.8" y="213.9" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">对外就绪</text>
<text x="1382.8" y="237.1" font-size="12.5" fill="#57606A" text-anchor="middle">外部轮询健康检查</text>
<text x="1382.8" y="255.9" font-size="12.5" fill="#57606A" text-anchor="middle">直到应答</text>
<line x1="48.0" y1="346.0" x2="1552.0" y2="346.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="372.0" font-size="13" fill="#8C959F" text-anchor="start">/init 是同步的，在 ResumeSandbox 之内，通常几毫秒；客户端多出的几百毫秒不是“envd 启动慢”（第 14 篇）。</text></svg>