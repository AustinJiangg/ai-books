<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="482" viewBox="0 0 1600 482" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="482" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">启动脚本的管线</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">unshare -m 开私有挂载命名空间；把挂载树设为私有；盖 tmpfs、放两个符号链接；最后进入网络命名空间并启动 Firecracker。两处全挂载树操作（红）在高并发下要抢内核全局锁。</text>
<rect x="48.0" y="156.0" width="229.0" height="120.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="162.5" y="208.1" font-size="14.5" fill="#9A3215" font-weight="600" text-anchor="middle">unshare -m</text>
<text x="162.5" y="230.7" font-size="12" fill="#57606A" text-anchor="middle">新的挂载命名空间</text>
<path d="M281.0 216.0 L299.0 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="303.0" y="156.0" width="229.0" height="120.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="417.5" y="208.1" font-size="14.5" fill="#9A3215" font-weight="600" text-anchor="middle">mount --make-rprivate /</text>
<text x="417.5" y="230.7" font-size="12" fill="#57606A" text-anchor="middle">遍历整棵挂载树</text>
<path d="M536.0 216.0 L554.0 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="558.0" y="156.0" width="229.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="672.5" y="208.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">mount -t tmpfs</text>
<text x="672.5" y="230.7" font-size="12" fill="#57606A" text-anchor="middle">盖住沙箱目录</text>
<path d="M791.0 216.0 L809.0 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="813.0" y="156.0" width="229.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="927.5" y="208.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">ln -s ×2</text>
<text x="927.5" y="230.7" font-size="12" fill="#57606A" text-anchor="middle">磁盘、内核</text>
<path d="M1046.0 216.0 L1064.0 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1068.0" y="156.0" width="229.0" height="120.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1182.5" y="199.1" font-size="14.5" fill="#9A3215" font-weight="600" text-anchor="middle">ip netns exec &lt;ns&gt;</text>
<text x="1182.5" y="221.7" font-size="12" fill="#57606A" text-anchor="middle">进网络命名空间</text>
<text x="1182.5" y="239.7" font-size="12" fill="#57606A" text-anchor="middle">（还偷偷做五件事）</text>
<path d="M1301.0 216.0 L1319.0 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1323.0" y="156.0" width="229.0" height="120.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1437.5" y="208.1" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">firecracker</text>
<text x="1437.5" y="230.7" font-size="12" fill="#57606A" text-anchor="middle">--api-sock &lt;sock&gt;</text>
<rect x="48.0" y="316.0" width="1504.0" height="70.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="800.0" y="342.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">然后</text>
<text x="800.0" y="366.2" font-size="12.5" fill="#57606A" text-anchor="middle">orchestrator 每 10 毫秒检查一次 API 套接字是否出现；同时盯着脚本进程，提前退出就立即取消等待并报因</text>
<line x1="48.0" y1="416.0" x2="1552.0" y2="416.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="442.0" font-size="13" fill="#8C959F" text-anchor="start">第 15 篇：只把 ip netns exec 换成 fc-netns-exec，“等待 Firecracker 启动”就省下一大截。</text></svg>