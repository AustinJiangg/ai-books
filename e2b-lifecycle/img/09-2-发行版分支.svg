<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="662" viewBox="0 0 1600 662" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="662" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">发行版分支：先探测，再走各自的路</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">provision.sh 读 /etc/os-release；默认用户、USER 指令和 configure.sh 看有没有 /etc/debian_version、有没有 wheel 组。</text>
