<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="392" viewBox="0 0 1600 392" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="392" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">镜像解包成 ext4</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">按最大尺寸造一块空 ext4；挂载后把各层并行解包到各自目录，用 overlayfs 叠成一个只读视图，rsync 进磁盘；最后检查、收缩、再检查。</text>
<rect x="48.0" y="156.0" width="225.7" height="130.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="160.8" y="212.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">拉镜像</text>
<text x="160.8" y="236.2" font-size="12.5" fill="#57606A" text-anchor="middle">指定平台；拉下来再查一次架构</text>
<path d="M277.7 221.0 L299.7 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="303.7" y="156.0" width="225.7" height="130.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="416.5" y="203.5" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">造空 ext4</text>
<text x="416.5" y="226.8" font-size="12.5" fill="#57606A" text-anchor="middle">约 24 GiB 上限；每 4 KiB 一个</text>
<text x="416.5" y="245.5" font-size="12.5" fill="#57606A" text-anchor="middle">inode；不留 root 预留</text>
<path d="M533.3 221.0 L555.3 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="559.3" y="156.0" width="225.7" height="130.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="672.2" y="212.9" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">各层并行解包</text>
<text x="672.2" y="236.2" font-size="12.5" fill="#57606A" text-anchor="middle">layer-0、layer-1……</text>
<path d="M789.0 221.0 L811.0 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="815.0" y="156.0" width="225.7" height="130.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="927.8" y="212.9" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">overlayfs 叠起来</text>
<text x="927.8" y="236.2" font-size="12.5" fill="#57606A" text-anchor="middle">删除与覆盖交给内核处理</text>
<path d="M1044.7 221.0 L1066.7 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1070.7" y="156.0" width="225.7" height="130.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="1183.5" y="212.9" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">rsync 进磁盘</text>
<text x="1183.5" y="236.2" font-size="12.5" fill="#57606A" text-anchor="middle">保留权限、符号链接、硬链接</text>
<path d="M1300.3 221.0 L1322.3 221.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1326.3" y="156.0" width="225.7" height="130.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1439.2" y="212.9" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">查 → 缩 → 查</text>
<text x="1439.2" y="236.2" font-size="12.5" fill="#57606A" text-anchor="middle">收缩到刚好装下</text>
<line x1="48.0" y1="326.0" x2="1552.0" y2="326.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="352.0" font-size="13" fill="#8C959F" text-anchor="start">上游把平台写死成 amd64，这是搬到 ARM 要改的第一处（第 9 篇）。</text></svg>