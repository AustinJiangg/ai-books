<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="482" viewBox="0 0 1600 482" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="482" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">恢复的时间账（920B 单次，92.6 ms 返回）</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">恢复不搬运任何数据：内存按缺页回来，根盘按需读差分。所以 950 上 0 MiB 档 109.3 ms、256 MiB 档 120.7 ms，几乎不随改动量变化。</text>
