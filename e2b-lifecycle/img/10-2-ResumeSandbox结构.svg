<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="682" viewBox="0 0 1600 682" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="682" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">ResumeSandbox 的三段结构</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">第一段串行准备，同时在后台开始领网络槽位、搭根盘、准备 uffd、预取；第二段三路并行，耗时等于最慢的一路；第三段串行收尾。</text>
<rect x="48.0" y="156.0" width="380.0" height="430.0" rx="14" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="68.0" y="186.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">一 · 串行准备</text>
<circle cx="78.0" cy="247.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="78.0" y="251.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<rect x="98.0" y="216.0" width="314.0" height="62.1" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="112.0" y="239.2" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">取模板句柄</text>
<text x="112.0" y="261.2" font-size="11.5" fill="#57606A" text-anchor="start">缓存没有就后台拉</text>
<circle cx="78.0" cy="317.1" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="78.0" y="321.6" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<rect x="98.0" y="286.1" width="314.0" height="62.1" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="112.0" y="309.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">发起后台准备</text>
<text x="112.0" y="331.2" font-size="11.5" fill="#57606A" text-anchor="start">槽位、根盘、uffd、预取</text>
<circle cx="78.0" cy="375.1" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="78.0" y="379.6" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<rect x="98.0" y="356.1" width="314.0" height="37.8" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="112.0" y="379.4" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">等网络槽位</text>
<circle cx="78.0" cy="420.9" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="78.0" y="425.4" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<rect x="98.0" y="402.0" width="314.0" height="37.8" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="112.0" y="425.2" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">读模板元数据</text>
<circle cx="78.0" cy="478.8" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="78.0" y="483.3" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<rect x="98.0" y="447.8" width="314.0" height="62.1" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="112.0" y="471.0" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">建 Firecracker 进程对象</text>
<text x="112.0" y="493.0" font-size="11.5" fill="#57606A" text-anchor="start">生成启动脚本，进程未起</text>
<rect x="468.0" y="156.0" width="520.0" height="430.0" rx="14" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="488.0" y="186.0" font-size="15" fill="#8A5300" font-weight="600" text-anchor="start">二 · 三路并行（取最慢）</text>
<rect x="492.0" y="226.0" width="472.0" height="100.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="728.0" y="267.9" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">拉起 Firecracker</text>
<text x="728.0" y="291.2" font-size="12.5" fill="#57606A" text-anchor="middle">执行启动脚本，等 API 套接字出现（第 11 篇）</text>
<rect x="492.0" y="346.0" width="472.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="728.0" y="382.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">等 uffd 套接字</text>
<text x="728.0" y="406.2" font-size="12.5" fill="#57606A" text-anchor="middle">内存处理器就绪（第 12 篇）</text>
<rect x="492.0" y="456.0" width="472.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="728.0" y="492.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">接上根盘</text>
<text x="728.0" y="516.2" font-size="12.5" fill="#57606A" text-anchor="middle">符号链接到 NBD 设备（第 13 篇）</text>
<rect x="1028.0" y="156.0" width="524.0" height="430.0" rx="14" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1048.0" y="186.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">三 · 串行收尾</text>
<circle cx="1058.0" cy="247.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="1058.0" y="251.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<rect x="1078.0" y="216.0" width="458.0" height="62.1" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1092.0" y="239.2" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">加载快照</text>
<text x="1092.0" y="261.2" font-size="11.5" fill="#57606A" text-anchor="start">PUT /snapshot/load，内存交给 uffd</text>
<circle cx="1058.0" cy="307.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="1058.0" y="311.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<rect x="1078.0" y="288.1" width="458.0" height="37.8" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1092.0" y="311.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">恢复 vCPU</text>
<circle cx="1058.0" cy="366.9" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="1058.0" y="371.4" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<rect x="1078.0" y="335.9" width="458.0" height="62.1" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1092.0" y="359.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">写 MMDS</text>
<text x="1092.0" y="381.1" font-size="11.5" fill="#57606A" text-anchor="start">沙箱身份</text>
<circle cx="1058.0" cy="439.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="1058.0" y="443.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<rect x="1078.0" y="408.0" width="458.0" height="62.1" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1092.0" y="431.2" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">调 envd /init</text>
<text x="1092.0" y="453.1" font-size="11.5" fill="#57606A" text-anchor="start">令牌、环境变量、默认用户</text>
<path d="M432.0 371.0 L464.0 371.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<path d="M992.0 371.0 L1024.0 371.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<line x1="48.0" y1="616.0" x2="1552.0" y2="616.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="642.0" font-size="13" fill="#8C959F" text-anchor="start">每准备好一样资源就登记一个清理函数；任何一步失败，倒序执行全部清理，不在宿主上留垃圾。</text></svg>