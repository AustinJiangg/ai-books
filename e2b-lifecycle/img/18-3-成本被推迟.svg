<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="380" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">成本被推迟：恢复很快，第一次访问工作集才慢</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">950 上：快照前第一次读 192 MiB 负载 590.9 ms；暂停、恢复之后第一次读同一份负载 702.6 ms，多出约 112 ms，由 guest 里第一个访问这些页的程序承担。</text>
<text x="48.0" y="194.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">快照前首次读 192 MiB</text>
<rect x="348.0" y="166.0" width="711.4" height="40.0" rx="5" fill="#F4F5F7" stroke="#57606A" stroke-width="1.2"/>
<text x="1069.4" y="194.0" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">590.9 ms</text>
<text x="48.0" y="258.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">恢复后首次读 192 MiB</text>
<rect x="348.0" y="230.0" width="845.9" height="40.0" rx="5" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.2"/>
<text x="1203.9" y="258.0" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">702.6 ms  多约 112 ms</text>
<line x1="48.0" y1="314.0" x2="1552.0" y2="314.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="340.0" font-size="13" fill="#8C959F" text-anchor="start">所以评价恢复不能只看 connect() 多久返回；第 20 篇用“恢复后首次读一遍负载”的时间衡量改动有没有让恢复变慢。</text></svg>