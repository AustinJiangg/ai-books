<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="689" viewBox="0 0 1600 689" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="689" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">暂停的六步：第 ② 步之后再也没有恢复运行</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">前五步把状态存下来；第 ⑥ 步导出磁盘增量时把写层摘下、关掉沙箱。导出磁盘的那个函数，参数之一就是“关掉沙箱”的回调。</text>
<circle cx="62.0" cy="184.8" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="189.3" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<rect x="88.0" y="152.0" width="940.0" height="65.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="176.7" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">停掉健康检查</text>
<text x="102.0" y="199.9" font-size="12.5" fill="#57606A" text-anchor="start">沙箱接下来会停止响应，别让健康检查误报</text>
<circle cx="62.0" cy="262.3" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="266.8" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<rect x="88.0" y="229.6" width="940.0" height="65.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="254.2" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">暂停 vCPU</text>
<text x="102.0" y="277.5" font-size="12.5" fill="#57606A" text-anchor="start">guest 不再产生新状态</text>
<circle cx="62.0" cy="339.9" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="344.4" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<rect x="88.0" y="307.1" width="940.0" height="65.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="331.8" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">让 Firecracker 写 snapfile</text>
<text x="102.0" y="355.1" font-size="12.5" fill="#57606A" text-anchor="start">CPU、中断控制器、设备状态；不含内存</text>
<circle cx="62.0" cy="417.4" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="421.9" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<rect x="88.0" y="384.7" width="940.0" height="65.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="409.4" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">取脏页集合</text>
<text x="102.0" y="432.6" font-size="12.5" fill="#57606A" text-anchor="start">问内存处理器：这一代哪些页改过</text>
<circle cx="62.0" cy="495.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="499.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<rect x="88.0" y="462.2" width="940.0" height="65.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="486.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">导出内存增量</text>
<text x="102.0" y="510.2" font-size="12.5" fill="#57606A" text-anchor="start">process_vm_readv 从 Firecracker 进程读出，写成紧凑文件</text>
<circle cx="62.0" cy="572.5" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="577.0" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">6</text>
<rect x="88.0" y="539.8" width="940.0" height="65.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="564.5" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">导出磁盘增量</text>
<text x="102.0" y="587.7" font-size="12.5" fill="#57606A" text-anchor="start">摘下写层 → 关掉沙箱 → 等 NBD 释放 → 逐块导出</text>
<rect x="1078.0" y="152.0" width="474.0" height="300.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1315.0" y="274.4" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">为什么必须停</text>
<text x="1315.0" y="298.3" font-size="13" fill="#57606A" text-anchor="middle">摘下写层后，guest 再写磁盘无处可去</text>
<text x="1315.0" y="317.8" font-size="13" fill="#57606A" text-anchor="middle">遍历写层时不能有并发写，否则导出“一半新一半旧”</text>
<text x="1315.0" y="337.3" font-size="13" fill="#57606A" text-anchor="middle">NBD 设备释放后写层文件才能关闭</text>
<rect x="1078.0" y="472.0" width="474.0" height="90.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="1315.0" y="508.9" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">最后</text>
<text x="1315.0" y="532.2" font-size="12.5" fill="#57606A" text-anchor="middle">写元数据 → 上传 → 等上传完才返回</text>
<line x1="48.0" y1="623.3" x2="1552.0" y2="623.3" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="649.3" font-size="13" fill="#8C959F" text-anchor="start">对“沙箱离场”合理；对高频存档读档不可接受，这是另做快照回滚的直接原因。</text></svg>