<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="688" viewBox="0 0 1600 688" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="688" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">还剩下的问题与可能方向</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">按影响面排列。</text>
<rect x="48.0" y="152.0" width="1500.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="174.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">问题</text>
<text x="478.0" y="174.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">现状</text>
<text x="998.0" y="174.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">可能的方向</text>
<rect x="48.0" y="194.2" width="1500.0" height="38.2" rx="6" fill="#FCEDE8" stroke="#D6603D" stroke-width="1"/>
<text x="58.0" y="217.1" font-size="13.5" fill="#9A3215" font-weight="600" text-anchor="start">高并发下拉起 Firecracker 仍是主瓶颈</text>
<text x="478.0" y="217.1" font-size="13.5" fill="#9A3215" text-anchor="start">仍有约 7 次 fork/exec、1 次挂载树遍历、bash 解析、10 ms 轮询</text>
<text x="998.0" y="217.1" font-size="13.5" fill="#9A3215" text-anchor="start">减少全局锁上的操作而不是挪动它；事件通知代替轮询</text>
<line x1="48.0" y1="276.8" x2="1548.0" y2="276.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="259.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">暂停里约 114 ms 未归因</text>
<text x="478.0" y="259.3" font-size="13.5" fill="#1F2328" text-anchor="start">Firecracker 退出过程中调用栈读不到的一段</text>
<text x="998.0" y="259.3" font-size="13.5" fill="#1F2328" text-anchor="start">更细的跟踪；退出与导出能否并行</text>
<line x1="48.0" y1="319.0" x2="1548.0" y2="319.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="301.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">模板放在 tmpfs 上</text>
<text x="478.0" y="301.6" font-size="13.5" fill="#1F2328" text-anchor="start">宿主重启即丢</text>
<text x="998.0" y="301.6" font-size="13.5" fill="#1F2328" text-anchor="start">改到持久磁盘，或真正启用 MinIO</text>
<line x1="48.0" y1="361.2" x2="1548.0" y2="361.2" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="343.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">强杀时网络池泄漏</text>
<text x="478.0" y="343.8" font-size="13.5" fill="#1F2328" text-anchor="start">只能停—清—启</text>
<text x="998.0" y="343.8" font-size="13.5" fill="#1F2328" text-anchor="start">启动时识别并回收上一次的残留</text>
<line x1="48.0" y1="403.5" x2="1548.0" y2="403.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="386.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">920B 上原生暂停不精确</text>
<text x="478.0" y="386.1" font-size="13.5" fill="#1F2328" text-anchor="start">默认不开跟踪</text>
<text x="998.0" y="386.1" font-size="13.5" fill="#1F2328" text-anchor="start">取决于写保护的运行期代价值不值</text>
<line x1="48.0" y1="445.8" x2="1548.0" y2="445.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="428.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">Firecracker 不在自己的 cgroup</text>
<text x="478.0" y="428.3" font-size="13.5" fill="#1F2328" text-anchor="start">只能整组记账、整组绑核</text>
<text x="998.0" y="428.3" font-size="13.5" fill="#1F2328" text-anchor="start">恢复按沙箱放入 cgroup 的代码，验证 v1 宿主</text>
<line x1="48.0" y1="488.0" x2="1548.0" y2="488.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="470.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">客户端多出的约 300 ms 没拆完</text>
<text x="478.0" y="470.6" font-size="13.5" fill="#1F2328" text-anchor="start">路由、轮询就绪、缺页还没打点</text>
<text x="998.0" y="470.6" font-size="13.5" fill="#1F2328" text-anchor="start">在 envd 内部和 proxy 层补点</text>
<line x1="48.0" y1="622.0" x2="1552.0" y2="622.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="648.0" font-size="13" fill="#8C959F" text-anchor="start">回看路线见第 23 篇第四节。</text></svg>