<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="632" viewBox="0 0 1600 632" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="632" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">虚拟内存与缺页：用到了才准备</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">进程看到的是虚拟地址，经页表一页一页地翻译成物理内存。页表项的存在位是 0 时，访问会触发缺页，内核这时才分配物理页、填内容、登记页表，然后让进程接着跑。</text>
