<text x="1154.0" y="276.6" font-size="16" fill="#9A3215" font-weight="600" text-anchor="start">访问虚拟页 2 → 缺页</text>
<text x="1154.0" y="301.2" font-size="13.5" fill="#57606A" text-anchor="start">① CPU 发现存在位是 0，停下</text>
<text x="1154.0" y="321.4" font-size="13.5" fill="#57606A" text-anchor="start">② 交给内核</text>
<text x="1154.0" y="341.7" font-size="13.5" fill="#57606A" text-anchor="start">③ 找一页空闲物理内存</text>
<text x="1154.0" y="361.9" font-size="13.5" fill="#57606A" text-anchor="start">④ 填内容：新内存填零；</text>
<text x="1154.0" y="382.2" font-size="13.5" fill="#57606A" text-anchor="start">文件映射从文件读；</text>
<text x="1154.0" y="402.4" font-size="13.5" fill="#57606A" text-anchor="start">登记了 UFFD 的交给用户态程序</text>
<text x="1154.0" y="422.7" font-size="13.5" fill="#57606A" text-anchor="start">⑤ 登记页表，存在位置 1</text>
<text x="1154.0" y="442.9" font-size="13.5" fill="#57606A" text-anchor="start">⑥ 进程接着跑</text>
<line x1="48.0" y1="566.0" x2="1552.0" y2="566.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="592.0" font-size="13" fill="#8C959F" text-anchor="start">注：E2B 要让客户机内存也“用到才准备”，但数据散在好几代快照里，内核不知道去哪读，所以要用 userfaultfd 把第 ④ 步交给 orchestrator。</text></svg>