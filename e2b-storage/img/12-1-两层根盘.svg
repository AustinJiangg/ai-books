<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">下层是所有同模板沙箱共享的只读模板，上层是每个沙箱自己的 COW 文件。写一律写上层并在位图里登记；读先看上层，没有再看下层。</text>
