<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="678" viewBox="0 0 1600 678" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="678" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">新一代 header 怎么来：拿上一代的表，用本次改动覆盖</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">暂停得到 C 时：C 写过第 1000～1001 块，先把这张位图变成一条映射，再盖到 B 的 header 上；被盖住的那段切开，其余照搬，最后把相邻的段合并。代数加 1，BaseBuildId 不变。</text>
<text x="234.0" y="190.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="end">B 的 header</text>
