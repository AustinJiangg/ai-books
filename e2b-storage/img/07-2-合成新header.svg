<text x="518.8" y="334.0" font-size="13" fill="#9A3215" font-weight="600" text-anchor="start">原来的 A 段在这里被切成三段</text>
<rect x="48.0" y="466.0" width="485.3" height="80.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="290.7" y="497.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">① 位图变映射</text>
<text x="290.7" y="521.5" font-size="13" fill="#57606A" text-anchor="middle">连续的 1 合并成一段，紧凑地编进 C 的数据文件</text>
<rect x="557.3" y="466.0" width="485.3" height="80.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="800.0" y="497.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">② 覆盖合并</text>
<text x="800.0" y="521.5" font-size="13" fill="#57606A" text-anchor="middle">新映射盖在旧映射上，被盖住的部分切掉</text>
<rect x="1066.7" y="466.0" width="485.3" height="80.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1309.3" y="497.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">③ 规整</text>
<text x="1309.3" y="521.5" font-size="13" fill="#57606A" text-anchor="middle">相邻且能接上的段合并，减少条数</text>
<rect x="48.0" y="575.0" width="16.0" height="16.0" rx="4" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.2"/>
<text x="72.0" y="588.0" font-size="13" fill="#57606A" text-anchor="start">数据在 A（模板）</text>
<rect x="204.1" y="575.0" width="16.0" height="16.0" rx="4" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.2"/>
<text x="228.1" y="588.0" font-size="13" fill="#57606A" text-anchor="start">数据在 B</text>
<rect x="308.2" y="575.0" width="16.0" height="16.0" rx="4" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.2"/>
<text x="332.2" y="588.0" font-size="13" fill="#57606A" text-anchor="start">数据在 C（这次的改动）</text>
<line x1="48.0" y1="612.0" x2="1552.0" y2="612.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="638.0" font-size="13" fill="#8C959F" text-anchor="start">注：内存这边一样。ARM 补丁允许本次改动按 4 KiB 记、而上一代 header 是 2 MiB 一块，合成时块大小变细到 4 KiB；映射是按字节记的，旧的 2 MiB 段依然有效。</text></svg>