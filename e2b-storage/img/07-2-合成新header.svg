<text x="508.8" y="428.0" font-size="12" fill="#8C959F" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">1000</text>
<text x="673.3" y="428.0" font-size="12" fill="#8C959F" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">1002</text>
<text x="1160.8" y="428.0" font-size="12" fill="#8C959F" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">5000</text>
<text x="1325.3" y="428.0" font-size="12" fill="#8C959F" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">5100</text>
<text x="1552.0" y="428.0" font-size="12" fill="#8C959F" text-anchor="end">（示意比例，不按真实长度）</text>
