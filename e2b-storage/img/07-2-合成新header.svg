<text x="1434.6" y="190.0" font-size="14" fill="#8A5300" font-weight="600" text-anchor="middle">A</text>
<text x="234.0" y="280.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="end">本次改动</text>
<rect x="508.8" y="256.0" width="154.5" height="38.0" rx="4" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="587.0" y="280.0" font-size="14" fill="#9A3215" font-weight="600" text-anchor="middle">C</text>
<rect x="248.0" y="256.0" width="1304.0" height="38.0" rx="4" fill="none" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="4 4"/>
<text x="234.0" y="390.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="end">C 的 header</text>
