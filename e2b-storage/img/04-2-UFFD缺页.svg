<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="532" viewBox="0 0 1600 532" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="532" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">userfaultfd：缺页由另一个程序来填</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">Firecracker 把客户机内存登记在 UFFD 上。客户机碰到一页还没有的内存，出错的线程被挂起，内核往 UFFD 里放一条消息；orchestrator 读到后用 UFFDIO_COPY 把内容原子地填进去。</text>
<rect x="48.0" y="156.0" width="470.0" height="96.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="283.0" y="195.5" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="middle">客户机访问第 X 页</text>
<text x="283.0" y="219.4" font-size="13" fill="#57606A" text-anchor="middle">这一页还没准备</text>
<circle cx="66.0" cy="174.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="66.0" y="178.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<rect x="588.0" y="156.0" width="470.0" height="96.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="823.0" y="185.8" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">Firecracker 进程缺页</text>
<text x="823.0" y="209.7" font-size="13" fill="#57606A" text-anchor="middle">内核发现这段地址登记在 UFFD 上</text>
<text x="823.0" y="229.2" font-size="13" fill="#57606A" text-anchor="middle">出错线程挂起</text>
<circle cx="606.0" cy="174.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="606.0" y="178.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<rect x="1128.0" y="156.0" width="470.0" height="96.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="1363.0" y="195.5" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">UFFD 里出现一条消息</text>
<text x="1363.0" y="219.4" font-size="13" fill="#57606A" text-anchor="middle">{地址 A，读还是写}</text>
<circle cx="1146.0" cy="174.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="1146.0" y="178.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<rect x="1128.0" y="326.0" width="470.0" height="96.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1363.0" y="355.8" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">orchestrator 读出消息</text>
<text x="1363.0" y="379.7" font-size="13" fill="#57606A" text-anchor="middle">地址 → 客户机第 X 页</text>
<text x="1363.0" y="399.2" font-size="13" fill="#57606A" text-anchor="middle">查映射表，从快照数据取这一页</text>
<circle cx="1146.0" cy="344.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="1146.0" y="348.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<rect x="588.0" y="326.0" width="470.0" height="96.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="823.0" y="365.6" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">UFFDIO_COPY</text>
<text x="823.0" y="389.5" font-size="13" fill="#57606A" text-anchor="middle">原子地把内容放到地址 A</text>
<circle cx="606.0" cy="344.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="606.0" y="348.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<rect x="48.0" y="326.0" width="470.0" height="96.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="283.0" y="365.6" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="middle">内核登记页表，唤醒线程</text>
<text x="283.0" y="389.5" font-size="13" fill="#57606A" text-anchor="middle">客户机继续运行，什么都没察觉</text>
<circle cx="66.0" cy="344.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="66.0" y="348.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">6</text>
<path d="M524.0 204.0 L582.0 204.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<path d="M1064.0 204.0 L1122.0 204.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<path d="M1363.0 258.0 L1363.0 320.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<path d="M1122.0 374.0 L1064.0 374.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<path d="M582.0 374.0 L524.0 374.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<line x1="48.0" y1="466.0" x2="1552.0" y2="466.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="492.0" font-size="13" fill="#8C959F" text-anchor="start">注：E2B 只登记 MISSING（缺页）事件。两个 vCPU 同时碰同一页时，第二次 UFFDIO_COPY 返回 EEXIST，忽略即可（第 13 篇）。</text></svg>