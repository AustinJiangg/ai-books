<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="602" viewBox="0 0 1600 602" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m8B7FE0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#8B7FE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="602" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">一个沙箱的存储一生：五个阶段对应全书五个部分</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">模板构建出六个文件；沙箱从模板按需取盘和内存；暂停产生新的 build，恢复又回到运行；运行中还可以打检查点、原地回滚。</text>
<rect x="48.0" y="156.0" width="337.0" height="150.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="216.5" y="213.4" font-size="17" fill="#8A5300" font-weight="600" text-anchor="middle">① 模板构建</text>
<text x="216.5" y="237.3" font-size="13" fill="#57606A" text-anchor="middle">Dockerfile + Harbor 镜像</text>
<text x="216.5" y="256.8" font-size="13" fill="#57606A" text-anchor="middle">→ rootfs.ext4 + 内存快照</text>
<rect x="181.7" y="316.0" width="69.5" height="20.5" rx="10.25" fill="#EEF0F2" stroke="none" stroke-width="0"/>
<text x="216.5" y="330.0" font-size="11.5" fill="#57606A" text-anchor="middle">第 8、9 篇</text>
<rect x="437.0" y="156.0" width="337.0" height="150.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="605.5" y="213.4" font-size="17" fill="#8A5300" font-weight="600" text-anchor="middle">② 模板存放</text>
<text x="605.5" y="237.3" font-size="13" fill="#57606A" text-anchor="middle">六个文件 + header 映射表</text>
<text x="605.5" y="256.8" font-size="13" fill="#57606A" text-anchor="middle">→ /tmp/templates</text>
<rect x="567.3" y="316.0" width="76.4" height="20.5" rx="10.25" fill="#EEF0F2" stroke="none" stroke-width="0"/>
<text x="605.5" y="330.0" font-size="11.5" fill="#57606A" text-anchor="middle">第 7、10 篇</text>
<rect x="826.0" y="156.0" width="337.0" height="150.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="994.5" y="213.4" font-size="17" fill="#1D4F91" font-weight="600" text-anchor="middle">③ 沙箱运行</text>
<text x="994.5" y="237.3" font-size="13" fill="#57606A" text-anchor="middle">硬盘 = NBD + 写时复制</text>
<text x="994.5" y="256.8" font-size="13" fill="#57606A" text-anchor="middle">内存 = UFFD 按需供页 + 大页</text>
<rect x="952.9" y="316.0" width="83.3" height="20.5" rx="10.25" fill="#EEF0F2" stroke="none" stroke-width="0"/>
<text x="994.5" y="330.0" font-size="11.5" fill="#57606A" text-anchor="middle">第 11～13 篇</text>
<rect x="1215.0" y="156.0" width="337.0" height="150.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1383.5" y="213.4" font-size="17" fill="#0E6B4F" font-weight="600" text-anchor="middle">④ 暂停与恢复</text>
<text x="1383.5" y="237.3" font-size="13" fill="#57606A" text-anchor="middle">只存改动的增量快照</text>
<text x="1383.5" y="256.8" font-size="13" fill="#57606A" text-anchor="middle">恢复 = 用新 build 回到 ③</text>
<rect x="1341.9" y="316.0" width="83.3" height="20.5" rx="10.25" fill="#EEF0F2" stroke="none" stroke-width="0"/>
<text x="1383.5" y="330.0" font-size="11.5" fill="#57606A" text-anchor="middle">第 14、15 篇</text>
<path d="M391.0 231.0 L431.0 231.0" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<path d="M780.0 231.0 L820.0 231.0" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<path d="M1169.0 231.0 L1209.0 231.0" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<path d="M1383.5 150.0 L1383.5 126.0 L994.5 126.0 L994.5 150.0" fill="none" stroke="#1F9E77" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<text x="1189.0" y="118.0" font-size="13" fill="#0E6B4F" font-weight="600" text-anchor="middle">恢复</text>
<rect x="786.0" y="386.0" width="417.0" height="110.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="994.5" y="423.4" font-size="17" fill="#4B3FA8" font-weight="600" text-anchor="middle">⑤ 检查点回滚</text>
<text x="994.5" y="447.3" font-size="13" fill="#57606A" text-anchor="middle">本机、随 Firecracker 进程存活</text>
<text x="994.5" y="466.8" font-size="13" fill="#57606A" text-anchor="middle">原地把内存和磁盘倒回去（第 16、17 篇）</text>
<path d="M954.5 350.0 L954.5 380.0" fill="none" stroke="#8B7FE0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8B7FE0)"/>
<text x="944.5" y="369.0" font-size="12.5" fill="#8B7FE0" font-weight="600" text-anchor="end">打检查点</text>
<path d="M1034.5 380.0 L1034.5 350.0" fill="none" stroke="#8B7FE0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8B7FE0)"/>
<text x="1044.5" y="369.0" font-size="12.5" fill="#8B7FE0" font-weight="600" text-anchor="start">回滚</text>
<rect x="48.0" y="386.0" width="726.0" height="110.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="411.0" y="432.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">第一部分（第 1～6 篇）：打地基</text>
<text x="411.0" y="456.5" font-size="13" fill="#57606A" text-anchor="middle">块与页、文件系统、NBD、虚拟内存与 userfaultfd、写时复制、Firecracker 的存储</text>
<rect x="1215.0" y="386.0" width="337.0" height="110.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1383.5" y="432.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">第五部分（第 18、19 篇）</text>
<text x="1383.5" y="456.5" font-size="13" fill="#57606A" text-anchor="middle">部署配置、容量规划与排障</text>
<line x1="48.0" y1="536.0" x2="1552.0" y2="536.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="562.0" font-size="13" fill="#8C959F" text-anchor="start">注：①② 产生的文件在存储后端；③ 的数据在本地缓存和 NBD、UFFD 里；④ 产生新的 build，回到存储后端；⑤ 的文件只在本机 /orchestrator/build/checkpoints 下。</text></svg>