<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="592" viewBox="0 0 1600 592" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="592" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">写保护“封条”：怎么区分读过的页和写过的页</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">UFFDIO_COPY 带上 UFFDIO_COPY_MODE_WP，填进去的页就贴着封条；以后被写，内核撕掉封条让写继续。到打快照时，读 pagemap：在内存里、且没封条的页，就是写过的页。</text>
<rect x="48.0" y="156.0" width="358.0" height="50.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="227.0" y="185.8" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">只读过的页</text>
<text x="60.0" y="242.0" font-size="12" fill="#8C959F" text-anchor="start">填页时</text>
<rect x="48.0" y="250.0" width="358.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="227.0" y="276.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">读缺页 → 填页并贴封条</text>
<text x="60.0" y="312.0" font-size="12" fill="#8C959F" text-anchor="start">之后</text>
<rect x="48.0" y="320.0" width="358.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="227.0" y="346.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">之后只读</text>
<text x="60.0" y="382.0" font-size="12" fill="#8C959F" text-anchor="start">pagemap 看到</text>
<rect x="48.0" y="390.0" width="358.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="227.0" y="416.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">在、有封条</text>
<rect x="48.0" y="460.0" width="358.0" height="50.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="227.0" y="490.1" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">不算脏</text>
<rect x="430.0" y="156.0" width="358.0" height="50.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="609.0" y="185.8" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">写缺页的页</text>
<text x="442.0" y="242.0" font-size="12" fill="#8C959F" text-anchor="start">填页时</text>
<rect x="430.0" y="250.0" width="358.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="609.0" y="276.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">写缺页 → 填页不贴封条</text>
<text x="442.0" y="312.0" font-size="12" fill="#8C959F" text-anchor="start">之后</text>
<rect x="430.0" y="320.0" width="358.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="609.0" y="346.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">写</text>
<text x="442.0" y="382.0" font-size="12" fill="#8C959F" text-anchor="start">pagemap 看到</text>
<rect x="430.0" y="390.0" width="358.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="609.0" y="416.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">在、无封条</text>
<rect x="430.0" y="460.0" width="358.0" height="50.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="609.0" y="490.1" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">算脏</text>
<rect x="812.0" y="156.0" width="358.0" height="50.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="991.0" y="185.8" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">先读后写的页</text>
<text x="824.0" y="242.0" font-size="12" fill="#8C959F" text-anchor="start">填页时</text>
<rect x="812.0" y="250.0" width="358.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="991.0" y="276.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">读缺页 → 填页并贴封条</text>
<text x="824.0" y="312.0" font-size="12" fill="#8C959F" text-anchor="start">之后</text>
<rect x="812.0" y="320.0" width="358.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="991.0" y="346.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">后来被写，封条被撕</text>
<text x="824.0" y="382.0" font-size="12" fill="#8C959F" text-anchor="start">pagemap 看到</text>
<rect x="812.0" y="390.0" width="358.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="991.0" y="416.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">在、无封条</text>
<rect x="812.0" y="460.0" width="358.0" height="50.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="991.0" y="490.1" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">算脏</text>
<rect x="1194.0" y="156.0" width="358.0" height="50.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1373.0" y="185.8" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">没碰过的页</text>
<text x="1206.0" y="242.0" font-size="12" fill="#8C959F" text-anchor="start">填页时</text>
<rect x="1194.0" y="250.0" width="358.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1373.0" y="276.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">从未缺页</text>
<text x="1206.0" y="312.0" font-size="12" fill="#8C959F" text-anchor="start">之后</text>
<rect x="1194.0" y="320.0" width="358.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1373.0" y="346.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">—</text>
<text x="1206.0" y="382.0" font-size="12" fill="#8C959F" text-anchor="start">pagemap 看到</text>
<rect x="1194.0" y="390.0" width="358.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1373.0" y="416.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">不在</text>
<rect x="1194.0" y="460.0" width="358.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1373.0" y="490.1" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">不算脏</text>
<line x1="48.0" y1="526.0" x2="1552.0" y2="526.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="552.0" font-size="13" fill="#8C959F" text-anchor="start">注：这是 x86 上精确增量的来源。这套环境的 ARM 补丁填页时不再贴封条，于是“只读过的页”也被判成脏页（第 15 篇）。</text></svg>