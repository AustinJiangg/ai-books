<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="582" viewBox="0 0 1600 582" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="582" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">两种组织多层数据的方式：逐层往下找，还是查一张拍平的表</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">A 是模板，B、C 是之后两次暂停的改动。读第 1000 块：链表式要从 C 往下一层层问；E2B 的 header 是拍平的，每一层都带一张完整的表，查一次就知道数据在哪。</text>
<text x="48.0" y="166.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">链表式：层数越多越慢</text>
