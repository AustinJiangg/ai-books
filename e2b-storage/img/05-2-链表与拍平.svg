<line x1="48.0" y1="516.0" x2="1552.0" y2="516.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="542.0" font-size="13" fill="#8C959F" text-anchor="start">注：拍平的代价是，被任何 header 引用的那一层都必须留着；删掉中间的 B，C 读第 5000 块就会去一个不存在的文件里找。</text></svg>