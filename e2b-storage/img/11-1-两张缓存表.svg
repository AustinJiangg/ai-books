<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="714" viewBox="0 0 1600 714" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="714" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">两张缓存表：模板表按 build 记，数据表按“build/文件”记</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">模板 C 的 header 引用 A、B、C 三代数据，所以模板表里只有 C 一项，数据表里却有三项 rootfs；另一个模板 D 也引用 A，就和 C 共享 A 那一项。两张表的项都是最后一次访问后 25 小时过期。</text>
<rect x="48.0" y="156.0" width="520.0" height="330.0" rx="14" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="68.0" y="186.0" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="start">模板表（按 buildID）</text>
<rect x="72.0" y="216.0" width="472.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="308.0" y="240.3" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">build C</text>
<text x="308.0" y="262.9" font-size="12" fill="#57606A" text-anchor="middle">两个 header（在内存里）</text>
<text x="308.0" y="280.9" font-size="12" fill="#57606A" text-anchor="middle">snapfile、metadata.json → /orchestrator/template/C/cache/&lt;随机&gt;/</text>
<text x="308.0" y="298.9" font-size="12" fill="#57606A" text-anchor="middle">header 引用 A、B、C</text>
<rect x="72.0" y="346.0" width="472.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="308.0" y="370.3" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">build D</text>
<text x="308.0" y="392.9" font-size="12" fill="#57606A" text-anchor="middle">两个 header（在内存里）</text>
<text x="308.0" y="410.9" font-size="12" fill="#57606A" text-anchor="middle">snapfile、metadata.json → /orchestrator/template/D/cache/&lt;随机&gt;/</text>
<text x="308.0" y="428.9" font-size="12" fill="#57606A" text-anchor="middle">header 引用 A、D</text>
<rect x="728.0" y="156.0" width="824.0" height="330.0" rx="14" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="748.0" y="186.0" font-size="15" fill="#8A5300" font-weight="600" text-anchor="start">数据表（按 buildID/文件类型）</text>
<rect x="752.0" y="216.0" width="776.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.3"/>
<text x="772.0" y="245.0" font-size="14" fill="#8A5300" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">A/rootfs.ext4</text>
<text x="988.0" y="245.0" font-size="12.5" fill="#57606A" text-anchor="start">→ /orchestrator/build/A-rootfs.ext4-&lt;随机&gt;（稀疏，按 4 MiB 拉）</text>
<rect x="752.0" y="276.0" width="776.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.3"/>
<text x="772.0" y="305.0" font-size="14" fill="#8A5300" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">B/rootfs.ext4</text>
<text x="988.0" y="305.0" font-size="12.5" fill="#57606A" text-anchor="start">→ /orchestrator/build/B-rootfs.ext4-&lt;随机&gt;（稀疏，按 4 MiB 拉）</text>
<rect x="752.0" y="336.0" width="776.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.3"/>
<text x="772.0" y="365.0" font-size="14" fill="#8A5300" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">C/rootfs.ext4</text>
<text x="988.0" y="365.0" font-size="12.5" fill="#57606A" text-anchor="start">→ /orchestrator/build/C-rootfs.ext4-&lt;随机&gt;（稀疏，按 4 MiB 拉）</text>
<rect x="752.0" y="396.0" width="776.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.3"/>
<text x="772.0" y="425.0" font-size="14" fill="#8A5300" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">D/rootfs.ext4</text>
<text x="988.0" y="425.0" font-size="12.5" fill="#57606A" text-anchor="start">→ /orchestrator/build/D-rootfs.ext4-&lt;随机&gt;（稀疏，按 4 MiB 拉）</text>
<path d="M550.0 266.0 L746.0 239.0" fill="none" stroke="#57606A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<path d="M550.0 266.0 L746.0 299.0" fill="none" stroke="#57606A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<path d="M550.0 266.0 L746.0 359.0" fill="none" stroke="#57606A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<path d="M550.0 396.0 L746.0 239.0" fill="none" stroke="#57606A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m57606A)"/>
<path d="M550.0 396.0 L746.0 419.0" fill="none" stroke="#57606A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m57606A)"/>
<rect x="48.0" y="526.0" width="740.0" height="86.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="418.0" y="551.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">磁盘淘汰</text>
<text x="418.0" y="574.8" font-size="12.5" fill="#57606A" text-anchor="middle">每秒查一次 /orchestrator/build 所在磁盘</text>
<text x="418.0" y="593.6" font-size="12.5" fill="#57606A" text-anchor="middle">占用超过 85%（默认）就淘汰最老的一项</text>
<rect x="812.0" y="526.0" width="740.0" height="86.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1182.0" y="551.6" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">启动时清空</text>
<text x="1182.0" y="574.8" font-size="12.5" fill="#57606A" text-anchor="middle">模板表初始化时 cleanDir(/orchestrator/build)</text>
<text x="1182.0" y="593.6" font-size="12.5" fill="#57606A" text-anchor="middle">这里是缓存，不是模板的家</text>
<line x1="48.0" y1="648.0" x2="1552.0" y2="648.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="674.0" font-size="13" fill="#8C959F" text-anchor="start">注：文件名里的随机 ID 防止旧缓存项关闭时删掉新缓存项的文件。内存这边一样，只是换成 memfile。</text></svg>