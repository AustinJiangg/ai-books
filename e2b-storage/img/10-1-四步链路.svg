<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="668" viewBox="0 0 1600 668" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="668" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">为什么 .env 写了 MinioBucket，实际却是 Local：四步链路</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">唯一会读 STORAGE_PROVIDER 的进程是 template-manager，它的 job 定义被部署包里写死 "Local" 的那份覆盖了；写着 ${STORAGE_PROVIDER} 的 orchestrator job 从来没被提交。</text>
<rect x="48.0" y="156.0" width="346.0" height="120.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="221.0" y="198.9" font-size="16" fill="#3D3C38" font-weight="600" text-anchor="middle">① RPM 安装</text>
<text x="221.0" y="222.1" font-size="12.5" fill="#57606A" text-anchor="middle">nomad/template-manager.hcl</text>
<text x="221.0" y="240.9" font-size="12.5" fill="#57606A" text-anchor="middle">STORAGE_PROVIDER = "${STORAGE_PROVIDER}"</text>
<path d="M400.0 216.0 L428.0 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="434.0" y="156.0" width="346.0" height="120.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="607.0" y="198.9" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">② build.sh -i 覆盖</text>
<text x="607.0" y="222.1" font-size="12.5" fill="#57606A" text-anchor="middle">cp dep/template-manager.hcl → nomad/</text>
<text x="607.0" y="240.9" font-size="12.5" fill="#57606A" text-anchor="middle">STORAGE_PROVIDER = "Local"（写死）</text>
<path d="M786.0 216.0 L814.0 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="820.0" y="156.0" width="346.0" height="120.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="993.0" y="198.9" font-size="16" fill="#3D3C38" font-weight="600" text-anchor="middle">③ deploy.sh 渲染</text>
<text x="993.0" y="222.1" font-size="12.5" fill="#57606A" text-anchor="middle">source .env（MinioBucket）</text>
<text x="993.0" y="240.9" font-size="12.5" fill="#57606A" text-anchor="middle">envsubst 只换 ${…}，"Local" 原样保留</text>
<path d="M1172.0 216.0 L1200.0 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1206.0" y="156.0" width="346.0" height="120.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="1379.0" y="198.9" font-size="16" fill="#3D3C38" font-weight="600" text-anchor="middle">④ 只提交四个 job</text>
<text x="1379.0" y="222.1" font-size="12.5" fill="#57606A" text-anchor="middle">redis  template-manager  edge  api</text>
<text x="1379.0" y="240.9" font-size="12.5" fill="#57606A" text-anchor="middle">orchestrator.hcl 渲染了但不提交</text>
<rect x="48.0" y="336.0" width="700.0" height="120.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="398.0" y="378.1" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">/usr/bin/template-manager 的环境变量</text>
<text x="398.0" y="402.0" font-size="13" fill="#57606A" text-anchor="middle">STORAGE_PROVIDER=Local</text>
<text x="398.0" y="421.5" font-size="13" fill="#57606A" text-anchor="middle">没有 LOCAL_TEMPLATE_STORAGE_BASE_PATH → 用默认值</text>
<path d="M754.0 396.0 L822.0 396.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="828.0" y="336.0" width="724.0" height="120.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1190.0" y="387.9" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">/tmp/templates  /tmp/build-cache</text>
<text x="1190.0" y="411.8" font-size="13" fill="#57606A" text-anchor="middle">/tmp 是 tmpfs：占内存、宿主重启全丢、10 天没访问会被 systemd-tmpfiles 清掉</text>
<rect x="48.0" y="496.0" width="1504.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="800.0" y="522.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">MinIO：build.sh -i 装好、健康检查通过，但没建桶，也没有任何组件往里写</text>
<text x="800.0" y="546.2" font-size="12.5" fill="#57606A" text-anchor="middle">/root/data/minio 下只有 .minio.sys；helm（k8s）那条部署路上 MinIO 才会真正生效</text>
<line x1="48.0" y1="602.0" x2="1552.0" y2="602.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="628.0" font-size="13" fill="#8C959F" text-anchor="start">注：确认方法是看进程实际的环境变量：tr '\0' '\n' &lt; /proc/&lt;template-manager 的 PID&gt;/environ | grep STORAGE。/orchestrator/build 里有 memfile 不能说明什么，那是任何后端下都有的本地缓存。</text></svg>