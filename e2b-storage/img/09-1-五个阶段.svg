<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="712" viewBox="0 0 1600 712" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="712" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">模板构建的五个阶段：每一步都是一次快照，都是一个 build</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">base 把镜像变成第一层完整的盘和内存；之后每一步都“从上一层恢复 → 执行 → 暂停 → 上传”，只存这一步的改动。最后一层就是模板；optimize 只往它的 metadata.json 里加预取清单。</text>
<rect x="48.0" y="156.0" width="268.8" height="110.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="182.4" y="194.2" font-size="17" fill="#8A5300" font-weight="600" text-anchor="middle">base</text>
<text x="182.4" y="217.4" font-size="12.5" fill="#57606A" text-anchor="middle">镜像 → ext4 → 两次开机</text>
<text x="182.4" y="236.2" font-size="12.5" fill="#57606A" text-anchor="middle">根盘完整，内存去全零页</text>
<path d="M322.8 211.0 L350.8 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="356.8" y="156.0" width="268.8" height="110.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="491.2" y="194.2" font-size="17" fill="#0E6B4F" font-weight="600" text-anchor="middle">user</text>
<text x="491.2" y="217.4" font-size="12.5" fill="#57606A" text-anchor="middle">建默认用户</text>
<text x="491.2" y="236.2" font-size="12.5" fill="#57606A" text-anchor="middle">（新版模板）</text>
<path d="M631.6 211.0 L659.6 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="665.6" y="156.0" width="268.8" height="110.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="800.0" y="194.2" font-size="17" fill="#0E6B4F" font-weight="600" text-anchor="middle">steps</text>
<text x="800.0" y="217.4" font-size="12.5" fill="#57606A" text-anchor="middle">每条 RUN / COPY 一层</text>
<text x="800.0" y="236.2" font-size="12.5" fill="#57606A" text-anchor="middle">只含这一步的改动</text>
<path d="M940.4 211.0 L968.4 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="974.4" y="156.0" width="268.8" height="110.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1108.8" y="194.2" font-size="17" fill="#0E6B4F" font-weight="600" text-anchor="middle">finalize</text>
<text x="1108.8" y="217.4" font-size="12.5" fill="#57606A" text-anchor="middle">configure.sh、启动命令</text>
<text x="1108.8" y="236.2" font-size="12.5" fill="#57606A" text-anchor="middle">等就绪；这就是模板</text>
<path d="M1249.2 211.0 L1277.2 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1283.2" y="156.0" width="268.8" height="110.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1417.6" y="194.2" font-size="17" fill="#1F2328" font-weight="600" text-anchor="middle">optimize</text>
<text x="1417.6" y="217.4" font-size="12.5" fill="#57606A" text-anchor="middle">恢复几次，录预取清单</text>
<text x="1417.6" y="236.2" font-size="12.5" fill="#57606A" text-anchor="middle">不产生新层</text>
<text x="48.0" y="326.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">构建完，/tmp/templates 下有好几个 build 目录</text>
<rect x="88.0" y="570.0" width="760.0" height="46.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="108.0" y="599.0" font-size="14" fill="#8A5300" font-weight="600" text-anchor="start">base 层 buildID</text>
<text x="348.0" y="599.0" font-size="13" fill="#57606A" text-anchor="start">六个文件；rootfs 完整</text>
<rect x="88.0" y="514.0" width="760.0" height="46.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="108.0" y="543.0" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="start">user 层</text>
<text x="348.0" y="543.0" font-size="13" fill="#57606A" text-anchor="start">六个文件；只含改动</text>
<rect x="88.0" y="458.0" width="760.0" height="46.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="108.0" y="487.0" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="start">step1 层</text>
<text x="348.0" y="487.0" font-size="13" fill="#57606A" text-anchor="start">六个文件；只含改动</text>
<rect x="88.0" y="402.0" width="760.0" height="46.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="108.0" y="431.0" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="start">step2 层</text>
<text x="348.0" y="431.0" font-size="13" fill="#57606A" text-anchor="start">六个文件；只含改动</text>
<rect x="88.0" y="346.0" width="760.0" height="46.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="108.0" y="375.0" font-size="14" fill="#9A3215" font-weight="600" text-anchor="start">finalize 层 = 模板</text>
<text x="348.0" y="375.0" font-size="13" fill="#57606A" text-anchor="start">header 引用上面所有层；metadata.json 含预取清单</text>
<text x="878.0" y="370.0" font-size="13" fill="#8C959F" text-anchor="start">↑ 最新</text>
<rect x="968.0" y="346.0" width="584.0" height="130.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1260.0" y="393.2" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">/tmp/build-cache/&lt;范围&gt;/index/&lt;哈希&gt;</text>
<text x="1260.0" y="416.5" font-size="12.5" fill="#57606A" text-anchor="middle">每层一条：哈希 → 这一层的 buildID</text>
<text x="1260.0" y="435.2" font-size="12.5" fill="#57606A" text-anchor="middle">下次构建前几步没变，直接命中</text>
<rect x="968.0" y="496.0" width="584.0" height="106.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1260.0" y="531.2" font-size="14" fill="#9A3215" font-weight="600" text-anchor="middle">构建失败</text>
<text x="1260.0" y="554.5" font-size="12.5" fill="#57606A" text-anchor="middle">删掉这次 buildID 前缀下的文件</text>
<text x="1260.0" y="573.2" font-size="12.5" fill="#57606A" text-anchor="middle">已成功的前几层保留，下次还能命中</text>
<line x1="48.0" y1="646.0" x2="1552.0" y2="646.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="672.0" font-size="13" fill="#8C959F" text-anchor="start">注：一个有 2 步命令的模板，构建完至少 5 个 build 目录。上传异步进行，但写 index 要等前面所有层都上传完，防止别的构建命中一个数据还没到的层。</text></svg>