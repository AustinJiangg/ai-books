<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="658" viewBox="0 0 1600 658" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="658" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">压实：只有一个孩子的隐藏检查点，并进它的孩子</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">“只保留最近 N 个、删最老的”这种用法，删的永远是下一个的父亲，隐藏的检查点会无限增长。压实把隐藏的 H 并进唯一的孩子 C：位图取并集，C 没有而 H 有的页拷进 C，C 接到 H 的父亲下面。</text>
<text x="48.0" y="162.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">压实前</text>
<rect x="48.0" y="176.0" width="300.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="198.0" y="203.6" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">P</text>
<text x="198.0" y="226.2" font-size="12" fill="#57606A" text-anchor="middle">H 的父亲</text>
<rect x="48.0" y="276.0" width="300.0" height="70.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="198.0" y="303.6" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">H（已删除、隐藏）</text>
<text x="198.0" y="326.2" font-size="12" fill="#57606A" text-anchor="middle">页 {1, 4, 5}</text>
<path d="M198.0 252.0 L198.0 270.0" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<rect x="48.0" y="376.0" width="300.0" height="70.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="198.0" y="403.6" font-size="16" fill="#4B3FA8" font-weight="600" text-anchor="middle">C</text>
<text x="198.0" y="426.2" font-size="12" fill="#57606A" text-anchor="middle">页 {4, 9}</text>
<path d="M198.0 352.0 L198.0 370.0" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<text x="608.0" y="162.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">压实后</text>
<rect x="608.0" y="176.0" width="300.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="758.0" y="203.6" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">P</text>
<text x="758.0" y="226.2" font-size="12" fill="#57606A" text-anchor="middle">C 的新父亲</text>
<rect x="608.0" y="276.0" width="300.0" height="70.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="758.0" y="294.6" font-size="16" fill="#4B3FA8" font-weight="600" text-anchor="middle">C（合并后）</text>
<text x="758.0" y="317.2" font-size="12" fill="#57606A" text-anchor="middle">页 {1, 4, 5, 9}</text>
<text x="758.0" y="335.2" font-size="12" fill="#57606A" text-anchor="middle">4 用 C 自己的版本</text>
<path d="M758.0 252.0 L758.0 270.0" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<path d="M378.0 346.0 L578.0 346.0" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="478.0" y="336.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">fold</text>
<rect x="1008.0" y="176.0" width="544.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1280.0" y="209.2" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">为什么不改变任何回滚</text>
<text x="1280.0" y="232.4" font-size="12.5" fill="#57606A" text-anchor="middle">H 只有 C 一个孩子：凡是经过 H 的路径，</text>
<text x="1280.0" y="251.2" font-size="12.5" fill="#57606A" text-anchor="middle">一定紧挨着经过 C；把两者合成一个，</text>
<text x="1280.0" y="269.9" font-size="12.5" fill="#57606A" text-anchor="middle">还原集和内容查找的结果都不变</text>
<rect x="1008.0" y="316.0" width="544.0" height="110.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1280.0" y="353.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">磁盘这半</text>
<text x="1280.0" y="376.8" font-size="12.5" fill="#57606A" text-anchor="middle">列着 H 那层的视图都紧接着列 C 那层时，</text>
<text x="1280.0" y="395.6" font-size="12.5" fill="#57606A" text-anchor="middle">两层合成一层并改写 header；否则 H 那层留在 C 的视图里</text>
<rect x="48.0" y="486.0" width="485.3" height="70.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="290.7" y="512.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">CHECKPOINT_COMPACT</text>
<text x="290.7" y="535.9" font-size="12.5" fill="#57606A" text-anchor="middle">默认开；false 关闭</text>
<rect x="557.3" y="486.0" width="485.3" height="70.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="800.0" y="512.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">CHECKPOINT_COMPACT_MAX_PER_OP</text>
<text x="800.0" y="535.9" font-size="12.5" fill="#57606A" text-anchor="middle">默认 8：一次删除最多顺带并几个</text>
<rect x="1066.7" y="486.0" width="485.3" height="70.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1309.3" y="512.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">失败重试</text>
<text x="1309.3" y="535.9" font-size="12.5" fill="#57606A" text-anchor="middle">之后的删除里再试，最多 3 次，之后放着不管</text>
<line x1="48.0" y1="592.0" x2="1552.0" y2="592.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="618.0" font-size="13" fill="#8C959F" text-anchor="start">注：压实后，一棵有 V 个可见检查点的树最多 V+1 个隐藏的、总共不超过 2V+1 个。文件工作都写到新名字下，最后一次性切换。</text></svg>