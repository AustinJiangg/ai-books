<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="658" viewBox="0 0 1600 658" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="658" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">同一个键，在两种后端下落在哪：Local 和 MinIO</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">六个文件在存储里的“名字”在所有后端下都一样，都以 buildID 为前缀。Local 直接按路径建目录写文件；MinIO 把它当作桶里的对象，自己再在磁盘上摊开存。</text>
<rect x="48.0" y="156.0" width="420.0" height="260.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="258.0" y="226.9" font-size="16" fill="#8A5300" font-weight="600" text-anchor="middle">键名（所有后端相同）</text>
<text x="258.0" y="251.4" font-size="13.5" fill="#8A5300" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">&lt;buildID&gt;/snapfile</text>
<text x="258.0" y="271.7" font-size="13.5" fill="#8A5300" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">&lt;buildID&gt;/memfile</text>
<text x="258.0" y="291.9" font-size="13.5" fill="#8A5300" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">&lt;buildID&gt;/memfile.header</text>
<text x="258.0" y="312.2" font-size="13.5" fill="#8A5300" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">&lt;buildID&gt;/rootfs.ext4</text>
<text x="258.0" y="332.4" font-size="13.5" fill="#8A5300" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">&lt;buildID&gt;/rootfs.ext4.header</text>
<text x="258.0" y="352.7" font-size="13.5" fill="#8A5300" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">&lt;buildID&gt;/metadata.json</text>
<rect x="568.0" y="156.0" width="984.0" height="120.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1060.0" y="198.1" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">Local（本环境实际生效）</text>
<text x="1060.0" y="222.0" font-size="13" fill="#57606A" text-anchor="middle">/tmp/templates/&lt;buildID&gt;/memfile</text>
<text x="1060.0" y="241.5" font-size="13" fill="#57606A" text-anchor="middle">上传 = 拷贝文件；不支持生成上传链接</text>
<rect x="568.0" y="296.0" width="984.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1060.0" y="329.5" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">MinioBucket（.env 的本意）</text>
<text x="1060.0" y="352.7" font-size="12.5" fill="#57606A" text-anchor="middle">桶 e2b-dev-fc-templates 里的对象 &lt;buildID&gt;/memfile</text>
<text x="1060.0" y="371.5" font-size="12.5" fill="#57606A" text-anchor="middle">磁盘上：/root/data/minio/e2b-dev-fc-templates/&lt;buildID&gt;/memfile/…</text>
<text x="1060.0" y="390.2" font-size="12.5" fill="#57606A" text-anchor="middle">useSSL 写死 false；不会自动建桶；支持预签名上传链接</text>
<path d="M474.0 256.0 L562.0 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<path d="M474.0 316.0 L562.0 356.0" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m57606A)"/>
<rect x="48.0" y="456.0" width="740.0" height="100.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="418.0" y="488.6" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">想不丢：方案一（改动最小）</text>
<text x="418.0" y="511.8" font-size="12.5" fill="#57606A" text-anchor="middle">dep/template-manager.hcl 的 env 里加</text>
<text x="418.0" y="530.5" font-size="12.5" fill="#57606A" text-anchor="middle">LOCAL_TEMPLATE_STORAGE_BASE_PATH 指到硬盘，搬数据</text>
<rect x="812.0" y="456.0" width="740.0" height="100.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1182.0" y="488.6" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">想不丢：方案二</text>
<text x="1182.0" y="511.8" font-size="12.5" fill="#57606A" text-anchor="middle">建两个桶，把写死的 "Local" 改回 ${STORAGE_PROVIDER}</text>
<text x="1182.0" y="530.5" font-size="12.5" fill="#57606A" text-anchor="middle">按 &lt;buildID&gt;/&lt;文件名&gt; 原样把数据拷进桶</text>
<line x1="48.0" y1="592.0" x2="1552.0" y2="592.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="618.0" font-size="13" fill="#8C959F" text-anchor="start">注：两条路都要改源头 e2b-deploy/dep/template-manager.hcl，否则下次 build.sh -i 又覆盖回去。</text></svg>