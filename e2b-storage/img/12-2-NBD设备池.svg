<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="758" viewBox="0 0 1600 758" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="758" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">NBD 设备池：后台预备空闲设备，创建沙箱时直接拿</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">启动时读 nbds_max（本环境 512）建一张位图。后台循环不停地找“没人接着、大小为 0”的设备，放进容量 64 的就绪队列；创建沙箱从队列取，结束时断开、清位图归还。</text>
<text x="48.0" y="160.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">/dev/nbd0 … nbd511</text>
