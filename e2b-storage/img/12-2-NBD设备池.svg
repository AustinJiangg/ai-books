<rect x="48.0" y="316.0" width="461.3" height="140.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="278.7" y="349.8" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">后台循环 Populate</text>
<text x="278.7" y="373.1" font-size="12.5" fill="#57606A" text-anchor="middle">从 0 号起找位图里没分出去的 N</text>
<text x="278.7" y="391.8" font-size="12.5" fill="#57606A" text-anchor="middle">/sys/block/nbdN/pid 不存在</text>
<text x="278.7" y="410.6" font-size="12.5" fill="#57606A" text-anchor="middle">且 /sys/block/nbdN/size 为 0</text>
<text x="278.7" y="429.3" font-size="12.5" fill="#57606A" text-anchor="middle">找不到：等 50 ms 再找</text>
<rect x="569.3" y="316.0" width="461.3" height="140.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="800.0" y="368.6" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">就绪队列（容量 64）</text>
<text x="800.0" y="391.8" font-size="12.5" fill="#57606A" text-anchor="middle">预备好的空闲设备</text>
<text x="800.0" y="410.6" font-size="12.5" fill="#57606A" text-anchor="middle">创建沙箱时直接取，几乎不花时间</text>
<rect x="1090.7" y="316.0" width="461.3" height="140.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="1321.3" y="359.2" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="middle">沙箱占用中</text>
<text x="1321.3" y="382.4" font-size="12.5" fill="#57606A" text-anchor="middle">4 条 socketpair、netlink 连接</text>
<text x="1321.3" y="401.2" font-size="12.5" fill="#57606A" text-anchor="middle">结束：断开，最多等 30 秒</text>
<text x="1321.3" y="419.9" font-size="12.5" fill="#57606A" text-anchor="middle">可无限重试，每 500 ms 一次</text>
<path d="M515.3 386.0 L563.3 386.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<path d="M1036.7 386.0 L1084.7 386.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="1060.7" y="378.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">取</text>
<path d="M1321.3 462.0 L1321.3 502.0 L278.7 502.0 L278.7 462.0" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<text x="800.0" y="524.0" font-size="12.5" fill="#57606A" font-weight="600" text-anchor="middle">归还：断开、清位图，之后又能被找到</text>
<rect x="48.0" y="556.0" width="1504.0" height="70.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="800.0" y="582.9" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">512 台都在用：就绪队列空了，后台每 50 ms 找一次、每失败 100 次打一条警告，新建沙箱在取设备这一步等到超时</text>
<text x="800.0" y="606.2" font-size="12.5" fill="#57606A" text-anchor="middle">正在暂停、还没断开 NBD 的沙箱也占名额</text>
<rect x="48.0" y="655.0" width="16.0" height="16.0" rx="4" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.2"/>
<text x="72.0" y="668.0" font-size="13" fill="#57606A" text-anchor="start">沙箱在用</text>
<rect x="152.0" y="655.0" width="16.0" height="16.0" rx="4" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.2"/>
<text x="176.0" y="668.0" font-size="13" fill="#57606A" text-anchor="start">就绪队列里</text>
<rect x="269.0" y="655.0" width="16.0" height="16.0" rx="4" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.2"/>
<text x="293.0" y="668.0" font-size="13" fill="#57606A" text-anchor="start">空闲</text>
<line x1="48.0" y1="692.0" x2="1552.0" y2="692.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="718.0" font-size="13" fill="#8C959F" text-anchor="start">注：orchestrator 启动时读不到 /sys/module/nbd/parameters/nbds_max 就报 NBD module not loaded，起不来；部署脚本不会替你加载模块。</text></svg>