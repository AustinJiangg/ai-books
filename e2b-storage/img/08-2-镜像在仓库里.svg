<text x="48.0" y="642.0" font-size="13" fill="#8C959F" text-anchor="start">注：多平台镜像的标签指向一个索引，再按平台挑清单。ARM 补丁把 template-manager 拉取的平台固定为 linux/arm64，拉到 x86 镜像会直接报平台不匹配。</text></svg>