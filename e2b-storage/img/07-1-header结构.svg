<text x="704.0" y="228.0" font-size="12" fill="#57606A" text-anchor="middle">代数，构建出来是 0</text>
<text x="704.0" y="264.0" font-size="11.5" fill="#8C959F" text-anchor="middle">8 字节</text>
<rect x="800.0" y="176.0" width="372.0" height="70.0" rx="6" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.2"/>
