<text x="800.0" y="572.6" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">BuildId 是 00000000-0000-…（uuid.Nil）的映射：这一段全是零，不在任何文件里，读的时候直接给零</text>
<line x1="48.0" y1="636.0" x2="1552.0" y2="636.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="662.0" font-size="13" fill="#8C959F" text-anchor="start">注：所以 header 很小。代码里给一个偏移查映射的函数叫 GetShiftedMapping：返回去哪个 build、那个文件里的哪个偏移、从这里开始还能连续读多长。</text></svg>