<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="702" viewBox="0 0 1600 702" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="702" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">header 的结构：64 字节元数据，加若干条 40 字节的映射</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">两个结构体按小端序原样写成二进制，没有压缩。映射按 Offset 从小到大排列，首尾相接，不重不漏地覆盖从 0 到 Size 的整个范围。</text>
<text x="48.0" y="162.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">元数据 Metadata（64 字节）</text>
