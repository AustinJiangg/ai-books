<text x="1362.0" y="204.0" font-size="14" fill="#8A5300" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">BaseBuildId</text>
<text x="1362.0" y="228.0" font-size="12" fill="#57606A" text-anchor="middle">第 0 代</text>
<text x="1362.0" y="264.0" font-size="11.5" fill="#8C959F" text-anchor="middle">16 字节</text>
