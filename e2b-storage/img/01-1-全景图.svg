<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="856" viewBox="0 0 1600 856" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD9922B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#D9922B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="856" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">全景图：这套环境里和存储有关的东西都在哪</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">一台鲲鹏服务器，一个 template-manager 进程同时当 orchestrator 和模板构建器。颜色表示角色：橙色是模板文件的家，蓝色是 orchestrator 的本地缓存，紫色是给虚拟机用的，红色是其实在吃内存的地方。</text>
<rect x="48.0" y="186.0" width="260.0" height="120.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="178.0" y="219.2" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">Harbor 镜像仓库</text>
<text x="178.0" y="242.4" font-size="12.5" fill="#57606A" text-anchor="middle">做模板的原料</text>
<text x="178.0" y="261.2" font-size="12.5" fill="#57606A" text-anchor="middle">nginx harbor:443 → 2900</text>
<text x="178.0" y="279.9" font-size="12.5" fill="#57606A" text-anchor="middle">数据在 /data</text>
<text x="48.0" y="166.0" font-size="14" fill="#8C959F" font-weight="600" text-anchor="start">原料</text>
<rect x="420.0" y="186.0" width="520.0" height="120.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="680.0" y="228.9" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">/usr/bin/template-manager</text>
<text x="680.0" y="252.1" font-size="12.5" fill="#57606A" text-anchor="middle">一个进程 = orchestrator + 模板构建（第 1、18 篇）</text>
<text x="680.0" y="270.9" font-size="12.5" fill="#57606A" text-anchor="middle">读写模板、管理本地缓存、回答 NBD 和 UFFD</text>
<text x="420.0" y="166.0" font-size="14" fill="#8C959F" font-weight="600" text-anchor="start">进程</text>
<path d="M314.0 246.0 L414.0 246.0" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<text x="364.0" y="236.0" font-size="12.5" fill="#57606A" font-weight="600" text-anchor="middle">拉镜像</text>
<text x="367.0" y="270.0" font-size="12" fill="#8C959F" text-anchor="middle">第 8 篇</text>
<rect x="1060.0" y="186.0" width="492.0" height="120.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1306.0" y="228.5" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">/tmp/templates/&lt;buildID&gt;/</text>
<text x="1306.0" y="251.8" font-size="12.5" fill="#57606A" text-anchor="middle">模板和快照的六个文件（Local 后端）</text>
<text x="1306.0" y="270.5" font-size="12.5" fill="#57606A" text-anchor="middle">/tmp 是 tmpfs：占内存、重启即丢（第 10 篇）</text>
<text x="1060.0" y="166.0" font-size="14" fill="#8C959F" font-weight="600" text-anchor="start">模板的家</text>
<path d="M946.0 231.0 L1054.0 231.0" fill="none" stroke="#D9922B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
<text x="1000.0" y="223.0" font-size="12.5" fill="#D9922B" font-weight="600" text-anchor="middle">上传</text>
<path d="M1054.0 271.0 L946.0 271.0" fill="none" stroke="#D9922B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
<text x="1000.0" y="289.0" font-size="12.5" fill="#D9922B" font-weight="600" text-anchor="middle">按需读</text>
<text x="48.0" y="352.0" font-size="14" fill="#8C959F" font-weight="600" text-anchor="start">本地缓存（第 11 篇）</text>
<rect x="48.0" y="366.0" width="358.0" height="96.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="227.0" y="406.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">/orchestrator/template</text>
<text x="227.0" y="428.6" font-size="12" fill="#57606A" text-anchor="middle">snapfile、metadata.json</text>
<rect x="430.0" y="366.0" width="358.0" height="96.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="609.0" y="397.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">/orchestrator/build</text>
<text x="609.0" y="419.6" font-size="12" fill="#57606A" text-anchor="middle">memfile、rootfs 的稀疏副本</text>
<text x="609.0" y="437.6" font-size="12" fill="#57606A" text-anchor="middle">启动时清空；检查点也在这</text>
<rect x="812.0" y="366.0" width="358.0" height="96.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="991.0" y="397.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">/orchestrator/sandbox</text>
<text x="991.0" y="419.6" font-size="12" fill="#57606A" text-anchor="middle">每个沙箱的 COW 文件</text>
<text x="991.0" y="437.6" font-size="12" fill="#57606A" text-anchor="middle">和指向 NBD 的 .link</text>
<rect x="1194.0" y="366.0" width="358.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1373.0" y="397.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">/mnt/snapshot-cache</text>
<text x="1373.0" y="419.6" font-size="12" fill="#57606A" text-anchor="middle">tmpfs 65G</text>
<text x="1373.0" y="437.6" font-size="12" fill="#57606A" text-anchor="middle">本版代码不写</text>
<text x="48.0" y="502.0" font-size="14" fill="#8C959F" font-weight="600" text-anchor="start">给虚拟机用的</text>
<rect x="48.0" y="516.0" width="485.3" height="84.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="290.7" y="550.0" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="middle">/dev/nbd0 … nbd511</text>
<text x="290.7" y="572.6" font-size="12" fill="#57606A" text-anchor="middle">沙箱的“硬盘”，自编译模块 512 台（第 3、12 篇）</text>
<rect x="557.3" y="516.0" width="485.3" height="84.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="800.0" y="550.0" font-size="14" fill="#9A3215" font-weight="600" text-anchor="middle">/mnt/hugepages</text>
<text x="800.0" y="572.6" font-size="12" fill="#57606A" text-anchor="middle">沙箱“内存”背后的 2 MiB 大页池（第 13 篇）</text>
<rect x="1066.7" y="516.0" width="485.3" height="84.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="1309.3" y="550.0" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="middle">/fc-kernels  /fc-versions  /fc-envd</text>
<text x="1309.3" y="572.6" font-size="12" fill="#57606A" text-anchor="middle">内核、定制 Firecracker、envd（第 6 篇）</text>
<text x="48.0" y="640.0" font-size="14" fill="#8C959F" font-weight="600" text-anchor="start">其他</text>
<rect x="48.0" y="654.0" width="620.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="358.0" y="681.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">MinIO  /root/data/minio</text>
<text x="358.0" y="703.6" font-size="12" fill="#57606A" text-anchor="middle">装了、健康检查通过，但没建桶、没人写（第 10 篇）</text>
<rect x="692.0" y="654.0" width="420.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="902.0" y="681.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">PostgreSQL</text>
<text x="902.0" y="703.6" font-size="12" fill="#57606A" text-anchor="middle">模板和 build 的记录</text>
<rect x="1136.0" y="654.0" width="416.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1344.0" y="681.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">Redis</text>
<text x="1344.0" y="703.6" font-size="12" fill="#57606A" text-anchor="middle">运行中的沙箱在哪台机器上</text>
<rect x="48.0" y="753.0" width="16.0" height="16.0" rx="4" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.2"/>
<text x="72.0" y="766.0" font-size="13" fill="#57606A" text-anchor="start">模板文件</text>
<rect x="152.0" y="753.0" width="16.0" height="16.0" rx="4" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.2"/>
<text x="176.0" y="766.0" font-size="13" fill="#57606A" text-anchor="start">orchestrator 与本地缓存</text>
<rect x="363.2" y="753.0" width="16.0" height="16.0" rx="4" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.2"/>
<text x="387.2" y="766.0" font-size="13" fill="#57606A" text-anchor="start">给虚拟机用的</text>
<rect x="493.2" y="753.0" width="16.0" height="16.0" rx="4" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.2"/>
<text x="517.2" y="766.0" font-size="13" fill="#57606A" text-anchor="start">其实在吃内存</text>
<line x1="48.0" y1="790.0" x2="1552.0" y2="790.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="816.0" font-size="13" fill="#8C959F" text-anchor="start">注：镜像（Harbor）、模板（/tmp/templates）、MinIO 是三处互不相干的存储。镜像变成模板以后，沙箱就不再用到 Harbor 里的镜像了。</text></svg>