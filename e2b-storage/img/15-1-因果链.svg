<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="776" viewBox="0 0 1600 776" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="776" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">注释掉的三行，引出一条因果链</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">ARM 补丁把读缺页时的 UFFDIO_COPY_MODE_WP 注释掉了。填进去的页都不带封条，于是“在内存里、且没封条”对每一个换入过的页都成立，常驻页判据从“写过的页”变成了“碰过的页”。</text>
<rect x="48.0" y="156.0" width="722.0" height="54.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="409.0" y="188.1" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">x86（上游）</text>
<rect x="78.0" y="234.0" width="662.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="409.0" y="265.6" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">读缺页：填页并贴封条</text>
<rect x="78.0" y="306.0" width="662.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="409.0" y="337.6" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">之后只读：封条还在</text>
<path d="M409.0 290.0 L409.0 302.0" fill="none" stroke="#57606A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<rect x="78.0" y="378.0" width="662.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="409.0" y="409.6" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">被写：封条被撕</text>
<path d="M409.0 362.0 L409.0 374.0" fill="none" stroke="#57606A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<rect x="78.0" y="450.0" width="662.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="409.0" y="481.6" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">暂停：在且无封条 = 写过的页</text>
<path d="M409.0 434.0 L409.0 446.0" fill="none" stroke="#57606A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<rect x="78.0" y="522.0" width="662.0" height="54.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="409.0" y="553.6" font-size="14.5" fill="#0E6B4F" font-weight="600" text-anchor="middle">内存增量 ≈ 真正写过的页</text>
<path d="M409.0 506.0 L409.0 518.0" fill="none" stroke="#57606A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<rect x="830.0" y="156.0" width="722.0" height="54.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1191.0" y="188.1" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">这套 ARM 环境（写跟踪没开时）</text>
<rect x="860.0" y="234.0" width="662.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1191.0" y="265.6" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">读缺页：填页，不贴封条</text>
<rect x="860.0" y="306.0" width="662.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1191.0" y="337.6" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">之后只读：本来就没封条</text>
<path d="M1191.0 290.0 L1191.0 302.0" fill="none" stroke="#57606A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<rect x="860.0" y="378.0" width="662.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1191.0" y="409.6" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">预取填的页：也没封条</text>
<path d="M1191.0 362.0 L1191.0 374.0" fill="none" stroke="#57606A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<rect x="860.0" y="450.0" width="662.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1191.0" y="481.6" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">暂停：在且无封条 = 换入过的所有页</text>
<path d="M1191.0 434.0 L1191.0 446.0" fill="none" stroke="#57606A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<rect x="860.0" y="522.0" width="662.0" height="54.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1191.0" y="553.6" font-size="14.5" fill="#9A3215" font-weight="600" text-anchor="middle">内存增量 = 读过 + 写过（超集），下限 ≈ 工作集</text>
<path d="M1191.0 506.0 L1191.0 518.0" fill="none" stroke="#57606A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<rect x="48.0" y="604.0" width="485.3" height="70.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="290.7" y="630.9" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">磁盘不受影响</text>
<text x="290.7" y="654.2" font-size="12.5" fill="#57606A" text-anchor="middle">来自 COW 文件，只记写入，依然精确</text>
<rect x="557.3" y="604.0" width="485.3" height="70.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="800.0" y="630.9" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">正确性不受影响</text>
<text x="800.0" y="654.2" font-size="12.5" fill="#57606A" text-anchor="middle">多导出的页内容和父 build 一样</text>
<rect x="1066.7" y="604.0" width="485.3" height="70.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1309.3" y="630.9" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">代价</text>
<text x="1309.3" y="654.2" font-size="12.5" fill="#57606A" text-anchor="middle">空间和时间：每次暂停多出一个工作集</text>
<line x1="48.0" y1="710.0" x2="1552.0" y2="710.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="736.0" font-size="13" fill="#8C959F" text-anchor="start">注：补丁没写明为什么注释掉；可能是当时 arm64 的内核或 Firecracker 对 UFFD 写保护的支持不完整。有 HDBSS 的机器写跟踪默认打开，暂停不走这条判据。</text></svg>