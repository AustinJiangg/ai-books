<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="758" viewBox="0 0 1600 758" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="758" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">检查点树：回滚到 c2 再打检查点，就长出一条分支</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">回滚不删除任何检查点，比目标新的 c3 作为另一条分支保留，照样能回滚过去；下一个检查点的父亲是回滚的目标。每个检查点只存它那段时间（epoch）写过的页，第一个默认存完整内存。</text>
<rect x="228.0" y="196.0" width="160.0" height="70.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="308.0" y="223.9" font-size="17" fill="#9A3215" font-weight="600" text-anchor="middle">c1</text>
<text x="308.0" y="246.5" font-size="12" fill="#57606A" text-anchor="middle">完整内存（根）</text>
<rect x="228.0" y="326.0" width="160.0" height="70.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="308.0" y="353.9" font-size="17" fill="#4B3FA8" font-weight="600" text-anchor="middle">c2</text>
<text x="308.0" y="376.5" font-size="12" fill="#57606A" text-anchor="middle">这一段写过的页</text>
<rect x="58.0" y="456.0" width="160.0" height="70.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="138.0" y="483.9" font-size="17" fill="#4B3FA8" font-weight="600" text-anchor="middle">c3</text>
<text x="138.0" y="506.5" font-size="12" fill="#57606A" text-anchor="middle">这一段写过的页</text>
<rect x="398.0" y="456.0" width="160.0" height="70.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="478.0" y="483.9" font-size="17" fill="#4B3FA8" font-weight="600" text-anchor="middle">c4</text>
<text x="478.0" y="506.5" font-size="12" fill="#57606A" text-anchor="middle">这一段写过的页</text>
<path d="M308.0 272.0 L308.0 320.0" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<path d="M308.0 402.0 L138.0 450.0" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
