<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="638" viewBox="0 0 1600 638" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD6603D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#D6603D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="638" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">从一个名字找到文件：数据库里的记录怎么指到 /tmp/templates</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">别名 → 模板 → 标签指派 → build。env_builds 的主键就是 buildID，也就是 /tmp/templates 下的目录名。暂停一个沙箱时，api 在一个事务里往四张表各写一行。</text>
<rect x="48.0" y="156.0" width="263.5" height="110.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="179.8" y="193.5" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">env_aliases</text>
<text x="179.8" y="216.8" font-size="12.5" fill="#57606A" text-anchor="middle">alias = base</text>
<text x="179.8" y="235.5" font-size="12.5" fill="#57606A" text-anchor="middle">env_id = 9x2k…</text>
<path d="M317.5 211.0 L355.5 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="361.5" y="156.0" width="263.5" height="110.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="493.2" y="202.9" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">envs</text>
<text x="493.2" y="226.2" font-size="12.5" fill="#57606A" text-anchor="middle">id = 9x2k…（模板 ID）</text>
<path d="M631.0 211.0 L669.0 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="675.0" y="156.0" width="263.5" height="110.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="806.8" y="193.5" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">env_build_assignments</text>
<text x="806.8" y="216.8" font-size="12.5" fill="#57606A" text-anchor="middle">env_id = 9x2k…  tag = default</text>
<text x="806.8" y="235.5" font-size="12.5" fill="#57606A" text-anchor="middle">build_id = 7c1e9b52-…</text>
<path d="M944.5 211.0 L982.5 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="988.5" y="156.0" width="263.5" height="110.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1120.2" y="184.2" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">env_builds</text>
<text x="1120.2" y="207.4" font-size="12.5" fill="#57606A" text-anchor="middle">id = 7c1e9b52-…（= buildID）</text>
<text x="1120.2" y="226.2" font-size="12.5" fill="#57606A" text-anchor="middle">status、vcpu、ram_mb、</text>
<text x="1120.2" y="244.9" font-size="12.5" fill="#57606A" text-anchor="middle">kernel_version…</text>
<rect x="1302.0" y="156.0" width="250.0" height="110.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1427.0" y="202.6" font-size="14" fill="#9A3215" font-weight="600" text-anchor="middle">/tmp/templates/7c1e9b52-…/</text>
<text x="1427.0" y="225.9" font-size="12.5" fill="#57606A" text-anchor="middle">六个文件（第 7 篇）</text>
<path d="M1258.0 211.0 L1296.0 211.0" fill="none" stroke="#D6603D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD6603D)"/>
<text x="48.0" y="326.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">暂停沙箱 i4fok… 时，api 在一个事务里写：</text>
<rect x="48.0" y="346.0" width="358.0" height="86.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="227.0" y="380.8" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">envs</text>
<text x="227.0" y="404.0" font-size="12.5" fill="#57606A" text-anchor="middle">给这个快照建一个模板</text>
<rect x="430.0" y="346.0" width="358.0" height="86.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="609.0" y="371.4" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">snapshots</text>
<text x="609.0" y="394.6" font-size="12.5" fill="#57606A" text-anchor="middle">sandbox_id = i4fok… → 快照模板</text>
<text x="609.0" y="413.4" font-size="12.5" fill="#57606A" text-anchor="middle">base_env_id = 最初的模板</text>
<rect x="812.0" y="346.0" width="358.0" height="86.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="991.0" y="380.8" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">env_builds</text>
<text x="991.0" y="404.0" font-size="12.5" fill="#57606A" text-anchor="middle">新 build，得到新 buildID</text>
<rect x="1194.0" y="346.0" width="358.0" height="86.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1373.0" y="380.8" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">env_build_assignments</text>
<text x="1373.0" y="404.0" font-size="12.5" fill="#57606A" text-anchor="middle">快照模板的标签指向新 build</text>
<rect x="48.0" y="466.0" width="1504.0" height="70.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="800.0" y="492.9" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">删模板、删快照：只删这些行（删 envs 会级联删掉别名、标签指派等），不删 /tmp/templates 里的文件</text>
<text x="800.0" y="516.2" font-size="12.5" fill="#57606A" text-anchor="middle">重跑 build.sh -i 则相反：PostgreSQL 容器被重建，换了新的匿名卷，记录全没了，文件还在</text>
<line x1="48.0" y1="572.0" x2="1552.0" y2="572.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="598.0" font-size="13" fill="#8C959F" text-anchor="start">注：SDK 返回的 l1xjsvf1d8h3umr8d11y:default 是“模板 ID:标签”，要经过 env_build_assignments 才能查到 buildID。</text></svg>