<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="772" viewBox="0 0 1600 772" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m8B7FE0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#8B7FE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="772" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">UFFD 的交接：Firecracker 把句柄从 unix socket 递过来</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">orchestrator 先开好 socket；Firecracker 加载快照、申请客户机内存（不填内容）、建 UFFD 并登记，然后连上 socket，一条消息里带上内存布局 JSON 和 UFFD 文件描述符。</text>
<rect x="48.0" y="156.0" width="712.0" height="56.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="404.0" y="189.1" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">orchestrator</text>
<rect x="840.0" y="156.0" width="712.0" height="56.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="1196.0" y="189.1" font-size="16" fill="#4B3FA8" font-weight="600" text-anchor="middle">新的 Firecracker 进程</text>
<line x1="404.0" y1="216.0" x2="404.0" y2="676.0" stroke="#D8DEE4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="1196.0" y1="216.0" x2="1196.0" y2="676.0" stroke="#D8DEE4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect x="68.0" y="236.0" width="672.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="404.0" y="262.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">开 /tmp/uffd-&lt;ID&gt;-&lt;随机&gt;.sock，等 accept（最多 120 秒）</text>
<path d="M410.0 318.0 L1190.0 318.0" fill="none" stroke="#1F2328" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="800.0" y="308.0" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">PUT /snapshot/load：backend_type=Uffd，backend_path=那个 socket</text>
<rect x="860.0" y="360.0" width="672.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1196.0" y="386.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">按 snapfile 申请客户机内存（大页），不填内容</text>
<rect x="860.0" y="422.0" width="672.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1196.0" y="448.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">userfaultfd() 建 UFFD，登记这段内存，只收 MISSING 事件</text>
<path d="M1190.0 504.0 L410.0 504.0" fill="none" stroke="#8B7FE0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8B7FE0)"/>
<text x="800.0" y="494.0" font-size="13" fill="#4B3FA8" font-weight="600" text-anchor="middle">连上 socket，sendmsg：内存布局 JSON + SCM_RIGHTS 带上 UFFD</text>
<rect x="68.0" y="546.0" width="672.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="404.0" y="572.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="middle">建地址映射：FC 进程地址 → 客户机偏移；数据来源 = memfile header</text>
<path d="M410.0 628.0 L1190.0 628.0" fill="none" stroke="#1F2328" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="800.0" y="618.0" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">uffd 就绪 → resumeVM</text>
<line x1="48.0" y1="706.0" x2="1552.0" y2="706.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="732.0" font-size="13" fill="#8C959F" text-anchor="start">注：上游等握手的超时是 10 秒；ARM 机器上 Firecracker 从启动到发来句柄更慢，并发高时不够，补丁放宽到 120 秒。预取的“拉取”一路在握手之前就可以开始。</text></svg>