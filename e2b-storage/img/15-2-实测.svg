<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="724" viewBox="0 0 1600 724" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="724" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">实测：两次快照之间什么都不做，内存增量也有 112 MiB</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">同一个沙箱连打三次快照（每次打完用新 build 原地恢复）：#1 基线，#2 什么都不做，#3 写 200 MiB 随机数据。数据来自 deploy-docs/09，写跟踪没开的 ARM 环境。</text>
<text x="48.0" y="200.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">#1 基线</text>
<text x="48.0" y="224.0" font-size="13" fill="#57606A" text-anchor="start">耗时 0.42 秒</text>
<rect x="268.0" y="172.0" width="349.7" height="34.0" rx="4" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="627.7" y="195.0" font-size="13.5" fill="#4B3FA8" font-weight="600" text-anchor="start">memfile 112 MiB</text>
<rect x="268.0" y="214.0" width="3.0" height="34.0" rx="1" fill="#1F9E77" stroke="#1F9E77" stroke-width="1"/>
<text x="282.0" y="237.0" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">rootfs 0：沙箱读了大量磁盘，但磁盘增量只记写入</text>
<text x="48.0" y="320.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">#2 什么都不做</text>
<text x="48.0" y="344.0" font-size="13" fill="#57606A" text-anchor="start">耗时 0.41 秒</text>
<rect x="268.0" y="292.0" width="349.7" height="34.0" rx="4" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="627.7" y="315.0" font-size="13.5" fill="#4B3FA8" font-weight="600" text-anchor="start">memfile 112 MiB</text>
<rect x="268.0" y="334.0" width="3.0" height="34.0" rx="1" fill="#1F9E77" stroke="#1F9E77" stroke-width="1"/>
<text x="282.0" y="357.0" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">rootfs 0：沙箱读了大量磁盘，但磁盘增量只记写入</text>
<text x="48.0" y="440.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">#3 写了 200 MiB</text>
<text x="48.0" y="464.0" font-size="13" fill="#57606A" text-anchor="start">耗时 1.10 秒</text>
<rect x="268.0" y="412.0" width="1055.3" height="34.0" rx="4" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="1333.3" y="435.0" font-size="13.5" fill="#4B3FA8" font-weight="600" text-anchor="start">memfile 338 MiB</text>
<rect x="268.0" y="454.0" width="627.6" height="34.0" rx="4" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="905.6" y="477.0" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">rootfs 201 MiB</text>
<line x1="268.0" y1="160.0" x2="268.0" y2="506.0" stroke="#D8DEE4" stroke-width="1.2" stroke-linecap="round"/>
<rect x="48.0" y="536.0" width="485.3" height="86.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="290.7" y="570.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">#2 的 112 MiB</text>
<text x="290.7" y="594.2" font-size="12.5" fill="#57606A" text-anchor="middle">新 UFFD 下系统重新换入自己的工作集；x86 上不算，这里全算</text>
<rect x="557.3" y="536.0" width="485.3" height="86.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="800.0" y="570.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">#3 的 338 ≈ 112 + 200 + 26</text>
<text x="800.0" y="594.2" font-size="12.5" fill="#57606A" text-anchor="middle">dd 经过客户机页缓存，这 200 MiB 同时进了内存和磁盘两份增量</text>
<rect x="1066.7" y="536.0" width="485.3" height="86.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1309.3" y="570.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">0.7 秒多出来的</text>
<text x="1309.3" y="594.2" font-size="12.5" fill="#57606A" text-anchor="middle">多导出约 427 MiB，约 600 MB/s，和 process_vm_readv 加写文件相符</text>
<line x1="48.0" y1="658.0" x2="1552.0" y2="658.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="684.0" font-size="13" fill="#8C959F" text-anchor="start">注：112 MiB 约为模板内存的一成，就是这个沙箱的常驻工作集。连续暂停 N 次，这套环境约多存 N 个工作集；而 /tmp/templates 在 tmpfs 上，删除也不回收。</text></svg>