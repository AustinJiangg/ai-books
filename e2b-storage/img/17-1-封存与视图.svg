<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="768" viewBox="0 0 1600 768" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="768" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">磁盘跟着回滚：打检查点时封存写层，回滚时换视图</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">封存只是几个指针的切换：把当前写层冻成只读层，装一个新的空写层，不拷数据、不刷盘。每个检查点记下“模板 + 哪几层”作为磁盘视图；回滚就在 NBD 下面换成那个视图。</text>
<text x="48.0" y="166.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">打 c1 之前</text>
<rect x="48.0" y="456.0" width="353.5" height="46.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="224.8" y="483.5" font-size="14" fill="#8A5300" font-weight="600" text-anchor="middle">模板（只读）</text>
<rect x="48.0" y="402.0" width="353.5" height="46.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="224.8" y="429.5" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="middle">W1（写层）</text>
<path d="M405.5 356.0 L427.5 356.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="431.5" y="166.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">打完 c1</text>
<rect x="431.5" y="456.0" width="353.5" height="46.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="608.2" y="483.5" font-size="14" fill="#8A5300" font-weight="600" text-anchor="middle">模板（只读）</text>
<rect x="431.5" y="402.0" width="353.5" height="46.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="608.2" y="429.5" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="middle">L1</text>
<rect x="431.5" y="348.0" width="353.5" height="46.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="608.2" y="375.5" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="middle">W2（写层）</text>
<text x="431.5" y="532.0" font-size="12.5" fill="#57606A" text-anchor="start">c1 视图：模板 + L1</text>
<path d="M789.0 356.0 L811.0 356.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="815.0" y="166.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">打完 c2、c3</text>
<rect x="815.0" y="456.0" width="353.5" height="46.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="991.8" y="483.5" font-size="14" fill="#8A5300" font-weight="600" text-anchor="middle">模板（只读）</text>
<rect x="815.0" y="402.0" width="353.5" height="46.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="991.8" y="429.5" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="middle">L1</text>
<rect x="815.0" y="348.0" width="353.5" height="46.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="991.8" y="375.5" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="middle">L2</text>
<rect x="815.0" y="294.0" width="353.5" height="46.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="991.8" y="321.5" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="middle">L3</text>
<rect x="815.0" y="240.0" width="353.5" height="46.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="991.8" y="267.5" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="middle">W4（写层）</text>
<text x="815.0" y="532.0" font-size="12.5" fill="#57606A" text-anchor="start">c2 视图：模板 + L1 + L2</text>
<text x="815.0" y="554.0" font-size="12.5" fill="#57606A" text-anchor="start">c3 视图：模板 + L1 + L2 + L3</text>
<path d="M1172.5 356.0 L1194.5 356.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="1198.5" y="166.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">回滚到 c1</text>
<rect x="1198.5" y="456.0" width="353.5" height="46.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1375.2" y="483.5" font-size="14" fill="#8A5300" font-weight="600" text-anchor="middle">模板（只读）</text>
<rect x="1198.5" y="402.0" width="353.5" height="46.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="1375.2" y="429.5" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="middle">L1</text>
<rect x="1198.5" y="348.0" width="353.5" height="46.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1375.2" y="375.5" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="middle">W5（新写层）</text>
<text x="1198.5" y="532.0" font-size="12.5" fill="#57606A" text-anchor="start">NBD、Firecracker 不变</text>
<text x="1198.5" y="554.0" font-size="12.5" fill="#57606A" text-anchor="start">L2、L3 还被 c2、c3 引用，保留</text>
<rect x="48.0" y="586.0" width="1504.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="617.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">LayerStack：每块一个 uint16 记“主人是第几层”（0 = 模板）</text>
<text x="800.0" y="641.2" font-size="12.5" fill="#57606A" text-anchor="middle">读一块查一次数组就到，不管摞了多少层；代价是每 GiB 根盘 512 KiB、每个视图一份</text>
<line x1="48.0" y1="702.0" x2="1552.0" y2="702.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="728.0" font-size="13" fill="#8C959F" text-anchor="start">注：封存时故意不 msync：之后读它的人都经过同一份页缓存，内容一致；刷盘只换来“宿主崩溃后还在”，而检查点本来就随进程消失。实测刷盘每 MB 脏数据 0.49 ms。</text></svg>