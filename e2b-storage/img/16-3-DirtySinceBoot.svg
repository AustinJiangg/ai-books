<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="748" viewBox="0 0 1600 748" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="748" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">DirtySinceBoot：把 Firecracker 每次清空前的位图攒起来</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">Firecracker 的写跟踪位图每打一次检查点（或回滚一次）就清空。暂停要导出的却是“自恢复以来写过的所有页”。补丁在每次清空前把位图并进一个集合，暂停时再并上当前位图。</text>
<line x1="88.0" y1="226.0" x2="1512.0" y2="226.0" stroke="#1F2328" stroke-width="2" stroke-linecap="round" marker-end="url(#m1F2328)"/>
<line x1="130.7" y1="212.0" x2="130.7" y2="240.0" stroke="#1F2328" stroke-width="2" stroke-linecap="round"/>
<text x="130.7" y="200.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">恢复</text>
<line x1="486.7" y1="212.0" x2="486.7" y2="240.0" stroke="#1F2328" stroke-width="2" stroke-linecap="round"/>
<text x="486.7" y="200.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">打 c1</text>
<line x1="871.2" y1="212.0" x2="871.2" y2="240.0" stroke="#1F2328" stroke-width="2" stroke-linecap="round"/>
<text x="871.2" y="200.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">打 c2</text>
<line x1="1398.1" y1="212.0" x2="1398.1" y2="240.0" stroke="#1F2328" stroke-width="2" stroke-linecap="round"/>
<text x="1398.1" y="200.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">暂停</text>
<rect x="134.7" y="256.0" width="348.0" height="40.0" rx="6" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.2"/>
<text x="308.7" y="281.0" font-size="13.5" fill="#4B3FA8" font-weight="600" text-anchor="middle">位图 ①</text>
<rect x="490.7" y="256.0" width="376.5" height="40.0" rx="6" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.2"/>
<text x="679.0" y="281.0" font-size="13.5" fill="#4B3FA8" font-weight="600" text-anchor="middle">位图 ②</text>
<rect x="875.2" y="256.0" width="518.9" height="40.0" rx="6" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.2"/>
<text x="1134.6" y="281.0" font-size="13.5" fill="#4B3FA8" font-weight="600" text-anchor="middle">当前位图 ③</text>
<path d="M486.7 302.0 L486.7 352.0" fill="none" stroke="#1F9E77" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<text x="494.7" y="331.0" font-size="12.5" fill="#1F9E77" font-weight="600" text-anchor="start">清空前并进 ①</text>
<path d="M871.2 302.0 L871.2 352.0" fill="none" stroke="#1F9E77" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<text x="879.2" y="331.0" font-size="12.5" fill="#1F9E77" font-weight="600" text-anchor="start">清空前并进 ②</text>
<rect x="88.0" y="358.0" width="882.9" height="50.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="529.4" y="387.8" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">DirtySinceBoot = ① ∪ ②</text>
<rect x="1098.1" y="446.0" width="330.0" height="70.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1263.1" y="473.3" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">暂停导出 = ① ∪ ② ∪ ③</text>
<text x="1263.1" y="495.9" font-size="12" fill="#57606A" text-anchor="middle">日志 source=tracked+accumulated</text>
<path d="M1398.1 302.0 L1398.1 440.0" fill="none" stroke="#1F9E77" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<path d="M976.9 383.0 L1278.1 383.0 L1278.1 440.0" fill="none" stroke="#1F9E77" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<rect x="48.0" y="556.0" width="740.0" height="90.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="418.0" y="583.6" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">只用当前位图 ③ 会怎样</text>
<text x="418.0" y="606.8" font-size="12.5" fill="#57606A" text-anchor="middle">恢复出来的客户机由两个不同时刻的内存拼成，</text>
<text x="418.0" y="625.6" font-size="12.5" fill="#57606A" text-anchor="middle">而暂停本身不报任何错：静默的数据损坏</text>
<rect x="812.0" y="556.0" width="740.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1182.0" y="583.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">第一个检查点是完整捕获</text>
<text x="1182.0" y="606.8" font-size="12.5" fill="#57606A" text-anchor="middle">它的位图是“全部页”，不能并进来；改为打快照前先导出一次当前位图（不清空），</text>
<text x="1182.0" y="625.6" font-size="12.5" fill="#57606A" text-anchor="middle">每 GiB 客户机内存 32 KiB</text>
<line x1="48.0" y1="682.0" x2="1552.0" y2="682.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="708.0" font-size="13" fill="#8C959F" text-anchor="start">注：任何一步出问题，集合被标记为不可信，之后的暂停一律退回常驻页判据。代码注释：导出多了只是慢，导出少了就是静默的数据损坏。</text></svg>