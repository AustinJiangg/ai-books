<text x="410.4" y="342.0" font-size="13" fill="#4B3FA8" font-weight="600" text-anchor="middle">沙箱 2</text>
<rect x="480.4" y="246.0" width="116.0" height="180.0" rx="8" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.1"/>
<text x="538.4" y="342.0" font-size="13" fill="#4B3FA8" font-weight="600" text-anchor="middle">沙箱 3</text>
