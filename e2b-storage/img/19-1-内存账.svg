<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="868" viewBox="0 0 1600 868" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="868" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">容量账：模板和快照吃的是宿主的普通内存，不是大页，也不是硬盘</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">/tmp/templates 在 tmpfs 上，挤在“给宿主留的普通内存”里（总内存 16%，最多 42 GiB），和操作系统、各服务、template-manager 的页缓存抢地方；大页那一大块是给客户机用的。</text>
<rect x="48.0" y="156.0" width="150.4" height="300.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.4"/>
<rect x="204.4" y="156.0" width="1347.6" height="300.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.4"/>
<text x="224.4" y="188.0" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="start">可做大页的内存：静态池 20%（≤64 GiB）+ 超分配 80%</text>
<text x="224.4" y="212.0" font-size="13" fill="#57606A" text-anchor="start">客户机内存走这里；静态池开机就划出，不管有没有沙箱</text>
<rect x="224.4" y="246.0" width="116.0" height="180.0" rx="8" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.1"/>
<text x="282.4" y="342.0" font-size="13" fill="#4B3FA8" font-weight="600" text-anchor="middle">沙箱 1</text>
