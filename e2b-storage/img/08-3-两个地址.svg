<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="776" viewBox="0 0 1600 776" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m5B9BE6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#5B9BE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="776" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">同一个 Harbor，两个门：推送走 &lt;本机IP&gt;:2900，拉取走 harbor:443</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">docker daemon 推镜像时如果配了代理，不认识只写在 /etc/hosts 里的 harbor，会被转给代理而 504，所以推送用 IP 和 HTTP。template-manager 用 Go 库直接拉，要求 HTTPS 且证书名对得上，所以拉取用</text>
<text x="48.0" y="116.0" font-size="15" fill="#57606A" text-anchor="start">harbor:443。</text>
<rect x="1180.0" y="180.0" width="372.0" height="350.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="1366.0" y="327.7" font-size="17" fill="#3D3C38" font-weight="600" text-anchor="middle">Harbor</text>
<text x="1366.0" y="351.6" font-size="13" fill="#57606A" text-anchor="middle">HTTP 2900</text>
<text x="1366.0" y="371.1" font-size="13" fill="#57606A" text-anchor="middle">项目 e2b-orchestration（公开）</text>
<text x="1366.0" y="390.6" font-size="13" fill="#57606A" text-anchor="middle">数据目录 /data</text>
<rect x="48.0" y="180.0" width="380.0" height="90.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="238.0" y="208.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">build.sh -s：push_base_image</text>
<text x="238.0" y="230.6" font-size="12" fill="#57606A" text-anchor="middle">docker load dep/ubuntu-22.04-custom.tar.gz</text>
<text x="238.0" y="248.6" font-size="12" fill="#57606A" text-anchor="middle">docker push &lt;IP&gt;:2900/…</text>
<path d="M434.0 225.0 L1174.0 225.0" fill="none" stroke="#1F2328" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="804.0" y="215.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">HTTP &lt;本机IP&gt;:2900（daemon.json 的 insecure-registries）</text>
<rect x="48.0" y="440.0" width="380.0" height="90.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="238.0" y="468.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">template-manager 建模板</text>
<text x="238.0" y="490.6" font-size="12" fill="#57606A" text-anchor="middle">FROM harbor:443/e2b-orchestration/…</text>
<text x="238.0" y="508.6" font-size="12" fill="#57606A" text-anchor="middle">Go 库 remote.Image，不经过 docker</text>
<rect x="640.0" y="440.0" width="300.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="790.0" y="468.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">nginx  server_name harbor</text>
<text x="790.0" y="490.6" font-size="12" fill="#57606A" text-anchor="middle">listen 443 ssl → 127.0.0.1:2900</text>
<text x="790.0" y="508.6" font-size="12" fill="#57606A" text-anchor="middle">自签证书，CN=harbor</text>
<path d="M434.0 485.0 L634.0 485.0" fill="none" stroke="#5B9BE6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m5B9BE6)"/>
<text x="534.0" y="475.0" font-size="12.5" fill="#5B9BE6" font-weight="600" text-anchor="middle">HTTPS</text>
<path d="M946.0 485.0 L1174.0 485.0" fill="none" stroke="#57606A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<text x="1060.0" y="475.0" font-size="12.5" fill="#57606A" font-weight="600" text-anchor="middle">HTTP 127.0.0.1:2900</text>
<rect x="48.0" y="580.0" width="740.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="418.0" y="610.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">名字 harbor 怎么解析</text>
<text x="418.0" y="633.8" font-size="12.5" fill="#57606A" text-anchor="middle">/etc/resolv.conf → 127.0.0.1 dnsmasq → /etc/hosts 里的 &lt;本机IP&gt; harbor</text>
<text x="418.0" y="652.6" font-size="12.5" fill="#57606A" text-anchor="middle">（-s 写入后要重启 dnsmasq）</text>
<rect x="812.0" y="580.0" width="740.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1182.0" y="610.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">证书怎么被信任</text>
<text x="1182.0" y="633.8" font-size="12.5" fill="#57606A" text-anchor="middle">系统信任库 /etc/pki/ca-trust/…/harbor-ca.crt</text>
<text x="1182.0" y="652.6" font-size="12.5" fill="#57606A" text-anchor="middle">hcl 里 SSL_CERT_FILE=/etc/docker/certs.d/harbor:443/ca.crt</text>
<line x1="48.0" y1="710.0" x2="1552.0" y2="710.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="736.0" font-size="13" fill="#8C959F" text-anchor="start">注：两个门背后是同一个仓库。docker daemon 的代理、insecure-registries 设置对 template-manager 不起作用。</text></svg>