<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="582" viewBox="0 0 1600 582" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="mD9922B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#D9922B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="582" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">写时复制：一百个沙箱共享一份模板，各自只存改过的块</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">所有沙箱读没改过的块时都去读同一份只读模板；写的时候才把那一块记到自己的私有文件里。以后读这一块，先看自己有没有。</text>
<rect x="348.0" y="156.0" width="904.0" height="90.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="800.0" y="193.2" font-size="17" fill="#8A5300" font-weight="600" text-anchor="middle">模板的根盘（5 GiB，只读，一份）</text>
<text x="800.0" y="217.1" font-size="13" fill="#57606A" text-anchor="middle">所有同模板的沙箱共享</text>
<rect x="168.0" y="376.0" width="340.0" height="100.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
