<text x="48.0" y="542.0" font-size="13" fill="#8C959F" text-anchor="start">注：合计 = 模板一份 + 各沙箱的改动（几十 MB 级）。拷一百份要 500 GB，这样只要 5 GB 多一点。</text></svg>