<text x="778.0" y="417.9" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">沙箱 2 的改动 12 MB</text>
<text x="778.0" y="441.2" font-size="12.5" fill="#57606A" text-anchor="middle">稀疏文件 + “哪些块是我的”位图</text>
<path d="M778.0 370.0 L778.0 252.0" fill="none" stroke="#D9922B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
<text x="786.0" y="315.0" font-size="12.5" fill="#D9922B" font-weight="600" text-anchor="start">读没改过的块</text>
