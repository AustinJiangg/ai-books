<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="548" viewBox="0 0 1600 548" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="548" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">同一份数据，在内存里出现不止一次</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">这套环境的“存储后端”在 tmpfs 上，本身就占内存；本地缓存文件在硬盘上，但刚读写过的内容留在页缓存里；最后每个用到这一页的沙箱，客户机内存里还各有一份。</text>
<rect x="48.0" y="166.0" width="428.0" height="150.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="262.0" y="222.8" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">/tmp/templates/&lt;B&gt;/memfile</text>
<text x="262.0" y="246.7" font-size="13" fill="#57606A" text-anchor="middle">存储后端，在 tmpfs 上</text>
<text x="262.0" y="266.2" font-size="13" fill="#57606A" text-anchor="middle">= 宿主普通内存</text>
<path d="M484.0 241.0 L578.0 241.0" fill="none" stroke="#1F2328" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="531.0" y="231.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">拉取 4 MiB</text>
<rect x="586.0" y="166.0" width="428.0" height="150.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="213.0" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">/orchestrator/build/&lt;B&gt;-memfile-&lt;随机&gt;</text>
<text x="800.0" y="236.9" font-size="13" fill="#57606A" text-anchor="middle">本地缓存，在硬盘上</text>
<text x="800.0" y="256.4" font-size="13" fill="#57606A" text-anchor="middle">读写过的部分在页缓存里</text>
<text x="800.0" y="275.9" font-size="13" fill="#57606A" text-anchor="middle">记在 template-manager 的 cgroup 账上</text>
<path d="M1022.0 241.0 L1116.0 241.0" fill="none" stroke="#1F2328" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="1069.0" y="231.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">UFFDIO_COPY</text>
<rect x="1124.0" y="166.0" width="428.0" height="150.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="1338.0" y="222.8" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="middle">Firecracker 进程里的客户机内存</text>
<text x="1338.0" y="246.7" font-size="13" fill="#57606A" text-anchor="middle">2 MiB 大页，每个沙箱各一份</text>
<text x="1338.0" y="266.2" font-size="13" fill="#57606A" text-anchor="middle">不记 memory 控制器的账</text>
<rect x="48.0" y="366.0" width="1504.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="800.0" y="397.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">第 1 份是把模板放在 /tmp 造成的；第 2 份是缓存层的正常行为，内存紧张时内核会回收；第 3 份是沙箱真正在用的</text>
<text x="800.0" y="421.5" font-size="13" fill="#57606A" text-anchor="middle">第 19 篇把这几份加起来算容量账</text>
<line x1="48.0" y1="482.0" x2="1552.0" y2="482.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="508.0" font-size="13" fill="#8C959F" text-anchor="start">注：/mnt/snapshot-cache 也是 tmpfs，但这个版本的代码只在启动时建一下目录，从不往里写，不占内存。</text></svg>