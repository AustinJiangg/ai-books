<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="808" viewBox="0 0 1600 808" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="808" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">沙箱读一块数据的完整路径</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">先看沙箱自己写过没有；没有就查当前 build 的 header，找到数据在哪一代；去数据表取那一代的本地副本，本地没有就从存储后端拉整个 4 MiB。内存的路径完全一样，只是起点换成 UFFD 缺页。</text>
<rect x="228.0" y="156.0" width="1144.0" height="74.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="800.0" y="184.9" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="middle">客户机读 /dev/vda 第 N 块</text>
<text x="800.0" y="208.2" font-size="12.5" fill="#57606A" text-anchor="middle">virtio-blk → /dev/nbdX → NBD 服务</text>
<circle cx="198.0" cy="193.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="198.0" y="197.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<path d="M800.0 232.0 L800.0 250.0" fill="none" stroke="#1F2328" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="228.0" y="252.0" width="1144.0" height="74.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="800.0" y="280.9" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">沙箱自己写过第 N 块吗？</text>
<text x="800.0" y="304.2" font-size="12.5" fill="#57606A" text-anchor="middle">是 → 从 /orchestrator/sandbox/…cow 读，结束</text>
<circle cx="198.0" cy="289.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="198.0" y="293.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<path d="M800.0 328.0 L800.0 346.0" fill="none" stroke="#1F2328" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="228.0" y="348.0" width="1144.0" height="74.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="800.0" y="367.6" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">查 rootfs.ext4.header（内存中）</text>
<text x="800.0" y="390.8" font-size="12.5" fill="#57606A" text-anchor="middle">得到：在 build B 的数据文件里，偏移 M</text>
<text x="800.0" y="409.6" font-size="12.5" fill="#57606A" text-anchor="middle">uuid.Nil → 直接给零</text>
<circle cx="198.0" cy="385.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="198.0" y="389.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<path d="M800.0 424.0 L800.0 442.0" fill="none" stroke="#1F2328" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="228.0" y="444.0" width="1144.0" height="74.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="472.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">去数据表取 “B/rootfs.ext4”</text>
<text x="800.0" y="496.2" font-size="12.5" fill="#57606A" text-anchor="middle">没有就新建：建稀疏文件、mmap、建 chunker</text>
<circle cx="198.0" cy="481.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="198.0" y="485.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<path d="M800.0 520.0 L800.0 538.0" fill="none" stroke="#1F2328" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="228.0" y="540.0" width="1144.0" height="74.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="559.6" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">chunker.Slice(M, 4 KiB)</text>
<text x="800.0" y="582.8" font-size="12.5" fill="#57606A" text-anchor="middle">本地有：直接返回 mmap 里那一段</text>
<text x="800.0" y="601.6" font-size="12.5" fill="#57606A" text-anchor="middle">本地没有：从 /tmp/templates/B/rootfs.ext4 拉整个 4 MiB 块</text>
<circle cx="198.0" cy="577.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="198.0" y="581.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<path d="M800.0 616.0 L800.0 634.0" fill="none" stroke="#1F2328" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="228.0" y="636.0" width="1144.0" height="74.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="800.0" y="677.8" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="middle">交回 NBD 服务 → 内核 → 客户机</text>
<circle cx="198.0" cy="673.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="198.0" y="677.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">6</text>
<line x1="48.0" y1="742.0" x2="1552.0" y2="742.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="768.0" font-size="13" fill="#8C959F" text-anchor="start">注：同一块同时只拉一次（fetchers.Wait），两个沙箱同时读同一块，一个去拉，另一个等。本机刚打的快照数据本来就在本地，数据表里存的是“本地 diff”，不用拉。</text></svg>