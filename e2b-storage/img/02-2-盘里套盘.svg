<text x="944.0" y="420.5" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="start">/bin  /etc  /home  /usr  …  成千上万个文件</text>
<path d="M754.0 392.0 L894.0 392.0" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="824.0" y="382.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">交给虚拟机当硬盘</text>
<line x1="48.0" y1="526.0" x2="1552.0" y2="526.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="552.0" font-size="13" fill="#8C959F" text-anchor="start">注：E2B 能按块做写时复制、按块做增量快照，前提就在这里：它只管外层的块，不用理解内层的文件。</text></svg>