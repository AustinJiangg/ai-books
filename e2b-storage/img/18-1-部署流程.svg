<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="738" viewBox="0 0 1600 738" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="738" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">部署流程里，存储相关的东西是哪一步放上去的</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">RPM 把二进制、内核、定制 Firecracker 和部署包装到 /opt/e2b-infra；-i 装 MinIO、Harbor、nginx 并用 dep/ 覆盖上游文件；-s 才真正建目录、挂 tmpfs、预留大页、放运行环境文件、启动 Harbor 和提交 job。</text>
<rect x="48.0" y="156.0" width="353.5" height="54.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="224.8" y="188.1" font-size="16" fill="#3D3C38" font-weight="600" text-anchor="middle">RPM 安装</text>
<rect x="58.0" y="230.0" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="224.8" y="251.7" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">bin/orchestrator  envd</text>
<rect x="58.0" y="275.2" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="224.8" y="296.9" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">bin/vmlinux.bin（.openeuler）</text>
<rect x="58.0" y="320.3" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="224.8" y="342.1" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">bin/firecracker（定制，aarch64）</text>
<rect x="58.0" y="365.5" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="224.8" y="387.2" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">nomad/*.hcl（上游版）</text>
<rect x="58.0" y="410.6" width="333.5" height="84.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="224.8" y="439.6" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">dep/：.env、template-manager.hcl、</text>
<text x="224.8" y="456.8" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">init-client.sh、Harbor/MinIO 包、</text>
<text x="224.8" y="474.0" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">ubuntu-22.04-custom.tar.gz</text>
<path d="M405.5 183.0 L427.5 183.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="431.5" y="156.0" width="353.5" height="54.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="608.2" y="188.1" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">部署前（手工一次）</text>
<rect x="441.5" y="230.0" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="608.2" y="251.7" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">自编译 nbd.ko 固化到系统</text>
<rect x="441.5" y="275.2" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="608.2" y="296.9" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">modules-load.d：开机加载</text>
<rect x="441.5" y="320.3" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="608.2" y="342.1" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">modprobe.d：nbds_max=512</text>
<rect x="441.5" y="365.5" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="608.2" y="387.2" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">升级内核后要重做</text>
<path d="M789.0 183.0 L811.0 183.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
