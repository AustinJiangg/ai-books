<rect x="825.0" y="230.0" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="991.8" y="251.7" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">MinIO → /root/data/minio</text>
<rect x="825.0" y="275.2" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="991.8" y="296.9" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">Harbor 解压、改 harbor.yml</text>
<rect x="825.0" y="320.3" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="991.8" y="342.1" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">nginx：harbor:443 + 自签证书</text>
<rect x="825.0" y="365.5" width="333.5" height="62.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="991.8" y="392.1" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">dep/ 覆盖 /opt/e2b-infra 同名文件
（</text>
<text x="991.8" y="409.2" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">STORAGE_PROVIDER="Local" 由此生效）</text>
<rect x="825.0" y="437.5" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="991.8" y="459.2" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">SDK 补丁、检查点 SDK</text>
<path d="M1172.5 183.0 L1194.5 183.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1198.5" y="156.0" width="353.5" height="54.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1375.2" y="188.1" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">build.sh -s</text>
<rect x="1208.5" y="230.0" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1375.2" y="251.7" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">启动 Harbor，建项目，推基础镜像</text>
<rect x="1208.5" y="275.2" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1375.2" y="296.9" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">/orchestrator/{sandbox,template,build}</text>
<rect x="1208.5" y="320.3" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1375.2" y="342.1" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">/swapfile 1G；/mnt/snapshot-cache tmpfs</text>
<rect x="1208.5" y="365.5" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1375.2" y="387.2" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">nbd udev 规则；/fc-vm；大页预留</text>
<rect x="1208.5" y="410.6" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1375.2" y="432.4" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">/fc-envd /fc-kernels /fc-versions</text>
<rect x="1208.5" y="455.8" width="333.5" height="35.2" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1375.2" y="477.5" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">提交 redis、template-manager、edge、api</text>
<rect x="48.0" y="556.0" width="1504.0" height="80.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="800.0" y="587.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">build.sh -d：停进程、杀残留 Firecracker；不动 /tmp/templates、/orchestrator 下的缓存、大页池、MinIO 和 Harbor 的数据</text>
<text x="800.0" y="611.2" font-size="12.5" fill="#57606A" text-anchor="middle">大页要 build.sh --purge-hugepages；被强杀的沙箱留在 /orchestrator/sandbox 的 COW 文件不会被自动清理</text>
<line x1="48.0" y1="672.0" x2="1552.0" y2="672.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="698.0" font-size="13" fill="#8C959F" text-anchor="start">注：改任何配置都要改源头 e2b-deploy/dep/…，再 build.sh -r template-manager 只重跑这一个 job；重跑会结束所有运行中的沙箱、作废检查点、清空 /orchestrator/build。</text></svg>