<line x1="48.0" y1="756.0" x2="1552.0" y2="756.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="782.0" font-size="13" fill="#8C959F" text-anchor="start">注：这些规则只描述新连接的第一个包怎么改；同一条连接的后续包和回包，由 conntrack 按记录处理（见下一节）。被 REDIRECT 的程序用 SO_ORIGINAL_DST 向内核要回原始目的地址。</text></svg>