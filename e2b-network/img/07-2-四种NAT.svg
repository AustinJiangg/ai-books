<text x="220.0" y="522.0" font-size="20" fill="#1F2328" font-weight="700" text-anchor="start">MASQUERADE</text>
<text x="378.1" y="522.0" font-size="13.5" fill="#57606A" text-anchor="start">宿主机出口</text>
<text x="220.0" y="584.0" font-size="13.5" fill="#8C959F" text-anchor="start">源</text>
<rect x="264.0" y="560.0" width="220.0" height="38.0" rx="8" fill="#F4F5F7" stroke="none" stroke-width="0"/>
<text x="374.0" y="585.0" font-size="14.5" fill="#1F2328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">10.13.0.5</text>
<path d="M494.0 579.0 L544.0 579.0" fill="none" stroke="#D9922B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
