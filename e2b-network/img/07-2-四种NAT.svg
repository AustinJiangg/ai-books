<text x="226.0" y="412.0" font-size="12" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">-o eth0 -s 169.254.0.21 -j SNAT --to 10.13.0.5</text>
<rect x="887.0" y="226.0" width="665.0" height="236.0" rx="14" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.2"/>
<text x="909.0" y="262.0" font-size="20" fill="#1F2328" font-weight="700" text-anchor="start">DNAT</text>
<text x="980.7" y="262.0" font-size="13.5" fill="#57606A" text-anchor="start">ns-5 入口</text>
<text x="909.0" y="324.0" font-size="13.5" fill="#8C959F" text-anchor="start">目的</text>
<rect x="953.0" y="300.0" width="220.0" height="38.0" rx="8" fill="#F4F5F7" stroke="none" stroke-width="0"/>
<text x="1063.0" y="325.0" font-size="14.5" fill="#1F2328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">10.13.0.5</text>
<path d="M1183.0 319.0 L1233.0 319.0" fill="none" stroke="#D9922B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
