<text x="226.0" y="672.0" font-size="12" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">-s 10.13.0.5/32 -o enp125s0f0 -j MASQUERADE</text>
<rect x="887.0" y="486.0" width="665.0" height="236.0" rx="14" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.2"/>
<text x="909.0" y="522.0" font-size="20" fill="#1F2328" font-weight="700" text-anchor="start">REDIRECT</text>
<text x="1038.3" y="522.0" font-size="13.5" fill="#57606A" text-anchor="start">宿主机，从 e2bv-5 进来的 TCP</text>
<text x="909.0" y="584.0" font-size="13.5" fill="#8C959F" text-anchor="start">目的</text>
<rect x="953.0" y="560.0" width="220.0" height="38.0" rx="8" fill="#F4F5F7" stroke="none" stroke-width="0"/>
<text x="1063.0" y="585.0" font-size="14.5" fill="#1F2328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">151.101.0.223:443</text>
<path d="M1183.0 579.0 L1233.0 579.0" fill="none" stroke="#D9922B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
