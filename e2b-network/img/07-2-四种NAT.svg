<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="822" viewBox="0 0 1600 822" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="mD9922B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#D9922B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="822" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">四种地址转换：改源还是改目的，换成写死的地址还是自动选</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">按两件事把 NAT 分成四格：改的是源地址还是目的地址（决定挂在哪个钩子上），新地址是写死的还是自动选的。每格都是 E2B 里真实用到的一条规则。</text>
<text x="530.5" y="176.0" font-size="18" fill="#1F2328" font-weight="600" text-anchor="middle">改源地址</text>
<text x="530.5" y="200.0" font-size="13" fill="#57606A" text-anchor="middle">在 POSTROUTING 做：要先知道从哪块网卡出去</text>
<text x="1219.5" y="176.0" font-size="18" fill="#1F2328" font-weight="600" text-anchor="middle">改目的地址</text>
<text x="1219.5" y="200.0" font-size="13" fill="#57606A" text-anchor="middle">在 PREROUTING 做：要赶在路由判断之前</text>
<text x="48.0" y="346.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">写死新地址</text>
<rect x="198.0" y="226.0" width="665.0" height="236.0" rx="14" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.2"/>
<text x="220.0" y="262.0" font-size="20" fill="#1F2328" font-weight="700" text-anchor="start">SNAT</text>
<text x="291.7" y="262.0" font-size="13.5" fill="#57606A" text-anchor="start">ns-5 出口</text>
<text x="220.0" y="324.0" font-size="13.5" fill="#8C959F" text-anchor="start">源</text>
<rect x="264.0" y="300.0" width="220.0" height="38.0" rx="8" fill="#F4F5F7" stroke="none" stroke-width="0"/>
<text x="374.0" y="325.0" font-size="14.5" fill="#1F2328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">169.254.0.21</text>
<path d="M494.0 319.0 L544.0 319.0" fill="none" stroke="#D9922B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
