<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="850" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">拆网：命名空间里的东西随它一起消失，宿主机上的要逐条删</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">删除 ns-5，里面的网卡、路由、NAT 规则、nftables 表都会一起消失。宿主机上的网卡、路由和 9 条 iptables 规则不会，必须由 RemoveNetwork 逐条删掉。orchestrator 被强杀、断电或中途出错，宿主机这一侧就会</text>
<text x="48.0" y="116.0" font-size="15" fill="#57606A" text-anchor="start">留下残骸。</text>
<rect x="48.0" y="180.0" width="732.0" height="420.0" rx="16" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.4"/>
<text x="72.0" y="216.0" font-size="18" fill="#1D4F91" font-weight="600" text-anchor="start">ns-5 里</text>
<text x="150.4" y="216.0" font-size="14" fill="#57606A" text-anchor="start">删除命名空间时自动消失</text>
<rect x="72.0" y="244.0" width="684.0" height="60.0" rx="9" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1"/>
<text x="92.0" y="269.0" font-size="13.5" fill="#1D4F91" font-weight="600" text-anchor="start">网卡</text>
<text x="92.0" y="290.0" font-size="13.5" fill="#1F2328" text-anchor="start">lo、eth0（vpeer）、tap0</text>
<rect x="72.0" y="318.0" width="684.0" height="60.0" rx="9" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1"/>
<text x="92.0" y="343.0" font-size="13.5" fill="#1D4F91" font-weight="600" text-anchor="start">路由</text>
<text x="92.0" y="364.0" font-size="13.5" fill="#1F2328" text-anchor="start">default via 10.14.0.10</text>
<rect x="72.0" y="392.0" width="684.0" height="60.0" rx="9" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1"/>
<text x="92.0" y="417.0" font-size="13.5" fill="#1D4F91" font-weight="600" text-anchor="start">iptables nat</text>
<text x="92.0" y="438.0" font-size="13.5" fill="#1F2328" text-anchor="start">SNAT、DNAT 共 2 条</text>
<rect x="72.0" y="466.0" width="684.0" height="60.0" rx="9" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1"/>
<text x="92.0" y="491.0" font-size="13.5" fill="#1D4F91" font-weight="600" text-anchor="start">nftables</text>
<text x="92.0" y="512.0" font-size="13.5" fill="#1F2328" text-anchor="start">表 slot-firewall</text>
<text x="72.0" y="574.0" font-size="14" fill="#57606A" text-anchor="start">命名空间的一大好处：里面的东西不用逐条删</text>
<rect x="820.0" y="180.0" width="732.0" height="420.0" rx="16" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.4"/>
<text x="844.0" y="216.0" font-size="18" fill="#3D3C38" font-weight="600" text-anchor="start">宿主机上</text>
<text x="932.0" y="216.0" font-size="14" fill="#57606A" text-anchor="start">必须逐条删</text>
<rect x="844.0" y="244.0" width="684.0" height="60.0" rx="9" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1"/>
<text x="864.0" y="269.0" font-size="13.5" fill="#3D3C38" font-weight="600" text-anchor="start">网卡</text>
<text x="864.0" y="290.0" font-size="13.5" fill="#1F2328" text-anchor="start">e2bv-5（显式删，避免和下一个同名网卡撞上）</text>
<rect x="844.0" y="318.0" width="684.0" height="60.0" rx="9" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1"/>
<text x="864.0" y="343.0" font-size="13.5" fill="#3D3C38" font-weight="600" text-anchor="start">路由</text>
<text x="864.0" y="364.0" font-size="13.5" fill="#1F2328" text-anchor="start">10.13.0.5/32 via 10.14.0.11</text>
<rect x="844.0" y="392.0" width="684.0" height="60.0" rx="9" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1"/>
<text x="864.0" y="417.0" font-size="13.5" fill="#3D3C38" font-weight="600" text-anchor="start">iptables filter</text>
<text x="864.0" y="438.0" font-size="13.5" fill="#1F2328" text-anchor="start">FORWARD 2 条</text>
<rect x="844.0" y="466.0" width="684.0" height="60.0" rx="9" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1"/>
<text x="864.0" y="491.0" font-size="13.5" fill="#3D3C38" font-weight="600" text-anchor="start">iptables nat</text>
<text x="864.0" y="512.0" font-size="13.5" fill="#1F2328" text-anchor="start">MASQUERADE 1 条 + REDIRECT 6 条</text>
<text x="844.0" y="574.0" font-size="14" text-anchor="start" xml:space="preserve"><tspan fill="#9A3215" font-weight="700">每个槽位 9 条 iptables 规则；</tspan><tspan fill="#57606A">300 个槽位就是 2700 条</tspan></text>
<text x="48.0" y="636.0" font-size="17" fill="#1F2328" font-weight="600" text-anchor="start">异常退出时留下的两种残骸</text>
<rect x="48.0" y="654.0" width="737.0" height="96.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="68.0" y="683.8" font-size="15" fill="#9A3215" font-weight="600" text-anchor="start">残留的命名空间和 veth</text>
<text x="68.0" y="707.7" font-size="13" fill="#57606A" text-anchor="start">/var/run/netns/ns-N、e2bv-N 还在。orchestrator 启动时把已存在的 ns-N 当成别人的，这个编号不再用，可用编</text>
<text x="68.0" y="727.2" font-size="13" fill="#57606A" text-anchor="start">号越来越少。</text>
<rect x="815.0" y="654.0" width="737.0" height="96.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="835.0" y="683.8" font-size="15" fill="#9A3215" font-weight="600" text-anchor="start">残留的 iptables 规则</text>
<text x="835.0" y="707.7" font-size="13" fill="#57606A" text-anchor="start">网卡删了，规则不会跟着消失，只是永远不会命中。攒到几万条后，每次改 iptables 都要读写整张表，建网和部署都</text>
<text x="835.0" y="727.2" font-size="13" fill="#57606A" text-anchor="start">变慢。</text>
<line x1="48.0" y1="784.0" x2="1552.0" y2="784.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="810.0" font-size="13" fill="#8C959F" text-anchor="start">注：部署脚本停服务时会区分在用和残留的槽位，只清理残留的命名空间、veth 和 iptables 规则，并批量删除上万条规则（第 21 篇）。</text></svg>