<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="738" viewBox="0 0 1600 738" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="738" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">dnsmasq：本机的 DNS 转发器，按域名决定谁来回答</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">程序只问 127.0.0.1:53。dnsmasq 按配置逐条看域名：有的自己直接回答，有的转给 Consul，其余转给普通的上游 DNS，并把答案缓存起来。这补上了 resolv.conf 的两个短板：不能写端口、不能按域名分流。</text>
<rect x="430.0" y="156.0" width="560.0" height="480.0" rx="14" fill="#FCFBFA" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="450.0" y="186.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">dnsmasq  127.0.0.1:53</text>
<rect x="450.0" y="206.0" width="520.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.3"/>
<text x="470.0" y="242.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">*.e2b.app</text>
<text x="470.0" y="270.0" font-size="13" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">address=/.e2b.app/127.0.0.1</text>
<rect x="1130.0" y="206.0" width="422.0" height="96.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1341.0" y="245.7" font-size="15.5" fill="#8A5300" font-weight="600" text-anchor="middle">自己回答 127.0.0.1</text>
<text x="1341.0" y="269.6" font-size="13" fill="#57606A" text-anchor="middle">不问任何人</text>
<path d="M970.0 254.0 L1124.0 254.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="450.0" y="328.0" width="520.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="470.0" y="364.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">*.consul</text>
<text x="470.0" y="392.0" font-size="13" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">server=/consul/127.0.0.1#8600</text>
<rect x="1130.0" y="328.0" width="422.0" height="96.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1341.0" y="367.7" font-size="15.5" fill="#1D4F91" font-weight="600" text-anchor="middle">Consul DNS</text>
<text x="1341.0" y="391.6" font-size="13" fill="#57606A" text-anchor="middle">127.0.0.1:8600，回答服务当前地址</text>
<path d="M970.0 376.0 L1124.0 376.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="450.0" y="450.0" width="520.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1.3"/>
<text x="470.0" y="486.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">pypi.org 等</text>
<text x="470.0" y="514.0" font-size="13" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">其他域名</text>
<rect x="1130.0" y="450.0" width="422.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1341.0" y="489.7" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="middle">上游 DNS</text>
<text x="1341.0" y="513.6" font-size="13" fill="#57606A" text-anchor="middle">例如 192.168.10.1</text>
<path d="M970.0 498.0 L1124.0 498.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="450.0" y="566.0" width="520.0" height="56.0" rx="8" fill="#FDF0D9" stroke="#D9922B" stroke-width="1" stroke-dasharray="4 3"/>
<text x="470.0" y="590.0" font-size="13.5" fill="#8A5300" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">local=/e2b.app/</text>
<text x="470.0" y="611.0" font-size="13" fill="#57606A" text-anchor="start">e2b.app 只在本地找；本地没有的记录（如 AAAA）直接回答“没有”</text>
<rect x="48.0" y="306.0" width="252.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="174.0" y="348.2" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="middle">本机程序</text>
<text x="174.0" y="372.1" font-size="13" fill="#57606A" text-anchor="middle">SDK、orchestrator、api…</text>
<text x="174.0" y="391.6" font-size="13" fill="#57606A" text-anchor="middle">/etc/resolv.conf：</text>
<text x="174.0" y="411.1" font-size="13" fill="#57606A" text-anchor="middle">nameserver 127.0.0.1</text>
<path d="M304.0 376.0 L424.0 376.0" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="364.0" y="366.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">查询</text>
<line x1="48.0" y1="672.0" x2="1552.0" y2="672.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="698.0" font-size="13" fill="#8C959F" text-anchor="start">注：这是宿主机上的 DNS。沙箱里的程序用的是另一套：resolv.conf 里写的是 8.8.8.8（第 14 篇）。宿主机这套的完整配置见第 17 篇。</text></svg>