<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="672" viewBox="0 0 1600 672" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="672" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">同一个钩子上谁先谁后：E2B 的防火墙排在 NAT 前面</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">同一个钩子上可以挂好几条链，按优先级数字从小到大执行。沙箱发出的包进入 ns-5 后，先过 -150 的 nftables 防火墙，再过 -100 的 iptables nat，最后在 POSTROUTING 做 SNAT。所以防火墙判断的永远是沙箱原本</text>
<text x="48.0" y="116.0" font-size="15" fill="#57606A" text-anchor="start">想访问的地址。</text>
<text x="48.0" y="355.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">PREROUTING 上的链</text>
<line x1="260.0" y1="350.0" x2="1392.0" y2="350.0" stroke="#57606A" stroke-width="1.6" stroke-linecap="round"/>
<text x="1400.0" y="355.0" font-size="12.5" fill="#8C959F" text-anchor="start">数字小的先执行 →</text>
<circle cx="357.0" cy="350.0" r="5" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="357.0" y="380.0" font-size="13" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">-300</text>
<rect x="329.9" y="268.0" width="54.3" height="58.0" rx="9" fill="#F4F5F7" stroke="#57606A" stroke-width="1"/>
<text x="357.0" y="292.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">raw</text>
<text x="357.0" y="312.0" font-size="12" fill="#57606A" text-anchor="middle">最早</text>
<line x1="357.0" y1="326.0" x2="357.0" y2="342.0" stroke="#57606A" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="842.2" cy="350.0" r="7" fill="#1F9E77" stroke="none" stroke-width="1"/>
<text x="842.2" y="380.0" font-size="13" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">-150</text>
<rect x="755.0" y="268.0" width="174.4" height="58.0" rx="9" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.4"/>
<text x="842.2" y="292.0" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="middle">E2B：slot-firewall</text>
<text x="842.2" y="312.0" font-size="12" fill="#57606A" text-anchor="middle">nftables，放行或丢弃</text>
<line x1="842.2" y1="326.0" x2="842.2" y2="342.0" stroke="#1F9E77" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="1003.9" cy="350.0" r="5" fill="#D9922B" stroke="none" stroke-width="1"/>
<text x="1003.9" y="380.0" font-size="13" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">-100</text>
<rect x="899.3" y="204.0" width="209.2" height="58.0" rx="9" fill="#FDF0D9" stroke="#D9922B" stroke-width="1"/>
<text x="1003.9" y="228.0" font-size="14" fill="#8A5300" font-weight="600" text-anchor="middle">nat PREROUTING</text>
<text x="1003.9" y="248.0" font-size="12" fill="#57606A" text-anchor="middle">iptables：DNAT、REDIRECT</text>
<line x1="1003.9" y1="262.0" x2="1003.9" y2="342.0" stroke="#D9922B" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="1327.3" cy="350.0" r="5" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1327.3" y="380.0" font-size="13" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">0</text>
<rect x="1288.1" y="268.0" width="78.5" height="40.0" rx="9" fill="#F4F5F7" stroke="#57606A" stroke-width="1"/>
<text x="1327.3" y="292.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">filter</text>
<line x1="1327.3" y1="308.0" x2="1327.3" y2="342.0" stroke="#57606A" stroke-width="1.2" stroke-linecap="round"/>
<text x="48.0" y="440.0" font-size="17" fill="#1F2328" font-weight="600" text-anchor="start">沙箱发出的一个包，在 ns-5 里依次经过</text>
<rect x="48.0" y="470.0" width="229.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="162.5" y="509.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">从 tap0 进入</text>
<text x="162.5" y="532.9" font-size="12.5" fill="#57606A" text-anchor="middle">目的 151.101.0.223</text>
<path d="M280.0 518.0 L299.0 518.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="303.0" y="470.0" width="229.0" height="96.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="417.5" y="509.6" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="middle">nftables 防火墙</text>
<text x="417.5" y="532.9" font-size="12.5" fill="#57606A" text-anchor="middle">优先级 -150：看的是原始目的地址</text>
<path d="M535.0 518.0 L554.0 518.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="558.0" y="470.0" width="229.0" height="96.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="672.5" y="509.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">iptables nat PREROUTING</text>
<text x="672.5" y="532.9" font-size="12.5" fill="#57606A" text-anchor="middle">-100：这个方向没有匹配的规则</text>
<path d="M790.0 518.0 L809.0 518.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="813.0" y="470.0" width="229.0" height="96.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="927.5" y="509.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">路由 → FORWARD</text>
<text x="927.5" y="532.9" font-size="12.5" fill="#57606A" text-anchor="middle">转发给 eth0（vpeer）</text>
<path d="M1045.0 518.0 L1064.0 518.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1068.0" y="470.0" width="229.0" height="96.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1182.5" y="509.6" font-size="14" fill="#8A5300" font-weight="600" text-anchor="middle">nat POSTROUTING：SNAT</text>
<text x="1182.5" y="532.9" font-size="12.5" fill="#57606A" text-anchor="middle">源 169.254.0.21 → 10.13.0.5</text>
<path d="M1300.0 518.0 L1319.0 518.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1323.0" y="470.0" width="229.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1437.5" y="509.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">从 eth0 离开</text>
<text x="1437.5" y="532.9" font-size="12.5" fill="#57606A" text-anchor="middle">进入宿主机</text>
<line x1="48.0" y1="606.0" x2="1552.0" y2="606.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="632.0" font-size="13" fill="#8C959F" text-anchor="start">注：iptables 和 nftables 挂在同一个 Netfilter 上，可以同时使用。E2B 的分工：出站过滤用 nftables，地址转换和各种改道用 iptables。</text></svg>