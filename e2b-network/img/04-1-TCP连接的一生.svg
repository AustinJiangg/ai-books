<text x="48.0" y="1030.0" font-size="13" fill="#8C959F" text-anchor="start">注：x、y 是两端各自随机选的起始序列号。TIME_WAIT 会再等一段时间才彻底关闭，防止迟到的包被误认成新连接的。</text></svg>