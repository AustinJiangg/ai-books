<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" viewBox="0 0 1600 1070" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="1070" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">一条 TCP 连接的一生：两端各记一份状态</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">以沙箱里的 pip 连接 pypi.org 为例。中间是来回的包，两侧是两端各自记下的连接状态。连接不是一根线，而是两端内存里对得上的两份记录：对方的地址和端口、序列号、确认号、所处阶段。</text>
<rect x="430.0" y="156.0" width="260.0" height="58.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="560.0" y="176.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">客户端</text>
<text x="560.0" y="200.2" font-size="12.5" fill="#1D4F91" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">169.254.0.21:51234</text>
<rect x="910.0" y="156.0" width="260.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
