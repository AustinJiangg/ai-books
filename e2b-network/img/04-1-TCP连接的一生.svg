<path d="M564.0 506.0 L1034.0 524.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="800.0" y="504.0" font-size="13.5" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">数据  seq=x+1</text>
<text x="800.0" y="540.0" font-size="12" fill="#8C959F" text-anchor="middle">带上这段数据的编号</text>
<path d="M1036.0 578.0 L566.0 596.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="800.0" y="576.0" font-size="13.5" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">ACK  ack=x+1+长度</text>
<text x="800.0" y="612.0" font-size="12" fill="#8C959F" text-anchor="middle">收到这里之前的全部数据</text>
<path d="M564.0 676.0 L1034.0 694.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
