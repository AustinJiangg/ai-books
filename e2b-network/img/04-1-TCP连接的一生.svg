<path d="M564.0 264.0 L1034.0 282.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="800.0" y="262.0" font-size="13.5" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">SYN  seq=x</text>
<text x="800.0" y="298.0" font-size="12" fill="#8C959F" text-anchor="middle">我想连你，我的起始编号是 x</text>
<path d="M1036.0 336.0 L566.0 354.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="800.0" y="334.0" font-size="13.5" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">SYN+ACK  seq=y ack=x+1</text>
<text x="800.0" y="370.0" font-size="12" fill="#8C959F" text-anchor="middle">好，我的起始编号是 y</text>
<path d="M564.0 408.0 L1034.0 426.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
