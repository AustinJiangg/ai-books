<text x="1278.0" y="202.8" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">耗时超过 150 毫秒的回滚里</text>
<text x="1278.0" y="226.7" font-size="13" fill="#57606A" text-anchor="start">87% 能用“某一次关闭套接字”解释；这一</text>
<text x="1278.0" y="246.2" font-size="13" fill="#57606A" text-anchor="start">步占整个回滚耗时的 90%</text>
<rect x="1260.0" y="296.0" width="292.0" height="150.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1278.0" y="344.2" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="start">补丁：回滚路径上不开也不关套接字</text>
<text x="1278.0" y="367.4" font-size="12.5" fill="#57606A" text-anchor="start">ns-5 这边：建网第 11 步打开，存在槽位里，</text>
<text x="1278.0" y="386.2" font-size="12.5" fill="#57606A" text-anchor="start">拆网时交给后台协程关闭。宿主机这边：常驻</text>
<text x="1278.0" y="404.9" font-size="12.5" fill="#57606A" text-anchor="start">清扫器持有一个，批量处理所有沙箱</text>
<line x1="48.0" y1="476.0" x2="1552.0" y2="476.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="502.0" font-size="13" fill="#8C959F" text-anchor="start">注：某个槽位的套接字坏了，就退回“进命名空间、临时开一个”的老办法，并只打印一次告警。看起来理所当然很快的操作，也要靠实测确认。</text></svg>