<line x1="770.0" y1="320.0" x2="770.0" y2="332.0" stroke="#D6603D" stroke-width="2" stroke-linecap="round"/>
<text x="770.0" y="352.0" font-size="13" fill="#9A3215" font-weight="600" text-anchor="middle">中位 250</text>
