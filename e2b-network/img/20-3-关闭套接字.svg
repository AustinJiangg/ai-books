<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="542" viewBox="0 0 1600 542" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="542" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">关闭一个 netlink 套接字要 250 毫秒：比回滚本身还慢</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">清理 conntrack 要通过 netlink 套接字。最初每次回滚都临时开一个、用完关掉；在鲲鹏 920（内核 6.6）上实测，关闭时内核要等 nf_tables 的工作队列清空，而建新槽位时这个队列正忙。</text>
