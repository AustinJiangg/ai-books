<text x="879.0" y="516.0" font-size="12.5" fill="#57606A" font-weight="600" text-anchor="middle">是</text>
<rect x="990.0" y="506.0" width="170.0" height="36.0" rx="18" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1075.0" y="529.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">交给 TCP 代理</text>
<path d="M620.0 466.0 L620.0 489.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="630.0" y="483.0" font-size="12.5" fill="#8C959F" font-weight="600" text-anchor="start">否</text>
<rect x="300.0" y="582.0" width="640.0" height="64.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.2"/>
<text x="320.0" y="609.0" font-size="13" fill="#8C959F" font-weight="600" text-anchor="start">规则 4</text>
<text x="390.0" y="609.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">目的在用户放行集合里？</text>
<text x="390.0" y="631.0" font-size="12.5" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">allowOut 的 IP/CIDR（+ 8.8.8.8）</text>
<path d="M942.0 614.0 L986.0 614.0" fill="none" stroke="#1F9E77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<text x="964.0" y="606.0" font-size="12.5" fill="#1F9E77" font-weight="600" text-anchor="middle">是</text>
<rect x="990.0" y="596.0" width="120.0" height="36.0" rx="18" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1050.0" y="619.0" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="middle">放行</text>
<path d="M620.0 556.0 L620.0 579.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="630.0" y="573.0" font-size="12.5" fill="#8C959F" font-weight="600" text-anchor="start">否</text>
<rect x="300.0" y="672.0" width="640.0" height="64.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.2"/>
<text x="320.0" y="699.0" font-size="13" fill="#8C959F" font-weight="600" text-anchor="start">规则 5</text>
<text x="390.0" y="699.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">目的在用户拦截集合里？</text>
<text x="390.0" y="721.0" font-size="12.5" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">denyOut，或断网时的 0.0.0.0/0</text>
<path d="M942.0 704.0 L986.0 704.0" fill="none" stroke="#D6603D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD6603D)"/>
<text x="964.0" y="696.0" font-size="12.5" fill="#D6603D" font-weight="600" text-anchor="middle">是</text>
