<text x="320.0" y="339.0" font-size="13" fill="#8C959F" font-weight="600" text-anchor="start">规则 2</text>
<text x="390.0" y="339.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">目的在预置放行集合里？</text>
