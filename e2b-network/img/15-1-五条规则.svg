<text x="1050.0" y="709.0" font-size="14" fill="#9A3215" font-weight="600" text-anchor="middle">丢弃</text>
<path d="M620.0 646.0 L620.0 669.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="630.0" y="663.0" font-size="12.5" fill="#8C959F" font-weight="600" text-anchor="start">否</text>
<path d="M620.0 736.0 L620.0 759.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="630.0" y="753.0" font-size="12.5" fill="#8C959F" font-weight="600" text-anchor="start">否</text>
<rect x="420.0" y="762.0" width="400.0" height="48.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="620.0" y="790.8" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">链的默认策略：放行</text>
<path d="M286 222.0 h-10 V466.0 h10" fill="none" stroke="#8C959F" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="266.0" y="340.0" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="end">预置规则</text>
<text x="266.0" y="362.0" font-size="12.5" fill="#57606A" text-anchor="end">所有协议</text>
<path d="M286 582.0 h-10 V736.0 h10" fill="none" stroke="#8C959F" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="266.0" y="655.0" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="end">用户规则</text>
<text x="266.0" y="677.0" font-size="12.5" fill="#57606A" text-anchor="end">只管非 TCP</text>
<rect x="1190.0" y="222.0" width="362.0" height="95.1" rx="10" fill="#FFFFFF" stroke="#D6603D" stroke-width="1.2"/>
<rect x="1190.0" y="222.0" width="5.0" height="95.1" rx="2" fill="#D6603D" stroke="#D6603D" stroke-width="0"/>
<rect x="1194.0" y="222.0" width="358.0" height="95.1" rx="10" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="1212.0" y="251.2" font-size="14.5" fill="#9A3215" font-weight="600" text-anchor="start">规则 3 在规则 4 前面</text>
<text x="1212.0" y="275.1" font-size="13" fill="#57606A" text-anchor="start">allowOut 写了 10.0.0.5 也没用：包先撞上规则 3 被</text>
<text x="1212.0" y="294.6" font-size="13" fill="#57606A" text-anchor="start">丢弃。私有地址永远放不出去，这是刻意的。</text>
<rect x="1190.0" y="335.1" width="362.0" height="95.1" rx="10" fill="#FFFFFF" stroke="#1F9E77" stroke-width="1.2"/>
<rect x="1190.0" y="335.1" width="5.0" height="95.1" rx="2" fill="#1F9E77" stroke="#1F9E77" stroke-width="0"/>
<rect x="1194.0" y="335.1" width="358.0" height="95.1" rx="10" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="1212.0" y="364.3" font-size="14.5" fill="#0E6B4F" font-weight="600" text-anchor="start">规则 4 在规则 5 前面</text>
<text x="1212.0" y="388.2" font-size="13" fill="#57606A" text-anchor="start">允许优先：denyOut 0.0.0.0/0 + allowOut</text>
<text x="1212.0" y="407.7" font-size="13" fill="#57606A" text-anchor="start">1.1.1.1，就是“拒绝一切，只开一个口子”。</text>
<rect x="1190.0" y="448.3" width="362.0" height="95.1" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.2"/>
<rect x="1190.0" y="448.3" width="5.0" height="95.1" rx="2" fill="#5B9BE6" stroke="#5B9BE6" stroke-width="0"/>
<rect x="1194.0" y="448.3" width="358.0" height="95.1" rx="10" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="1212.0" y="477.5" font-size="14.5" fill="#1D4F91" font-weight="600" text-anchor="start">规则 1 排第一</text>
<text x="1212.0" y="501.4" font-size="13" fill="#57606A" text-anchor="start">宿主机先发起的连接（比如连 envd），沙箱的回包目的</text>
<text x="1212.0" y="520.9" font-size="13" fill="#57606A" text-anchor="start">是 10.14.0.10，也在拦截范围内，靠它放行。</text>
<line x1="48.0" y1="844.0" x2="1552.0" y2="844.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="870.0" font-size="13" fill="#8C959F" text-anchor="start">注：每条规则都以 iifname "tap0" 开头，只检查沙箱发出的包；外面进来的包和回包不受约束。这张表挂在 PREROUTING，优先级 -150，比 NAT 早，看到的是沙箱原本想访问的地址。</text></svg>