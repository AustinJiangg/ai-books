<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="910" viewBox="0 0 1600 910" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD6603D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#D6603D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="910" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">命名空间防火墙的五条规则：从上往下，命中即停</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">每个从 tap0 进来的包（沙箱发出的包）依次回答下面几个问题。前三条对所有协议生效；用户的放行、拦截只管非 TCP，TCP 在这一层放过去，到宿主机交给防火墙代理再判一次。</text>
<rect x="300.0" y="146.0" width="640.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="620.0" y="175.8" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">从 tap0 进入 ns-5 的包</text>
<rect x="300.0" y="222.0" width="640.0" height="64.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.2"/>
<text x="320.0" y="249.0" font-size="13" fill="#8C959F" font-weight="600" text-anchor="start">规则 1</text>
<text x="390.0" y="249.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">属于已建立的连接？</text>
