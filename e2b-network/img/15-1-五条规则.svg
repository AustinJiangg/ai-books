<text x="1050.0" y="439.0" font-size="14" fill="#9A3215" font-weight="600" text-anchor="middle">丢弃</text>
<path d="M620.0 376.0 L620.0 399.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="630.0" y="393.0" font-size="12.5" fill="#8C959F" font-weight="600" text-anchor="start">否</text>
