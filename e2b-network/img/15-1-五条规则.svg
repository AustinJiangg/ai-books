<path d="M942.0 344.0 L986.0 344.0" fill="none" stroke="#1F9E77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<text x="964.0" y="336.0" font-size="12.5" fill="#1F9E77" font-weight="600" text-anchor="middle">是</text>
<rect x="990.0" y="326.0" width="120.0" height="36.0" rx="18" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1050.0" y="349.0" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="middle">放行</text>
<path d="M620.0 286.0 L620.0 309.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="630.0" y="303.0" font-size="12.5" fill="#8C959F" font-weight="600" text-anchor="start">否</text>
<rect x="300.0" y="402.0" width="640.0" height="64.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.2"/>
<text x="320.0" y="429.0" font-size="13" fill="#8C959F" font-weight="600" text-anchor="start">规则 3</text>
<text x="390.0" y="429.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">目的在预置拦截集合里？</text>
<text x="390.0" y="451.0" font-size="12.5" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">10/8 · 172.16/12 · 192.168/16 · 127/8 · 169.254/16</text>
<path d="M942.0 434.0 L986.0 434.0" fill="none" stroke="#D6603D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD6603D)"/>
