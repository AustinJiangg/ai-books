<path d="M942.0 254.0 L986.0 254.0" fill="none" stroke="#1F9E77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<text x="964.0" y="246.0" font-size="12.5" fill="#1F9E77" font-weight="600" text-anchor="middle">是</text>
<rect x="990.0" y="236.0" width="120.0" height="36.0" rx="18" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1050.0" y="259.0" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="middle">放行</text>
<path d="M620.0 196.0 L620.0 219.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
