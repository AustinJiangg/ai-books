<text x="760.0" y="238.0" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="middle">virtio-net 驱动</text>
<text x="760.0" y="260.6" font-size="12" fill="#57606A" text-anchor="middle">知道自己在虚拟机里</text>
