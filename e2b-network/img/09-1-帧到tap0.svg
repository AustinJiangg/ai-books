<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="742" viewBox="0 0 1600 742" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="742" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">一个帧从客户机走到 tap0：中间隔着一个普通程序 Firecracker</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">客户机的 virtio-net 驱动把帧放进和 Firecracker 共享的内存队列；Firecracker 取出来，写进 tap0 的文件描述符，帧就进了 ns-5 的网络栈。发往 169.254.169.254 的 MMDS 请求在 Firecracker 这里就被截下回</text>
<text x="48.0" y="116.0" font-size="15" fill="#57606A" text-anchor="start">答，不会出现在 tap0 上。</text>
