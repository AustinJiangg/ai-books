<path d="M691.6 414.0 L564.0 414.0" fill="none" stroke="#1F9E77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<text x="627.8" y="406.0" font-size="12.5" fill="#1F9E77" font-weight="600" text-anchor="middle">是</text>
