<text x="780.0" y="598.6" font-size="12" fill="#57606A" text-anchor="middle">“收到”一个以太网帧</text>
<rect x="300.0" y="552.0" width="260.0" height="64.0" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
