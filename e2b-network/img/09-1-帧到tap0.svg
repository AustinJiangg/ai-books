<line x1="48.0" y1="676.0" x2="1552.0" y2="676.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="702.0" font-size="13" fill="#8C959F" text-anchor="start">注：反方向一样：ns-5 把发给客户机的帧从 tap0 发出，Firecracker read 到它，放进接收队列，再用中断通知客户机。对宿主机内核来说，tap0 就像一根网线，另一头接着一台 169.254.0.21。</text></svg>