<text x="68.0" y="392.0" font-size="12.5" fill="#57606A" text-anchor="start">用户态，运行在 ns-5 里</text>
<rect x="48.0" y="506.0" width="1504.0" height="136.0" rx="14" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
