<text x="530.0" y="238.0" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="middle">客户机内核</text>
<text x="530.0" y="260.6" font-size="12" fill="#57606A" text-anchor="middle">查路由，交给网关</text>
