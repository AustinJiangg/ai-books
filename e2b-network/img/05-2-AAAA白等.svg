<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="592" viewBox="0 0 1600 592" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="592" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">同时查 A 和 AAAA：一个不回答，整个查询就白等十几秒</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">客户端不知道对方支持 IPv4 还是 IPv6，常常同时发出 A 和 AAAA 两个查询，两个都有结果才开始连接。如果 DNS 服务器对 AAAA 一声不吭，客户端要等满超时、重试，按默认的 5 秒超时、共 3 次，就是 15 秒。</text>
