<path d="M1452.5 366.0 L1524.0 366.0" fill="none" stroke="#1F9E77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<text x="1524.0" y="350.0" font-size="13" fill="#0E6B4F" font-weight="600" text-anchor="end">开始连接</text>
<path d="M260.0 464 v8 H1452.5 v-8" fill="none" stroke="#D6603D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="856.2" y="496.0" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">白等约 15 秒</text>
<line x1="48.0" y1="526.0" x2="1552.0" y2="526.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="552.0" font-size="13" fill="#8C959F" text-anchor="start">注：这套环境里真实发生过：SDK 每次连沙箱都多等 15 秒。原因是 dnsmasq 把 AAAA 转给了不通的上游；加一行 local=/e2b.app/，让 dnsmasq 对 AAAA 立刻回答“没有”，问题就消失了（第 17 篇）。</text></svg>