<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="714" viewBox="0 0 1600 714" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD9922B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#D9922B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="714" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">conntrack：只有第一个包查 NAT 规则，之后全按记录改</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">以宿主机上的 MASQUERADE 为例：沙箱经 Host IP 10.13.0.5 向 8.8.8.8 发 DNS 查询。第一个包查 nat 表、改地址，内核把结果记成一条连接；后续的包和回包都直接按这条记录改，不再查规则。</text>
<rect x="48.0" y="176.0" width="400.0" height="92.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="248.0" y="213.5" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">第一个包（NEW）</text>
<text x="248.0" y="237.4" font-size="13" fill="#1D4F91" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">10.13.0.5:41234 → 8.8.8.8:53</text>
<rect x="1090.0" y="176.0" width="462.0" height="92.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1321.0" y="213.8" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">源改成 192.168.10.23，并写下记录</text>
<text x="1321.0" y="237.0" font-size="12.5" fill="#57606A" text-anchor="middle">查 nat 表，命中 MASQUERADE</text>
<rect x="48.0" y="290.0" width="400.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="248.0" y="327.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">同一连接的后续包</text>
<text x="248.0" y="351.5" font-size="13" fill="#1F2328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">10.13.0.5:41234 → 8.8.8.8:53</text>
<rect x="1090.0" y="290.0" width="462.0" height="92.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1321.0" y="327.8" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">按记录把源改成 192.168.10.23</text>
<text x="1321.0" y="351.0" font-size="12.5" fill="#57606A" text-anchor="middle">不查 nat 表</text>
<rect x="48.0" y="404.0" width="400.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="248.0" y="441.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">回包</text>
<text x="248.0" y="465.5" font-size="13" fill="#1F2328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">8.8.8.8:53 → 192.168.10.23:41234</text>
<rect x="1090.0" y="404.0" width="462.0" height="92.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1321.0" y="441.8" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">按记录把目的改回 10.13.0.5</text>
<text x="1321.0" y="465.0" font-size="12.5" fill="#57606A" text-anchor="middle">不查 nat 表；规则里也没写回包</text>
<rect x="520.0" y="176.0" width="480.0" height="320.0" rx="14" fill="#FCFBFA" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="540.0" y="206.0" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">宿主机的 conntrack 表（一条记录）</text>
<rect x="538.0" y="226.0" width="444.0" height="74.0" rx="8" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.1"/>
<text x="552.0" y="248.0" font-size="12.5" fill="#1D4F91" font-weight="600" text-anchor="start">原始方向</text>
<text x="552.0" y="272.0" font-size="13" fill="#1F2328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">src=10.13.0.5 dst=8.8.8.8</text>
<text x="552.0" y="290.0" font-size="13" fill="#1F2328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">sport=41234 dport=53</text>
<rect x="538.0" y="316.0" width="444.0" height="74.0" rx="8" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.1"/>
<text x="552.0" y="338.0" font-size="12.5" fill="#8A5300" font-weight="600" text-anchor="start">回复方向（预期的回包）</text>
<text x="552.0" y="362.0" font-size="13" fill="#1F2328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">src=8.8.8.8 dst=192.168.10.23</text>
<text x="552.0" y="380.0" font-size="13" fill="#1F2328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">sport=53 dport=41234</text>
<text x="540.0" y="426.0" font-size="13.5" fill="#57606A" text-anchor="start">状态：NEW → ESTABLISHED</text>
<text x="540.0" y="450.0" font-size="13.5" fill="#57606A" text-anchor="start">每个命名空间各有一张这样的表</text>
<path d="M452.0 222.0 L514.0 222.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="483.0" y="214.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">写入</text>
<path d="M1004.0 222.0 L1084.0 222.0" fill="none" stroke="#D9922B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
<path d="M452.0 336.0 L514.0 336.0" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<text x="483.0" y="328.0" font-size="12.5" fill="#57606A" font-weight="600" text-anchor="middle">查记录</text>
<path d="M1004.0 336.0 L1084.0 336.0" fill="none" stroke="#D9922B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
<path d="M452.0 450.0 L514.0 450.0" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<text x="483.0" y="442.0" font-size="12.5" fill="#57606A" font-weight="600" text-anchor="middle">查记录</text>
<path d="M1004.0 450.0 L1084.0 450.0" fill="none" stroke="#D9922B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
<rect x="48.0" y="532.0" width="1504.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1.3"/>
<text x="70.0" y="564.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">沙箱访问外网一次，两张表各留一条记录</text>
<text x="70.0" y="590.0" font-size="13.5" fill="#57606A" text-anchor="start">ns-5 的表：169.254.0.21 ⇄ 10.13.0.5（SNAT）。宿主机的表：10.13.0.5 ⇄ 192.168.10.23（MASQUERADE）。快照回滚时两张表里的旧记录都要清掉（第 20 篇）。</text>
<line x1="48.0" y1="648.0" x2="1552.0" y2="648.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="674.0" font-size="13" fill="#8C959F" text-anchor="start">注：conntrack 给每个包标一个状态：NEW、ESTABLISHED、RELATED、INVALID。防火墙常用的第一条规则就是放行 ESTABLISHED 和 RELATED。</text></svg>