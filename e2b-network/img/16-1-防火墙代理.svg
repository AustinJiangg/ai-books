<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="786" viewBox="0 0 1600 786" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="786" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">TCP 防火墙代理接到一个连接后：认人、查限额、问原址、读域名、判定、替它去连</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">沙箱发出的 TCP 连接通过 nftables 后，在宿主机按目的端口分三路 REDIRECT 到代理。代理按下面的顺序处理；拒绝时直接关闭沙箱这边的连接，所以沙箱看到的是“连上了又被关掉”，不是超时。</text>
<text x="48.0" y="152.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">按目的端口分三路</text>
<rect x="48.0" y="172.0" width="250.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="173.0" y="198.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">80 → 5016</text>
<text x="173.0" y="222.2" font-size="12.5" fill="#57606A" text-anchor="middle">读 HTTP Host 头</text>
<path d="M300.0 207.0 L348.0 207.0 L348.0 302.0 L388.0 302.0" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<rect x="48.0" y="258.0" width="250.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="173.0" y="284.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">443 → 5017</text>
<text x="173.0" y="308.2" font-size="12.5" fill="#57606A" text-anchor="middle">读 TLS SNI</text>
<path d="M300.0 293.0 L348.0 293.0 L348.0 302.0 L388.0 302.0" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<rect x="48.0" y="344.0" width="250.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="173.0" y="370.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">其他 → 5018</text>
<text x="173.0" y="394.2" font-size="12.5" fill="#57606A" text-anchor="middle">不读内容，只看 IP</text>
<path d="M300.0 379.0 L348.0 379.0 L348.0 302.0 L388.0 302.0" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<text x="48.0" y="452.0" font-size="12.5" fill="#57606A" text-anchor="start">分开端口，是为了不卡住 SSH</text>
<text x="48.0" y="472.0" font-size="12.5" fill="#57606A" text-anchor="start">这类服务器先说话的协议</text>
<rect x="392.0" y="172.0" width="468.0" height="62.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="410.0" y="194.8" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">① 这是哪个沙箱</text>
<text x="410.0" y="218.0" font-size="12.5" fill="#57606A" text-anchor="start">用源地址 Host IP（如 10.13.0.5）查运行中的沙箱；找不到就关闭</text>
<path d="M626.0 234.0 L626.0 244.0" fill="none" stroke="#1F2328" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="392.0" y="246.0" width="468.0" height="62.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="410.0" y="268.8" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">② 连接数限额</text>
<text x="410.0" y="292.0" font-size="12.5" fill="#57606A" text-anchor="start">每个沙箱的并发连接有上限，超了就关闭</text>
<path d="M626.0 308.0 L626.0 318.0" fill="none" stroke="#1F2328" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="392.0" y="320.0" width="468.0" height="62.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="410.0" y="342.8" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">③ 原本要去哪</text>
<text x="410.0" y="366.0" font-size="12.5" fill="#57606A" text-anchor="start">SO_ORIGINAL_DST 从 conntrack 取回，如 151.101.0.223:443</text>
<path d="M626.0 382.0 L626.0 392.0" fill="none" stroke="#1F2328" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="392.0" y="394.0" width="468.0" height="62.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="410.0" y="416.8" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">④ 读域名</text>
<text x="410.0" y="440.0" font-size="12.5" fill="#57606A" text-anchor="start">5016 读 Host，5017 读 SNI；只偷看不消费，之后原样转发</text>
<path d="M626.0 456.0 L626.0 466.0" fill="none" stroke="#1F2328" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="392.0" y="468.0" width="468.0" height="62.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="410.0" y="490.8" font-size="14.5" fill="#0E6B4F" font-weight="600" text-anchor="start">⑤ 判定</text>
<text x="410.0" y="514.0" font-size="12.5" fill="#57606A" text-anchor="start">isEgressAllowed，顺序见右边</text>
<text x="920.0" y="152.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">判定顺序（允许优先，默认放行）</text>
<rect x="920.0" y="172.0" width="632.0" height="52.0" rx="8" fill="#F7F8FA" stroke="none" stroke-width="0"/>
<circle cx="942.0" cy="198.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="942.0" y="202.3" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="964.0" y="203.0" font-size="14" fill="#1F2328" text-anchor="start">沙箱没有任何网络配置</text>
<text x="1536.0" y="203.0" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="end">放行</text>
<rect x="920.0" y="236.0" width="632.0" height="52.0" rx="8" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<circle cx="942.0" cy="262.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="942.0" y="266.3" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="964.0" y="267.0" font-size="14" fill="#1F2328" text-anchor="start">有域名，且匹配 AllowedDomains</text>
<text x="1536.0" y="267.0" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="end">放行（按域名）</text>
<rect x="920.0" y="300.0" width="632.0" height="52.0" rx="8" fill="#F7F8FA" stroke="none" stroke-width="0"/>
<circle cx="942.0" cy="326.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="942.0" y="330.3" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<text x="964.0" y="331.0" font-size="14" fill="#1F2328" text-anchor="start">目的 IP 在 AllowedCidrs</text>
<text x="1536.0" y="331.0" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="end">放行（按 IP）</text>
<rect x="920.0" y="364.0" width="632.0" height="52.0" rx="8" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<circle cx="942.0" cy="390.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="942.0" y="394.3" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<text x="964.0" y="395.0" font-size="14" fill="#1F2328" text-anchor="start">目的 IP 在 DeniedCidrs</text>
<text x="1536.0" y="395.0" font-size="14" fill="#9A3215" font-weight="600" text-anchor="end">拒绝</text>
<rect x="920.0" y="428.0" width="632.0" height="52.0" rx="8" fill="#F7F8FA" stroke="none" stroke-width="0"/>
<circle cx="942.0" cy="454.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="942.0" y="458.3" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<text x="964.0" y="459.0" font-size="14" fill="#1F2328" text-anchor="start">以上都不是</text>
<text x="1536.0" y="459.0" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="end">放行</text>
<text x="920.0" y="496.0" font-size="12.5" fill="#57606A" text-anchor="start">域名匹配：pypi.org 不含 www.pypi.org；*.example.com 不含 example.com 本身</text>
<text x="48.0" y="572.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">⑥ 放行后，代理以宿主机身份新开一条连接，然后双向搬运数据</text>
<rect x="48.0" y="590.0" width="732.0" height="96.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="68.0" y="620.0" font-size="15.5" fill="#0E6B4F" font-weight="600" text-anchor="start">按域名放行</text>
<text x="68.0" y="643.9" font-size="13" fill="#57606A" text-anchor="start">不用沙箱给的 IP：在宿主机上重新解析域名，解析结果在预置拦截段里就拒绝（连 SYN 都不发），否则连解析出的</text>
<text x="68.0" y="663.4" font-size="13" fill="#57606A" text-anchor="start">地址</text>
<rect x="820.0" y="590.0" width="732.0" height="96.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="840.0" y="629.7" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="start">按 IP 放行，或默认放行</text>
<text x="840.0" y="653.6" font-size="13" fill="#57606A" text-anchor="start">连 SO_ORIGINAL_DST 拿到的那个 IP 和端口，也就是沙箱原本想去的地方</text>
<line x1="48.0" y1="720.0" x2="1552.0" y2="720.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="746.0" font-size="13" fill="#8C959F" text-anchor="start">注：所有沙箱的所有出站 TCP 都经过这个代理，它运行在 orchestrator 进程里；orchestrator 挂了，REDIRECT 规则还在但 5016～5018 没人监听，沙箱的出站 TCP 全部失败。</text></svg>