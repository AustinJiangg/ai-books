<line x1="48.0" y1="464.0" x2="1552.0" y2="464.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="490.0" font-size="13" fill="#8C959F" text-anchor="start">注：去 pypi.org 的 TCP 包在 e2bv-5 上还能看到，但不会出现在物理网卡上：它被 REDIRECT 给了防火墙代理，物理网卡上看到的是代理另开的那条连接（第 13、16 篇）。</text></svg>