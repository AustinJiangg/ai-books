<text x="48.0" y="634.0" font-size="13" fill="#8C959F" text-anchor="start">注：电脑和解析器之间默认用 UDP 53，回答太长时改用 TCP 53。下次有人再问 pypi.org，解析器在 TTL 到期前直接从缓存回答，不再跑第 2～7 步。</text></svg>