<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="674" viewBox="0 0 1600 674" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="674" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">一次域名解析：递归解析器替你一层层问下去</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">电脑只问一个递归解析器（例如 8.8.8.8），由它依次去问根服务器、.org 服务器、pypi.org 的权威服务器，拿到答案后回给电脑并缓存起来。查询走 UDP 53 端口。</text>
<rect x="1220.0" y="176.0" width="332.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1386.0" y="213.7" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="middle">根服务器</text>
<text x="1386.0" y="237.6" font-size="13" fill="#57606A" text-anchor="middle">知道每个顶级域归谁管</text>
<rect x="1220.0" y="326.0" width="332.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1386.0" y="363.7" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="middle">.org 服务器</text>
<text x="1386.0" y="387.6" font-size="13" fill="#57606A" text-anchor="middle">知道 pypi.org 归谁管</text>
<rect x="1220.0" y="476.0" width="332.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1386.0" y="513.7" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="middle">pypi.org 的权威服务器</text>
<text x="1386.0" y="537.6" font-size="13" fill="#57606A" text-anchor="middle">真正知道 IP</text>
<rect x="560.0" y="176.0" width="300.0" height="392.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="710.0" y="216.0" font-size="17" fill="#1D4F91" font-weight="600" text-anchor="middle">递归解析器</text>
<text x="710.0" y="240.0" font-size="13.5" fill="#1D4F91" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">例如 8.8.8.8</text>
<rect x="590.0" y="458.0" width="240.0" height="82.0" rx="8" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1" stroke-dasharray="4 3"/>
<text x="710.0" y="486.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">缓存</text>
<text x="710.0" y="508.0" font-size="12.5" fill="#1F2328" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">pypi.org → 151.101.0.223</text>
<text x="710.0" y="528.0" font-size="12.5" fill="#57606A" text-anchor="middle">TTL 到期前直接回答</text>
<rect x="48.0" y="322.0" width="242.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="169.0" y="354.0" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="middle">你的电脑</text>
<text x="169.0" y="377.9" font-size="13" fill="#57606A" text-anchor="middle">读 /etc/resolv.conf</text>
<text x="169.0" y="397.4" font-size="13" fill="#57606A" text-anchor="middle">知道该问 8.8.8.8</text>
