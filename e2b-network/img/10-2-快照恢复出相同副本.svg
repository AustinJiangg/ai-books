<text x="70.0" y="698.0" font-size="14" text-anchor="start" xml:space="preserve"><tspan fill="#9A3215" font-weight="700">后果：</tspan><tspan fill="#57606A">一台宿主机上，所有沙箱的网络身份完全相同；而且所有模板用的是同一组常量，换个模板也一样。客户机不知道自己是第几个副本。</tspan></text>
<line x1="48.0" y1="760.0" x2="1552.0" y2="760.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="786.0" font-size="13" fill="#8C959F" text-anchor="start">注：网卡配置真正读进客户机，只发生在构建模板时那一次开机；恢复沙箱不会重新开机，也不会重新配置（第 9 篇）。</text></svg>