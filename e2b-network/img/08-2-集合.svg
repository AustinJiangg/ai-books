<rect x="1298.0" y="404.0" width="190.0" height="34.0" rx="17" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1"/>
<text x="1393.0" y="426.0" font-size="13" fill="#1D4F91" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">169.254.0.0/16</text>
<rect x="878.0" y="450.0" width="190.0" height="34.0" rx="17" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1"/>
<text x="973.0" y="472.0" font-size="13" fill="#1D4F91" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">172.16.0.0/12</text>
<rect x="1088.0" y="450.0" width="190.0" height="34.0" rx="17" fill="#FDF0D9" stroke="#D9922B" stroke-width="1"/>
<text x="1183.0" y="472.0" font-size="13" fill="#8A5300" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">192.168.0.0/16</text>
<line x1="1186.0" y1="334.0" x2="1186.0" y2="354.0" stroke="#D9922B" stroke-width="1.4" stroke-linecap="round" marker-end="url(#mD9922B)"/>
<text x="844.0" y="572.0" font-size="13.5" fill="#57606A" text-anchor="start">查一次集合就知道。用户的 allowOut/denyOut 只往用户集合里填元素。</text>
<rect x="48.0" y="632.0" width="1504.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#1F9E77" stroke-width="1.3"/>
<text x="70.0" y="664.0" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="start">原子提交：没有“改了一半”的窗口</text>
<text x="70.0" y="690.0" font-size="13.5" fill="#57606A" text-anchor="start">E2B 先在内存里攒好建表、建链、建集合、加规则、填元素这一批操作，最后调用一次 Flush 提交；内核要么全部生效，要么全部不生效。</text>
<line x1="48.0" y1="748.0" x2="1552.0" y2="748.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="774.0" font-size="13" fill="#8C959F" text-anchor="start">注：图中的集合是“预置拦截”集合，内容固定；另有预置放行和两个用户集合，第 15 篇逐条讲。</text></svg>