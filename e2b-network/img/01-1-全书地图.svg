<text x="48.0" y="1046.0" font-size="13" fill="#8C959F" text-anchor="start">注：沙箱里看到的永远是 169.254.0.21；宿主机只认 Host IP 10.13.0.5。两者在 ns-5 的 NAT 处互换（第 10 篇）。TCP 出站全部经过防火墙代理，代理另开连接从物理网卡出去。SDK 的控制请求直连 api:3000，沙箱请求走 80 → client-proxy；本机</text>
<text x="48.0" y="1066.0" font-size="13" fill="#8C959F" text-anchor="start">SDK 即使访问 192.168.10.23，包也只在 lo 上转一圈，不经物理网卡。</text></svg>