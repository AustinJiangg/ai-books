<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="896" viewBox="0 0 1600 896" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="896" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">全书地图：一个沙箱的网络，和进出它的四类流量</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">以单机部署、槽位 5 为例。每个部件下方的灰色标签是详细讲它的篇目；带圈数字是四类流量：① 出站（沙箱访问外部） ② 入站（SDK、浏览器访问沙箱） ③ 控制（orchestrator 直接调用 envd） ④ 内部服务（沙箱访问</text>
<text x="48.0" y="116.0" font-size="15" fill="#57606A" text-anchor="start">宿主机上的服务）。</text>
