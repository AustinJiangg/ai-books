<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="774" viewBox="0 0 1600 774" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m5B9BE6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#5B9BE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="774" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">分层排障：从外到内一层层排除</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">把这套网络分成七层。入站问题（SDK、浏览器访问不了沙箱）从第 1 层往下查到第 6 层；出站问题（沙箱访问不了外部）从第 6 层查到第 7 层。右边是每层最先看的命令。</text>
<rect x="220.0" y="152.0" width="1332.0" height="66.0" rx="10" fill="#F7F8FA" stroke="none" stroke-width="0"/>
<circle cx="246.0" cy="185.0" r="14" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="246.0" y="189.9" font-size="13.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="272.0" y="180.0" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="start">DNS</text>
<text x="272.0" y="202.0" font-size="12" fill="#8C959F" text-anchor="start">第 17 篇</text>
<text x="390.0" y="180.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">宿主机能否把域名解析对？</text>
