<text x="246.0" y="417.9" font-size="13.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<text x="272.0" y="408.0" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="start">槽位</text>
