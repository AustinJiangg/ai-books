<text x="246.0" y="645.9" font-size="13.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">7</text>
<text x="272.0" y="636.0" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="start">出站</text>
