<rect x="220.0" y="304.0" width="1332.0" height="66.0" rx="10" fill="#F7F8FA" stroke="none" stroke-width="0"/>
<circle cx="246.0" cy="337.0" r="14" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="246.0" y="341.9" font-size="13.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<text x="272.0" y="332.0" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="start">代理</text>
<text x="272.0" y="354.0" font-size="12" fill="#8C959F" text-anchor="start">第 18 篇</text>
<text x="390.0" y="332.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">client-proxy、orchestrator 代理正常？目录里有这个沙箱？</text>
