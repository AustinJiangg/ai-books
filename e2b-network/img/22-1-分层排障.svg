<text x="272.0" y="484.0" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="start">命名空间</text>
<text x="272.0" y="506.0" font-size="12" fill="#8C959F" text-anchor="start">第 15 篇</text>
<text x="390.0" y="484.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">NAT、nftables 正确？</text>
<text x="390.0" y="506.0" font-size="12.5" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">ip netns exec ns-5 iptables -t nat -S　·　ip netns exec ns-5 nft list ruleset</text>
<rect x="220.0" y="532.0" width="1332.0" height="66.0" rx="10" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<circle cx="246.0" cy="565.0" r="14" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="246.0" y="569.9" font-size="13.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">6</text>
<text x="272.0" y="560.0" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="start">客户机</text>
<text x="272.0" y="582.0" font-size="12" fill="#8C959F" text-anchor="start">第 14 篇</text>
<text x="390.0" y="560.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">服务在监听吗？DNS 配置对吗？</text>
