<text x="138.0" y="218.5" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">后台补货协程</text>
<text x="138.0" y="241.8" font-size="12.5" fill="#57606A" text-anchor="middle">循环建槽位，放进新建队</text>
<text x="138.0" y="260.5" font-size="12.5" fill="#57606A" text-anchor="middle">列；满了就等</text>
