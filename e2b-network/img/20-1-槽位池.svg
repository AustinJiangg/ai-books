<text x="960.0" y="528.0" font-size="13" fill="#0E6B4F" font-weight="600" text-anchor="middle">放回复用队列</text>
<rect x="1180.0" y="516.0" width="372.0" height="70.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1366.0" y="542.9" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">拆掉：RemoveNetwork</text>
<text x="1366.0" y="566.2" font-size="12.5" fill="#57606A" text-anchor="middle">复用队列已满，或清理失败</text>
<path d="M1366.0 468.0 L1366.0 512.0" fill="none" stroke="#D6603D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD6603D)"/>
<rect x="48.0" y="616.0" width="1504.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1.3"/>
<text x="70.0" y="648.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">复用时原样保留的</text>
<text x="70.0" y="674.0" font-size="13.5" fill="#57606A" text-anchor="start">命名空间、网卡、地址、路由、NAT 和 REDIRECT 规则都只和槽位编号有关，不用复位。conntrack 记录不主动清，等它们自己超时；这段“槽位换了主人、内核记录还在”的窗口，也是连接池要按生命周期 ID 分组的原因之一。</text>
<line x1="48.0" y1="732.0" x2="1552.0" y2="732.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="758.0" font-size="13" fill="#8C959F" text-anchor="start">注：orchestrator 正常退出时会把两条队列里的空闲槽位逐个拆掉；被强杀时它们就成了残骸（第 12、21 篇）。</text></svg>