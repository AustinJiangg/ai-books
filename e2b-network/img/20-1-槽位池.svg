<text x="1366.0" y="426.3" font-size="12.5" fill="#57606A" text-anchor="middle">ResetInternet：清空两个用户集合，重填预置集合</text>
<path d="M1366.0 288.0 L1366.0 352.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
