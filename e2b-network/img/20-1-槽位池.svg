<text x="850.0" y="286.0" font-size="12.5" fill="#1D4F91" font-weight="600" text-anchor="start">空时</text>
<rect x="1180.0" y="176.0" width="372.0" height="110.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
