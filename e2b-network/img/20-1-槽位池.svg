<text x="263.0" y="226.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">放入</text>
<rect x="880.0" y="281.0" width="220.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="990.0" y="323.7" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="middle">取一个槽位</text>
<text x="990.0" y="347.0" font-size="12.5" fill="#57606A" text-anchor="middle">先看复用队列；没有再从新建队列</text>
<text x="990.0" y="365.7" font-size="12.5" fill="#57606A" text-anchor="middle">拿（必要时等）</text>
<path d="M804.0 446.0 L840.0 446.0 L840.0 366.0 L876.0 366.0" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<text x="850.0" y="418.0" font-size="13" fill="#0E6B4F" font-weight="600" text-anchor="start">优先</text>
<path d="M804.0 236.0 L840.0 236.0 L840.0 316.0 L876.0 316.0" fill="none" stroke="#5B9BE6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m5B9BE6)"/>
