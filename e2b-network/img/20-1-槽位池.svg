<text x="1366.0" y="237.0" font-size="12.5" fill="#57606A" text-anchor="middle">ConfigureInternet 装载用户的出站规则；Firecracker</text>
<text x="1366.0" y="255.7" font-size="12.5" fill="#57606A" text-anchor="middle">在这个命名空间里运行</text>
<path d="M1104.0 341.0 L1140.0 341.0 L1140.0 231.0 L1176.0 231.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
