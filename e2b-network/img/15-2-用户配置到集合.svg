<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m5B9BE6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#5B9BE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD6603D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#D6603D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="790" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">用户的出站配置怎么变成集合里的元素</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">创建沙箱时的三个参数，先在 api 里校验、拆分、补 DNS，再交给 orchestrator 变成三个列表。IP 和网段装进 nftables 的用户集合，域名只留给 TCP 防火墙代理。规则在沙箱拿到槽位时设置一次，归还时清空。</text>
<text x="48.0" y="152.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">用户参数</text>
<text x="400.0" y="152.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">api：校验与转换</text>
<text x="860.0" y="152.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">交给 orchestrator 的三个列表</text>
<text x="1250.0" y="152.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">最后装到哪</text>
<rect x="48.0" y="174.0" width="252.0" height="88.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="174.0" y="209.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">allow_internet_access</text>
<text x="174.0" y="232.9" font-size="12.5" fill="#57606A" text-anchor="middle">true / false</text>
<rect x="48.0" y="286.0" width="252.0" height="88.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="174.0" y="312.2" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">network.allowOut</text>
<text x="174.0" y="335.5" font-size="12.5" fill="#57606A" text-anchor="middle">IP、CIDR、域名（可用</text>
<text x="174.0" y="354.2" font-size="12.5" fill="#57606A" text-anchor="middle">*.example.com）</text>
<rect x="48.0" y="398.0" width="252.0" height="88.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="174.0" y="433.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">network.denyOut</text>
<text x="174.0" y="456.9" font-size="12.5" fill="#57606A" text-anchor="middle">只能是 IP 或 CIDR</text>
<rect x="400.0" y="174.0" width="360.0" height="70.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="418.0" y="191.2" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">校验</text>
<text x="418.0" y="214.5" font-size="12.5" fill="#57606A" text-anchor="start">denyOut 只能是 IP/CIDR；allowOut 有域名时，</text>
<text x="418.0" y="233.2" font-size="12.5" fill="#57606A" text-anchor="start">denyOut 必须含 0.0.0.0/0</text>
<rect x="400.0" y="258.0" width="360.0" height="70.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="418.0" y="284.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">拆分</text>
<text x="418.0" y="307.9" font-size="12.5" fill="#57606A" text-anchor="start">allowOut 拆成 IP/CIDR 和域名两部分</text>
<rect x="400.0" y="342.0" width="360.0" height="70.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="418.0" y="368.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">补 DNS</text>
<text x="418.0" y="391.9" font-size="12.5" fill="#57606A" text-anchor="start">有域名就把 8.8.8.8 加进放行的 IP</text>
<rect x="400.0" y="426.0" width="360.0" height="70.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="418.0" y="443.2" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">断网</text>
<text x="418.0" y="466.5" font-size="12.5" fill="#57606A" text-anchor="start">allow_internet_access=false：拦截列表整个换成</text>
<text x="418.0" y="485.2" font-size="12.5" fill="#57606A" text-anchor="start">0.0.0.0/0</text>
<path d="M302.0 218.0 L396.0 218.0" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<path d="M302.0 330.0 L396.0 330.0" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<path d="M302.0 442.0 L396.0 442.0" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<rect x="860.0" y="174.0" width="290.0" height="88.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1005.0" y="209.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">AllowedCidrs</text>
<text x="1005.0" y="233.2" font-size="12.5" fill="#57606A" text-anchor="middle">allowOut 的 IP/CIDR（+ 8.8.8.8）</text>
<path d="M764.0 324.0 L812.0 324.0 L812.0 218.0 L856.0 218.0" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<rect x="860.0" y="286.0" width="290.0" height="88.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1005.0" y="321.9" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">AllowedDomains</text>
<text x="1005.0" y="345.2" font-size="12.5" fill="#57606A" text-anchor="middle">allowOut 的域名</text>
<path d="M764.0 324.0 L812.0 324.0 L812.0 330.0 L856.0 330.0" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<rect x="860.0" y="398.0" width="290.0" height="88.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1005.0" y="433.9" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">DeniedCidrs</text>
<text x="1005.0" y="457.2" font-size="12.5" fill="#57606A" text-anchor="middle">denyOut，或 0.0.0.0/0</text>
<path d="M764.0 324.0 L812.0 324.0 L812.0 442.0 L856.0 442.0" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<text x="860.0" y="518.0" font-size="12.5" fill="#57606A" text-anchor="start">请求里没带 allow_internet_access 时，</text>
<text x="860.0" y="538.0" font-size="12.5" fill="#57606A" text-anchor="start">用节点开关 ALLOW_SANDBOX_INTERNET</text>
<rect x="1250.0" y="174.0" width="302.0" height="88.0" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1401.0" y="209.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">nftables 用户放行集合</text>
<text x="1401.0" y="233.2" font-size="12.5" fill="#57606A" text-anchor="middle">filtered_allowlist：管非 TCP</text>
<path d="M1154.0 218.0 L1180.0 218.0 L1180.0 208.0 L1246.0 208.0" fill="none" stroke="#5B9BE6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m5B9BE6)"/>
<rect x="1250.0" y="286.0" width="302.0" height="88.0" rx="10" fill="#FFFFFF" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1401.0" y="321.9" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">TCP 防火墙代理</text>
<text x="1401.0" y="345.2" font-size="12.5" fill="#57606A" text-anchor="middle">按域名 + IP 判定 TCP（第 16 篇）</text>
<path d="M1154.0 218.0 L1180.0 218.0 L1180.0 320.0 L1246.0 320.0" fill="none" stroke="#5B9BE6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m5B9BE6)"/>
<path d="M1154.0 330.0 L1200.0 330.0 L1200.0 330.0 L1246.0 330.0" fill="none" stroke="#1F9E77" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<path d="M1154.0 442.0 L1220.0 442.0 L1220.0 340.0 L1246.0 340.0" fill="none" stroke="#D6603D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD6603D)"/>
<rect x="1250.0" y="398.0" width="302.0" height="88.0" rx="10" fill="#FFFFFF" stroke="#D6603D" stroke-width="1.3"/>
<text x="1401.0" y="433.9" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">nftables 用户拦截集合</text>
<text x="1401.0" y="457.2" font-size="12.5" fill="#57606A" text-anchor="middle">filtered_denylist：管非 TCP</text>
<path d="M1154.0 442.0 L1220.0 442.0 L1220.0 452.0 L1246.0 452.0" fill="none" stroke="#D6603D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD6603D)"/>
<text x="48.0" y="580.0" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start">这些规则的一生</text>
<rect x="48.0" y="598.0" width="474.7" height="92.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="66.0" y="626.6" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="start">取槽位时</text>
<text x="66.0" y="649.8" font-size="12.5" fill="#57606A" text-anchor="start">ConfigureInternet：三个列表都空就什么也不做；否则进命名空间往集合里</text>
<text x="66.0" y="668.6" font-size="12.5" fill="#57606A" text-anchor="start">加元素</text>
<path d="M526.7 644.0 L558.7 644.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="562.7" y="598.0" width="474.7" height="92.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="580.7" y="635.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">运行中</text>
<text x="580.7" y="659.2" font-size="12.5" fill="#57606A" text-anchor="start">没有接口可以修改；要换规则只能暂停再恢复，或重建沙箱</text>
<path d="M1041.3 644.0 L1073.3 644.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1077.3" y="598.0" width="474.7" height="92.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1095.3" y="626.6" font-size="15" fill="#8A5300" font-weight="600" text-anchor="start">归还槽位时</text>
<text x="1095.3" y="649.8" font-size="12.5" fill="#57606A" text-anchor="start">ResetInternet：清空两个用户集合，重填两个预置集合，防止规则留给下一</text>
<text x="1095.3" y="668.6" font-size="12.5" fill="#57606A" text-anchor="start">个沙箱</text>
<line x1="48.0" y1="724.0" x2="1552.0" y2="724.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="750.0" font-size="13" fill="#8C959F" text-anchor="start">注：0.0.0.0/0 在 Go 的地址库里不算合法网段，代码直接往集合里写入 0.0.0.0～255.255.255.255 这个区间。</text></svg>