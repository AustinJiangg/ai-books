<text x="1242.0" y="222.0" font-size="18" fill="#8C959F" text-anchor="start">…</text>
<text x="58.0" y="304.0" font-size="15" text-anchor="start" xml:space="preserve"><tspan fill="#57606A">第 5 块的起点 = 10.14.0.0 + 5 × 2 = </tspan><tspan fill="#8A5300" font-weight="700">10.14.0.10</tspan><tspan fill="#57606A">（宿主机侧 e2bv-5），下一个 </tspan><tspan fill="#8A5300" font-weight="700">10.14.0.11</tspan><tspan fill="#57606A">（命名空间侧 vpeer）</tspan></text>
<text x="48.0" y="368.0" font-size="17" fill="#1F2328" font-weight="600" text-anchor="start">Host 池 10.13.0.0/16，每个槽位一个地址</text>
