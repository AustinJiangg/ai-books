<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="738" viewBox="0 0 1600 738" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="738" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">从地址池算出第 N 个地址：起点当整数，加上偏移</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">槽位编号 N 决定它的两段地址：VRT 池切成一块块 /31，第 N 块从第 2N 个地址开始；Host 池直接取第 N 个地址。以 N = 5 为例。</text>
