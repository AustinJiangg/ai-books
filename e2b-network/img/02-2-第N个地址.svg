<rect x="48.0" y="564.0" width="1504.0" height="74.0" rx="10" fill="#F7F8FA" stroke="#D8DEE4" stroke-width="1.3"/>
<text x="70.0" y="594.0" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">数字大了会进位，和十进制一样，只是每段满 256 进 1</text>
<text x="70.0" y="620.0" font-size="14" text-anchor="start" xml:space="preserve"><tspan fill="#57606A">槽位 300：Host IP = 10.13.0.0 + 300，300 = 1 × 256 + 44 → </tspan><tspan fill="#8A5300" font-weight="700">10.13.1.44</tspan><tspan fill="#57606A">；veth = 10.14.0.0 + 600，600 = 2 × 256 + 88 → </tspan><tspan fill="#8A5300" font-weight="700">10.14.2.88</tspan><tspan fill="#57606A"> / </tspan><tspan fill="#8A5300" font-weight="700">10.14.2.89</tspan></text>
