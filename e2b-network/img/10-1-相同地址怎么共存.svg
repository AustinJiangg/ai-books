<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="792" viewBox="0 0 1600 792" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="792" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">每个沙箱都是 169.254.0.21，靠什么不冲突</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">所有沙箱从同一张快照恢复，客户机的网卡配置完全相同。E2B 不去改客户机，而是改客户机外面：给每个沙箱一个网络命名空间，在命名空间的出口把地址换成各自的 Host IP。</text>
