<text x="624.0" y="580.0" font-size="14.5" text-anchor="start" xml:space="preserve"><tspan fill="#0E6B4F" font-weight="600">命名空间里：</tspan><tspan fill="#57606A">只有一个 169.254.0.21、一个 169.254.0.22，不冲突</tspan></text>
<circle cx="610.0" cy="609.0" r="4" fill="#1F9E77" stroke="none" stroke-width="1"/>
<text x="624.0" y="614.0" font-size="14.5" text-anchor="start" xml:space="preserve"><tspan fill="#0E6B4F" font-weight="600">出口：</tspan><tspan fill="#57606A">出去的包源地址换成 Host IP（SNAT），进来的包目的地址换回 .21（DNAT）</tspan></text>
<circle cx="610.0" cy="643.0" r="4" fill="#1F9E77" stroke="none" stroke-width="1"/>
<text x="624.0" y="648.0" font-size="14.5" text-anchor="start" xml:space="preserve"><tspan fill="#0E6B4F" font-weight="600">回包：</tspan><tspan fill="#57606A">宿主机按各不相同的 Host IP，把回包送回对应的命名空间</tspan></text>
<line x1="48.0" y1="726.0" x2="1552.0" y2="726.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="752.0" font-size="13" fill="#8C959F" text-anchor="start">注：Host IP 来自地址池 10.13.0.0/16，第 N 号槽位用第 N 个地址（第 11 篇）。命名空间和 NAT 规则在沙箱恢复之前就建好，不拖慢恢复（第 20 篇）。</text></svg>