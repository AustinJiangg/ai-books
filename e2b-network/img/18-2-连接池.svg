<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="668" viewBox="0 0 1600 668" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="668" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">连接池为什么按生命周期 ID 分组：Host IP 会换主人</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">槽位 5 先给沙箱 A 用，A 结束后给了沙箱 B，Host IP 都是 10.13.0.5。连接池如果按目标地址分组，发给 B 的请求可能拿到当初连 A 的旧连接。</text>
<text x="48.0" y="186.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">槽位 5</text>
<text x="48.0" y="206.0" font-size="12.5" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">Host IP 10.13.0.5</text>
<rect x="300.0" y="170.0" width="596.0" height="40.0" rx="8" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.2"/>
<text x="598.0" y="196.0" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="middle">沙箱 A（LifecycleID = a1）</text>
<rect x="956.0" y="170.0" width="596.0" height="40.0" rx="8" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.2"/>
<text x="1254.0" y="196.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">沙箱 B（LifecycleID = b7）</text>
<line x1="926.0" y1="160.0" x2="926.0" y2="556.0" stroke="#8C959F" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="926.0" y="576.0" font-size="13" fill="#8C959F" text-anchor="middle">A 结束，槽位 5 归还后分给 B</text>
<text x="48.0" y="286.0" font-size="15" fill="#9A3215" font-weight="600" text-anchor="start">按目标地址分组</text>
<text x="48.0" y="308.0" font-size="12.5" fill="#57606A" text-anchor="start">键：10.13.0.5:49983</text>
<rect x="300.0" y="246.0" width="596.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="598.0" y="285.8" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">建连接 c1，用完放回池子</text>
<text x="598.0" y="309.0" font-size="12.5" fill="#57606A" text-anchor="middle">键 10.13.0.5:49983</text>
<rect x="956.0" y="246.0" width="596.0" height="96.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1254.0" y="285.8" font-size="14.5" fill="#9A3215" font-weight="600" text-anchor="middle">从池子里取到 c1</text>
<text x="1254.0" y="309.0" font-size="12.5" fill="#57606A" text-anchor="middle">两端状态对不上：请求失败，甚至被错误的对象处理</text>
<text x="48.0" y="422.0" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="start">按生命周期 ID 分组（E2B）</text>
<text x="48.0" y="444.0" font-size="12.5" fill="#57606A" text-anchor="start">键：沙箱实例的 LifecycleID</text>
<rect x="300.0" y="382.0" width="596.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="598.0" y="421.8" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">建连接 c1，键 a1</text>
<text x="598.0" y="445.0" font-size="12.5" fill="#57606A" text-anchor="middle">只给沙箱 A 用</text>
<rect x="956.0" y="382.0" width="596.0" height="96.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1254.0" y="421.8" font-size="14.5" fill="#0E6B4F" font-weight="600" text-anchor="middle">键 b7 下没有连接，新建 c2</text>
<text x="1254.0" y="445.0" font-size="12.5" fill="#57606A" text-anchor="middle">A 的连接绝不会被 B 拿到</text>
<line x1="48.0" y1="602.0" x2="1552.0" y2="602.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="628.0" font-size="13" fill="#8C959F" text-anchor="start">注：也不用沙箱 ID 分组：沙箱暂停再恢复后 ID 不变，但已是新实例，可能落在别的槽位。此外 orchestrator 代理到沙箱的连接关闭了 keep-alive：沙箱里的服务随时可能重启，同机新建连接的开销又很小。</text></svg>