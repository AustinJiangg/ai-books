<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="726" viewBox="0 0 1600 726" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="726" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">三块积木：网络命名空间、veth 对、tap 设备</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">E2B 每个沙箱的网络都由这三样搭成：命名空间隔出一整套独立的网络栈；veth 对把两个命名空间连起来；tap 让 Firecracker 这个普通程序能收发以太网帧。</text>
<rect x="48.0" y="156.0" width="482.7" height="470.0" rx="16" fill="#FCFBFA" stroke="#D8DEE4" stroke-width="1"/>
<text x="70.0" y="192.0" font-size="18" fill="#1F2328" font-weight="600" text-anchor="start">网络命名空间</text>
<text x="70.0" y="216.0" font-size="13.5" fill="#57606A" text-anchor="start">一整套独立的网络栈</text>
<rect x="558.7" y="156.0" width="482.7" height="470.0" rx="16" fill="#FCFBFA" stroke="#D8DEE4" stroke-width="1"/>
<text x="580.7" y="192.0" font-size="18" fill="#1F2328" font-weight="600" text-anchor="start">veth 对</text>
<text x="580.7" y="216.0" font-size="13.5" fill="#57606A" text-anchor="start">一根两头的虚拟网线</text>
<rect x="1069.3" y="156.0" width="482.7" height="470.0" rx="16" fill="#FCFBFA" stroke="#D8DEE4" stroke-width="1"/>
<text x="1091.3" y="192.0" font-size="18" fill="#1F2328" font-weight="600" text-anchor="start">tap 设备</text>
<text x="1091.3" y="216.0" font-size="13.5" fill="#57606A" text-anchor="start">一头是网卡，一头是程序</text>
<rect x="70.0" y="240.0" width="211.3" height="300.0" rx="12" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="175.7" y="266.0" font-size="13.5" fill="#3D3C38" font-weight="600" text-anchor="middle">宿主机（初始命名空间）</text>
<rect x="80.0" y="282.0" width="191.3" height="33.0" rx="6" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="0.8"/>
<text x="175.7" y="304.0" font-size="12" fill="#1F2328" text-anchor="middle">网卡（至少一个 lo）</text>
<rect x="80.0" y="323.0" width="191.3" height="33.0" rx="6" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="0.8"/>
<text x="175.7" y="345.0" font-size="12" fill="#1F2328" text-anchor="middle">路由表</text>
<rect x="80.0" y="364.0" width="191.3" height="33.0" rx="6" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="0.8"/>
<text x="175.7" y="386.0" font-size="12" fill="#1F2328" text-anchor="middle">iptables / nftables 规则</text>
<rect x="80.0" y="405.0" width="191.3" height="33.0" rx="6" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="0.8"/>
<text x="175.7" y="427.0" font-size="12" fill="#1F2328" text-anchor="middle">conntrack 表</text>
<rect x="80.0" y="446.0" width="191.3" height="33.0" rx="6" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="0.8"/>
<text x="175.7" y="468.0" font-size="12" fill="#1F2328" text-anchor="middle">ip_forward 等参数</text>
<rect x="80.0" y="487.0" width="191.3" height="33.0" rx="6" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="0.8"/>
<text x="175.7" y="509.0" font-size="12" fill="#1F2328" text-anchor="middle">端口</text>
<rect x="297.3" y="240.0" width="211.3" height="300.0" rx="12" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="403.0" y="266.0" font-size="13.5" fill="#1D4F91" font-weight="600" text-anchor="middle">ns-5</text>
<rect x="307.3" y="282.0" width="191.3" height="33.0" rx="6" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="0.8"/>
<text x="403.0" y="304.0" font-size="12" fill="#1F2328" text-anchor="middle">网卡（至少一个 lo）</text>
<rect x="307.3" y="323.0" width="191.3" height="33.0" rx="6" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="0.8"/>
<text x="403.0" y="345.0" font-size="12" fill="#1F2328" text-anchor="middle">路由表</text>
<rect x="307.3" y="364.0" width="191.3" height="33.0" rx="6" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="0.8"/>
<text x="403.0" y="386.0" font-size="12" fill="#1F2328" text-anchor="middle">iptables / nftables 规则</text>
<rect x="307.3" y="405.0" width="191.3" height="33.0" rx="6" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="0.8"/>
<text x="403.0" y="427.0" font-size="12" fill="#1F2328" text-anchor="middle">conntrack 表</text>
<rect x="307.3" y="446.0" width="191.3" height="33.0" rx="6" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="0.8"/>
<text x="403.0" y="468.0" font-size="12" fill="#1F2328" text-anchor="middle">ip_forward 等参数</text>
<rect x="307.3" y="487.0" width="191.3" height="33.0" rx="6" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="0.8"/>
<text x="403.0" y="509.0" font-size="12" fill="#1F2328" text-anchor="middle">端口</text>
<text x="70.0" y="570.0" font-size="13.5" fill="#57606A" text-anchor="start">各有一份，互相看不见。一块网卡同一时间只属于一个命名空间。</text>
<rect x="580.7" y="246.0" width="438.7" height="110.0" rx="12" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="596.7" y="270.0" font-size="13.5" fill="#3D3C38" font-weight="600" text-anchor="start">宿主机</text>
<rect x="705.0" y="291.0" width="190.0" height="50.0" rx="9" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="800.0" y="312.0" font-size="14" fill="#3D3C38" font-weight="600" text-anchor="middle">e2bv-5</text>
<text x="800.0" y="330.5" font-size="12.5" fill="#3D3C38" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">10.14.0.10/31</text>
<rect x="580.7" y="436.0" width="438.7" height="110.0" rx="12" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="596.7" y="460.0" font-size="13.5" fill="#1D4F91" font-weight="600" text-anchor="start">ns-5</text>
<rect x="705.0" y="475.0" width="190.0" height="50.0" rx="9" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="496.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">eth0（vpeer）</text>
<text x="800.0" y="514.5" font-size="12.5" fill="#1D4F91" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">10.14.0.11/31</text>
<line x1="800.0" y1="344.0" x2="800.0" y2="472.0" stroke="#1F2328" stroke-width="3" stroke-linecap="round" marker-start="url(#m1F2328)" marker-end="url(#m1F2328)"/>
<text x="814.0" y="402.0" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">一头进，</text>
<text x="814.0" y="422.0" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">另一头出</text>
<text x="580.7" y="570.0" font-size="13.5" fill="#57606A" text-anchor="start">两头可以放进不同的命名空间；两头地址在同一个 /31 里，是直连的</text>
<text x="580.7" y="592.0" font-size="13.5" fill="#57606A" text-anchor="start">邻居。</text>
<rect x="1091.3" y="246.0" width="438.7" height="120.0" rx="12" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="1107.3" y="270.0" font-size="13.5" fill="#4B3FA8" font-weight="600" text-anchor="start">用户态</text>
<rect x="1200.7" y="292.0" width="220.0" height="52.0" rx="9" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="1310.7" y="314.0" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="middle">Firecracker 进程</text>
<text x="1310.7" y="332.0" font-size="12" fill="#4B3FA8" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">持有一个文件描述符</text>
<rect x="1091.3" y="426.0" width="438.7" height="120.0" rx="12" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1107.3" y="450.0" font-size="13.5" fill="#1D4F91" font-weight="600" text-anchor="start">内核（ns-5）</text>
<rect x="1200.7" y="472.0" width="220.0" height="52.0" rx="9" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1310.7" y="494.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">tap0（网卡）</text>
<text x="1310.7" y="512.0" font-size="12" fill="#1D4F91" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">169.254.0.22/30</text>
<path d="M1260.7 346.0 L1260.7 468.0" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="1248.7" y="404.0" font-size="12.5" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="end">write(帧)</text>
<text x="1248.7" y="422.0" font-size="12" fill="#57606A" text-anchor="end">= tap0 收到</text>
<path d="M1360.7 470.0 L1360.7 348.0" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="1372.7" y="404.0" font-size="12.5" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">read(帧)</text>
<text x="1372.7" y="422.0" font-size="12" fill="#57606A" text-anchor="start">= tap0 发出</text>
<text x="1091.3" y="570.0" font-size="13.5" fill="#57606A" text-anchor="start">程序只能按名字打开自己所在命名空间里的 tap，所以 Firecracker 要</text>
<text x="1091.3" y="592.0" font-size="13.5" fill="#57606A" text-anchor="start">运行在 ns-5 里。</text>
<line x1="48.0" y1="660.0" x2="1552.0" y2="660.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="686.0" font-size="13" fill="#8C959F" text-anchor="start">注：tun 与 tap 的区别只有一点：tun 收发 IP 包，tap 收发带 MAC 的以太网帧。虚拟机的网卡要做 ARP，所以用 tap。</text></svg>