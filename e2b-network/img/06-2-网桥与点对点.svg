<line x1="378.0" y1="356.0" x2="448.0" y2="356.0" stroke="#57606A" stroke-width="1.4" stroke-linecap="round"/>
<rect x="448.0" y="330.0" width="130.0" height="52.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
