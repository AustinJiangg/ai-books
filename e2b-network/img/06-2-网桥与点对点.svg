<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="726" viewBox="0 0 1600 726" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="726" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">把沙箱接出去的两种方式：网桥，或者路由 + NAT</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">网桥把所有沙箱放进同一个二层网络，像接在同一台交换机上；路由 + NAT 给每个沙箱一条自己的点对点链路，宿主机按路由表转发。E2B 选后者，根本原因是它的沙箱无法拥有不同的 IP 和 MAC（第 10 篇）。</text>
<rect x="48.0" y="156.0" width="732.0" height="470.0" rx="16" fill="#FCFBFA" stroke="#D8DEE4" stroke-width="1"/>
<rect x="72.0" y="175.0" width="98.6" height="26.0" rx="13.0" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1"/>
<text x="121.3" y="192.7" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">Docker 默认</text>
<text x="184.6" y="194.0" font-size="18" fill="#1F2328" font-weight="600" text-anchor="start">网桥（虚拟交换机）</text>
<rect x="820.0" y="156.0" width="732.0" height="470.0" rx="16" fill="#FCFBFA" stroke="#D8DEE4" stroke-width="1"/>
