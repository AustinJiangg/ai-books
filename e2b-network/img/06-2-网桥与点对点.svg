<text x="860.0" y="500.0" font-size="14" text-anchor="start" xml:space="preserve"><tspan fill="#1F2328" font-weight="600">每条链路独立：</tspan><tspan fill="#57606A">沙箱之间没有二层通路，看不见对方的 ARP</tspan></text>
<circle cx="848.0" cy="525.2" r="3.6" fill="#1F9E77" stroke="none" stroke-width="1"/>
<text x="860.0" y="530.0" font-size="14" text-anchor="start" xml:space="preserve"><tspan fill="#1F2328" font-weight="600">沙箱互访：</tspan><tspan fill="#57606A">包只能先到宿主机，由宿主机决定转不转</tspan></text>
<circle cx="848.0" cy="555.2" r="3.6" fill="#1F9E77" stroke="none" stroke-width="1"/>
<text x="860.0" y="560.0" font-size="14" text-anchor="start" xml:space="preserve"><tspan fill="#0E6B4F" font-weight="600">不要求：</tspan><tspan fill="#57606A">沙箱的 IP、MAC 各不相同</tspan></text>
<line x1="48.0" y1="660.0" x2="1552.0" y2="660.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="686.0" font-size="13" fill="#8C959F" text-anchor="start">注：右边每个沙箱的地址都是 169.254.0.21，靠的是各自的命名空间和出口的 NAT（第 10、11 篇）。</text></svg>