<text x="88.0" y="500.0" font-size="14" text-anchor="start" xml:space="preserve"><tspan fill="#1F2328" font-weight="600">同一个二层网络：</tspan><tspan fill="#57606A">沙箱之间能互发 ARP、互相访问</tspan></text>
<circle cx="76.0" cy="525.2" r="3.6" fill="#8C959F" stroke="none" stroke-width="1"/>
<text x="88.0" y="530.0" font-size="14" text-anchor="start" xml:space="preserve"><tspan fill="#1F2328" font-weight="600">要隔离：</tspan><tspan fill="#57606A">还得另加规则</tspan></text>
<circle cx="76.0" cy="555.2" r="3.6" fill="#8C959F" stroke="none" stroke-width="1"/>
<text x="88.0" y="560.0" font-size="14" text-anchor="start" xml:space="preserve"><tspan fill="#9A3215" font-weight="600">前提：</tspan><tspan fill="#57606A">每个沙箱的 IP、MAC 必须各不相同</tspan></text>
