<text x="889.4" y="192.7" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">E2B 的选择</text>
<text x="948.9" y="194.0" font-size="18" fill="#1F2328" font-weight="600" text-anchor="start">路由 + NAT（点对点）</text>
