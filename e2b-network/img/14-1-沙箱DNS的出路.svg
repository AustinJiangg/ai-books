<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="862" viewBox="0 0 1600 862" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="862" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">沙箱为什么用不了宿主机的 dnsmasq：每条路都在半路被挡</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">把沙箱 /etc/resolv.conf 里的 nameserver 换成几个候选地址，看看 DNS 查询（UDP 53）各自走到哪里为止。只有公网地址 8.8.8.8 走得通，而且要宿主机自己能直接访问到它。</text>
