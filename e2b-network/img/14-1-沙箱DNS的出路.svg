<text x="340.0" y="616.0" font-size="13" fill="#0E6B4F" font-weight="600" text-anchor="start">放行 → SNAT → 宿主机转发、MASQUERADE → 物理网卡出去</text>
<rect x="48.0" y="692.0" width="1504.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="70.0" y="734.0" font-size="14" text-anchor="start" xml:space="preserve"><tspan fill="#1D4F91" font-weight="700">即使连得上也不该用：</tspan><tspan fill="#57606A">宿主机的 dnsmasq 把 *.e2b.app 答成 127.0.0.1、把 *.consul 转给内部 Consul，这些内部答案不应该给不可信的沙箱看。所以两套 DNS 被刻意分开。</tspan></text>
<line x1="48.0" y1="796.0" x2="1552.0" y2="796.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="822.0" font-size="13" fill="#8C959F" text-anchor="start">注：也不能换成内网 DNS（私有地址）：nftables 的预置拦截规则排在用户放行规则前面，allowOut 也救不了（第 15 篇）。</text></svg>