<text x="48.0" y="842.0" font-size="13" fill="#8C959F" text-anchor="start">注：客户机里的 eth0 和命名空间里的 eth0（vpeer）只是重名。10.13.0.5、10.14.0.10/11 由槽位编号 5 算出（本篇第三节）；169.254.0.21/22 与编号无关，每个槽位都一样。</text></svg>