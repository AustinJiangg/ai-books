<text x="974.0" y="621.0" font-size="14" fill="#8A5300" font-weight="600" text-anchor="start">两条 NAT</text>
<text x="974.0" y="640.0" font-size="12" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">SNAT 169.254.0.21 → 10.13.0.5；DNAT 反过来</text>
<rect x="930.0" y="660.0" width="610.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.2"/>
<circle cx="952.0" cy="685.0" r="12" fill="#1D4F91" stroke="none" stroke-width="1"/>
