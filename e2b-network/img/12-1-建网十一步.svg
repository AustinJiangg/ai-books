<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1112" viewBox="0 0 1600 1112" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="1112" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">建网十一步：线程在宿主机和 ns-5 之间来回切换</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">“当前在哪个网络命名空间”是线程的属性。CreateNetwork 先把协程钉在一个线程上，再用 setns 在两个命名空间之间来回切，每一步建的东西就落在线程当时所在的命名空间里。左列是宿主机，右列是 ns-5，粗线是线程</text>
<text x="48.0" y="116.0" font-size="15" fill="#57606A" text-anchor="start">的位置。</text>
<rect x="108.0" y="180.0" width="594.0" height="40.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.2"/>
<text x="405.0" y="206.0" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">宿主机命名空间</text>
<rect x="918.0" y="180.0" width="634.0" height="40.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.2"/>
<text x="1241.0" y="206.0" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">ns-5</text>
<rect x="120.0" y="240.0" width="570.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.2"/>
<text x="164.0" y="261.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">锁线程，记下宿主机命名空间</text>
<text x="164.0" y="280.0" font-size="12" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">LockOSThread；hostNS := netns.Get()</text>
<rect x="930.0" y="300.0" width="610.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.2"/>
<circle cx="952.0" cy="325.0" r="12" fill="#1D4F91" stroke="none" stroke-width="1"/>
<text x="952.0" y="329.1" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="974.0" y="321.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">创建 ns-5，线程随即进入</text>
<text x="974.0" y="340.0" font-size="12" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">ip netns add ns-5</text>
<rect x="930.0" y="360.0" width="610.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.2"/>
<circle cx="952.0" cy="385.0" r="12" fill="#1D4F91" stroke="none" stroke-width="1"/>
<text x="952.0" y="389.1" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="974.0" y="381.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">建 veth 对，配 vpeer</text>
<text x="974.0" y="400.0" font-size="12" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">eth0 = 10.14.0.11/31；e2bv-5 这头送回宿主机</text>
<rect x="120.0" y="420.0" width="570.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.2"/>
<circle cx="142.0" cy="445.0" r="12" fill="#3D3C38" stroke="none" stroke-width="1"/>
<text x="142.0" y="449.1" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<text x="164.0" y="441.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">配宿主机这一头</text>
<text x="164.0" y="460.0" font-size="12" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">e2bv-5 = 10.14.0.10/31</text>
<rect x="930.0" y="480.0" width="610.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.2"/>
<circle cx="952.0" cy="505.0" r="12" fill="#1D4F91" stroke="none" stroke-width="1"/>
<text x="952.0" y="509.1" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<text x="974.0" y="501.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">建 tap0，启用 lo</text>
<text x="974.0" y="520.0" font-size="12" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">tap0 = 169.254.0.22/30</text>
<rect x="930.0" y="540.0" width="610.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.2"/>
<circle cx="952.0" cy="565.0" r="12" fill="#1D4F91" stroke="none" stroke-width="1"/>
<text x="952.0" y="569.1" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<text x="974.0" y="561.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">默认路由</text>
<text x="974.0" y="580.0" font-size="12" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">default via 10.14.0.10</text>
<rect x="930.0" y="600.0" width="610.0" height="50.0" rx="8" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.2"/>
<circle cx="952.0" cy="625.0" r="12" fill="#D9922B" stroke="none" stroke-width="1"/>
