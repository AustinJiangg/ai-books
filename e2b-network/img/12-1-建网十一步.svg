<text x="164.0" y="861.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">六条 REDIRECT</text>
<text x="164.0" y="880.0" font-size="12" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">192.0.2.1 的 3 条 + 防火墙代理 3 条</text>
<rect x="120.0" y="900.0" width="1420.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.2" stroke-dasharray="5 4"/>
<circle cx="142.0" cy="925.0" r="12" fill="#1D4F91" stroke="none" stroke-width="1"/>
<text x="142.0" y="929.1" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">11</text>
<text x="164.0" y="921.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">为 ns-5 打开一个 conntrack 句柄（补丁新增）</text>
<text x="164.0" y="940.0" font-size="12" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">netlink 套接字，为第 20 篇的回滚清理做准备；打开失败也不影响使用</text>
<rect x="120.0" y="960.0" width="570.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.2"/>
<text x="164.0" y="981.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">defer：回到宿主机</text>
<text x="164.0" y="1000.0" font-size="12" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">无论成败，最后都切回宿主机</text>
