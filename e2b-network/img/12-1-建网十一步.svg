<text x="48.0" y="1072.0" font-size="13" fill="#8C959F" text-anchor="start">注：步骤 1 的 netns.NewNamed 建好命名空间后会让当前线程进入它；步骤 2 建的 veth 两头起初都在 ns-5，所以要把 e2bv-5 这头送回宿主机。如果不锁线程，Go 调度器把协程挪到别的线程上，后面的规则就会落到错误的命名空间。</text></svg>