<rect x="120.0" y="720.0" width="570.0" height="50.0" rx="8" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.2"/>
<circle cx="142.0" cy="745.0" r="12" fill="#D9922B" stroke="none" stroke-width="1"/>
<text x="142.0" y="749.1" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">8</text>
<text x="164.0" y="741.0" font-size="14" fill="#8A5300" font-weight="600" text-anchor="start">到 Host IP 的路由</text>
<text x="164.0" y="760.0" font-size="12" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">10.13.0.5/32 via 10.14.0.11</text>
<rect x="120.0" y="780.0" width="570.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.2"/>
<circle cx="142.0" cy="805.0" r="12" fill="#3D3C38" stroke="none" stroke-width="1"/>
<text x="142.0" y="809.1" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">9</text>
<text x="164.0" y="801.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">转发放行 + MASQUERADE</text>
<text x="164.0" y="820.0" font-size="12" fill="#57606A" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">FORWARD × 2；-s 10.13.0.5/32 -j MASQUERADE</text>
<rect x="120.0" y="840.0" width="570.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.2"/>
<circle cx="142.0" cy="865.0" r="12" fill="#3D3C38" stroke="none" stroke-width="1"/>
