<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="668" viewBox="0 0 1600 668" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m5B9BE6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#5B9BE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD9922B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#D9922B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="668" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">build.sh -s 的顺序：ip_forward 必须先于槽位池，入口规则放最后</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">和网络有关的七步按下面的顺序执行。最关键的一条依赖：新命名空间的 ip_forward 在创建那一刻从宿主机继承，之后改宿主机的值对已建好的命名空间无效，所以第 4 步必须在第 6 步建槽位池之前。</text>
<rect x="48.0" y="226.0" width="199.4" height="120.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="147.7" y="278.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">Harbor</text>
<text x="147.7" y="300.7" font-size="12" fill="#57606A" text-anchor="middle">安装并启动镜像仓库</text>
<circle cx="147.7" cy="226.0" r="13" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="147.7" y="230.7" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<path d="M249.4 286.0 L262.4 286.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="265.4" y="226.0" width="199.4" height="120.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="365.1" y="278.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">start-server.sh</text>
<text x="365.1" y="300.7" font-size="12" fill="#57606A" text-anchor="middle">Consul / Nomad 服务端</text>
<circle cx="365.1" cy="226.0" r="13" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="365.1" y="230.7" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<path d="M466.9 286.0 L479.9 286.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="482.9" y="226.0" width="199.4" height="120.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="582.6" y="260.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">start-client.sh</text>
<text x="582.6" y="282.7" font-size="12" fill="#57606A" text-anchor="middle">resolv.conf 第一行</text>
<text x="582.6" y="300.7" font-size="12" fill="#57606A" text-anchor="middle">127.0.0.1；Consul 转发；连</text>
<text x="582.6" y="318.7" font-size="12" fill="#57606A" text-anchor="middle">接队列参数</text>
<circle cx="582.6" cy="226.0" r="13" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="582.6" y="230.7" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<path d="M684.3 286.0 L697.3 286.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="700.3" y="226.0" width="199.4" height="120.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="800.0" y="278.1" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">init-client.sh</text>
<text x="800.0" y="300.7" font-size="12" fill="#57606A" text-anchor="middle">ip_forward = 1</text>
<circle cx="800.0" cy="226.0" r="13" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="800.0" y="230.7" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<path d="M901.7 286.0 L914.7 286.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="917.7" y="226.0" width="199.4" height="120.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1017.4" y="269.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">/etc/hosts</text>
<text x="1017.4" y="291.7" font-size="12" fill="#57606A" text-anchor="middle">加 &lt;本机IP&gt; harbor，重启</text>
<text x="1017.4" y="309.7" font-size="12" fill="#57606A" text-anchor="middle">dnsmasq</text>
<circle cx="1017.4" cy="226.0" r="13" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="1017.4" y="230.7" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<path d="M1119.1 286.0 L1132.1 286.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1135.1" y="226.0" width="199.4" height="120.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1234.9" y="269.1" font-size="14.5" fill="#1D4F91" font-weight="600" text-anchor="middle">deploy.sh</text>
<text x="1234.9" y="291.7" font-size="12" fill="#57606A" text-anchor="middle">启动 template-manager，开</text>
<text x="1234.9" y="309.7" font-size="12" fill="#57606A" text-anchor="middle">始建槽位池</text>
<circle cx="1234.9" cy="226.0" r="13" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="1234.9" y="230.7" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">6</text>
<path d="M1336.6 286.0 L1349.6 286.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1352.6" y="226.0" width="199.4" height="120.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1452.3" y="278.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">入口规则</text>
<text x="1452.3" y="300.7" font-size="12" fill="#57606A" text-anchor="middle">80 → 3002，先删老规则</text>
<circle cx="1452.3" cy="226.0" r="13" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="1452.3" y="230.7" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">7</text>
<path d="M799.9999999999999 350 C799.9999999999999 416 1234.857142857143 416 1234.857142857143 352" fill="none" stroke="#D9922B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
<text x="1017.4" y="414.5" font-size="13" fill="#8A5300" font-weight="600" text-anchor="middle">必须在前：命名空间创建时继承 ip_forward</text>
<path d="M582.5714285714286 208 C582.5714285714286 132 1017.4285714285713 132 1017.4285714285713 206" fill="none" stroke="#5B9BE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m5B9BE6)"/>
<text x="800.0" y="148.0" font-size="13" fill="#1D4F91" font-weight="600" text-anchor="middle">dnsmasq 只在启动时读 /etc/hosts，所以这里再重启一次</text>
<rect x="48.0" y="456.0" width="737.0" height="112.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="68.0" y="494.0" font-size="15.5" fill="#9A3215" font-weight="600" text-anchor="start">顺序错了会怎样</text>
<text x="68.0" y="517.9" font-size="13" fill="#57606A" text-anchor="start">整池槽位都转不了包：宿主机连不上客户机里的 envd，构建模板在等 envd 时 60 秒超时，报 build was cancelled。</text>
<text x="68.0" y="537.4" font-size="13" fill="#57606A" text-anchor="start">只能重启 template-manager，让它把整池重建。</text>
<rect x="815.0" y="456.0" width="737.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.3"/>
<text x="835.0" y="494.0" font-size="15.5" fill="#1F2328" font-weight="600" text-anchor="start">openEuler 的坑</text>
<text x="835.0" y="517.9" font-size="13" fill="#57606A" text-anchor="start">自带的 /etc/sysctl.conf 写死 ip_forward=0，而 sysctl -p 只读这个文件，会把值压回 0。脚本：直接改这一行为</text>
<text x="835.0" y="537.4" font-size="13" fill="#57606A" text-anchor="start">1 → sysctl -p → 再 sysctl -w 一次。</text>
<line x1="48.0" y1="602.0" x2="1552.0" y2="602.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="628.0" font-size="13" fill="#8C959F" text-anchor="start">注：入口规则放在最后，是因为它们是全局规则，和槽位无关；所有 iptables 命令都带 -w 等 xtables 锁，并用 -C … || -A … 写法，重复执行 -s 也安全。</text></svg>