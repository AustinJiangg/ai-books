<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="744" viewBox="0 0 1600 744" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="744" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">宿主机的入口：一个公网上不存在的域名，怎么落到本机 3002 端口</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">SDK 发出的请求分两类：控制请求直连 api 的 3000 端口；沙箱请求访问 http://49983-&lt;沙箱ID&gt;.e2b.app。后者先由 dnsmasq 解析成 127.0.0.1，再由 iptables 把 80 端口改到 3002，交给 client-proxy。</text>
<rect x="48.0" y="156.0" width="210.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="153.0" y="295.6" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">SDK</text>
<text x="153.0" y="318.2" font-size="12" fill="#57606A" text-anchor="middle">跑在本机</text>
<text x="153.0" y="336.2" font-size="12" fill="#57606A" text-anchor="middle">.env 里</text>
<text x="153.0" y="354.2" font-size="12" fill="#57606A" text-anchor="middle">E2B_DOMAIN=e2b.app</text>
<path d="M260.0 196.0 L1010.0 196.0" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m57606A)"/>
<text x="634.0" y="186.0" font-size="13" fill="#57606A" font-weight="600" text-anchor="middle">控制请求：创建、销毁、暂停沙箱，构建模板</text>
<rect x="1014.0" y="166.0" width="538.0" height="60.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1283.0" y="200.8" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">api :3000</text>
<rect x="370.0" y="246.0" width="490.0" height="150.0" rx="12" fill="#FCFBFA" stroke="#AEB6BE" stroke-width="1.2"/>
<text x="388.0" y="274.0" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">/etc/resolv.conf 第一行 nameserver 127.0.0.1 → dnsmasq</text>
<text x="388.0" y="312.0" font-size="12.5" fill="#8A5300" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">address=/.e2b.app/127.0.0.1</text>
<text x="660.0" y="312.0" font-size="12.5" fill="#57606A" text-anchor="start">A 记录：回答 127.0.0.1</text>
<text x="388.0" y="344.0" font-size="12.5" fill="#8A5300" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">local=/e2b.app/</text>
<text x="660.0" y="344.0" font-size="12.5" fill="#57606A" text-anchor="start">AAAA 等：立刻回答“没有”</text>
<text x="388.0" y="376.0" font-size="12.5" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">server=/consul/127.0.0.1#8600</text>
<text x="660.0" y="376.0" font-size="12.5" fill="#57606A" text-anchor="start">*.consul 转给 Consul</text>
<path d="M260.0 321.0 L366.0 321.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="314.0" y="311.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">① 解析域名</text>
<path d="M260.0 456.0 L366.0 456.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="314.0" y="446.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">② 连 127.0.0.1:80</text>
<rect x="370.0" y="422.0" width="490.0" height="68.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="615.0" y="447.8" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">iptables nat OUTPUT</text>
<text x="615.0" y="471.0" font-size="12.5" fill="#57606A" text-anchor="middle">-p tcp -o lo --dport 80 → REDIRECT 3002</text>
<path d="M864.0 456.0 L1010.0 456.0" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1014.0" y="412.0" width="538.0" height="88.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1283.0" y="447.9" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">client-proxy :3002</text>
<text x="1283.0" y="471.8" font-size="13" fill="#57606A" text-anchor="middle">按 Host 头找沙箱（第 18 篇）</text>
<rect x="48.0" y="524.0" width="210.0" height="104.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="153.0" y="550.3" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">别的机器上的 SDK</text>
<text x="153.0" y="572.9" font-size="12" fill="#57606A" text-anchor="middle">自己把 *.e2b.app 解析到</text>
<text x="153.0" y="590.9" font-size="12" fill="#57606A" text-anchor="middle">192.168.10.23，</text>
<text x="153.0" y="608.9" font-size="12" fill="#57606A" text-anchor="middle">经物理网卡访问它的 80 端口</text>
<path d="M260.0 576.0 L366.0 576.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="370.0" y="542.0" width="490.0" height="68.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="615.0" y="567.8" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">iptables nat PREROUTING</text>
<text x="615.0" y="591.0" font-size="12.5" fill="#57606A" text-anchor="middle">-p tcp --dport 80 --dst-type LOCAL → REDIRECT 3002</text>
<path d="M864.0 576.0 L940.0 576.0 L940.0 478.0 L1010.0 478.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="1014.0" y="582.0" font-size="13" fill="#57606A" text-anchor="start">本机发出的包不经过 PREROUTING，所以两条规则都要有</text>
<line x1="48.0" y1="658.0" x2="1552.0" y2="658.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="684.0" font-size="13" fill="#8C959F" text-anchor="start">注：DNS 只能给地址，不能给端口，所以要 iptables 改端口。这两条规则只在内存里，机器重启后要重新执行 build.sh -s。SDK 默认用 https，build.sh -i 运行 patch_e2b.py 把它改成 http。别的机器上的 SDK 发控制请求时，同样直连 api 的 3000</text>
<text x="48.0" y="704.0" font-size="13" fill="#8C959F" text-anchor="start">端口，只是包从物理网卡进来（本篇 5.1 节）。</text></svg>