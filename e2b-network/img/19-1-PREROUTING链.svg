<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="822" viewBox="0 0 1600 822" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="822" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">宿主机的 nat PREROUTING 链：从上往下，命中即停</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">槽位 5 的六条 REDIRECT 加在链尾，前面还有一条全局入口规则。三个沙箱发出的 TCP 包依次往下比，命中第一条就停。宿主服务的三条排在防火墙代理的三条前面，所以 192.0.2.1:80 不会被 5016 截走。</text>
