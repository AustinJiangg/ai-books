<text x="70.0" y="700.0" font-size="13.5" fill="#57606A" text-anchor="start">ns-5 里 nftables 规则 2 放行 192.0.2.1（发往私有地址的包在规则 3 就被丢了），再 SNAT 成 10.13.0.5；宿主服务据此认出是哪个沙箱。只有这三个 TCP 端口有改道，访问 192.0.2.1 的其他端口或 UDP 都无果。</text>
<line x1="48.0" y1="756.0" x2="1552.0" y2="756.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="782.0" font-size="13" fill="#8C959F" text-anchor="start">注：真实链里每个槽位各有六条，全都加在链尾；全局入口规则在部署时就加上，排在最前。它要是没有 --dst-type LOCAL，第一列的包就会在第一行被截到 3002（第 17 篇）。</text></svg>