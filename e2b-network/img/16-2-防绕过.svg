<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="858" viewBox="0 0 1600 858" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="858" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">防绕过：按域名放行时，代理自己重新解析域名</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">用户只允许 pypi.org。沙箱里的恶意代码在 /etc/hosts 写一行 203.0.113.66 pypi.org，再去连 pypi.org:443：SNI 写的是 pypi.org，实际目的 IP 却是攻击者的服务器。代理连哪个地址，决定了这条规则还算不</text>
<text x="48.0" y="116.0" font-size="15" fill="#57606A" text-anchor="start">算数。</text>
<rect x="48.0" y="176.0" width="1504.0" height="76.0" rx="10" fill="#FCFBFA" stroke="#D8DEE4" stroke-width="1.3"/>
<text x="72.0" y="206.0" font-size="13" fill="#8C959F" text-anchor="start">沙箱 /etc/hosts</text>
<text x="72.0" y="232.0" font-size="15" fill="#9A3215" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">203.0.113.66 pypi.org</text>
<text x="448.0" y="206.0" font-size="13" fill="#8C959F" text-anchor="start">连接的原始目的</text>
<text x="448.0" y="232.0" font-size="15" fill="#9A3215" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">203.0.113.66:443</text>
<text x="824.0" y="206.0" font-size="13" fill="#8C959F" text-anchor="start">TLS 里的 SNI</text>
<text x="824.0" y="232.0" font-size="15" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">pypi.org</text>
<text x="1200.0" y="206.0" font-size="13" fill="#8C959F" text-anchor="start">用户配置</text>
<text x="1200.0" y="232.0" font-size="15" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="start">allowOut: pypi.org</text>
<rect x="48.0" y="286.0" width="732.0" height="360.0" rx="16" fill="#FCFBFA" stroke="#D8DEE4" stroke-width="1"/>
<rect x="78.0" y="304.0" width="182.5" height="32.0" rx="16.0" fill="#D6603D" stroke="#D6603D" stroke-width="1"/>
<text x="169.3" y="325.4" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">如果代理连沙箱给的 IP</text>
<rect x="78.0" y="356.0" width="672.0" height="72.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="414.0" y="383.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">SNI pypi.org 在放行名单里</text>
<text x="414.0" y="407.5" font-size="13" fill="#57606A" text-anchor="middle">判定：放行</text>
<path d="M414.0 428.0 L414.0 448.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="78.0" y="448.0" width="672.0" height="72.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="414.0" y="475.6" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">连 203.0.113.66:443</text>
<text x="414.0" y="499.5" font-size="13" fill="#57606A" text-anchor="middle">就是 /etc/hosts 里写的那个</text>
<path d="M414.0 520.0 L414.0 540.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="78.0" y="540.0" width="672.0" height="80.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="414.0" y="571.9" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">数据送到了攻击者的服务器</text>
<text x="414.0" y="595.8" font-size="13" fill="#57606A" text-anchor="middle">“只允许 pypi.org”形同虚设</text>
<rect x="820.0" y="286.0" width="732.0" height="360.0" rx="16" fill="#FCFBFA" stroke="#D8DEE4" stroke-width="1"/>
<rect x="850.0" y="304.0" width="201.8" height="32.0" rx="16.0" fill="#1F9E77" stroke="#1F9E77" stroke-width="1"/>
<text x="950.9" y="325.4" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">E2B：按域名放行时连域名</text>
<rect x="850.0" y="356.0" width="672.0" height="72.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1186.0" y="383.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">SNI pypi.org 在放行名单里</text>
<text x="1186.0" y="407.5" font-size="13" fill="#57606A" text-anchor="middle">判定：放行（按域名）</text>
<path d="M1186.0 428.0 L1186.0 448.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="850.0" y="448.0" width="672.0" height="72.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1186.0" y="475.6" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">宿主机重新解析 pypi.org</text>
<text x="1186.0" y="499.5" font-size="13" fill="#57606A" text-anchor="middle">问宿主机的 DNS，得到 151.101.0.223</text>
<path d="M1186.0 520.0 L1186.0 540.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="850.0" y="540.0" width="672.0" height="80.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1186.0" y="571.9" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">连到真正的 PyPI</text>
<text x="1186.0" y="595.8" font-size="13" fill="#57606A" text-anchor="middle">沙箱的 /etc/hosts、DNS 都影响不了目标</text>
<rect x="48.0" y="676.0" width="1504.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.3"/>
<text x="70.0" y="708.0" font-size="15.5" fill="#8A5300" font-weight="600" text-anchor="start">再防一层：解析结果不能是内网（防 DNS 重绑定）</text>
<text x="70.0" y="736.0" font-size="13.5" fill="#57606A" text-anchor="start">放行的域名如果被解析成 10.x、192.168.x、127.x、169.254.x 等预置拦截段的地址，代理在发起 TCP 连接之前就拒绝，并记一条告警日志，连一个 SYN 都不会发往内网。</text>
<line x1="48.0" y1="792.0" x2="1552.0" y2="792.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="818.0" font-size="13" fill="#8C959F" text-anchor="start">注：按域名放行用的是宿主机的 DNS（本机 dnsmasq → 上游）。沙箱自己能解析、宿主机解析不了时，按域名放行的连接会失败，排障要两边都看。</text></svg>