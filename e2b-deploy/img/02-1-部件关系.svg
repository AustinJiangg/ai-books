<text x="978.0" y="381.2" font-size="12.5" fill="#57606A" text-anchor="middle">:5008 gRPC  ·  :5007 沙箱代理</text>
<text x="978.0" y="399.9" font-size="12.5" fill="#57606A" text-anchor="middle">建网、挂盘、起 Firecracker、建模板</text>
