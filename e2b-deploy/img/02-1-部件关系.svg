<text x="498.0" y="257.1" font-size="12.5" fill="#57606A" text-anchor="middle">:3000 REST  ·  :5009 gRPC</text>
<text x="498.0" y="275.9" font-size="12.5" fill="#57606A" text-anchor="middle">管团队、密钥、模板、沙箱</text>
<rect x="348.0" y="416.0" width="300.0" height="110.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="498.0" y="453.9" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">client-proxy（edge）</text>
<text x="498.0" y="477.1" font-size="12.5" fill="#57606A" text-anchor="middle">:3002 沙箱流量  ·  :3003 健康</text>
<text x="498.0" y="495.9" font-size="12.5" fill="#57606A" text-anchor="middle">按域名里的沙箱 ID 转发</text>
<rect x="808.0" y="306.0" width="340.0" height="120.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="978.0" y="339.2" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">orchestrator = template-manager</text>
