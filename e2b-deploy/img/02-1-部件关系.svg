<text x="48.0" y="778.0" font-size="13" fill="#8C959F" text-anchor="start">注：上游还有 otel-collector、loki、clickhouse、docker-reverse-proxy、nomad-autoscaler，本环境都没部署，不在开沙箱的主路径上。</text></svg>