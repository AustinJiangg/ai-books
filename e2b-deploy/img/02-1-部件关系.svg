<text x="148.0" y="376.5" font-size="12.5" fill="#57606A" text-anchor="middle">e2b 2.20.0（已打补丁）</text>
<rect x="348.0" y="196.0" width="300.0" height="110.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
