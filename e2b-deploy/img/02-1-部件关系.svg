<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="818" viewBox="0 0 1600 818" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="818" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">E2B 的部件：谁调谁、走哪个端口</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">蓝色是 E2B 自己的服务，橙色是它们依赖的外部组件，紫色在沙箱里。api 找 orchestrator 不经过 Consul，而是问 Nomad 有哪些就绪节点，再连每个节点的 5008。</text>
