<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="352" viewBox="0 0 1600 352" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="352" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">以 API_PORT=3000 为例：一个值从 .env 走到进程</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">envsubst 是中间关键的一步：nomad/ 是模板，rendered/ 是填好值的成品，Nomad 只认 rendered/。</text>
