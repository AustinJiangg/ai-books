<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="615" viewBox="0 0 1600 615" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="615" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">一个服务要长期跑着，要解决五件事</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">同样五件事，systemd、docker、Nomad 各有一套答案。本环境三种都在用，各管一批服务。</text>
<rect x="48.0" y="152.0" width="1504.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="174.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">要素</text>
<text x="258.0" y="174.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">systemd（例：MinIO）</text>
<text x="708.0" y="174.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">docker（例：PostgreSQL）</text>
<text x="1158.0" y="174.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">Nomad（例：api、orchestrator）</text>
<line x1="48.0" y1="234.5" x2="1552.0" y2="234.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="217.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">可执行文件</text>
<text x="258.0" y="217.1" font-size="13.5" fill="#1F2328" text-anchor="start">/usr/local/bin/minio</text>
<text x="708.0" y="217.1" font-size="13.5" fill="#1F2328" text-anchor="start">镜像 postgres:latest</text>
<text x="1158.0" y="217.1" font-size="13.5" fill="#1F2328" text-anchor="start">镜像 .../api 或 /usr/bin/template-manager</text>
<line x1="48.0" y1="276.8" x2="1552.0" y2="276.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="259.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">配置</text>
<text x="258.0" y="259.3" font-size="13.5" fill="#1F2328" text-anchor="start">EnvironmentFile=/etc/default/minio.yml</text>
<text x="708.0" y="259.3" font-size="13.5" fill="#1F2328" text-anchor="start">docker run -e POSTGRES_PASSWORD=...</text>
<text x="1158.0" y="259.3" font-size="13.5" fill="#1F2328" text-anchor="start">job 里的 env { } 块</text>
<line x1="48.0" y1="319.0" x2="1552.0" y2="319.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="301.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">端口</text>
<text x="258.0" y="301.6" font-size="13.5" fill="#1F2328" text-anchor="start">ExecStart 里的 --address :9000</text>
<text x="708.0" y="301.6" font-size="13.5" fill="#1F2328" text-anchor="start">-p 5432:5432</text>
<text x="1158.0" y="301.6" font-size="13.5" fill="#1F2328" text-anchor="start">network { port ... static }</text>
<line x1="48.0" y1="361.2" x2="1552.0" y2="361.2" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="343.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">日志</text>
<text x="258.0" y="343.8" font-size="13.5" fill="#1F2328" text-anchor="start">journalctl -u minio</text>
<text x="708.0" y="343.8" font-size="13.5" fill="#1F2328" text-anchor="start">docker logs postgres</text>
<text x="1158.0" y="343.8" font-size="13.5" fill="#1F2328" text-anchor="start">nomad alloc logs &lt;id&gt; start</text>
<line x1="48.0" y1="403.5" x2="1552.0" y2="403.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="386.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">守护者</text>
<text x="258.0" y="386.1" font-size="13.5" fill="#1F2328" text-anchor="start">Restart=always + systemctl enable</text>
<text x="708.0" y="386.1" font-size="13.5" fill="#1F2328" text-anchor="start">--restart=always（docker 守护）</text>
<text x="1158.0" y="386.1" font-size="13.5" fill="#1F2328" text-anchor="start">restart / reschedule 策略（Nomad 守护）</text>
<text x="48.0" y="431.5" font-size="14" fill="#57606A" font-weight="600" text-anchor="start">守护链</text>
<rect x="48.0" y="449.5" width="338.5" height="70.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="217.2" y="476.4" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">systemd</text>
<text x="217.2" y="499.7" font-size="12.5" fill="#57606A" text-anchor="middle">PID 1</text>
<path d="M390.5 484.5 L432.5 484.5" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="436.5" y="449.5" width="338.5" height="70.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="605.8" y="476.4" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">docker / nomad / consul</text>
<text x="605.8" y="499.7" font-size="12.5" fill="#57606A" text-anchor="middle">systemd 的服务</text>
<path d="M779.0 484.5 L821.0 484.5" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="825.0" y="449.5" width="338.5" height="70.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="994.2" y="476.4" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">postgres 容器、Harbor</text>
<text x="994.2" y="499.7" font-size="12.5" fill="#57606A" text-anchor="middle">docker 守护</text>
<path d="M1167.5 484.5 L1209.5 484.5" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1213.5" y="449.5" width="338.5" height="70.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1382.8" y="466.5" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">api、client-proxy、redis、</text>
<text x="1382.8" y="486.3" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">orchestrator</text>
<text x="1382.8" y="509.6" font-size="12.5" fill="#57606A" text-anchor="middle">Nomad 守护</text>
<line x1="48.0" y1="549.5" x2="1552.0" y2="549.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="575.5" font-size="13" fill="#8C959F" text-anchor="start">注：判断一个配置到底生效没有，最终要看进程的环境变量：tr '\0' '\n' &lt; /proc/&lt;PID&gt;/environ。</text></svg>