<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="576" viewBox="0 0 1600 576" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="576" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">template-manager 的 32 GiB 管的是什么</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">Nomad 把这个 job 放进一个 cgroup，memory = 32768 是它的上限。Firecracker 进程也在里面，但客户机内存是大页，只记 hugetlb 控制器，不进这本账。</text>
<rect x="48.0" y="150.0" width="900.0" height="330.0" rx="14" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="68.0" y="180.0" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="start">Nomad 任务的 cgroup：memory.max = 32 GiB</text>
<text x="68.0" y="202.0" font-size="12.5" fill="#57606A" text-anchor="start">nomad.slice/…/&lt;allocID&gt;.start.scope</text>
<rect x="68.0" y="224.0" width="420.0" height="110.0" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="278.0" y="270.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">/usr/bin/template-manager</text>
<text x="278.0" y="294.2" font-size="12.5" fill="#57606A" text-anchor="middle">自己的堆：几十 MB 到几 GB</text>
<rect x="508.0" y="224.0" width="420.0" height="110.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="718.0" y="261.6" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="middle">每个 Firecracker 进程</text>
<text x="718.0" y="284.8" font-size="12.5" fill="#57606A" text-anchor="middle">客户机以外的内存：每个几十 MB</text>
<text x="718.0" y="303.6" font-size="12.5" fill="#57606A" text-anchor="middle">（ARM 补丁没把它挪到独立 cgroup）</text>
<rect x="68.0" y="350.0" width="860.0" height="110.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="498.0" y="396.9" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">页缓存：撑满它的通常是这个</text>
<text x="498.0" y="420.2" font-size="12.5" fill="#57606A" text-anchor="middle">建模板时解压镜像层、写磁盘镜像、写内存快照；脏页要先落盘才能回收</text>
<rect x="988.0" y="150.0" width="564.0" height="150.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="1270.0" y="207.7" font-size="15.5" fill="#4B3FA8" font-weight="600" text-anchor="middle">客户机内存（2 MiB 大页）</text>
<text x="1270.0" y="231.0" font-size="12.5" fill="#57606A" text-anchor="middle">MAP_HUGETLB，只记 hugetlb 控制器</text>
<text x="1270.0" y="249.7" font-size="12.5" fill="#57606A" text-anchor="middle">几百个沙箱也不占这 32 GiB</text>
<rect x="988.0" y="320.0" width="564.0" height="160.0" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/>
<text x="1270.0" y="363.8" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">两个方向都会错</text>
<text x="1270.0" y="387.1" font-size="12.5" fill="#57606A" text-anchor="middle">太小：建模板时 OOM（退出码 137）</text>
<text x="1270.0" y="405.8" font-size="12.5" fill="#57606A" text-anchor="middle">太大：超过节点可分配内存，调度不上</text>
<text x="1270.0" y="424.6" font-size="12.5" fill="#57606A" text-anchor="middle">（Dimension "memory" exhausted）</text>
<text x="1270.0" y="443.3" font-size="12.5" fill="#57606A" text-anchor="middle">两种都表现为 api 一直 503</text>
<line x1="48.0" y1="510.0" x2="1552.0" y2="510.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="536.0" font-size="13" fill="#8C959F" text-anchor="start">注：cpu = 2048 的单位是 MHz，用于调度预留和 CPU 权重，不是绑定 2 个核。</text></svg>