<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="695" viewBox="0 0 1600 695" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="695" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">建第一个模板，用到了前面几乎每一篇的成果</text>
