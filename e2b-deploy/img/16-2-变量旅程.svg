<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="787" viewBox="0 0 1600 787" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="787" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">SANDBOXES_HOST_NETWORK_CIDR 的旅程，以及它会在哪里断</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">左边八个环节依次传递，右边是四种“改了没用”的情况。验证时从下往上查最快。</text>
<circle cx="62.0" cy="177.7" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="182.2" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<rect x="88.0" y="146.0" width="860.0" height="63.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="169.7" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">仓库 e2b-deploy/dep/.env</text>
<text x="102.0" y="192.3" font-size="12" fill="#57606A" text-anchor="start">export SANDBOXES_HOST_NETWORK_CIDR=10.13.0.0/16</text>
<circle cx="62.0" cy="249.2" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="253.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<rect x="88.0" y="217.5" width="860.0" height="63.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="241.2" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">/opt/e2b-infra/dep/.env</text>
<text x="102.0" y="263.8" font-size="12" fill="#57606A" text-anchor="start">rpmbuild 打进包</text>
<circle cx="62.0" cy="320.7" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="325.2" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<rect x="88.0" y="289.0" width="860.0" height="63.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="312.7" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">/opt/e2b-infra/.env</text>
<text x="102.0" y="335.3" font-size="12" fill="#57606A" text-anchor="start">build.sh -i 拷到根目录</text>
<circle cx="62.0" cy="392.2" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="396.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<rect x="88.0" y="360.4" width="860.0" height="63.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="384.2" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">deploy.sh 的环境变量</text>
<text x="102.0" y="406.8" font-size="12" fill="#57606A" text-anchor="start">source + set -a</text>
<circle cx="62.0" cy="463.7" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="468.2" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<rect x="88.0" y="431.9" width="860.0" height="63.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="455.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">rendered/template-manager.hcl</text>
<text x="102.0" y="478.2" font-size="12" fill="#57606A" text-anchor="start">envsubst（变量要在白名单里）</text>
<circle cx="62.0" cy="535.1" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="539.6" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">6</text>
<rect x="88.0" y="503.4" width="860.0" height="63.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="527.1" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">Nomad 里的 job 定义</text>
<text x="102.0" y="549.7" font-size="12" fill="#57606A" text-anchor="start">nomad job run；nomad job inspect 可看</text>
<circle cx="62.0" cy="606.6" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="611.1" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">7</text>
<rect x="88.0" y="574.9" width="860.0" height="63.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="598.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">template-manager 进程的环境变量</text>
<text x="102.0" y="621.2" font-size="12" fill="#57606A" text-anchor="start">Nomad 启动任务；/proc/&lt;PID&gt;/environ</text>
<circle cx="62.0" cy="678.1" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="682.6" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">8</text>
<rect x="88.0" y="646.4" width="860.0" height="63.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="670.1" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">orchestrator 用 10.13.0.0/16 分配地址</text>
<text x="102.0" y="692.7" font-size="12" fill="#57606A" text-anchor="start">Go 代码读环境变量</text>
<rect x="988.0" y="146.0" width="564.0" height="116.0" rx="10" fill="#FFFFFF" stroke="#D6603D" stroke-width="1.3"/>
<text x="1270.0" y="186.5" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">被写死的值压过</text>
<text x="1270.0" y="209.8" font-size="12.5" fill="#57606A" text-anchor="middle">hcl 里写字面值 STORAGE_PROVIDER = "Local"，.env 的 MinioBucket 没机会进来。特</text>
<text x="1270.0" y="228.5" font-size="12.5" fill="#57606A" text-anchor="middle">征：.env 改了，rendered/ 没变</text>
<rect x="988.0" y="274.0" width="564.0" height="116.0" rx="10" fill="#FFFFFF" stroke="#D6603D" stroke-width="1.3"/>
<text x="1270.0" y="323.9" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">不在白名单里</text>
<text x="1270.0" y="347.2" font-size="12.5" fill="#57606A" text-anchor="middle">rendered/ 里还留着 ${XXX}。查：grep '\${[A-Z_]*}' rendered/*.hcl</text>
<rect x="988.0" y="402.0" width="564.0" height="116.0" rx="10" fill="#FFFFFF" stroke="#D6603D" stroke-width="1.3"/>
<text x="1270.0" y="451.9" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">改错了层</text>
<text x="1270.0" y="475.2" font-size="12.5" fill="#57606A" text-anchor="middle">改了 rendered/、根目录 .env 或脚本，下次渲染、-i、rpm -Uvh 时被覆盖</text>
<rect x="988.0" y="530.0" width="564.0" height="116.0" rx="10" fill="#FFFFFF" stroke="#D6603D" stroke-width="1.3"/>
<text x="1270.0" y="579.9" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">没有重启</text>
<text x="1270.0" y="603.2" font-size="12.5" fill="#57606A" text-anchor="middle">值对了，但 job 定义没变化，进程还是旧的</text>
<line x1="48.0" y1="721.8" x2="1552.0" y2="721.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="747.8" font-size="13" fill="#8C959F" text-anchor="start">注：同一个变量还会被 build.sh -d 读（根目录 .env 那份），用来判断哪些 iptables 规则是自己的。</text></svg>