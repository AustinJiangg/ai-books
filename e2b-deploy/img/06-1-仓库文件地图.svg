<text x="609.5" y="200.8" font-size="12.5" fill="#57606A" text-anchor="middle">对上游的唯一修改</text>
<rect x="437.0" y="236.0" width="345.0" height="60.8" rx="10" fill="#FFFFFF" stroke="#D6603D" stroke-width="1.3"/>
