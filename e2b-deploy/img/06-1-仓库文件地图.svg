<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="816" viewBox="0 0 1600 816" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="816" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">仓库里有什么：原料、改良、配方、摆盘</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">这是一个“打包仓库”：没有 packages/api 这类源码目录，E2B 的源码整个装在一个走 git-lfs 的压缩包里；对源码的全部修改集中在一个补丁里；spec 把它们变成 RPM；e2b-deploy/ 决定装好后怎么部署。</text>
<rect x="48.0" y="150.0" width="361.0" height="70.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
