<text x="48.0" y="482.0" font-size="13" fill="#8C959F" text-anchor="start">注：离线环境拉不到 Docker Hub，所以要自己搭仓库；docker 用明文 HTTP 访问它，靠 daemon.json 的 insecure-registries。</text></svg>