<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="522" viewBox="0 0 1600 522" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="522" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">镜像、容器与仓库：安装包、正在运行的软件、应用商店</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">api 的镜像是部署时现场构建的：把 RPM 编译好的二进制拷进 debian 精简镜像，推进本机 Harbor；Nomad 再按名字拉下来启动成容器。</text>
<rect x="48.0" y="156.0" width="323.5" height="100.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="209.8" y="188.5" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">Dockerfile</text>
<text x="209.8" y="211.8" font-size="12.5" fill="#57606A" text-anchor="middle">FROM debian:bookworm-slim</text>
<text x="209.8" y="230.5" font-size="12.5" fill="#57606A" text-anchor="middle">COPY api /api</text>
