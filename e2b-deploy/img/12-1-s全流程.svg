<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="892" viewBox="0 0 1600 892" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="892" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">build.sh -s 的完整顺序</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">先起服务（Harbor、Consul、Nomad），再准备宿主机，然后等 Nomad 就绪、把镜像和 job 交给它，最后打开 80 端口的入口。右侧是讲它的篇目。</text>
<circle cx="62.0" cy="178.4" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="182.9" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<rect x="88.0" y="146.0" width="1298.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="170.2" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">启动 Harbor</text>
<text x="102.0" y="193.5" font-size="12.5" fill="#57606A" text-anchor="start">harbor/install.sh；修属主 10000:10000；重启 registry、proxy</text>
<rect x="1402.0" y="146.0" width="150.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/>
<text x="1477.0" y="182.0" font-size="12" fill="#57606A" text-anchor="middle">第 12 篇</text>
<circle cx="62.0" cy="253.3" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="257.8" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<rect x="88.0" y="220.9" width="1298.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="245.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">start-server.sh</text>
<text x="102.0" y="268.4" font-size="12.5" fill="#57606A" text-anchor="start">装 Consul、Nomad；以 server 启动；ACL bootstrap；建节点池</text>
<rect x="1402.0" y="220.9" width="150.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/>
<text x="1477.0" y="256.9" font-size="12" fill="#57606A" text-anchor="middle">第 12 篇</text>
<circle cx="62.0" cy="328.2" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="332.7" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<rect x="88.0" y="295.8" width="1298.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="320.0" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">append_nomad_client_config + 重启 Nomad</text>
<text x="102.0" y="343.2" font-size="12.5" fill="#57606A" text-anchor="start">同一个 Nomad 也当 client：api 池、raw_exec、network_speed</text>
<rect x="1402.0" y="295.8" width="150.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/>
<text x="1477.0" y="331.8" font-size="12" fill="#57606A" text-anchor="middle">第 12 篇</text>
<circle cx="62.0" cy="403.1" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="407.6" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<rect x="88.0" y="370.7" width="1298.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="394.9" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">start-client.sh</text>
<text x="102.0" y="418.1" font-size="12.5" fill="#57606A" text-anchor="start">orchestrator → /usr/bin/template-manager；目录、swap、tmpfs、DNS</text>
<rect x="1402.0" y="370.7" width="150.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/>
<text x="1477.0" y="406.7" font-size="12" fill="#57606A" text-anchor="middle">第 12 篇</text>
<circle cx="62.0" cy="478.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="482.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<rect x="88.0" y="445.6" width="1298.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="469.8" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">init-client.sh</text>
<text x="102.0" y="493.0" font-size="12.5" fill="#57606A" text-anchor="start">IP 转发、sysctl、NBD、envd、内核、Firecracker、大页</text>
<rect x="1402.0" y="445.6" width="150.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/>
<text x="1477.0" y="481.6" font-size="12" fill="#57606A" text-anchor="middle">第 13 篇</text>
<circle cx="62.0" cy="552.9" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="557.4" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">6</text>
<rect x="88.0" y="520.4" width="1298.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="544.7" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">wait_for_port 4646</text>
<text x="102.0" y="567.9" font-size="12.5" fill="#57606A" text-anchor="start">永不超时；卡住看 journalctl -u nomad</text>
<rect x="1402.0" y="520.4" width="150.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/>
<text x="1477.0" y="556.5" font-size="12" fill="#57606A" text-anchor="middle">第 12 篇</text>
<circle cx="62.0" cy="627.8" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="632.3" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">7</text>
<rect x="88.0" y="595.3" width="1298.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="619.5" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">Harbor 收尾</text>
<text x="102.0" y="642.8" font-size="12.5" fill="#57606A" text-anchor="start">登录、建项目、/etc/hosts 写 harbor、推送 ubuntu:22.04-custom</text>
<rect x="1402.0" y="595.3" width="150.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/>
<text x="1477.0" y="631.4" font-size="12" fill="#57606A" text-anchor="middle">第 14 篇</text>
<circle cx="62.0" cy="702.7" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="707.2" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">8</text>
<rect x="88.0" y="670.2" width="1298.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="694.4" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">deploy.sh</text>
<text x="102.0" y="717.7" font-size="12.5" fill="#57606A" text-anchor="start">构建推送镜像 → envsubst → nomad job run ×4 → seed-db、放开配额</text>
<rect x="1402.0" y="670.2" width="150.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/>
<text x="1477.0" y="706.3" font-size="12" fill="#57606A" text-anchor="middle">第 14、15 篇</text>
<circle cx="62.0" cy="777.6" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="782.1" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">9</text>
<rect x="88.0" y="745.1" width="1298.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="102.0" y="769.3" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">iptables 80 → 3002</text>
<text x="102.0" y="792.6" font-size="12.5" fill="#57606A" text-anchor="start">PREROUTING（外机）+ OUTPUT（本机）</text>
<rect x="1402.0" y="745.1" width="150.0" height="64.9" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/>
<text x="1477.0" y="781.2" font-size="12" fill="#57606A" text-anchor="middle">第 14 篇</text>
<line x1="48.0" y1="826.0" x2="1552.0" y2="826.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="852.0" font-size="13" fill="#8C959F" text-anchor="start">注：第 5 步 init-client.sh 必须在第 8 步之前：orchestrator 一启动就建几百个网络槽位，ip_forward 要在那之前就是 1。</text></svg>