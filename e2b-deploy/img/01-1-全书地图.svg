<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="866" viewBox="0 0 1600 866" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="866" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">部署完成后，这台机器上有四层东西</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">从下往上：机器层是配置，没有进程；宿主服务层由 systemd 或 docker 直接管；业务层是 Nomad 管的 4 个 job；沙箱层是部署完成后每次 Sandbox.create() 新开的虚拟机。SDK 从左边进来：控制面找 api，数据面经 80</text>
<text x="48.0" y="116.0" font-size="15" fill="#57606A" text-anchor="start">端口到 client-proxy。</text>
