<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="799" viewBox="0 0 1600 799" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="799" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">harbor:443 这条路：建模板拉基础镜像时经过谁</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">template-manager 用 go-containerregistry 拉镜像，对非 localhost 地址默认走 HTTPS、不认 insecure-registries。于是给 Harbor 套一层 Nginx + 自签证书，名字必须是 harbor。</text>
<rect x="48.0" y="156.0" width="304.0" height="110.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="200.0" y="193.5" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">template-manager</text>
<text x="200.0" y="216.8" font-size="12.5" fill="#57606A" text-anchor="middle">FROM harbor:443/e2b-orchestration/</text>
<text x="200.0" y="235.5" font-size="12.5" fill="#57606A" text-anchor="middle">ubuntu:22.04-custom</text>
<path d="M356.0 211.0 L444.0 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="400.0" y="203.0" font-size="11.5" fill="#1F2328" font-weight="600" text-anchor="middle">DNS</text>
<rect x="448.0" y="156.0" width="304.0" height="110.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="600.0" y="193.5" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">dnsmasq</text>
<text x="600.0" y="216.8" font-size="12.5" fill="#57606A" text-anchor="middle">查 /etc/hosts</text>
<text x="600.0" y="235.5" font-size="12.5" fill="#57606A" text-anchor="middle">harbor → 192.168.10.23</text>
<path d="M756.0 211.0 L844.0 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="800.0" y="203.0" font-size="11.5" fill="#1F2328" font-weight="600" text-anchor="middle">HTTPS</text>
<rect x="848.0" y="156.0" width="304.0" height="110.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1000.0" y="193.5" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">Nginx :443</text>
<text x="1000.0" y="216.8" font-size="12.5" fill="#57606A" text-anchor="middle">出示证书 CN=harbor</text>
<text x="1000.0" y="235.5" font-size="12.5" fill="#57606A" text-anchor="middle">转给 127.0.0.1:2900</text>
<path d="M1156.0 211.0 L1244.0 211.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="1200.0" y="203.0" font-size="11.5" fill="#1F2328" font-weight="600" text-anchor="middle">HTTP</text>
<rect x="1248.0" y="156.0" width="304.0" height="110.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1400.0" y="202.9" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">Harbor :2900</text>
<text x="1400.0" y="226.2" font-size="12.5" fill="#57606A" text-anchor="middle">返回镜像</text>
<text x="48.0" y="316.0" font-size="14" fill="#57606A" font-weight="600" text-anchor="start">同一张证书 /etc/nginx/ssl/harbor.crt 装进三处</text>
<rect x="48.0" y="332.0" width="488.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#1F9E77" stroke-width="1.3"/>
<text x="292.0" y="363.3" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">系统信任库</text>
<text x="292.0" y="385.9" font-size="12" fill="#57606A" text-anchor="middle">/etc/pki/ca-trust/source/anchors/harbor-ca.crt</text>
<text x="292.0" y="403.9" font-size="12" fill="#57606A" text-anchor="middle">→ update-ca-trust extract；多数程序读这里</text>
<rect x="556.0" y="332.0" width="488.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#1F9E77" stroke-width="1.3"/>
<text x="800.0" y="363.3" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">docker 信任目录</text>
<text x="800.0" y="385.9" font-size="12" fill="#57606A" text-anchor="middle">/etc/docker/certs.d/harbor:443/ca.crt</text>
<text x="800.0" y="403.9" font-size="12" fill="#57606A" text-anchor="middle">→ docker daemon 读这里</text>
<rect x="1064.0" y="332.0" width="488.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1308.0" y="363.3" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">SSL_CERT_FILE</text>
<text x="1308.0" y="385.9" font-size="12" fill="#57606A" text-anchor="middle">template-manager.hcl 的 env</text>
<text x="1308.0" y="403.9" font-size="12" fill="#57606A" text-anchor="middle">→ 进程一定信任这张证书</text>
<rect x="48.0" y="466.0" width="1504.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="488.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">缺了哪一环</text>
<text x="678.0" y="488.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">建模板时的报错</text>
<line x1="48.0" y1="548.5" x2="1552.0" y2="548.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="531.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">/etc/hosts 没有 harbor（-s 写入）</text>
<text x="678.0" y="531.1" font-size="13.5" fill="#1F2328" text-anchor="start">lookup harbor on 127.0.0.1:53: server misbehaving</text>
<line x1="48.0" y1="590.8" x2="1552.0" y2="590.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="573.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">证书没被信任</text>
<text x="678.0" y="573.3" font-size="13.5" fill="#1F2328" text-anchor="start">x509: certificate signed by unknown authority</text>
<line x1="48.0" y1="633.0" x2="1552.0" y2="633.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="615.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">证书过期（365 天）</text>
<text x="678.0" y="615.6" font-size="13.5" fill="#1F2328" text-anchor="start">x509: certificate has expired</text>
<line x1="48.0" y1="675.2" x2="1552.0" y2="675.2" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="657.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">Nginx 没起来</text>
<text x="678.0" y="657.8" font-size="13.5" fill="#1F2328" text-anchor="start">connection refused</text>
<line x1="48.0" y1="717.5" x2="1552.0" y2="717.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="700.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">Harbor 里没有基础镜像（-s 推送）</text>
<text x="678.0" y="700.1" font-size="13.5" fill="#1F2328" text-anchor="start">manifest unknown</text>
<line x1="48.0" y1="733.5" x2="1552.0" y2="733.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="759.5" font-size="13" fill="#8C959F" text-anchor="start">注：推送镜像走 IP:2900（明文），拉取走 harbor:443（HTTPS），两者是同一个仓库。</text></svg>