<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="616" viewBox="0 0 1600 616" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="616" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">deploy.sh 的三段</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">先 source .env（set -a 导出）。--only &lt;job&gt; 时跳过第一段和第三段，只渲染并提交那一个 job，这就是 build.sh -r。</text>
<rect x="48.0" y="150.0" width="474.7" height="54.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="285.3" y="182.3" font-size="16.5" fill="#8A5300" font-weight="600" text-anchor="middle">① 构建并推送镜像</text>
<rect x="48.0" y="220.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.3"/>
<text x="285.3" y="246.9" font-size="13" fill="#57606A" text-anchor="middle">bin/*.Dockerfile 逐个 docker build</text>
<rect x="48.0" y="274.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.3"/>
<text x="285.3" y="300.9" font-size="13" fill="#57606A" text-anchor="middle">api、client-proxy、db-migrator</text>
<rect x="48.0" y="328.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.3"/>
<text x="285.3" y="354.9" font-size="13" fill="#57606A" text-anchor="middle">（orchestrator.Dockerfile 已被删）</text>
<rect x="48.0" y="382.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.3"/>
<text x="285.3" y="408.9" font-size="13" fill="#57606A" text-anchor="middle">redis:7.4.4-alpine 打标签推送</text>
<rect x="48.0" y="436.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.3"/>
<text x="285.3" y="462.9" font-size="13" fill="#57606A" text-anchor="middle">DOCKER_BUILDKIT=0</text>
<rect x="48.0" y="490.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.3"/>
<text x="285.3" y="516.9" font-size="13" fill="#57606A" text-anchor="middle">需要本机已有 debian:bookworm-slim</text>
<path d="M526.7 177.0 L558.7 177.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="562.7" y="150.0" width="474.7" height="54.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="182.3" font-size="16.5" fill="#1D4F91" font-weight="600" text-anchor="middle">② 渲染并提交 job</text>
<rect x="562.7" y="220.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="246.9" font-size="13" fill="#57606A" text-anchor="middle">envsubst '&lt;约 100 个变量的白名单&gt;'</text>
<rect x="562.7" y="274.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="300.9" font-size="13" fill="#57606A" text-anchor="middle">nomad/*.hcl → rendered/*.hcl</text>
<rect x="562.7" y="328.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="354.9" font-size="13" fill="#57606A" text-anchor="middle">$${NOMAD_PORT_proxy} 之类原样保留</text>
<rect x="562.7" y="382.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="408.9" font-size="13" fill="#57606A" text-anchor="middle">nomad job run --token ... 依次：</text>
<rect x="562.7" y="436.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="462.9" font-size="13" fill="#57606A" text-anchor="middle">redis → template-manager → edge → api</text>
<path d="M1041.3 177.0 L1073.3 177.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1077.3" y="150.0" width="474.7" height="54.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1314.7" y="182.3" font-size="16.5" fill="#0E6B4F" font-weight="600" text-anchor="middle">③ 初始化数据</text>
<rect x="1077.3" y="220.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1314.7" y="246.9" font-size="13" fill="#57606A" text-anchor="middle">teams 里没有 E2B 才执行</text>
<rect x="1077.3" y="274.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1314.7" y="300.9" font-size="13" fill="#57606A" text-anchor="middle">echo admin@e2b.dev | seed-db</text>
<rect x="1077.3" y="328.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1314.7" y="354.9" font-size="13" fill="#57606A" text-anchor="middle">摘出 Team ID、Access Token、Team API Key</text>
<rect x="1077.3" y="382.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1314.7" y="408.9" font-size="13" fill="#57606A" text-anchor="middle">写 /root/.e2b/config.json</text>
<rect x="1077.3" y="436.0" width="474.7" height="46.0" rx="10" fill="#FFFFFF" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1314.7" y="462.9" font-size="13" fill="#57606A" text-anchor="middle">UPDATE tiers … base_v1 → 10000</text>
<line x1="48.0" y1="550.0" x2="1552.0" y2="550.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="576.0" font-size="13" fill="#8C959F" text-anchor="start">注：文件名和 job 名不一定一样：edge.hcl 里的 job 叫 client-proxy，template-manager.hcl 里的叫 template-manager-system。</text></svg>