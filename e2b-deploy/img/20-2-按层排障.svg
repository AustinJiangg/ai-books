<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="696" viewBox="0 0 1600 696" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="696" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">按层排障：从下往上，报错在哪层，原因多在下一层</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">每一层先跑一条命令；通过就往上走，不通过就在这一层找。最典型的例子：api 一直 503，原因几乎总在 template-manager。</text>
<rect x="48.0" y="530.0" width="170.0" height="76.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="133.0" y="573.1" font-size="16" fill="#3D3C38" font-weight="600" text-anchor="middle">机器</text>
<rect x="238.0" y="530.0" width="810.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="252.0" y="559.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">nbds_max；ip_forward；HugePages_*</text>
<text x="252.0" y="582.9" font-size="12.5" fill="#57606A" text-anchor="start">正常：512；1；有大页</text>
<path d="M133.0 528.0 L133.0 512.0" fill="none" stroke="#1F9E77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<rect x="48.0" y="434.0" width="170.0" height="76.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="133.0" y="477.1" font-size="16" fill="#8A5300" font-weight="600" text-anchor="middle">宿主服务</text>
<rect x="238.0" y="434.0" width="810.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="252.0" y="463.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">systemctl --failed；docker ps -a</text>
<text x="252.0" y="486.9" font-size="12.5" fill="#57606A" text-anchor="start">正常：没有失败的服务、退出的容器</text>
<path d="M133.0 432.0 L133.0 416.0" fill="none" stroke="#1F9E77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<rect x="48.0" y="338.0" width="170.0" height="76.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="133.0" y="381.1" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">调度</text>
<rect x="238.0" y="338.0" width="810.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="252.0" y="367.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">nomad job status；nomad node status</text>
<text x="252.0" y="390.9" font-size="12.5" fill="#57606A" text-anchor="start">正常：4 个 running；1 个 ready</text>
<path d="M133.0 336.0 L133.0 320.0" fill="none" stroke="#1F9E77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<rect x="48.0" y="242.0" width="170.0" height="76.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="133.0" y="285.1" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">业务</text>
<rect x="238.0" y="242.0" width="810.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="252.0" y="271.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">curl :3000/health；curl :3003/health</text>
<text x="252.0" y="294.9" font-size="12.5" fill="#57606A" text-anchor="start">正常：200</text>
<path d="M133.0 240.0 L133.0 224.0" fill="none" stroke="#1F9E77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<rect x="48.0" y="146.0" width="170.0" height="76.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="133.0" y="189.1" font-size="16" fill="#4B3FA8" font-weight="600" text-anchor="middle">沙箱</text>
<rect x="238.0" y="146.0" width="810.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="252.0" y="175.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">建模板、开沙箱</text>
<text x="252.0" y="198.9" font-size="12.5" fill="#57606A" text-anchor="start">正常：看报错，回第 20 篇速查表</text>
<rect x="1088.0" y="146.0" width="464.0" height="200.0" rx="10" fill="#FFFFFF" stroke="#D6603D" stroke-width="1.3"/>
<text x="1320.0" y="219.2" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">两条经验</text>
<text x="1320.0" y="242.4" font-size="12.5" fill="#57606A" text-anchor="middle">报错在哪一层，原因往往在更下面一层</text>
<text x="1320.0" y="261.2" font-size="12.5" fill="#57606A" text-anchor="middle">看日志时确认是当前这次的：/data/nomad/alloc 下有旧 alloc；能力文件要</text>
<text x="1320.0" y="279.9" font-size="12.5" fill="#57606A" text-anchor="middle">核对 PID</text>
<rect x="1088.0" y="366.0" width="464.0" height="240.0" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/>
<text x="1102.0" y="440.4" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">日志在哪</text>
<text x="1102.0" y="463.7" font-size="12.5" fill="#57606A" text-anchor="start">journalctl -u nomad / consul / dnsmasq</text>
<text x="1102.0" y="482.4" font-size="12.5" fill="#57606A" text-anchor="start">docker logs postgres、Harbor 各容器</text>
<text x="1102.0" y="501.2" font-size="12.5" fill="#57606A" text-anchor="start">nomad alloc logs &lt;id&gt; start</text>
<text x="1102.0" y="519.9" font-size="12.5" fill="#57606A" text-anchor="start">/data/nomad/alloc/&lt;id&gt;/alloc/logs/</text>
<text x="1102.0" y="538.7" font-size="12.5" fill="#57606A" text-anchor="start">/var/log/nginx/</text>
<text x="144.0" y="524.0" font-size="12" fill="#0E6B4F" font-weight="600" text-anchor="start">通过就往上</text>
<line x1="48.0" y1="630.0" x2="1552.0" y2="630.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="656.0" font-size="13" fill="#8C959F" text-anchor="start">注：完整的常见问题表按“部署 / 建模板 / 用沙箱 / 运维”四类列在第 20 篇第三节，每条指向讲原理的那一篇。</text></svg>