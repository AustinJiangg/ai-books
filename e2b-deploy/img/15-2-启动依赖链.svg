<text x="58.0" y="648.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">断在哪</text>
<text x="358.0" y="648.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">根因举例</text>
<text x="878.0" y="648.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">先看什么</text>
<line x1="48.0" y1="708.5" x2="1552.0" y2="708.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="691.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">orchestrator 没起来</text>
<text x="358.0" y="691.1" font-size="13.5" fill="#1F2328" text-anchor="start">5007/5008 被上一轮残留占着</text>
<text x="878.0" y="691.1" font-size="13.5" fill="#1F2328" text-anchor="start">nomad job status template-manager-system；ss -lntp</text>
<line x1="48.0" y1="750.8" x2="1552.0" y2="750.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="733.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">起来又死了</text>
<text x="358.0" y="733.3" font-size="13.5" fill="#1F2328" text-anchor="start">内存配额太小被 OOM；NBD 模块没加载</text>
<text x="878.0" y="733.3" font-size="13.5" fill="#1F2328" text-anchor="start">nomad alloc status；dmesg | grep -i oom</text>
<line x1="48.0" y1="793.0" x2="1552.0" y2="793.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="775.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">调度不上</text>
<text x="358.0" y="775.6" font-size="13.5" fill="#1F2328" text-anchor="start">内存配额太大</text>
<text x="878.0" y="775.6" font-size="13.5" fill="#1F2328" text-anchor="start">nomad job status 里的 Placement Failure</text>
<line x1="48.0" y1="835.2" x2="1552.0" y2="835.2" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="817.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">api 连不上数据库</text>
<text x="358.0" y="817.8" font-size="13.5" fill="#1F2328" text-anchor="start">容器没起来、连接串不对</text>
<text x="878.0" y="817.8" font-size="13.5" fill="#1F2328" text-anchor="start">db-migrator 的日志</text>
<line x1="48.0" y1="877.5" x2="1552.0" y2="877.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
