<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="628" viewBox="0 0 1600 628" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="628" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">Nomad 的层级：job → group → task，放到机器上运行一次叫 allocation</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">以 api 为例：一个 group 里两个 task，db-migrator 是前置任务，先跑完；同一个 group 的 task 一定在同一台机器上。</text>
<rect x="48.0" y="152.0" width="1044.0" height="380.0" rx="14" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="68.0" y="182.0" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="start">job "api"</text>
<text x="68.0" y="204.0" font-size="12.5" fill="#57606A" text-anchor="start">node_pool = "api"  ·  type = service  ·  priority = 90</text>
<rect x="72.0" y="224.0" width="996.0" height="290.0" rx="14" fill="#FFFFFF" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="92.0" y="254.0" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="start">group "api-service"</text>
<text x="92.0" y="276.0" font-size="12.5" fill="#57606A" text-anchor="start">network：3000、5009  ·  service：api（/health 检查）  ·  restart</text>
<rect x="96.0" y="302.0" width="462.0" height="190.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="327.0" y="360.8" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">task "db-migrator"</text>
<text x="327.0" y="384.1" font-size="12.5" fill="#57606A" text-anchor="middle">driver = docker</text>
<text x="327.0" y="402.8" font-size="12.5" fill="#57606A" text-anchor="middle">lifecycle { hook = "prestart" }</text>
<text x="327.0" y="421.6" font-size="12.5" fill="#57606A" text-anchor="middle">先跑完、再启动主任务</text>
<text x="327.0" y="440.3" font-size="12.5" fill="#57606A" text-anchor="middle">goose 建表</text>
<rect x="582.0" y="302.0" width="462.0" height="190.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="813.0" y="360.8" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">task "start"</text>
<text x="813.0" y="384.1" font-size="12.5" fill="#57606A" text-anchor="middle">driver = docker</text>
<text x="813.0" y="402.8" font-size="12.5" fill="#57606A" text-anchor="middle">image = .../api</text>
<text x="813.0" y="421.6" font-size="12.5" fill="#57606A" text-anchor="middle">resources：20 GiB、20000 MHz</text>
<text x="813.0" y="440.3" font-size="12.5" fill="#57606A" text-anchor="middle">env { NOMAD_TOKEN ... }</text>
<path d="M560.0 397.0 L580.0 397.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1132.0" y="152.0" width="420.0" height="110.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1342.0" y="189.5" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">allocation 3f1c2a9e</text>
<text x="1342.0" y="212.8" font-size="12.5" fill="#57606A" text-anchor="middle">group 在节点 8a7d6c5b 上的一次运行</text>
<text x="1342.0" y="231.5" font-size="12.5" fill="#57606A" text-anchor="middle">Desired: run   Status: running</text>
<rect x="1132.0" y="282.0" width="420.0" height="110.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1342.0" y="319.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">driver 决定怎么跑</text>
<text x="1342.0" y="342.8" font-size="12.5" fill="#57606A" text-anchor="middle">docker：拉镜像起容器</text>
<text x="1342.0" y="361.6" font-size="12.5" fill="#57606A" text-anchor="middle">raw_exec：直接在宿主机上执行命令</text>
<rect x="1132.0" y="412.0" width="420.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1342.0" y="445.2" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">job 类型</text>
<text x="1342.0" y="468.4" font-size="12.5" fill="#57606A" text-anchor="middle">service：跑 count 份</text>
<text x="1342.0" y="487.2" font-size="12.5" fill="#57606A" text-anchor="middle">system：每个符合条件的节点一份</text>
<text x="1342.0" y="505.9" font-size="12.5" fill="#57606A" text-anchor="middle">（template-manager-system）</text>
<path d="M1096.0 207.0 L1128.0 207.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<text x="1112.0" y="199.0" font-size="12.5" fill="#1F2328" font-weight="600" text-anchor="middle">调度</text>
<line x1="48.0" y1="562.0" x2="1552.0" y2="562.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="588.0" font-size="13" fill="#8C959F" text-anchor="start">注：nomad job run 只在 job 定义有差异时才替换 allocation；只换了二进制、hcl 一字未改时，它什么都不做（第 19 篇）。</text></svg>