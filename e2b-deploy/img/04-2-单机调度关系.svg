<text x="228.5" y="370.3" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">redis</text>
<text x="228.5" y="392.9" font-size="12" fill="#57606A" text-anchor="middle">docker</text>
<path d="M228.5 314.0 L228.5 336.0" fill="none" stroke="#5B9BE6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m5B9BE6)"/>
