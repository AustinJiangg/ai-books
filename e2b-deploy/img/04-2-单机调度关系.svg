<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="706" viewBox="0 0 1600 706" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m5B9BE6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#5B9BE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="706" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">单机上的 Nomad、Consul、dnsmasq 与 docker</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">systemd 守护四个基础服务；Nomad 一个进程兼任 server 和 client，用 docker 跑 3 个 job、用 raw_exec 跑 orchestrator；Consul 记录服务，dnsmasq 让普通程序也能查到 .consul 名字。</text>
<rect x="48.0" y="150.0" width="1504.0" height="140.0" rx="14" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="68.0" y="180.0" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="start">systemd</text>
<rect x="68.0" y="194.0" width="351.0" height="80.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="243.5" y="217.3" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">nomad</text>
<text x="243.5" y="239.9" font-size="12" fill="#57606A" text-anchor="middle">server + client</text>
<text x="243.5" y="257.9" font-size="12" fill="#57606A" text-anchor="middle">:4646 界面</text>
<rect x="439.0" y="194.0" width="351.0" height="80.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="614.5" y="226.3" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">consul</text>
<text x="614.5" y="248.9" font-size="12" fill="#57606A" text-anchor="middle">:8500 HTTP · :8600 DNS</text>
<rect x="810.0" y="194.0" width="351.0" height="80.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="985.5" y="226.3" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">dnsmasq</text>
<text x="985.5" y="248.9" font-size="12" fill="#57606A" text-anchor="middle">:53 所有程序的 DNS 入口</text>
<rect x="1181.0" y="194.0" width="351.0" height="80.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1356.5" y="226.3" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">docker</text>
<text x="1356.5" y="248.9" font-size="12" fill="#57606A" text-anchor="middle">跑容器</text>
<line x1="243.5" y1="274.0" x2="243.5" y2="314.0" stroke="#5B9BE6" stroke-width="1.4" stroke-linecap="round"/>
