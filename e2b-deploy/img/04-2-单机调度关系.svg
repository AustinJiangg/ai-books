<text x="1371.5" y="370.3" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">template-manager-system</text>
<text x="1371.5" y="392.9" font-size="12" fill="#57606A" text-anchor="middle">raw_exec：/usr/bin/template-manager</text>
<path d="M1371.5 314.0 L1371.5 336.0" fill="none" stroke="#5B9BE6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m5B9BE6)"/>
<rect x="48.0" y="470.0" width="700.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="62.0" y="522.6" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">Consul 服务目录</text>
<text x="62.0" y="545.8" font-size="12.5" fill="#57606A" text-anchor="start">redis · template-manager · client-proxy · api · api-grpc</text>
<text x="62.0" y="564.6" font-size="12.5" fill="#57606A" text-anchor="start">Nomad 启动 alloc 时自动注册，健康检查不过就摘掉</text>
<rect x="788.0" y="470.0" width="764.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="802.0" y="503.8" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">dnsmasq 的三类名字</text>
<text x="802.0" y="527.1" font-size="12.5" fill="#57606A" text-anchor="start">*.consul → 转给 127.0.0.1:8600（Consul）</text>
<text x="802.0" y="545.8" font-size="12.5" fill="#57606A" text-anchor="start">*.e2b.app → 127.0.0.1</text>
<text x="802.0" y="564.6" font-size="12.5" fill="#57606A" text-anchor="start">harbor → /etc/hosts 里的本机 IP</text>
<text x="802.0" y="583.3" font-size="12.5" fill="#57606A" text-anchor="start">其他 → 上游 DNS</text>
<line x1="48.0" y1="640.0" x2="1552.0" y2="640.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="666.0" font-size="13" fill="#8C959F" text-anchor="start">注：api 找 orchestrator 不走 Consul，而是用 NOMAD_TOKEN 问 Nomad 哪些节点就绪，再连 &lt;节点&gt;:5008。</text></svg>