<text x="609.5" y="392.9" font-size="12" fill="#57606A" text-anchor="middle">docker</text>
<path d="M609.5 314.0 L609.5 336.0" fill="none" stroke="#5B9BE6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m5B9BE6)"/>
<rect x="810.0" y="340.0" width="361.0" height="76.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="990.5" y="370.3" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">api</text>
