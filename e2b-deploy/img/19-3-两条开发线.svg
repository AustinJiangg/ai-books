<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="706" viewBox="0 0 1600 706" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m5B9BE6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#5B9BE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="706" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">两条开发线：日常不打包，阶段收尾才出补丁和 RPM</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">补丁文件不能手改，所以要有一棵“已经打好补丁的源码树”：在里面正常写代码，最后用 git diff 生成新补丁。RPM 的价值在于可重复地装到另一台机器上。</text>
<rect x="48.0" y="150.0" width="732.0" height="110.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="414.0" y="187.9" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">交付仓库（本书讲的这个）</text>
<text x="414.0" y="211.1" font-size="12.5" fill="#57606A" text-anchor="middle">补丁、spec、原料、e2b-deploy/；没有展开的源码</text>
<text x="414.0" y="229.9" font-size="12.5" fill="#57606A" text-anchor="middle">推到远端</text>
<rect x="820.0" y="150.0" width="732.0" height="110.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1186.0" y="187.9" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">源码工作树（纯本地）</text>
<text x="1186.0" y="211.1" font-size="12.5" fill="#57606A" text-anchor="middle">源码包解开 + git 基线 + 打上补丁</text>
<text x="1186.0" y="229.9" font-size="12.5" fill="#57606A" text-anchor="middle">不推到任何地方；唯一产物是新补丁</text>
<text x="48.0" y="300.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">日常循环（一轮几分钟）</text>
<rect x="48.0" y="316.0" width="273.6" height="104.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="184.8" y="360.1" font-size="14.5" fill="#1D4F91" font-weight="600" text-anchor="middle">改代码</text>
<text x="184.8" y="382.7" font-size="12" fill="#57606A" text-anchor="middle">在源码工作树</text>
<path d="M325.6 368.0 L351.6 368.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="355.6" y="316.0" width="273.6" height="104.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="492.4" y="360.1" font-size="14.5" fill="#1D4F91" font-weight="600" text-anchor="middle">make build</text>
<text x="492.4" y="382.7" font-size="12" fill="#57606A" text-anchor="middle">只编改动的模块</text>
<path d="M633.2 368.0 L659.2 368.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="663.2" y="316.0" width="273.6" height="104.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="800.0" y="351.1" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">拷到运行位置</text>
<text x="800.0" y="373.7" font-size="12" fill="#57606A" text-anchor="middle">orchestrator → /usr/bin（先删后拷）</text>
<text x="800.0" y="391.7" font-size="12" fill="#57606A" text-anchor="middle">envd → /fc-envd</text>
<path d="M940.8 368.0 L966.8 368.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="970.8" y="316.0" width="273.6" height="104.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1107.6" y="351.1" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">让它重新跑</text>
<text x="1107.6" y="373.7" font-size="12" fill="#57606A" text-anchor="middle">-r 或 stop + run</text>
<text x="1107.6" y="391.7" font-size="12" fill="#57606A" text-anchor="middle">api 重建镜像；envd 重建模板</text>
<path d="M1248.4 368.0 L1274.4 368.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1278.4" y="316.0" width="273.6" height="104.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1415.2" y="360.1" font-size="14.5" fill="#0E6B4F" font-weight="600" text-anchor="middle">验证</text>
<text x="1415.2" y="382.7" font-size="12" fill="#57606A" text-anchor="middle">特征串</text>
<path d="M1452.0 424.0 L1452.0 450.0 L148.0 450.0 L148.0 424.0" fill="none" stroke="#5B9BE6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m5B9BE6)"/>
<text x="48.0" y="500.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">阶段收尾（一个功能做完才做一次）</text>
<rect x="48.0" y="516.0" width="273.6" height="90.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="184.8" y="553.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">git commit</text>
<text x="184.8" y="575.7" font-size="12" fill="#57606A" text-anchor="middle">源码工作树</text>
<path d="M325.6 561.0 L351.6 561.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="355.6" y="516.0" width="273.6" height="90.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="492.4" y="553.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">git diff 基线 HEAD</text>
<text x="492.4" y="575.7" font-size="12" fill="#57606A" text-anchor="middle">→ 0001-…patch</text>
<path d="M633.2 561.0 L659.2 561.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="663.2" y="516.0" width="273.6" height="90.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="800.0" y="553.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">patch --dry-run</text>
<text x="800.0" y="575.7" font-size="12" fill="#57606A" text-anchor="middle">在干净源码上验证</text>
<path d="M940.8 561.0 L966.8 561.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="970.8" y="516.0" width="273.6" height="90.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1107.6" y="553.1" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">rpmbuild + rpm -Uvh</text>
<text x="1107.6" y="575.7" font-size="12" fill="#57606A" text-anchor="middle">再重放覆盖</text>
<path d="M1248.4 561.0 L1274.4 561.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1278.4" y="516.0" width="273.6" height="90.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1415.2" y="565.6" font-size="14.5" fill="#0E6B4F" font-weight="600" text-anchor="middle">提交交付仓库</text>
<line x1="48.0" y1="640.0" x2="1552.0" y2="640.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="666.0" font-size="13" fill="#8C959F" text-anchor="start">注：详细流程见仓库的 deploy-docs/08-源码开发与出包流程.md。</text></svg>