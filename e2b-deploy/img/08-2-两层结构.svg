<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="654" viewBox="0 0 1600 654" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="654" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">完整部署 = RPM 底座 + dep/ 覆盖 + 运行时生成物</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">实际生效的是 dep/ 的单机版。rpm -Uvh 会把根目录打回上游版，所以升级后要重放覆盖；而 -i 会顺手覆盖 .env，冲掉真令牌。</text>
<rect x="48.0" y="150.0" width="1040.0" height="120.0" rx="14" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="68.0" y="180.0" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="start">③ 运行时生成物</text>
<text x="68.0" y="202.0" font-size="12.5" fill="#57606A" text-anchor="start">-s、deploy.sh、各脚本写出；RPM 永不触碰</text>
<text x="68.0" y="232.0" font-size="13" fill="#1F2328" text-anchor="start">.env 里的真 ACL 令牌 · rendered/*.hcl · /usr/bin/template-manager · /etc/nomad.d、/etc/consul.d、/etc/dnsmasq* · /data/nomad/acl.token · SDK 补丁</text>
<rect x="48.0" y="294.0" width="1040.0" height="120.0" rx="14" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="68.0" y="324.0" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="start">② dep/ 覆盖</text>
<text x="68.0" y="346.0" font-size="12.5" fill="#57606A" text-anchor="start">build.sh -i 从 dep/ 拷到根目录</text>
<text x="68.0" y="376.0" font-size="13" fill="#1F2328" text-anchor="start">单机版 deploy.sh（有 --only）· start-*.sh · init-client.sh · run-*.sh · nomad/template-manager.hcl · 根目录 .env</text>
<rect x="48.0" y="438.0" width="1040.0" height="120.0" rx="14" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="68.0" y="468.0" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="start">① RPM 底座</text>
<text x="68.0" y="490.0" font-size="12.5" fill="#57606A" text-anchor="start">rpm -ivh / -Uvh 整层重铺</text>
<text x="68.0" y="520.0" font-size="13" fill="#1F2328" text-anchor="start">bin/* · nomad/*.hcl（上游版）· 根目录 deploy.sh 等（上游版）· dep/*（含 dep/.env）· build.sh</text>
<rect x="1128.0" y="150.0" width="424.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1340.0" y="201.9" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">build.sh -i</text>
<text x="1340.0" y="225.2" font-size="12.5" fill="#57606A" text-anchor="middle">重做第②层；但也把 dep/.env 拷到根目录，冲掉第③层的真令牌</text>
<rect x="1128.0" y="294.0" width="424.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#D6603D" stroke-width="1.3"/>
<text x="1340.0" y="336.6" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">rpm -Uvh</text>
<text x="1340.0" y="359.8" font-size="12.5" fill="#57606A" text-anchor="middle">只重铺第①层，却让第②层失效：deploy.sh 丢 --only，</text>
<text x="1340.0" y="378.6" font-size="12.5" fill="#57606A" text-anchor="middle">template-manager.hcl 变回上游版</text>
<rect x="1128.0" y="438.0" width="424.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/>
<text x="1340.0" y="489.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">-d + -s</text>
<text x="1340.0" y="513.2" font-size="12.5" fill="#57606A" text-anchor="middle">重建第③层：集群从零开始，令牌换新</text>
<line x1="48.0" y1="588.0" x2="1552.0" y2="588.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="614.0" font-size="13" fill="#8C959F" text-anchor="start">注：升级 RPM 后重放覆盖时，要拷 dep/ 下除 .env 以外的文件（第 19 篇）。</text></svg>