<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="659" viewBox="0 0 1600 659" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="659" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">SDK 的三层改造：先整文件覆盖，最后做文本替换</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">装好 e2b==2.20.0、e2b_code_interpreter==2.4.1 之后，install_e2b 依次做三层。connection_config.py 三层都动过：最终起作用的是第二层那份，再被第三层改成 http。</text>
<circle cx="62.0" cy="216.6" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="221.1" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<rect x="88.0" y="150.0" width="960.0" height="133.1" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="102.0" y="180.7" font-size="16" fill="#8A5300" font-weight="600" text-anchor="start">第一层：替换 5 个文件（cp）</text>
<text x="102.0" y="203.9" font-size="12.5" fill="#57606A" text-anchor="start">connection_config.py：api、沙箱地址改 http</text>
<text x="102.0" y="222.7" font-size="12.5" fill="#57606A" text-anchor="start">dockerfile_parser.py：保留 Dockerfile 的 USER、WORKDIR</text>
<text x="102.0" y="241.4" font-size="12.5" fill="#57606A" text-anchor="start">template_sync/build_api.py、main.py：建模板走老接口 POST /templates，access token + API key 双客户端</text>
<text x="102.0" y="260.2" font-size="12.5" fill="#57606A" text-anchor="start">code_interpreter_sync.py：与原版相同</text>
<path d="M62.0 230.6 L62.0 303.1" fill="none" stroke="#1F2328" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<circle cx="62.0" cy="366.3" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="370.8" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<rect x="88.0" y="309.1" width="960.0" height="114.4" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="102.0" y="339.8" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="start">第二层：checkpoint 覆盖层（install.py）</text>
<text x="102.0" y="363.1" font-size="12.5" fill="#57606A" text-anchor="start">21 个文件：12 个新增，9 个覆盖（留 .orig）</text>
<text x="102.0" y="381.8" font-size="12.5" fill="#57606A" text-anchor="start">加 sandbox.checkpoint.create() / restore()</text>
<text x="102.0" y="400.6" font-size="12.5" fill="#57606A" text-anchor="start">版本不是 2.20.0 就停；装完自检</text>
<path d="M62.0 380.3 L62.0 443.5" fill="none" stroke="#1F2328" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<circle cx="62.0" cy="506.7" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
<text x="62.0" y="511.2" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<rect x="88.0" y="449.5" width="960.0" height="114.4" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="102.0" y="480.2" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="start">第三层：patch_e2b.py（文本替换）</text>
<text x="102.0" y="503.4" font-size="12.5" fill="#57606A" text-anchor="start">connection_config.py 全文 https → http</text>
<text x="102.0" y="522.2" font-size="12.5" fill="#57606A" text-anchor="start">code_interpreter（同步、异步）的 Jupyter 地址</text>
<text x="102.0" y="540.9" font-size="12.5" fill="#57606A" text-anchor="start">volume、MCP 地址（可选）；留 .backup，清 __pycache__</text>
<rect x="1088.0" y="150.0" width="464.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#D6603D" stroke-width="1.3"/>
<text x="1320.0" y="198.2" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">顺序反了会怎样</text>
<text x="1320.0" y="221.4" font-size="12.5" fill="#57606A" text-anchor="middle">patch_e2b.py 先把 https 改成 http</text>
<text x="1320.0" y="240.2" font-size="12.5" fill="#57606A" text-anchor="middle">→ checkpoint 覆盖层整文件盖回自带版本</text>
<text x="1320.0" y="258.9" font-size="12.5" fill="#57606A" text-anchor="middle">→ 又是 https，连不上</text>
<rect x="1088.0" y="320.0" width="464.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/>
<text x="1320.0" y="368.2" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">在别的机器上用 SDK</text>
<text x="1320.0" y="391.4" font-size="12.5" fill="#57606A" text-anchor="middle">装同样版本；至少跑 patch_e2b.py</text>
<text x="1320.0" y="410.2" font-size="12.5" fill="#57606A" text-anchor="middle">要建模板还得替换那 5 个文件</text>
<text x="1320.0" y="428.9" font-size="12.5" fill="#57606A" text-anchor="middle">自己把 *.e2b.app 解析到服务器</text>
<line x1="48.0" y1="593.9" x2="1552.0" y2="593.9" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="619.9" font-size="13" fill="#8C959F" text-anchor="start">注：所以用户的 .env 里既要 E2B_API_KEY，又要 E2B_ACCESS_TOKEN：建模板时两个都要用。</text></svg>