<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="720" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">第 0 步：执行 build.sh 之前，机器要自己备好的东西</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">这些事脚本不管或只管一半。每张卡片下半截是“不做会怎样”，报错往往离原因很远。</text>
<rect x="48.0" y="146.0" width="362.5" height="150.0" rx="10" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="64.0" y="176.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">硬件与系统</text>
<text x="64.0" y="200.0" font-size="12.5" fill="#57606A" text-anchor="start">鲲鹏、BIOS 开虚拟化、/dev/kvm、openEuler</text>
<rect x="49.0" y="244.0" width="360.5" height="51.0" rx="9" fill="#FCEDE8" stroke="none" stroke-width="0"/>
<text x="64.0" y="266.0" font-size="12.5" fill="#9A3215" text-anchor="start">不做：Firecracker 起不来</text>
<rect x="428.5" y="146.0" width="362.5" height="150.0" rx="10" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="444.5" y="176.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">Docker + Compose v2</text>
<text x="444.5" y="200.0" font-size="12.5" fill="#57606A" text-anchor="start">docker ≥ 25.0.3；源里的 docker-compose 1.22 不行</text>
<rect x="429.5" y="244.0" width="360.5" height="51.0" rx="9" fill="#FCEDE8" stroke="none" stroke-width="0"/>
<text x="444.5" y="266.0" font-size="12.5" fill="#9A3215" text-anchor="start">不做：装 Harbor 报 Unsupported config option</text>
<rect x="809.0" y="146.0" width="362.5" height="150.0" rx="10" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="825.0" y="176.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">insecure-registries</text>
<text x="825.0" y="200.0" font-size="12.5" fill="#57606A" text-anchor="start">daemon.json 加 &lt;IP&gt;:2900，合并而非覆盖</text>
<rect x="810.0" y="244.0" width="360.5" height="51.0" rx="9" fill="#FCEDE8" stroke="none" stroke-width="0"/>
<text x="825.0" y="266.0" font-size="12.5" fill="#9A3215" text-anchor="start">不做：push 镜像失败</text>
<rect x="1189.5" y="146.0" width="362.5" height="150.0" rx="10" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="1205.5" y="176.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">nbd 模块固化</text>
<text x="1205.5" y="200.0" font-size="12.5" fill="#57606A" text-anchor="start">自编译 nbd.ko，nbds_max=512，开机加载</text>
<rect x="1190.5" y="244.0" width="360.5" height="51.0" rx="9" fill="#FCEDE8" stroke="none" stroke-width="0"/>
<text x="1205.5" y="266.0" font-size="12.5" fill="#9A3215" text-anchor="start">不做：NBD module not loaded；升级内核后悄悄失效</text>
<rect x="48.0" y="314.0" width="362.5" height="150.0" rx="10" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="64.0" y="344.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">SELinux permissive</text>
<text x="64.0" y="368.0" font-size="12.5" fill="#57606A" text-anchor="start">写进 /etc/selinux/config</text>
<rect x="49.0" y="412.0" width="360.5" height="51.0" rx="9" fill="#FCEDE8" stroke="none" stroke-width="0"/>
<text x="64.0" y="434.0" font-size="12.5" fill="#9A3215" text-anchor="start">不做：重启后 Nomad、Consul 报 203/EXEC</text>
<rect x="428.5" y="314.0" width="362.5" height="150.0" rx="10" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="444.5" y="344.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">IP 转发</text>
<text x="444.5" y="368.0" font-size="12.5" fill="#57606A" text-anchor="start">openEuler 的 sysctl.conf 写死了 0；新脚本会改</text>
<rect x="429.5" y="412.0" width="360.5" height="51.0" rx="9" fill="#FCEDE8" stroke="none" stroke-width="0"/>
<text x="444.5" y="434.0" font-size="12.5" fill="#9A3215" text-anchor="start">不做：建模板等 envd 60 秒超时</text>
<rect x="809.0" y="314.0" width="362.5" height="150.0" rx="10" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="825.0" y="344.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">resolv.conf</text>
<text x="825.0" y="368.0" font-size="12.5" fill="#57606A" text-anchor="start">NetworkManager 设 dns=none</text>
<rect x="810.0" y="412.0" width="360.5" height="51.0" rx="9" fill="#FCEDE8" stroke="none" stroke-width="0"/>
<text x="825.0" y="434.0" font-size="12.5" fill="#9A3215" text-anchor="start">不做：网卡重连后 e2b 域名解析失效</text>
<rect x="1189.5" y="314.0" width="362.5" height="150.0" rx="10" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="1205.5" y="344.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">离线大件放进 dep/</text>
<text x="1205.5" y="368.0" font-size="12.5" fill="#57606A" text-anchor="start">consul、nomad（≥ 1.11.2）zip、Harbor 包、minio</text>
<rect x="1190.5" y="412.0" width="360.5" height="51.0" rx="9" fill="#FCEDE8" stroke="none" stroke-width="0"/>
<text x="1205.5" y="434.0" font-size="12.5" fill="#9A3215" text-anchor="start">不做：-i/-s 找不到文件；旧 Nomad 遇 NUMA panic</text>
<rect x="48.0" y="482.0" width="362.5" height="150.0" rx="10" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="64.0" y="512.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">docker load 三个镜像</text>
<text x="64.0" y="536.0" font-size="12.5" fill="#57606A" text-anchor="start">postgres:latest、redis:7.4.4-alpine、</text>
<text x="64.0" y="555.0" font-size="12.5" fill="#57606A" text-anchor="start">debian:bookworm-slim</text>
<rect x="49.0" y="580.0" width="360.5" height="51.0" rx="9" fill="#FCEDE8" stroke="none" stroke-width="0"/>
<text x="64.0" y="602.0" font-size="12.5" fill="#9A3215" text-anchor="start">不做：-i 报镜像不存在；构建镜像卡住</text>
<rect x="428.5" y="482.0" width="362.5" height="150.0" rx="10" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="444.5" y="512.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">yum 源、pip 源</text>
<text x="444.5" y="536.0" font-size="12.5" fill="#57606A" text-anchor="start">dnsmasq、nginx；e2b SDK</text>
<rect x="429.5" y="580.0" width="360.5" height="51.0" rx="9" fill="#FCEDE8" stroke="none" stroke-width="0"/>
<text x="444.5" y="602.0" font-size="12.5" fill="#9A3215" text-anchor="start">不做：-i 安装失败</text>
<rect x="809.0" y="482.0" width="362.5" height="150.0" rx="10" fill="#FFFFFF" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="825.0" y="512.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">SERVER_IP</text>
<text x="825.0" y="536.0" font-size="12.5" fill="#57606A" text-anchor="start">dep/.env 第一行，取默认路由的源地址</text>
<rect x="810.0" y="580.0" width="360.5" height="51.0" rx="9" fill="#FCEDE8" stroke="none" stroke-width="0"/>
<text x="825.0" y="602.0" font-size="12.5" fill="#9A3215" text-anchor="start">不做：check_host_ip 拦下；不拦的话 504 误导</text>
<line x1="48.0" y1="654.0" x2="1552.0" y2="654.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="680.0" font-size="13" fill="#8C959F" text-anchor="start">注：这些属于“装一次机器做一次”的事，和内核、硬件绑定，所以不放进每次都执行的部署脚本。</text></svg>