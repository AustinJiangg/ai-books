<rect x="660.0" y="150.0" width="280.0" height="74.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="800.0" y="179.2" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">build.sh -d</text>
