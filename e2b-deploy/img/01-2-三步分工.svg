<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="630" viewBox="0 0 1600 630" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="630" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">三步各负责什么：前两步只备料，第三步才真正改机器</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">第一步拿到原料，第二步把原料加工成 /opt/e2b-infra 里的成品，机器本身都没变；build.sh 的 -d、-i、-s 才动机器的各层。</text>
<rect x="48.0" y="150.0" width="280.0" height="74.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="188.0" y="179.2" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">第一步：下载仓库</text>
<text x="188.0" y="202.5" font-size="12.5" fill="#57606A" text-anchor="middle">git clone + git lfs pull</text>
<rect x="56.0" y="240.0" width="264.0" height="36.8" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="188.0" y="262.1" font-size="12.5" fill="#57606A" text-anchor="middle">上游源码包（带 vendor）</text>
<rect x="56.0" y="284.8" width="264.0" height="36.8" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="188.0" y="306.9" font-size="12.5" fill="#57606A" text-anchor="middle">ARM 补丁</text>
<rect x="56.0" y="329.5" width="264.0" height="36.8" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="188.0" y="351.6" font-size="12.5" fill="#57606A" text-anchor="middle">Firecracker、客户机内核</text>
<rect x="56.0" y="374.2" width="264.0" height="36.8" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="188.0" y="396.4" font-size="12.5" fill="#57606A" text-anchor="middle">部署脚本 e2b-deploy/</text>
<path d="M331.0 187.0 L351.0 187.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="354.0" y="150.0" width="280.0" height="74.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="494.0" y="179.2" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">第二步：打 RPM、安装</text>
<text x="494.0" y="202.5" font-size="12.5" fill="#57606A" text-anchor="middle">rpmbuild + rpm -ivh</text>
<rect x="362.0" y="240.0" width="264.0" height="55.5" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="494.0" y="262.1" font-size="12.5" fill="#57606A" text-anchor="middle">编译 api、client-proxy、</text>
<text x="494.0" y="280.9" font-size="12.5" fill="#57606A" text-anchor="middle">orchestrator、envd</text>
<rect x="362.0" y="303.5" width="264.0" height="36.8" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="494.0" y="325.6" font-size="12.5" fill="#57606A" text-anchor="middle">摆进 /opt/e2b-infra</text>
<rect x="362.0" y="348.2" width="264.0" height="36.8" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="494.0" y="370.4" font-size="12.5" fill="#57606A" text-anchor="middle">内核、Firecracker、job 模板就位</text>
