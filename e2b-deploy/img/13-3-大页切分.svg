<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="695" viewBox="0 0 1600 695" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="695" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">大页怎么切：三刀</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">第一刀给系统留普通内存 max(4 GiB, 16%)，最多 42 GiB；剩下的都算大页内存。第三刀：20% 立即划走做静态池（上限 HUGEPAGES_BASE_MAX_MIB，默认 64 GiB），80% 做超分配上限。</text>
<text x="48.0" y="164.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">例一：总内存 256 GiB</text>
<rect x="48.0" y="176.0" width="238.9" height="70.0" rx="6" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="60.0" y="206.0" font-size="14" fill="#3D3C38" font-weight="600" text-anchor="start">保留 41 GiB</text>
<text x="60.0" y="228.0" font-size="12.5" fill="#57606A" text-anchor="start">16%</text>
<rect x="288.9" y="176.0" width="250.6" height="70.0" rx="6" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="300.9" y="206.0" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="start">静态池 43 GiB</text>
<text x="300.9" y="228.0" font-size="12.5" fill="#57606A" text-anchor="start">20%，未到上限</text>
<rect x="541.5" y="176.0" width="1008.5" height="70.0" rx="6" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="553.5" y="206.0" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="start">超分配池 172 GiB</text>
<text x="553.5" y="228.0" font-size="12.5" fill="#57606A" text-anchor="start">80%，用到才分配</text>
<text x="48.0" y="294.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">例二：总内存 1.5 TiB（1536 GiB）</text>
<rect x="48.0" y="306.0" width="39.1" height="70.0" rx="6" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<rect x="89.1" y="306.0" width="60.7" height="70.0" rx="6" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<rect x="151.8" y="306.0" width="1168.1" height="70.0" rx="6" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="163.8" y="336.0" font-size="14" fill="#4B3FA8" font-weight="600" text-anchor="start">超分配池约 1195 GiB</text>
<text x="163.8" y="358.0" font-size="12.5" fill="#57606A" text-anchor="start">80% × 764928 页</text>
<rect x="1321.9" y="306.0" width="228.1" height="70.0" rx="6" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1333.9" y="336.0" font-size="14" fill="#9A3215" font-weight="600" text-anchor="start">约 235 GiB</text>
<text x="1333.9" y="358.0" font-size="12.5" fill="#57606A" text-anchor="start">被上限截掉，留作普通内存</text>
<text x="48.0" y="404.0" font-size="12.5" fill="#57606A" text-anchor="start">左边两小段：保留 42 GiB（16% 超过了 42 GiB 上限）· 静态池 64 GiB（20% 约 299 GiB，被上限截到 64 GiB）</text>
<rect x="48.0" y="446.0" width="1504.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="238.0" y="468.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">写到哪</text>
<text x="698.0" y="468.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">特点</text>
<line x1="48.0" y1="528.5" x2="1552.0" y2="528.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="511.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">静态池</text>
<text x="238.0" y="511.1" font-size="13.5" fill="#1F2328" text-anchor="start">/proc/sys/vm/nr_hugepages</text>
<text x="698.0" y="511.1" font-size="13.5" fill="#1F2328" text-anchor="start">开机就划走、一直占着，不管有没有沙箱；保证一定拿得到</text>
<line x1="48.0" y1="570.8" x2="1552.0" y2="570.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="553.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">超分配池</text>
<text x="238.0" y="553.3" font-size="13.5" fill="#1F2328" text-anchor="start">/proc/sys/vm/nr_overcommit_hugepages</text>
<text x="698.0" y="553.3" font-size="13.5" fill="#1F2328" text-anchor="start">只是上限；用到时才分配，用完归还</text>
<line x1="48.0" y1="613.0" x2="1552.0" y2="613.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="595.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">生命周期</text>
<text x="238.0" y="595.6" font-size="13.5" fill="#1F2328" text-anchor="start">写在 /proc，不持久</text>
<text x="698.0" y="595.6" font-size="13.5" fill="#1F2328" text-anchor="start">重启归零；-d 故意不释放（避免内存碎片）；--purge-hugepages 才释放</text>
<line x1="48.0" y1="629.0" x2="1552.0" y2="629.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="655.0" font-size="13" fill="#8C959F" text-anchor="start">注：脚本按字段名精确读 /proc/meminfo（鲲鹏上有 RemoteMemTotal 这一行），大页大小也不写死（64K 基页内核上是 512 MiB）。</text></svg>