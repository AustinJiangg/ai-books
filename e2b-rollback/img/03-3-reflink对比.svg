<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="582" viewBox="0 0 1600 582" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD6603D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#D6603D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="582" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">有没有 reflink：“每代复制一份完整内存”的代价天差地别</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">XFS、Btrfs 的 reflink 让新文件和旧文件共享磁盘块，复制 2 GiB 只改元数据；ext4 没有 reflink，复制就是真读 2 GiB、写 2 GiB。存档盘是 ext4，所以本方案只存差分，按页往祖先找。</text>
<rect x="48.0" y="156.0" width="722.0" height="330.0" rx="14" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="68.0" y="186.0" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="start">XFS / Btrfs：有 reflink</text>
<text x="68.0" y="208.0" font-size="12.5" fill="#57606A" text-anchor="start">复制 = 共享块，写时才分裂</text>
<rect x="78.0" y="246.0" width="200.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="178.0" y="268.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">第 n-1 代</text>
<text x="178.0" y="290.6" font-size="12" fill="#57606A" text-anchor="middle">2 GiB</text>
<rect x="540.0" y="246.0" width="200.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="640.0" y="268.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">第 n 代</text>
<text x="640.0" y="290.6" font-size="12" fill="#57606A" text-anchor="middle">复制 + 覆盖脏页</text>
<path d="M282.0 276.0 L536.0 276.0" fill="none" stroke="#1F9E77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#m1F9E77)"/>
<text x="409.0" y="268.0" font-size="12.5" fill="#1F9E77" font-weight="600" text-anchor="middle">共享块（元数据）</text>
<rect x="78.0" y="346.0" width="662.0" height="54.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="409.0" y="377.8" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">这一代没改：≈ 0</text>
<text x="78.0" y="446.0" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="start">成本只看改动量</text>
<rect x="830.0" y="156.0" width="722.0" height="330.0" rx="14" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="850.0" y="186.0" font-size="15" fill="#9A3215" font-weight="600" text-anchor="start">ext4：没有 reflink</text>
<text x="850.0" y="208.0" font-size="12.5" fill="#57606A" text-anchor="start">复制 = 真拷贝</text>
<rect x="860.0" y="246.0" width="200.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="960.0" y="268.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">第 n-1 代</text>
<text x="960.0" y="290.6" font-size="12" fill="#57606A" text-anchor="middle">2 GiB</text>
<rect x="1322.0" y="246.0" width="200.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1422.0" y="268.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">第 n 代</text>
<text x="1422.0" y="290.6" font-size="12" fill="#57606A" text-anchor="middle">复制 + 覆盖脏页</text>
<path d="M1064.0 276.0 L1318.0 276.0" fill="none" stroke="#D6603D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD6603D)"/>
<text x="1191.0" y="268.0" font-size="12.5" fill="#D6603D" font-weight="600" text-anchor="middle">读 2 GiB + 写 2 GiB</text>
<rect x="860.0" y="346.0" width="662.0" height="54.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1191.0" y="377.8" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">这一代没改：仍要拷 2 GiB</text>
<text x="860.0" y="446.0" font-size="14" fill="#9A3215" font-weight="600" text-anchor="start">成本和改动量脱钩，而且完全静默</text>
<line x1="48.0" y1="516.0" x2="1552.0" y2="516.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="542.0" font-size="13" fill="#8C959F" text-anchor="start">注：磁盘那一半不受影响：封存写层只是改名，本来就不需要复制（第 10 篇）。</text></svg>