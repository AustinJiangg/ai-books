<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="748" viewBox="0 0 1600 748" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="748" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">原地回滚的九个阶段与提交点</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">提交点之前只检查、不动客户机，失败了虚机原样恢复运行（HTTP 400）；之后开始改写客户机，失败就是“撕裂”，标记 Faulted、拒绝恢复运行，只能销毁重建（HTTP 500，带 "fault": true）。</text>
<rect x="48.0" y="156.0" width="560.0" height="76.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="62.0" y="185.9" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="start">1 校验</text>
<text x="62.0" y="209.2" font-size="12.5" fill="#57606A" text-anchor="start">已暂停？快照能读？设备组成一致？文件长度、位图几何</text>
<rect x="48.0" y="244.0" width="560.0" height="76.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="62.0" y="273.9" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="start">2 静默在途 I/O</text>
<text x="62.0" y="297.2" font-size="12.5" fill="#57606A" text-anchor="start">磁盘异步操作收尾；丢掉 tap 里发给旧时间线的包</text>
<rect x="48.0" y="332.0" width="560.0" height="76.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="62.0" y="361.9" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="start">3 取活跃脏图 + 覆盖校验</text>
<text x="62.0" y="385.2" font-size="12.5" fill="#57606A" text-anchor="start">取出先放进备份位图；内容文件在每页上都有数据</text>
<text x="48.0" y="440.0" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="start">失败 → 虚机原样恢复，沙箱照常可用</text>
<line x1="658.0" y1="146.0" x2="658.0" y2="632.0" stroke="#D6603D" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5"/>
<text x="658.0" y="658.0" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">提交点</text>
<rect x="708.0" y="156.0" width="844.0" height="64.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="722.0" y="179.9" font-size="15" fill="#8A5300" font-weight="600" text-anchor="start">4 内存</text>
<text x="722.0" y="203.2" font-size="12.5" fill="#57606A" text-anchor="start">按位图合批写回</text>
<rect x="708.0" y="228.0" width="844.0" height="64.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="722.0" y="251.9" font-size="15" fill="#8A5300" font-weight="600" text-anchor="start">5 vCPU</text>
<text x="722.0" y="275.2" font-size="12.5" fill="#57606A" text-anchor="start">收尾挂起的设备访问 → 复位 → 全写 → 读回核对</text>
<rect x="708.0" y="300.0" width="844.0" height="64.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="722.0" y="323.9" font-size="15" fill="#8A5300" font-weight="600" text-anchor="start">6 中断控制器</text>
<text x="722.0" y="347.2" font-size="12.5" fill="#57606A" text-anchor="start">普通恢复后再按位绝对写回，逐位等于快照</text>
<rect x="708.0" y="372.0" width="844.0" height="64.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="722.0" y="395.9" font-size="15" fill="#8A5300" font-weight="600" text-anchor="start">7 设备</text>
<text x="722.0" y="419.2" font-size="12.5" fill="#57606A" text-anchor="start">队列、特性、中断；串口复位；重建网卡缓存</text>
<rect x="708.0" y="444.0" width="844.0" height="64.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="722.0" y="467.9" font-size="15" fill="#8A5300" font-weight="600" text-anchor="start">8 VMGenID</text>
<text x="722.0" y="491.2" font-size="12.5" fill="#57606A" text-anchor="start">写入新代号，必须在内存之后</text>
<rect x="708.0" y="516.0" width="844.0" height="64.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="722.0" y="539.9" font-size="15" fill="#8A5300" font-weight="600" text-anchor="start">9 重置基线</text>
<text x="722.0" y="563.2" font-size="12.5" fill="#57606A" text-anchor="start">清零；队列页重新标脏</text>
<text x="708.0" y="608.0" font-size="14" fill="#9A3215" font-weight="600" text-anchor="start">失败 → 撕裂：一部分在目标时刻、一部分在现在，只能重建</text>
<line x1="48.0" y1="682.0" x2="1552.0" y2="682.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="708.0" font-size="13" fill="#8C959F" text-anchor="start">注：能检查的全部放在提交点之前；回滚调用超时也按撕裂处理，因为说不清停在提交点哪一边。orchestrator 只看 fault 字段，不匹配错误文案。</text></svg>