<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">原生 pause 导出磁盘差分时必须关掉沙箱，resume 要新起进程、缺页把工作集拉回来；本方案存档只暂停一下就继续跑，读档在同一个进程里只写回需要的页。950 上 0 MiB 档：pause 251.9 ms、resume 109.3 ms；存档</text>
<text x="48.0" y="116.0" font-size="15" fill="#57606A" text-anchor="start">17.2 ms、读档 22.4 ms。</text>
