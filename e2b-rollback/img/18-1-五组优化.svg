<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="722" viewBox="0 0 1600 722" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="722" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">五组优化，各作用在哪一段</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">单沙箱达标之后，多台沙箱同时做、反复做几个小时，暴露出的问题分散在存档和读档的各个环节，也有节点级的、和单次操作无关的长尾。</text>
<rect x="48.0" y="156.0" width="280.0" height="470.0" rx="12" fill="#F4F5F7" stroke="#57606A" stroke-width="1.2"/>
<text x="64.0" y="184.0" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">窗口外准备</text>
<rect x="348.0" y="156.0" width="560.0" height="470.0" rx="12" fill="#EAF3FF" stroke="#9CC3F0" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="364.0" y="184.0" font-size="14.5" fill="#1D4F91" font-weight="600" text-anchor="start">冻结窗口</text>
<rect x="928.0" y="156.0" width="280.0" height="470.0" rx="12" fill="#F4F5F7" stroke="#57606A" stroke-width="1.2"/>
<text x="944.0" y="184.0" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="start">窗口外收尾</text>
<rect x="1228.0" y="156.0" width="324.0" height="470.0" rx="12" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.2"/>
<text x="1244.0" y="184.0" font-size="14.5" fill="#9A3215" font-weight="600" text-anchor="start">节点级</text>
<rect x="944.0" y="206.0" width="248.0" height="115.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1068.0" y="245.9" font-size="14.5" fill="#1D4F91" font-weight="600" text-anchor="middle">1. 跨沙箱等待</text>
<text x="1068.0" y="269.1" font-size="12.5" fill="#57606A" text-anchor="middle">锁里只算；锁外读写、删文件；不再整</text>
<text x="1068.0" y="287.9" font-size="12.5" fill="#57606A" text-anchor="middle">份重写 index.json</text>
<rect x="364.0" y="206.0" width="528.0" height="115.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="628.0" y="255.3" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">2. 缩短冻结窗口</text>
<text x="628.0" y="278.5" font-size="12.5" fill="#57606A" text-anchor="middle">不 fsync；位图按字跳零；连续页合批读</text>
<rect x="64.0" y="206.0" width="248.0" height="115.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="188.0" y="255.3" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">2. 装配视图前移</text>
<text x="188.0" y="278.5" font-size="12.5" fill="#57606A" text-anchor="middle">读不可变的封存层，挪出窗口</text>
<rect x="944.0" y="341.0" width="248.0" height="115.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1068.0" y="390.3" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">2. 层文件移动后移</text>
<text x="1068.0" y="413.5" font-size="12.5" fill="#57606A" text-anchor="middle">跨文件系统是拷贝，放到恢复之后</text>
<rect x="364.0" y="341.0" width="528.0" height="115.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="628.0" y="390.3" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">3. 网络清理</text>
<text x="628.0" y="413.5" font-size="12.5" fill="#57606A" text-anchor="middle">与回滚并行；攒批一次整表扫描；按实测选路</text>
<rect x="64.0" y="341.0" width="248.0" height="115.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="188.0" y="390.3" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">3. 代理全双工</text>
<text x="188.0" y="413.5" font-size="12.5" fill="#57606A" text-anchor="middle">修复流式命令偶发截断</text>
<rect x="364.0" y="476.0" width="528.0" height="115.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="628.0" y="525.3" font-size="14.5" fill="#0E6B4F" font-weight="600" text-anchor="middle">4. 历史增长</text>
<text x="628.0" y="548.5" font-size="12.5" fill="#57606A" text-anchor="middle">位图批量装配视图；块归属索引</text>
<rect x="944.0" y="476.0" width="248.0" height="115.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1068.0" y="525.3" font-size="14.5" fill="#0E6B4F" font-weight="600" text-anchor="middle">4. 回收与合并</text>
<text x="1068.0" y="548.5" font-size="12.5" fill="#57606A" text-anchor="middle">层引用计数回收；隐藏条目合并</text>
<rect x="1244.0" y="206.0" width="292.0" height="115.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1390.0" y="255.3" font-size="14.5" fill="#9A3215" font-weight="600" text-anchor="middle">5. GC 长尾</text>
<text x="1390.0" y="278.5" font-size="12.5" fill="#57606A" text-anchor="middle">MADV_POPULATE 把缺页挪进系统调用</text>
<rect x="1244.0" y="341.0" width="292.0" height="115.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1390.0" y="390.3" font-size="14.5" fill="#1F2328" font-weight="600" text-anchor="middle">指标纠偏</text>
<text x="1390.0" y="413.5" font-size="12.5" fill="#57606A" text-anchor="middle">读盘量改为本沙箱自计</text>
<line x1="48.0" y1="656.0" x2="1552.0" y2="656.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="682.0" font-size="13" fill="#8C959F" text-anchor="start">注：每组按“现象 → 根因 → 改法 → 验证”展开见正文；最终长测里 GC 停顿最长 2.8 ms，冻结窗口里等连接跟踪清理的中位数 2.2 ms。</text></svg>