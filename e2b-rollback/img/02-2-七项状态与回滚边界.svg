<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="736" viewBox="0 0 1600 736" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="736" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">现场七项：沙箱里的回得去，沙箱外的回不去</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">前五项是机器里的东西，读档后都回到存档那一刻；时间要特殊处理：单调时钟倒退，墙钟被校回现在；外部世界对沙箱的记忆回不去，要业务自己处理。</text>
<rect x="48.0" y="150.0" width="1000.0" height="490.0" rx="14" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="68.0" y="180.0" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="start">沙箱边界之内</text>
<rect x="72.0" y="210.0" width="560.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="86.0" y="228.8" font-size="14.5" fill="#4B3FA8" font-weight="600" text-anchor="start">内存</text>
<text x="86.0" y="252.0" font-size="12.5" fill="#57606A" text-anchor="start">GB 级 · 进程数据、内核结构、文件缓存</text>
<rect x="704.5" y="224.0" width="87.0" height="26.0" rx="13.0" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="748.0" y="241.7" font-size="13" fill="#0E6B4F" font-weight="600" text-anchor="middle">回到那一刻</text>
<rect x="72.0" y="274.0" width="560.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="86.0" y="292.8" font-size="14.5" fill="#4B3FA8" font-weight="600" text-anchor="start">vCPU 寄存器</text>
<text x="86.0" y="316.0" font-size="12.5" fill="#57606A" text-anchor="start">执行到哪条指令</text>
<rect x="704.5" y="288.0" width="87.0" height="26.0" rx="13.0" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="748.0" y="305.7" font-size="13" fill="#0E6B4F" font-weight="600" text-anchor="middle">回到那一刻</text>
<rect x="72.0" y="338.0" width="560.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="86.0" y="356.8" font-size="14.5" fill="#4B3FA8" font-weight="600" text-anchor="start">中断控制器 GIC</text>
<text x="86.0" y="380.0" font-size="12.5" fill="#57606A" text-anchor="start">哪些中断在等、被屏蔽</text>
<rect x="704.5" y="352.0" width="87.0" height="26.0" rx="13.0" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="748.0" y="369.7" font-size="13" fill="#0E6B4F" font-weight="600" text-anchor="middle">回到那一刻</text>
<rect x="72.0" y="402.0" width="560.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="86.0" y="420.8" font-size="14.5" fill="#4B3FA8" font-weight="600" text-anchor="start">设备状态</text>
<text x="86.0" y="444.0" font-size="12.5" fill="#57606A" text-anchor="start">virtio 队列位置、协商特性</text>
<rect x="704.5" y="416.0" width="87.0" height="26.0" rx="13.0" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="748.0" y="433.7" font-size="13" fill="#0E6B4F" font-weight="600" text-anchor="middle">回到那一刻</text>
<rect x="72.0" y="466.0" width="560.0" height="54.0" rx="10" fill="#FFFFFF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="86.0" y="484.8" font-size="14.5" fill="#4B3FA8" font-weight="600" text-anchor="start">磁盘</text>
<text x="86.0" y="508.0" font-size="12.5" fill="#57606A" text-anchor="start">GB 级 · 根文件系统</text>
<rect x="704.5" y="480.0" width="87.0" height="26.0" rx="13.0" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="748.0" y="497.7" font-size="13" fill="#0E6B4F" font-weight="600" text-anchor="middle">回到那一刻</text>
<rect x="72.0" y="550.0" width="952.0" height="64.0" rx="10" fill="#FFFFFF" stroke="#9CC3F0" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="548.0" y="573.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">一致性：这五项必须在同一次暂停里一起处理</text>
<text x="548.0" y="597.2" font-size="12.5" fill="#57606A" text-anchor="middle">否则内存和磁盘属于两个时刻（第 2 篇第四节）</text>
<rect x="1098.0" y="150.0" width="454.0" height="160.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1325.0" y="203.2" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">时间</text>
<text x="1325.0" y="226.4" font-size="12.5" fill="#57606A" text-anchor="middle">单调时钟：随 vCPU 寄存器倒退</text>
<text x="1325.0" y="245.2" font-size="12.5" fill="#57606A" text-anchor="middle">墙钟：读档返回前由 envd 校回现在</text>
<text x="1325.0" y="263.9" font-size="12.5" fill="#57606A" text-anchor="middle">用户态随机数状态：回退</text>
<rect x="1098.0" y="340.0" width="454.0" height="300.0" rx="14" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1118.0" y="370.0" font-size="15" fill="#9A3215" font-weight="600" text-anchor="start">沙箱边界之外：回不去</text>
<circle cx="1122.0" cy="405.4" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1134.0" y="410.0" font-size="13.5" fill="#1F2328" text-anchor="start">宿主连接跟踪表（本方案清理）</text>
<circle cx="1122.0" cy="445.4" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1134.0" y="450.0" font-size="13.5" fill="#1F2328" text-anchor="start">TCP 对端、代理连接池（本方案断开）</text>
<circle cx="1122.0" cy="485.4" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1134.0" y="490.0" font-size="13.5" fill="#1F2328" text-anchor="start">外部数据库、已发出的请求</text>
<line x1="48.0" y1="670.0" x2="1552.0" y2="670.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="696.0" font-size="13" fill="#8C959F" text-anchor="start">注：连接跟踪、连接池和时间由第 12 篇处理；外部副作用是任何快照方案的边界，业务需幂等、去重或补偿。</text></svg>