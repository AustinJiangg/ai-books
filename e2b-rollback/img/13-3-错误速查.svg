<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="702" viewBox="0 0 1600 702" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="702" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">错误 reason 速查：能重试、换个做法、还是销毁重建</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">四个调用都不自动重发，服务端也不因客户端放弃而取消。拿到错误先看 reason：有的等一会就能重试，有的要先做别的事，有的只能重建沙箱。</text>
<rect x="48.0" y="156.0" width="488.0" height="450.0" rx="14" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="68.0" y="186.0" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="start">可以重试</text>
<rect x="72.0" y="221.0" width="53.7" height="26.0" rx="13.0" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="98.9" y="238.7" font-size="13" fill="#0E6B4F" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">busy</text>
<text x="72.0" y="268.0" font-size="13" fill="#1F2328" text-anchor="start">同沙箱另一个操作没结束，排队超时；等 Retry-After 秒</text>
<rect x="72.0" y="299.0" width="148.9" height="26.0" rx="13.0" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="146.4" y="316.7" font-size="13" fill="#0E6B4F" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">sandbox_restored</text>
<text x="72.0" y="346.0" font-size="13" fill="#1F2328" text-anchor="start">别的调用撞上了读档；重连重试</text>
<rect x="72.0" y="377.0" width="85.4" height="26.0" rx="13.0" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="114.7" y="394.7" font-size="13" fill="#0E6B4F" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">internal</text>
<text x="72.0" y="424.0" font-size="13" fill="#1F2328" text-anchor="start">稍后重试或换目标；持续出现就上报</text>
<rect x="556.0" y="156.0" width="488.0" height="450.0" rx="14" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="576.0" y="186.0" font-size="15" fill="#8A5300" font-weight="600" text-anchor="start">先做别的事</text>
<rect x="580.0" y="221.0" width="117.2" height="26.0" rx="13.0" fill="#FDF0D9" stroke="#D9922B" stroke-width="1"/>
<text x="638.6" y="238.7" font-size="13" fill="#8A5300" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">chain_broken</text>
<text x="580.0" y="268.0" font-size="13" fill="#1F2328" text-anchor="start">先存一个新档，再读档</text>
<rect x="580.0" y="299.0" width="140.9" height="26.0" rx="13.0" fill="#FDF0D9" stroke="#D9922B" stroke-width="1"/>
<text x="650.5" y="316.7" font-size="13" fill="#8A5300" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">rootfs_poisoned</text>
<text x="580.0" y="346.0" font-size="13" fill="#1F2328" text-anchor="start">读档到任意已有存档，账本随之重建</text>
<rect x="580.0" y="377.0" width="180.6" height="26.0" rx="13.0" fill="#FDF0D9" stroke="#D9922B" stroke-width="1"/>
<text x="670.3" y="394.7" font-size="13" fill="#8A5300" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">too_many_checkpoints</text>
<text x="580.0" y="424.0" font-size="13" fill="#1F2328" text-anchor="start">删掉不需要的，再存</text>
<rect x="580.0" y="455.0" width="196.5" height="26.0" rx="13.0" fill="#FDF0D9" stroke="#D9922B" stroke-width="1"/>
<text x="678.2" y="472.7" font-size="13" fill="#8A5300" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">checkpoint_bytes_limit</text>
<text x="580.0" y="502.0" font-size="13" fill="#1F2328" text-anchor="start">删最旧的，删当前基准几乎没用</text>
<rect x="580.0" y="533.0" width="93.4" height="26.0" rx="13.0" fill="#FDF0D9" stroke="#D9922B" stroke-width="1"/>
<text x="626.7" y="550.7" font-size="13" fill="#8A5300" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">disk_full</text>
<text x="580.0" y="580.0" font-size="13" fill="#1F2328" text-anchor="start">请运维清理存档盘（整个节点的问题）</text>
<rect x="1064.0" y="156.0" width="488.0" height="450.0" rx="14" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1084.0" y="186.0" font-size="15" fill="#9A3215" font-weight="600" text-anchor="start">只能重建或按业务决定</text>
<rect x="1088.0" y="221.0" width="53.7" height="26.0" rx="13.0" fill="#FCEDE8" stroke="#D6603D" stroke-width="1"/>
<text x="1114.9" y="238.7" font-size="13" fill="#9A3215" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">torn</text>
<text x="1088.0" y="268.0" font-size="13" fill="#1F2328" text-anchor="start">撕裂，销毁重建</text>
<rect x="1088.0" y="299.0" width="164.7" height="26.0" rx="13.0" fill="#FCEDE8" stroke="#D6603D" stroke-width="1"/>
<text x="1170.4" y="316.7" font-size="13" fill="#9A3215" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">guest_unresponsive</text>
<text x="1088.0" y="346.0" font-size="13" fill="#1F2328" text-anchor="start">已在目标时刻，客户机暂不响应；按业务决定</text>
<line x1="48.0" y1="636.0" x2="1552.0" y2="636.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="662.0" font-size="13" fill="#8C959F" text-anchor="start">注：删除按实际发生了什么作答：不存在回 404；已生效只是清理文件失败按成功返回；账本还没改就失败回 500。</text></svg>