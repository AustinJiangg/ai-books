<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="606" viewBox="0 0 1600 606" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m8C959F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#8C959F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="606" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">两把锁：按沙箱的操作锁持有整个操作，全局账本锁只持一瞬间</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">同一台沙箱的存档、读档、删除串行，不同沙箱完全并行。全局锁里只算、只摘账，不读写文件、不调 Firecracker；否则一台沙箱慢一点的磁盘操作，会让整台宿主的账本操作排队。先拿操作锁，再短暂拿全局锁，只有这一</text>
<text x="48.0" y="116.0" font-size="15" fill="#57606A" text-anchor="start">个方向，不会死锁。</text>
