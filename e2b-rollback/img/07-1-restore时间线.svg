<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="692" viewBox="0 0 1600 692" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="692" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">一次读档的时间线：准备、冻结窗口、收尾</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">目标磁盘视图在暂停之前就装配好；冻结窗口里导出活跃脏页、物化回滚集、交给 Firecracker 原地回滚、整体换磁盘，连接跟踪清理在后台并行；回滚完成后先更新账本，再等 envd。</text>
<rect x="48.0" y="196.0" width="220.0" height="84.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="158.0" y="230.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">进门</text>
<text x="158.0" y="252.6" font-size="12" fill="#57606A" text-anchor="middle">同存档：鉴权、取锁、再确认</text>
<rect x="48.0" y="292.0" width="220.0" height="84.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="158.0" y="326.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">取目标</text>
<text x="158.0" y="348.6" font-size="12" fill="#57606A" text-anchor="middle">本代 · 已提交 · 未隐藏</text>
<rect x="48.0" y="388.0" width="220.0" height="84.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="158.0" y="413.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">装配目标视图</text>
<text x="158.0" y="435.6" font-size="12" fill="#57606A" text-anchor="middle">读块清单、重开封存层、建索引</text>
<text x="158.0" y="453.6" font-size="12" fill="#57606A" text-anchor="middle">950 上约 0.2 ms</text>
<rect x="48.0" y="484.0" width="220.0" height="84.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="158.0" y="509.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">打开读档窗口</text>
<text x="158.0" y="531.6" font-size="12" fill="#57606A" text-anchor="middle">丢弃代理连接池</text>
<text x="158.0" y="549.6" font-size="12" fill="#57606A" text-anchor="middle">别的请求回 409</text>
<text x="48.0" y="178.0" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">窗口外</text>
<rect x="308.0" y="156.0" width="820.0" height="440.0" rx="12" fill="#EAF3FF" stroke="#9CC3F0" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="324.0" y="182.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="start">冻结窗口：虚机暂停</text>
<rect x="328.0" y="202.0" width="520.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="344.0" y="230.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">1. 暂停</text>
<text x="828.0" y="230.0" font-size="12.5" fill="#57606A" text-anchor="end">常数</text>
<rect x="328.0" y="256.0" width="520.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="344.0" y="284.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">2. 导出活跃脏页</text>
<text x="828.0" y="284.0" font-size="12.5" fill="#57606A" text-anchor="end">位图扫描，常数极小</text>
<rect x="328.0" y="310.0" width="520.0" height="44.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="344.0" y="338.0" font-size="14" fill="#8A5300" font-weight="600" text-anchor="start">3. 物化：算回滚集、沿祖先链找内容</text>
<text x="828.0" y="338.0" font-size="12.5" fill="#57606A" text-anchor="end">回滚集大小</text>
<rect x="328.0" y="364.0" width="520.0" height="44.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="344.0" y="392.0" font-size="14" fill="#8A5300" font-weight="600" text-anchor="start">4. Firecracker 原地回滚（九阶段）</text>
<text x="828.0" y="392.0" font-size="12.5" fill="#57606A" text-anchor="end">回滚集大小 + 常数</text>
<rect x="328.0" y="418.0" width="520.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="344.0" y="446.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">5. 整体换磁盘视图</text>
<text x="828.0" y="446.0" font-size="12.5" fill="#57606A" text-anchor="end">常数</text>
<rect x="328.0" y="472.0" width="520.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="344.0" y="500.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">6. 等连接跟踪清理结束</text>
<text x="828.0" y="500.0" font-size="12.5" fill="#57606A" text-anchor="end">通常 ≈ 0</text>
<rect x="328.0" y="526.0" width="520.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="344.0" y="554.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">7. 恢复</text>
<text x="828.0" y="554.0" font-size="12.5" fill="#57606A" text-anchor="end">常数</text>
<rect x="878.0" y="202.0" width="230.0" height="314.0" rx="10" fill="#FFFFFF" stroke="#D9922B" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="993.0" y="331.9" font-size="14" fill="#8A5300" font-weight="600" text-anchor="middle">后台：清连接跟踪表</text>
<text x="993.0" y="355.1" font-size="12.5" fill="#57606A" text-anchor="middle">暂停后立即开始</text>
<text x="993.0" y="373.9" font-size="12.5" fill="#57606A" text-anchor="middle">与 2. ～5. 并行</text>
<text x="993.0" y="392.6" font-size="12.5" fill="#57606A" text-anchor="middle">恢复前等它结束</text>
<rect x="1158.0" y="196.0" width="394.0" height="84.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1355.0" y="230.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">当前基准 ← 目标</text>
<text x="1355.0" y="252.6" font-size="12" fill="#57606A" text-anchor="middle">树从这里长出新分支</text>
<rect x="1158.0" y="292.0" width="394.0" height="84.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1355.0" y="326.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">磁盘账本 ← 目标描述</text>
<text x="1355.0" y="348.6" font-size="12" fill="#57606A" text-anchor="middle">顺带清除“已污染”</text>
<rect x="1158.0" y="388.0" width="394.0" height="84.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1355.0" y="422.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">等 envd 应答</text>
<text x="1355.0" y="444.6" font-size="12" fill="#57606A" text-anchor="middle">最多 45 s · 校正墙钟</text>
<rect x="1158.0" y="484.0" width="394.0" height="84.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1355.0" y="518.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="middle">返回成功</text>
<text x="1355.0" y="540.6" font-size="12" fill="#57606A" text-anchor="middle">失败按四档分级</text>
<text x="1158.0" y="178.0" font-size="13.5" fill="#1D4F91" font-weight="600" text-anchor="start">窗口外：账本跟着状态走</text>
<line x1="48.0" y1="626.0" x2="1552.0" y2="626.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="652.0" font-size="13" fill="#8C959F" text-anchor="start">注：和虚机大小相关的只有两次位图扫描（2 GiB 是 8192 个字），其余都只和回滚集有关。</text></svg>