<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="582" viewBox="0 0 1600 582" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD9922B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#D9922B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="582" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">能力随硬件降级，但每一级都要说出来</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">有 HDBSS 用硬件；启用失败退回 KVM 写保护；没开跟踪就每次全量。功能都对，只是代价不同。静默降级是最难发现的故障：功能全对、测试全过，只是慢。</text>
<rect x="48.0" y="156.0" width="760.0" height="84.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="428.0" y="190.2" font-size="17" fill="#0E6B4F" font-weight="600" text-anchor="middle">hdbss</text>
<text x="428.0" y="214.1" font-size="13" fill="#57606A" text-anchor="middle">硬件标脏，几乎不打扰客户机</text>
<text x="828.0" y="192.0" font-size="13" fill="#57606A" font-weight="600" text-anchor="start">什么时候：</text>
<text x="828.0" y="214.0" font-size="13" fill="#1F2328" text-anchor="start">950 默认</text>
<path d="M168.0 244.0 L168.0 272.0" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<rect x="48.0" y="276.0" width="760.0" height="84.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="428.0" y="310.2" font-size="17" fill="#8A5300" font-weight="600" text-anchor="middle">kvm-wp</text>
<text x="428.0" y="334.1" font-size="13" fill="#57606A" text-anchor="middle">每页首次写陷出一次；结果完全一样，只是慢</text>
<text x="828.0" y="312.0" font-size="13" fill="#57606A" font-weight="600" text-anchor="start">什么时候：</text>
<text x="828.0" y="334.0" font-size="13" fill="#1F2328" text-anchor="start">HDBSS 启用失败，或没有 HDBSS 但显式打开跟踪</text>
<path d="M168.0 364.0 L168.0 392.0" fill="none" stroke="#D9922B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
<rect x="48.0" y="396.0" width="760.0" height="84.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="428.0" y="430.2" font-size="17" fill="#9A3215" font-weight="600" text-anchor="middle">off</text>
<text x="428.0" y="454.1" font-size="13" fill="#57606A" text-anchor="middle">不产生位图 → 每次存档都是全量（mem_mode=full）</text>
<text x="828.0" y="432.0" font-size="13" fill="#57606A" font-weight="600" text-anchor="start">什么时候：</text>
<text x="828.0" y="454.0" font-size="13" fill="#1F2328" text-anchor="start">没有 HDBSS 且没打开跟踪</text>
<rect x="1168.0" y="156.0" width="384.0" height="324.0" rx="14" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1188.0" y="186.0" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="start">在哪里说出来</text>
<circle cx="1194.0" cy="225.4" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1206.0" y="230.0" font-size="13.5" fill="#1F2328" text-anchor="start">启动日志 checkpoint capabilities 一行，带理由</text>
<circle cx="1194.0" cy="281.4" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1206.0" y="286.0" font-size="13.5" fill="#1F2328" text-anchor="start">Firecracker 自报后端 hdbss / kvm-wp / off</text>
<circle cx="1194.0" cy="337.4" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1206.0" y="342.0" font-size="13.5" fill="#1F2328" text-anchor="start">每次存档回报 mem_mode</text>
<circle cx="1194.0" cy="393.4" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1206.0" y="398.0" font-size="13.5" fill="#1F2328" text-anchor="start">FC_HDBSS_REQUIRED=true：没有 HDBSS 就启</text>
<text x="1206.0" y="418.2" font-size="13.5" fill="#1F2328" text-anchor="start">动失败</text>
<line x1="48.0" y1="516.0" x2="1552.0" y2="516.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="542.0" font-size="13" fill="#8C959F" text-anchor="start">注：HDBSS 必须在所有 vCPU 创建之后启用，顺序错了调用照样成功、一条脏页都记不到；从快照加载的路径上也必须启用一次（第 8 篇）。</text></svg>