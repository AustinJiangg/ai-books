<rect x="48.0" y="396.0" width="361.0" height="80.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="228.5" y="427.8" font-size="14.5" fill="#1D4F91" font-weight="600" text-anchor="middle">1. 暂停后刷屏障</text>
<text x="228.5" y="451.0" font-size="12.5" fill="#57606A" text-anchor="middle">内核手里攥着的写全部推进写层</text>
<rect x="429.0" y="396.0" width="361.0" height="80.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
