<text x="1371.5" y="427.8" font-size="14.5" fill="#0E6B4F" font-weight="600" text-anchor="middle">4. 恢复后改名进 layers/</text>
<text x="1371.5" y="451.0" font-size="12.5" fill="#57606A" text-anchor="middle">同一文件系统：inode 不变，映射照样有效</text>
<line x1="48.0" y1="506.0" x2="1552.0" y2="506.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="532.0" font-size="13" fill="#8C959F" text-anchor="start">注：没有复制任何一个块；封存层就是客户机自己写出的那个文件。只登记 W1 写过哪些块，950 上改 128 MiB 时封存约 7 ms。</text></svg>