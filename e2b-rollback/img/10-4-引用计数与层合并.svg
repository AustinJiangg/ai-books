<rect x="368.0" y="286.0" width="100.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="418.0" y="308.5" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">W2</text>
<text x="72.0" y="364.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">当前运行状态</text>
<rect x="248.0" y="342.0" width="100.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="298.0" y="364.5" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">W1</text>
<rect x="368.0" y="342.0" width="100.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="418.0" y="364.5" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">W2</text>
<text x="72.0" y="424.0" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="start">W1 引用 = 3，W2 引用 = 2</text>
<text x="72.0" y="454.0" font-size="14" fill="#1F2328" text-anchor="start">删 c1：W1 从 3 减到 2，仍然保留</text>
<text x="72.0" y="482.0" font-size="13" fill="#57606A" text-anchor="start">计数归零的层才删（若旧栈还映射着，空间等映射解除）</text>
