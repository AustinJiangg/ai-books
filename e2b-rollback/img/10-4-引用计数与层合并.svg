<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="612" viewBox="0 0 1600 612" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="612" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">引用计数与层合并：删存档不等于删层</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">每个层被多少个视图（每个存档一个）和当前运行状态列着，就有多少引用；归零才删。层栈不是存档树，按树回收会删掉别人还在读的层。永远相邻成对出现的两层可以合成一层，读到的内容不变。</text>
<rect x="48.0" y="156.0" width="712.0" height="360.0" rx="14" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
