<rect x="248.0" y="230.0" width="100.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="298.0" y="252.5" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">W1</text>
<text x="72.0" y="308.0" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">c2 的视图</text>
