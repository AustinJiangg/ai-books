<text x="1422.0" y="430.5" font-size="13" fill="#57606A" text-anchor="middle">→ 按并集导出</text>
<path d="M1172.0 455.0 L1288.0 455.0" fill="none" stroke="#8B7FE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8B7FE0)"/>
<rect x="48.0" y="530.0" width="732.0" height="90.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="414.0" y="566.9" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">任何一次没并进去</text>
<text x="414.0" y="590.2" font-size="12.5" fill="#57606A" text-anchor="middle">整体标“不完整”，pause 退回“在内存里就算脏”：导多了只费时间，不会错</text>
<rect x="820.0" y="530.0" width="732.0" height="90.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
