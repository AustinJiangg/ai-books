<line x1="1028.0" y1="220.0" x2="1028.0" y2="260.0" stroke="#D9922B" stroke-width="3" stroke-linecap="round"/>
<text x="1028.0" y="210.0" font-size="13.5" fill="#8A5300" font-weight="600" text-anchor="middle">增量存档：清零</text>
