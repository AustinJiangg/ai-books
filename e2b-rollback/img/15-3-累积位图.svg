<text x="1186.0" y="590.2" font-size="12.5" fill="#57606A" text-anchor="middle">集合一直是空的，判据照常用 Firecracker 自己的位图</text>
<line x1="48.0" y1="650.0" x2="1552.0" y2="650.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="676.0" font-size="13" fill="#8C959F" text-anchor="start">注：磁盘那一半：原生 pause 导出时交出所有封存层和当前写层，按“最上层有就取最上层”压平导出，和沙箱自己读到的一致。</text></svg>