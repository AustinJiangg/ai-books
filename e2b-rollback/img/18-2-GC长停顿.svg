<text x="1443.0" y="690.0" font-size="12" fill="#57606A" text-anchor="middle">最终长测</text>
<line x1="48.0" y1="716.0" x2="1552.0" y2="716.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="742.0" font-size="13" fill="#8C959F" text-anchor="start">注：“减垃圾”之后次数减半，长停顿却没少，证明不是垃圾太多；最后的改善是 MADV_POPULATE、层回收、合并叠加的结果，不能全归功于一处改动。</text></svg>