<rect x="330.5" y="489.0" width="89.0" height="181.0" rx="3" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.1"/>
<text x="375.0" y="481.0" font-size="12" fill="#9A3215" font-weight="600" text-anchor="middle">226.3</text>
<text x="375.0" y="690.0" font-size="12" fill="#57606A" text-anchor="middle">long2</text>
<rect x="508.5" y="455.2" width="89.0" height="214.8" rx="3" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.1"/>
