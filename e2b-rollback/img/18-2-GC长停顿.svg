<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="782" viewBox="0 0 1600 782" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="782" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">GC 长停顿怎么跨沙箱传染，MADV_POPULATE 怎么切断</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">Go 垃圾回收要短暂“停住整个世界”，必须等所有处理器停下。某个线程在文件映射上拷贝时缺页，分配页、计入内存控制组、触发回收，睡在内核里，它的处理器一直是“运行中”，抢占够不着，STW 只能干等，别的沙箱的</text>
<text x="48.0" y="116.0" font-size="15" fill="#57606A" text-anchor="start">冻结窗口随之被拉长。</text>
<rect x="48.0" y="180.0" width="276.8" height="90.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="186.4" y="217.1" font-size="14.5" fill="#3D3C38" font-weight="600" text-anchor="middle">拷贝层数据</text>
<text x="186.4" y="239.7" font-size="12" fill="#57606A" text-anchor="middle">在 MAP_SHARED 映射上</text>
<path d="M328.8 225.0 L350.8 225.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="354.8" y="180.0" width="276.8" height="90.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="493.2" y="217.1" font-size="14.5" fill="#3D3C38" font-weight="600" text-anchor="middle">缺页（用户态）</text>
<text x="493.2" y="239.7" font-size="12" fill="#57606A" text-anchor="middle">分配页</text>
<path d="M635.6 225.0 L657.6 225.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="661.6" y="180.0" width="276.8" height="90.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="800.0" y="217.1" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">计入内存控制组</text>
<text x="800.0" y="239.7" font-size="12" fill="#57606A" text-anchor="middle">256 GiB 早已被页缓存填满</text>
<path d="M942.4 225.0 L964.4 225.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="968.4" y="180.0" width="276.8" height="90.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1106.8" y="217.1" font-size="14.5" fill="#9A3215" font-weight="600" text-anchor="middle">在回收里睡着</text>
<text x="1106.8" y="239.7" font-size="12" fill="#57606A" text-anchor="middle">86% 睡在回收限流上</text>
<path d="M1249.2 225.0 L1271.2 225.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1275.2" y="180.0" width="276.8" height="90.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1413.6" y="217.1" font-size="14.5" fill="#9A3215" font-weight="600" text-anchor="middle">STW 等不到它</text>
<text x="1413.6" y="239.7" font-size="12" fill="#57606A" text-anchor="middle">长停顿 100% 花在等处理器停下</text>
<rect x="48.0" y="300.0" width="1504.0" height="60.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="800.0" y="334.6" font-size="14.5" fill="#0E6B4F" font-weight="600" text-anchor="middle">改法：拷贝前对范围调用 madvise(MADV_POPULATE_READ / WRITE)：缺页、计入、回收都发生在系统调用里，STW 不用等处于系统调用中的线程</text>
<text x="48.0" y="400.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">STW 停顿 p99（ms），各轮长跑</text>
