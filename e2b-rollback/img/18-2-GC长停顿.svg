<text x="909.0" y="690.0" font-size="12" fill="#57606A" text-anchor="middle">long5 +MADV</text>
<rect x="1042.5" y="669.0" width="89.0" height="2.0" rx="3" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.1"/>
<text x="1087.0" y="661.0" font-size="12" fill="#0E6B4F" font-weight="600" text-anchor="middle">1.2</text>
<text x="1087.0" y="690.0" font-size="12" fill="#57606A" text-anchor="middle">long6 上限 60</text>
<rect x="1220.5" y="669.0" width="89.0" height="2.0" rx="3" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.1"/>
