<text x="1265.0" y="690.0" font-size="12" fill="#57606A" text-anchor="middle">long7 +合并</text>
<rect x="1398.5" y="669.1" width="89.0" height="2.0" rx="3" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.1"/>
