<text x="528.0" y="534.2" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">ck4</text>
<text x="528.0" y="557.5" font-size="12.5" fill="#57606A" text-anchor="middle">{2, 5}</text>
<rect x="748.0" y="506.0" width="220.0" height="72.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="858.0" y="534.2" font-size="16" fill="#8A5300" font-weight="600" text-anchor="middle">ck5</text>
