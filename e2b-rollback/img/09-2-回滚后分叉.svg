<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="682" viewBox="0 0 1600 682" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD6603D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#D6603D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="682" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">读档后分叉：存档之间是一棵树，不是一条链</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">依次存 ck1、ck2、ck3；读档回 ck1（ck2、ck3 保留）；从 ck1 继续存 ck4、ck5，它们的父亲是 ck1。创建时间的先后不等于依赖关系；“当前基准”记录沙箱现在从哪个存档继续变化。</text>
