<text x="858.0" y="194.2" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">ck3</text>
<text x="858.0" y="217.5" font-size="12.5" fill="#57606A" text-anchor="middle">{5, 7}</text>
