<text x="1248.0" y="263.3" font-size="13.5" fill="#1F2328" text-anchor="start">ck2</text>
<text x="1378.0" y="263.3" font-size="13.5" fill="#1F2328" text-anchor="start">ck1</text>
<line x1="1048.0" y1="323.0" x2="1552.0" y2="323.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="1058.0" y="305.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">存 ck3</text>
<text x="1248.0" y="305.6" font-size="13.5" fill="#1F2328" text-anchor="start">ck3</text>
<text x="1378.0" y="305.6" font-size="13.5" fill="#1F2328" text-anchor="start">ck2</text>
