<text x="1058.0" y="390.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">存 ck4</text>
<text x="1248.0" y="390.1" font-size="13.5" fill="#1F2328" text-anchor="start">ck4</text>
<text x="1378.0" y="390.1" font-size="13.5" fill="#1F2328" text-anchor="start">ck1</text>
<line x1="1048.0" y1="449.8" x2="1552.0" y2="449.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="1058.0" y="432.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">存 ck5</text>
<text x="1248.0" y="432.3" font-size="13.5" fill="#1F2328" text-anchor="start">ck5</text>
<text x="1378.0" y="432.3" font-size="13.5" fill="#1F2328" text-anchor="start">ck4</text>
<line x1="48.0" y1="616.0" x2="1552.0" y2="616.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="642.0" font-size="13" fill="#8C959F" text-anchor="start">注：条目的父亲写好就不变；沙箱的当前基准在存档成功时变成新存档，在读档成功时变成目标。读档不删除更新的存档，所以能前滚、能跨分支跳。</text></svg>