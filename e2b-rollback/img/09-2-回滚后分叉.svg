<text x="1028.0" y="546.7" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">当前基准</text>
<rect x="1048.0" y="156.0" width="504.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="1058.0" y="178.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">操作</text>
