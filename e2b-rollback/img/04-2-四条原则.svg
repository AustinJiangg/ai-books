<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="632" viewBox="0 0 1600 632" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="632" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">四条设计原则，以及它们各落在哪些机制上</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">原则来自三条硬要求（高频、低延迟、不能中断）和五条约束（ARM、ext4、纯加法、不装代理、版本成对）。全书第二部分的每一篇，都在实现其中一两条。</text>
<rect x="48.0" y="156.0" width="358.0" height="70.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="227.0" y="196.1" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">1. 成本只与改动量挂钩</text>
<rect x="48.0" y="242.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="227.0" y="271.9" font-size="13" fill="#57606A" text-anchor="middle">内存只存本代脏页（第 9 篇）</text>
<rect x="48.0" y="304.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="227.0" y="333.9" font-size="13" fill="#57606A" text-anchor="middle">封存写层只改名（第 10 篇）</text>
<rect x="48.0" y="366.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="227.0" y="395.9" font-size="13" fill="#57606A" text-anchor="middle">不等数据刷盘（第 10 篇）</text>
<rect x="48.0" y="428.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="227.0" y="457.9" font-size="13" fill="#57606A" text-anchor="middle">只写回回滚集（第 9、11 篇）</text>
<rect x="48.0" y="490.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="227.0" y="519.9" font-size="13" fill="#57606A" text-anchor="middle">唯一固定开销：全量根</text>
<rect x="430.0" y="156.0" width="358.0" height="70.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="609.0" y="196.1" font-size="16" fill="#8A5300" font-weight="600" text-anchor="middle">2. 不重建任何宿主资源</text>
<rect x="430.0" y="242.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="609.0" y="271.9" font-size="13" fill="#57606A" text-anchor="middle">同一个 Firecracker 进程</text>
<rect x="430.0" y="304.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="609.0" y="333.9" font-size="13" fill="#57606A" text-anchor="middle">KVM 对象、中断注册不动</text>
<rect x="430.0" y="366.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="609.0" y="395.9" font-size="13" fill="#57606A" text-anchor="middle">tap、网络槽位、NBD 设备不动</text>
<rect x="430.0" y="428.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="609.0" y="457.9" font-size="13" fill="#57606A" text-anchor="middle">内存映射与工作集保留</text>
<rect x="430.0" y="490.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="609.0" y="519.9" font-size="13" fill="#57606A" text-anchor="middle">代价：离不开活沙箱（第 14 篇）</text>
<rect x="812.0" y="156.0" width="358.0" height="70.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="991.0" y="196.1" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">3. 宁可报错，不可静默损坏</text>
<rect x="812.0" y="242.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="991.0" y="271.9" font-size="13" fill="#57606A" text-anchor="middle">缺位图就报错，不悄悄全量回滚</text>
<rect x="812.0" y="304.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="991.0" y="333.9" font-size="13" fill="#57606A" text-anchor="middle">链断了拒绝读档</text>
<rect x="812.0" y="366.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="991.0" y="395.9" font-size="13" fill="#57606A" text-anchor="middle">账本对不上就标记污染</text>
<rect x="812.0" y="428.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="991.0" y="457.9" font-size="13" fill="#57606A" text-anchor="middle">设备组成不一致就拒绝</text>
<rect x="812.0" y="490.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="991.0" y="519.9" font-size="13" fill="#57606A" text-anchor="middle">提交点前查完能查的（第 11、13 篇）</text>
<rect x="1194.0" y="156.0" width="358.0" height="70.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1373.0" y="196.1" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">4. 降级要说出来</text>
<rect x="1194.0" y="242.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1373.0" y="271.9" font-size="13" fill="#57606A" text-anchor="middle">启动日志报能力和理由</text>
<rect x="1194.0" y="304.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1373.0" y="333.9" font-size="13" fill="#57606A" text-anchor="middle">每次存档回报 mem_mode</text>
<rect x="1194.0" y="366.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1373.0" y="395.9" font-size="13" fill="#57606A" text-anchor="middle">Firecracker 自报后端</text>
<rect x="1194.0" y="428.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1373.0" y="457.9" font-size="13" fill="#57606A" text-anchor="middle">可设“没有 HDBSS 就启动失败”</text>
<rect x="1194.0" y="490.0" width="358.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1373.0" y="519.9" font-size="13" fill="#57606A" text-anchor="middle">（第 8 篇）</text>
<line x1="48.0" y1="566.0" x2="1552.0" y2="566.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="592.0" font-size="13" fill="#8C959F" text-anchor="start">注：原则二和“只能在活沙箱上回滚”是同一件事的两面；原则三因为没有兜底重建路线，从好习惯变成了硬要求。</text></svg>