<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="698" viewBox="0 0 1600 698" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="698" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">分层与边界：谁知道“树”，谁只做机械动作</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">语义只在一处：存档树、回滚集只有账本懂；“怎么把一页写进活着的客户机内存”只有 Firecracker 懂。两侧按约定的接口说话，任何一侧改动，只要接口不变，另一侧就不受影响。</text>
<text x="58.0" y="150.0" font-size="13.5" fill="#57606A" font-weight="600" text-anchor="start">层</text>
<text x="378.0" y="150.0" font-size="13.5" fill="#0E6B4F" font-weight="600" text-anchor="start">负责</text>
<text x="1018.0" y="150.0" font-size="13.5" fill="#9A3215" font-weight="600" text-anchor="start">不负责</text>
<rect x="48.0" y="166.0" width="310.0" height="50.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="203.0" y="195.8" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">SDK</text>
<rect x="368.0" y="166.0" width="630.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="683.0" y="195.1" font-size="13.5" fill="#57606A" text-anchor="middle">把四个调用发到沙箱地址</text>
<rect x="1008.0" y="166.0" width="544.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1280.0" y="195.1" font-size="13.5" fill="#57606A" text-anchor="middle">不知道请求没进沙箱</text>
<rect x="48.0" y="226.0" width="310.0" height="50.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="203.0" y="255.8" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">代理</text>
<rect x="368.0" y="226.0" width="630.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="683.0" y="255.1" font-size="13.5" fill="#57606A" text-anchor="middle">认出存档请求并改道</text>
<rect x="1008.0" y="226.0" width="544.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1280.0" y="255.1" font-size="13.5" fill="#57606A" text-anchor="middle">不懂存档的含义</text>
<rect x="48.0" y="286.0" width="310.0" height="50.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="203.0" y="315.8" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">Checkpoint Service</text>
<rect x="368.0" y="286.0" width="630.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="683.0" y="315.1" font-size="13.5" fill="#57606A" text-anchor="middle">编排、排队、全量/增量决策、失败分级、计时</text>
<rect x="1008.0" y="286.0" width="544.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1280.0" y="315.1" font-size="13.5" fill="#57606A" text-anchor="middle">不碰客户机内存，不算回滚集</text>
<rect x="48.0" y="346.0" width="310.0" height="50.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="203.0" y="375.8" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">账本 Store</text>
<rect x="368.0" y="346.0" width="630.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="683.0" y="375.1" font-size="13.5" fill="#57606A" text-anchor="middle">存档树、回滚集、按页找内容、磁盘层清单、合并</text>
<rect x="1008.0" y="346.0" width="544.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1280.0" y="375.1" font-size="13.5" fill="#57606A" text-anchor="middle">不和 Firecracker 说话</text>
<rect x="48.0" y="406.0" width="310.0" height="50.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="203.0" y="435.8" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">Sandbox 对象</text>
<rect x="368.0" y="406.0" width="630.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="683.0" y="435.1" font-size="13.5" fill="#57606A" text-anchor="middle">暂停/恢复、封存写层、换磁盘视图、清连接跟踪</text>
<rect x="1008.0" y="406.0" width="544.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1280.0" y="435.1" font-size="13.5" fill="#57606A" text-anchor="middle">不知道存档树</text>
<line x1="42.0" y1="468.0" x2="1558.0" y2="468.0" stroke="#D9922B" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="1552.0" y="490.0" font-size="12.5" fill="#8A5300" font-weight="600" text-anchor="end">约定的接口：位图文件 + 内容文件 + 三处扩展</text>
<rect x="48.0" y="502.0" width="310.0" height="50.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="203.0" y="531.8" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">Firecracker（分叉）</text>
<rect x="368.0" y="502.0" width="630.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="683.0" y="531.0" font-size="13.5" fill="#57606A" text-anchor="middle">写快照、导出脏页、原地回滚</text>
<rect x="1008.0" y="502.0" width="544.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1280.0" y="531.0" font-size="13.5" fill="#57606A" text-anchor="middle">不知道有“树”这回事</text>
<rect x="48.0" y="562.0" width="310.0" height="50.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="203.0" y="591.8" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">KVM / CPU</text>
<rect x="368.0" y="562.0" width="630.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="683.0" y="591.0" font-size="13.5" fill="#57606A" text-anchor="middle">记录脏页</text>
<rect x="1008.0" y="562.0" width="544.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1280.0" y="591.0" font-size="13.5" fill="#57606A" text-anchor="middle">——</text>
<line x1="48.0" y1="632.0" x2="1552.0" y2="632.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="658.0" font-size="13" fill="#8C959F" text-anchor="start">注：Firecracker 只加了三处，没有改动任何已有行为；orchestrator 与 Firecracker 必须成对交付，未打补丁的版本在 rollback 接口上返回 404。</text></svg>