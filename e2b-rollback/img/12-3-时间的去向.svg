<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="642" viewBox="0 0 1600 642" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="642" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">读档之后，各种“时间”去了哪里</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">单调时钟来自 vCPU 寄存器，跟着倒退；墙钟在读档返回之前由 envd 按宿主时间校正；VMGenID 让客户机内核重新播种随机数，但用户程序自己缓存的随机状态在内存里，被原样带回，要业务自己重新初始化。</text>
<rect x="48.0" y="156.0" width="361.0" height="70.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="228.5" y="195.8" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">单调时钟 CLOCK_MONOTONIC</text>
<rect x="48.0" y="240.0" width="361.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="228.5" y="279.2" font-size="14" fill="#57606A" text-anchor="middle">倒退到存档时刻</text>
<rect x="48.0" y="324.0" width="361.0" height="110.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="228.5" y="382.9" font-size="13" fill="#57606A" text-anchor="middle">不要用它量跨越读档的间隔；租约、超时判断要重新校准</text>
<rect x="429.0" y="156.0" width="361.0" height="70.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="609.5" y="195.8" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">墙钟 CLOCK_REALTIME</text>
<rect x="429.0" y="240.0" width="361.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="609.5" y="279.2" font-size="14" fill="#57606A" text-anchor="middle">读档返回前被 envd 校回现在</text>
<rect x="429.0" y="324.0" width="361.0" height="110.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="609.5" y="382.9" font-size="13" fill="#57606A" text-anchor="middle">调用方读档返回后再发的命令，看到的已是正确时间</text>
<rect x="810.0" y="156.0" width="361.0" height="70.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="990.5" y="195.8" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">内核随机数</text>
<rect x="810.0" y="240.0" width="361.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="990.5" y="279.2" font-size="14" fill="#57606A" text-anchor="middle">VMGenID 通知后重新播种</text>
<rect x="810.0" y="324.0" width="361.0" height="110.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="990.5" y="382.9" font-size="13" fill="#57606A" text-anchor="middle">新代号写在内存回滚之后</text>
<rect x="1191.0" y="156.0" width="361.0" height="70.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1371.5" y="195.8" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">用户态随机状态</text>
<rect x="1191.0" y="240.0" width="361.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1371.5" y="279.2" font-size="14" fill="#57606A" text-anchor="middle">回退到存档时刻</text>
<rect x="1191.0" y="324.0" width="361.0" height="110.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1371.5" y="373.1" font-size="13" fill="#57606A" text-anchor="middle">同一存档出发的两次执行可能得到相同随机序列，读档后</text>
<text x="1371.5" y="392.6" font-size="13" fill="#57606A" text-anchor="middle">自己重新初始化</text>
<rect x="48.0" y="466.0" width="1504.0" height="80.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="497.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">活性判据：用计数器在增长，不用时间戳在推进</text>
<text x="800.0" y="521.2" font-size="12.5" fill="#57606A" text-anchor="middle">凭直觉用时间判断后台进程是否还在跑，会在一次完全正确的读档上报失败；反过来，PID 和启动时刻在多次存档、读档之间不变，是“回到那一刻”最硬的证据</text>
<line x1="48.0" y1="576.0" x2="1552.0" y2="576.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="602.0" font-size="13" fill="#8C959F" text-anchor="start">注：如果 envd 一直不应答，墙钟就没有被校正，读档以 guest_unresponsive 报错（第 13 篇）。</text></svg>