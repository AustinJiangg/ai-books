<text x="292.0" y="460.6" font-size="12.5" fill="#57606A" text-anchor="middle">读档后现场不一致</text>
<rect x="556.0" y="386.0" width="488.0" height="100.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="800.0" y="427.9" font-size="15" fill="#8A5300" font-weight="600" text-anchor="middle">不判失败</text>
<text x="800.0" y="451.2" font-size="12.5" fill="#57606A" text-anchor="middle">超过 200 / 100 ms 目标线：那是结论，不是故障</text>
<rect x="1064.0" y="386.0" width="488.0" height="100.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1308.0" y="427.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">每轮</text>
<text x="1308.0" y="451.2" font-size="12.5" fill="#57606A" text-anchor="middle">新沙箱跑几遍，遍与遍之间查漂移；小档样本多给</text>
<line x1="48.0" y1="516.0" x2="1552.0" y2="516.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="542.0" font-size="13" fill="#8C959F" text-anchor="start">注：正确性可以远程验，性能必须在宿主上测：脏页后端、存档盘文件系统、产物实际大小、服务端分段计时都只能在宿主上读到。</text></svg>