<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="582" viewBox="0 0 1600 582" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m8C959F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#8C959F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="582" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">一次分档迭代：改、存、读档回去、校验、删</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">cpB 每次都挂在基点 cpA 下面、用完就删，链深不会随迭代变深；从 cpB 读档回 cpA 的回滚集正好是本档造的改动，所以读档那一列也能按档位读；每次都校验现场，耗时只有在“回对了”的前提下才有意义。</text>
<rect x="48.0" y="166.0" width="222.3" height="100.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="159.2" y="220.8" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="middle">处在基点 cpA</text>
<path d="M274.3 216.0 L300.3 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="304.3" y="166.0" width="222.3" height="100.0" rx="10" fill="#F3F0FF" stroke="#8B7FE0" stroke-width="1.3"/>
<text x="415.5" y="207.9" font-size="15" fill="#4B3FA8" font-weight="600" text-anchor="middle">造本档改动</text>
<text x="415.5" y="231.2" font-size="12.5" fill="#57606A" text-anchor="middle">内存 3 : 文件 1</text>
<path d="M530.7 216.0 L556.7 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="560.7" y="166.0" width="222.3" height="100.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="671.8" y="207.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">增量存档 → cpB</text>
<text x="671.8" y="231.2" font-size="12.5" fill="#57606A" text-anchor="middle">记墙钟、分段、产物</text>
<path d="M787.0 216.0 L813.0 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="817.0" y="166.0" width="222.3" height="100.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="928.2" y="207.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">读档回 cpA</text>
<text x="928.2" y="231.2" font-size="12.5" fill="#57606A" text-anchor="middle">撤销本档改动</text>
<path d="M1043.3 216.0 L1069.3 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1073.3" y="166.0" width="222.3" height="100.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1184.5" y="207.9" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">校验现场</text>
<text x="1184.5" y="231.2" font-size="12.5" fill="#57606A" text-anchor="middle">落错记异常</text>
<path d="M1299.7 216.0 L1325.7 216.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1329.7" y="166.0" width="222.3" height="100.0" rx="10" fill="#F6F6F3" stroke="#B7B5AC" stroke-width="1.3"/>
<text x="1440.8" y="207.9" font-size="15" fill="#3D3C38" font-weight="600" text-anchor="middle">删除 cpB</text>
<text x="1440.8" y="231.2" font-size="12.5" fill="#57606A" text-anchor="middle">链深配平</text>
<path d="M1452.0 270.0 L1452.0 316.0 L148.0 316.0 L148.0 270.0" fill="none" stroke="#8C959F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m8C959F)"/>
<text x="800.0" y="338.0" font-size="13" fill="#57606A" text-anchor="middle">下一次迭代</text>
