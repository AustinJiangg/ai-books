<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="690" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">存档目录：每个文件谁写、谁读、什么时候消失</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">根目录在 orchestrator 启动时整个清空，账本从不读盘。文件先写临时名、再改名到位（不 fsync）：prepared 的条目不在账本里，只有 committed 的才能被列出、被读档。</text>
