<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="638" viewBox="0 0 1600 638" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="638" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">纪元前进前后：失败处理从“删干净”变成“三层降级”</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">写快照成功的那一刻，Firecracker 把脏页记录清零，差分文件成了那段时间脏页的唯一记录。此前的失败删目录就行；此后的失败如果删目录，那一段写过哪些页就永远丢了，之后的读档会静默漏页。</text>
<line x1="48.0" y1="206.0" x2="1552.0" y2="206.0" stroke="#57606A" stroke-width="2" stroke-linecap="round" marker-end="url(#m57606A)"/>
<line x1="608.0" y1="176.0" x2="608.0" y2="236.0" stroke="#D6603D" stroke-width="3" stroke-linecap="round"/>
<text x="608.0" y="166.0" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">写快照成功：纪元前进</text>
<text x="328.0" y="236.0" font-size="13.5" fill="#57606A" text-anchor="middle">检查 · 决策 · Prepare · 暂停</text>
<text x="1080.0" y="236.0" font-size="13.5" fill="#57606A" text-anchor="middle">封存 · 改名 · 登记磁盘账本 · 提交</text>
<rect x="48.0" y="276.0" width="530.0" height="120.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="313.0" y="318.1" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">失败是干净的</text>
<text x="313.0" y="342.0" font-size="13" fill="#57606A" text-anchor="middle">删掉刚建的目录</text>
<text x="313.0" y="361.5" font-size="13" fill="#57606A" text-anchor="middle">虚机没被碰过，沙箱照常运行</text>
<rect x="638.0" y="276.0" width="914.0" height="70.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1095.0" y="302.8" font-size="14.5" fill="#0E6B4F" font-weight="600" text-anchor="middle">能正常提交</text>
<text x="1095.0" y="326.0" font-size="12.5" fill="#57606A" text-anchor="middle">→ 正常提交</text>
<rect x="638.0" y="358.0" width="914.0" height="70.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1095.0" y="384.8" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">不能 → 能隐藏提交吗？</text>
<text x="1095.0" y="408.0" font-size="12.5" fill="#57606A" text-anchor="middle">→ 隐藏提交：不出现在列表里、不能读档，但位图和差分留在树里，纪元没丢</text>
<rect x="638.0" y="440.0" width="914.0" height="70.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1095.0" y="466.8" font-size="14.5" fill="#9A3215" font-weight="600" text-anchor="middle">也不能</text>
<text x="1095.0" y="490.0" font-size="12.5" fill="#57606A" text-anchor="middle">→ 标记链断：拒绝一切读档，下一次存档强制全量，起一棵新树</text>
<text x="638.0" y="540.0" font-size="13" fill="#57606A" text-anchor="start">另：封存已换上新写层、旧层还没登记时，磁盘账本标记“已污染”。</text>
<line x1="48.0" y1="572.0" x2="1552.0" y2="572.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="598.0" font-size="13" fill="#8C959F" text-anchor="start">注：三层的思路是一致的：宁可留下一点垃圾，也不能留下一条坏链（第 13 篇）。</text></svg>