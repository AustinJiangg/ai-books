<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="642" viewBox="0 0 1600 642" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F2328" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m8C959F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#8C959F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD6603D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#D6603D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="642" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">存档、失败、读档、再试：任务可以回到准备完成的那一刻</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">准备环境要好几分钟。在准备完成时存档 S；方案 A 失败后读档回 S，依赖、配置、进程和已加载的数据一起回来；再试方案 B。读档不删除更新的存档，所以 A1 仍然可以回去。</text>
<rect x="48.0" y="156.0" width="260.0" height="90.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="178.0" y="183.9" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">准备环境</text>
<text x="178.0" y="207.1" font-size="12.5" fill="#57606A" text-anchor="middle">拉代码、装依赖、导数据、起服务</text>
<text x="178.0" y="225.9" font-size="12.5" fill="#57606A" text-anchor="middle">几分钟</text>
<rect x="378.0" y="171.0" width="110.0" height="60.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="433.0" y="206.1" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">存档 S</text>
<path d="M312.0 201.0 L374.0 201.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="568.0" y="156.0" width="300.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="718.0" y="205.8" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">方案 A：升级组件、改配置、跑测试</text>
<path d="M492.0 201.0 L564.0 201.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="608.0" y="276.0" width="110.0" height="50.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="663.0" y="305.5" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="middle">存档 A1</text>
<path d="M663.0 250.0 L663.0 272.0" fill="none" stroke="#8C959F" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#m8C959F)"/>
<rect x="948.0" y="156.0" width="220.0" height="90.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1058.0" y="193.2" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">测试失败</text>
<text x="1058.0" y="216.5" font-size="12.5" fill="#57606A" text-anchor="middle">配置被覆盖、服务退出</text>
<path d="M872.0 201.0 L944.0 201.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<path d="M1058.0 250.0 L1058.0 386.0 L408.0 386.0 L408.0 235.0" fill="none" stroke="#D6603D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD6603D)"/>
<text x="793.0" y="410.0" font-size="13.5" fill="#9A3215" font-weight="600" text-anchor="middle">读档回 S：几十毫秒，同一台沙箱</text>
<rect x="568.0" y="456.0" width="300.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="718.0" y="492.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">方案 B</text>
<text x="718.0" y="516.2" font-size="12.5" fill="#57606A" text-anchor="middle">从 S 的现场出发</text>
<path d="M463.0 235.0 L463.0 501.0 L564.0 501.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="948.0" y="456.0" width="220.0" height="90.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1058.0" y="493.2" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">成功</text>
<text x="1058.0" y="516.5" font-size="12.5" fill="#57606A" text-anchor="middle">继续推进</text>
<path d="M872.0 501.0 L944.0 501.0" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F2328)"/>
<rect x="1228.0" y="156.0" width="324.0" height="390.0" rx="14" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1248.0" y="186.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">读档后回来的是</text>
<circle cx="1256.0" cy="241.4" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1268.0" y="246.0" font-size="13.5" fill="#1F2328" text-anchor="start">依赖、配置文件</text>
<circle cx="1256.0" cy="287.4" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1268.0" y="292.0" font-size="13.5" fill="#1F2328" text-anchor="start">后台服务进程（原来的 PID）</text>
<circle cx="1256.0" cy="333.4" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1268.0" y="338.0" font-size="13.5" fill="#1F2328" text-anchor="start">进程里已加载的数据</text>
<circle cx="1256.0" cy="379.4" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1268.0" y="384.0" font-size="13.5" fill="#1F2328" text-anchor="start">保存后被杀的进程复活</text>
<circle cx="1256.0" cy="425.4" r="3.6" fill="#57606A" stroke="none" stroke-width="1"/>
<text x="1268.0" y="430.0" font-size="13.5" fill="#1F2328" text-anchor="start">保存后才起的进程消失</text>
<line x1="48.0" y1="576.0" x2="1552.0" y2="576.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="602.0" font-size="13" fill="#8C959F" text-anchor="start">注：读档要求承载沙箱的那台虚拟机还活着。宿主宕机、沙箱已被销毁之后的恢复，是原生快照的事（第 15 篇）。</text></svg>