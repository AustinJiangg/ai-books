<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="702" viewBox="0 0 1600 702" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="702" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">代际边界：一个 Firecracker 进程就是一代，换代后旧存档全部失效</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">账本按代记账，不按沙箱 ID。同一个 ID 经原生 pause / resume 换了新进程，新一代从零开始，旧存档 ID 返回 not_found；迟到的“沙箱被移除”通知发现 ID 已被活着的新一代持有，就什么也不做。</text>
<line x1="48.0" y1="236.0" x2="1552.0" y2="236.0" stroke="#57606A" stroke-width="2" stroke-linecap="round" marker-end="url(#m57606A)"/>
<rect x="68.0" y="196.0" width="640.0" height="80.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="388.0" y="227.9" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="middle">第 1 代：Firecracker 进程 #1</text>
<text x="388.0" y="251.2" font-size="12.5" fill="#57606A" text-anchor="middle">ck1 · ck2 · ck3 …… 都有效</text>
<line x1="768.0" y1="176.0" x2="768.0" y2="296.0" stroke="#D6603D" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="768.0" y="166.0" font-size="15" fill="#9A3215" font-weight="600" text-anchor="middle">换代</text>
<rect x="828.0" y="196.0" width="704.0" height="80.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="1180.0" y="227.9" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="middle">第 2 代：Firecracker 进程 #2（同一个沙箱 ID）</text>
<text x="1180.0" y="251.2" font-size="12.5" fill="#57606A" text-anchor="middle">看不到 ck1～ck3；第一次存档是新的全量根</text>
<rect x="48.0" y="346.0" width="1504.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="368.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">事件</text>
<text x="578.0" y="368.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">结果</text>
<line x1="48.0" y1="429.2" x2="1552.0" y2="429.2" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="411.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">沙箱被销毁</text>
<text x="578.0" y="411.6" font-size="14" fill="#1F2328" text-anchor="start">存档随之删除</text>
<line x1="48.0" y1="472.2" x2="1552.0" y2="472.2" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="454.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">原生 pause / resume</text>
<text x="578.0" y="454.6" font-size="14" fill="#1F2328" text-anchor="start">同一个 ID、新的进程，旧存档全部失效</text>
<line x1="48.0" y1="515.2" x2="1552.0" y2="515.2" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="497.6" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">Firecracker 或 orchestrator 重启</text>
<text x="578.0" y="497.6" font-size="14" fill="#1F2328" text-anchor="start">全部失效（账本启动时清空）</text>
<line x1="48.0" y1="558.2" x2="1552.0" y2="558.2" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="540.5" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">宿主重启、迁移到别的机器</text>
<text x="578.0" y="540.5" font-size="14" fill="#1F2328" text-anchor="start">全部失效</text>
<rect x="48.0" y="560.2" width="1504.0" height="39.0" rx="6" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1"/>
<text x="58.0" y="583.5" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="start">沙箱里的普通程序退出、重启</text>
<text x="578.0" y="583.5" font-size="14" fill="#0E6B4F" text-anchor="start">不算换代，存档照常有效</text>
<line x1="48.0" y1="636.0" x2="1552.0" y2="636.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="662.0" font-size="13" fill="#8C959F" text-anchor="start">注：为什么必须这样：读档是原地回滚，上一代的存档没有可以写回去的活进程；撕裂标记也按代记。</text></svg>