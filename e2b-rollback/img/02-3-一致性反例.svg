<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="632" viewBox="0 0 1600 632" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m57606A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="632" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">为什么必须是同一瞬间：内存 T1 加磁盘 T2 等于损坏</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">左边分两次暂停：内存在 T1 存，磁盘在 T2 存，中间客户机还在写。读档后文件系统的内存状态和磁盘块属于两个时刻。右边在一次暂停里一起存，客户机没刷盘的数据留在内存镜像里，位置完全正确。</text>
<rect x="48.0" y="156.0" width="722.0" height="380.0" rx="14" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="68.0" y="186.0" font-size="15" fill="#9A3215" font-weight="600" text-anchor="start">错误：分两次暂停</text>
<line x1="78.0" y1="266.0" x2="740.0" y2="266.0" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#m57606A)"/>
<line x1="168.0" y1="252.0" x2="168.0" y2="280.0" stroke="#D6603D" stroke-width="2.4" stroke-linecap="round"/>
<text x="168.0" y="244.0" font-size="13.5" fill="#9A3215" font-weight="600" text-anchor="middle">T1：存内存</text>
<line x1="610.0" y1="252.0" x2="610.0" y2="280.0" stroke="#D6603D" stroke-width="2.4" stroke-linecap="round"/>
<text x="610.0" y="244.0" font-size="13.5" fill="#9A3215" font-weight="600" text-anchor="middle">T2：存磁盘</text>
<text x="389.0" y="296.0" font-size="12.5" fill="#57606A" text-anchor="middle">客户机继续写：日志提交、块分配</text>
<circle cx="82.0" cy="371.4" r="3.6" fill="#D6603D" stroke="none" stroke-width="1"/>
<text x="94.0" y="376.0" font-size="13.5" fill="#1F2328" text-anchor="start">日志记着已提交，内存里提交还没发生</text>
<circle cx="82.0" cy="405.4" r="3.6" fill="#D6603D" stroke="none" stroke-width="1"/>
<text x="94.0" y="410.0" font-size="13.5" fill="#1F2328" text-anchor="start">缓存里的块比磁盘上的还旧</text>
<circle cx="82.0" cy="439.4" r="3.6" fill="#D6603D" stroke="none" stroke-width="1"/>
<text x="94.0" y="444.0" font-size="13.5" fill="#1F2328" text-anchor="start">inode 说 10 个块，分配表说 8 个</text>
<text x="78.0" y="496.0" font-size="14" fill="#9A3215" font-weight="600" text-anchor="start">→ 报文件系统损坏，或者悄悄读到错数据</text>
<rect x="830.0" y="156.0" width="722.0" height="380.0" rx="14" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="850.0" y="186.0" font-size="15" fill="#0E6B4F" font-weight="600" text-anchor="start">正确：一次暂停里一起存</text>
<rect x="860.0" y="226.0" width="662.0" height="190.0" rx="10" fill="#EAF3FF" stroke="#9CC3F0" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="880.0" y="254.0" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="start">冻结窗口</text>
<rect x="890.0" y="268.0" width="602.0" height="38.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1191.0" y="290.9" font-size="13" fill="#57606A" text-anchor="middle">保存内存</text>
<rect x="890.0" y="314.0" width="602.0" height="38.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1191.0" y="336.9" font-size="13" fill="#57606A" text-anchor="middle">保存磁盘</text>
<rect x="890.0" y="360.0" width="602.0" height="38.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1191.0" y="382.9" font-size="13" fill="#57606A" text-anchor="middle">保存 vCPU、GIC、设备状态</text>
<text x="860.0" y="456.0" font-size="13.5" fill="#1F2328" text-anchor="start">没刷盘的数据留在内存镜像里，位置正确；</text>
<text x="860.0" y="482.0" font-size="13.5" fill="#1F2328" text-anchor="start">读档后客户机会像什么都没发生一样把它刷下去。</text>
<line x1="48.0" y1="566.0" x2="1552.0" y2="566.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="592.0" font-size="13" fill="#8C959F" text-anchor="start">注：这是全书八条顺序约束的第一条（第 7 篇），存档时由“写快照”和“封存写层”在同一个冻结窗口里完成（第 6 篇）。</text></svg>