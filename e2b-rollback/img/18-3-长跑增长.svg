<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="670" viewBox="0 0 1600 670" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="670" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">长跑中的增长：修复前后对比</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">左：每台沙箱最多 60 个可见存档，30 分钟长跑的存档盘增长峰值。修复前隐藏存档无限积累、层文件从不回收；加上层回收和合并后，目录稳定在约 1240，峰值从 340.6 GiB 降到约 90 GiB。右：只留最近 10 个，读档中</text>
<text x="48.0" y="116.0" font-size="15" fill="#57606A" text-anchor="start">位数随时间的变化，视图装配改成位图批量处理后不再跟着块数涨。</text>
