<text x="48.0" y="630.0" font-size="13" fill="#8C959F" text-anchor="start">注：修复后块数比修复前同期还略多，读档却更快；剩下的缓慢增长来自客户机后台持续写内存让回滚集真实变大，是真实工作量。</text></svg>