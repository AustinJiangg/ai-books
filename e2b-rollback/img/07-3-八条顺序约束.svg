<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="734" viewBox="0 0 1600 734" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="734" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">八条顺序约束：只有一条被违反后能立刻报错</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">前五条在 orchestrator 的编排里，后三条在 Firecracker 内部。被违反后能立刻报错的只有第 2 条（靠 Firecracker 的覆盖校验兜底）；第 1 条可能以文件系统报错露头；其余全是静默的。</text>
<circle cx="62.0" cy="171.0" r="11" fill="#1F2328" stroke="none" stroke-width="1"/>
