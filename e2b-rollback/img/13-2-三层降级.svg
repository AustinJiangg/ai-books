<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="592" viewBox="0 0 1600 592" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD9922B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#D9922B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="592" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">存档的三层降级：宁可留下垃圾，也不留下坏链</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">写快照之前的失败删目录即可。写快照之后，差分是那段脏页的唯一记录：能正常提交就提交；不能就以隐藏条目提交，保住纪元；连隐藏都提交不了，就标记链断，拒绝读档，直到下一次全量存档起一棵新树。</text>
<rect x="48.0" y="156.0" width="760.0" height="84.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="428.0" y="189.9" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">正常提交</text>
<text x="428.0" y="213.8" font-size="13" fill="#57606A" text-anchor="middle">条目可见、可读档；当前基准 ← 新存档</text>
<path d="M108.0 244.0 L108.0 264.0 L188.0 264.0 L188.0 272.0" fill="none" stroke="#1F9E77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1F9E77)"/>
<text x="128.0" y="260.0" font-size="12.5" fill="#9A3215" font-weight="600" text-anchor="start">失败</text>
<rect x="168.0" y="276.0" width="760.0" height="84.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="548.0" y="309.9" font-size="16" fill="#8A5300" font-weight="600" text-anchor="middle">隐藏提交</text>
<text x="548.0" y="333.8" font-size="13" fill="#57606A" text-anchor="middle">列表里看不见、不能作为读档目标；位图和差分留在树里，回滚集计算照常用它</text>
<path d="M228.0 364.0 L228.0 384.0 L308.0 384.0 L308.0 392.0" fill="none" stroke="#D9922B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
<text x="248.0" y="380.0" font-size="12.5" fill="#9A3215" font-weight="600" text-anchor="start">失败</text>
<rect x="288.0" y="396.0" width="760.0" height="84.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="668.0" y="429.9" font-size="16" fill="#9A3215" font-weight="600" text-anchor="middle">标记链断</text>
<text x="668.0" y="453.8" font-size="13" fill="#57606A" text-anchor="middle">拒绝一切读档（回 chain_broken）；下一次存档强制全量，起新树</text>
<rect x="1108.0" y="156.0" width="444.0" height="340.0" rx="14" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="1128.0" y="186.0" font-size="15" fill="#1F2328" font-weight="600" text-anchor="start">三种保护状态</text>
<rect x="1128.0" y="226.0" width="404.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1330.0" y="255.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">隐藏条目</text>
<text x="1330.0" y="279.2" font-size="12.5" fill="#57606A" text-anchor="middle">在树里，不在接口里</text>
<rect x="1128.0" y="314.0" width="404.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1330.0" y="343.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">链断</text>
<text x="1330.0" y="367.2" font-size="12.5" fill="#57606A" text-anchor="middle">拒绝读档；全量根当全 1，跨树读档自动正确</text>
<rect x="1128.0" y="402.0" width="404.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1330.0" y="431.9" font-size="15" fill="#1F2328" font-weight="600" text-anchor="middle">账本污染</text>
<text x="1330.0" y="455.2" font-size="12.5" fill="#57606A" text-anchor="middle">层栈已变而账本没跟上；拒绝存档，读档后恢复</text>
<line x1="48.0" y1="526.0" x2="1552.0" y2="526.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="552.0" font-size="13" fill="#8C959F" text-anchor="start">注：封存已经把新写层换上、旧层还没登记进账本时，还要额外把磁盘账本标记为“已污染”（rootfs_poisoned）。</text></svg>