<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="650" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">三层测试，各证什么</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">单元测试与属性测试守部件和不变量；整机验收在目标机上证明整体正确、量耗时、跑并发和长跑；补充用例覆盖盲区、边界和故障注入。上机的一站式入口是 run.sh 的 smoke / func / perf / long / hdbss 几档。</text>
<rect x="288.0" y="156.0" width="1024.0" height="110.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="800.0" y="193.9" font-size="16" fill="#1D4F91" font-weight="600" text-anchor="middle">单元测试与属性测试</text>
<text x="800.0" y="217.1" font-size="12.5" fill="#57606A" text-anchor="middle">代码仓库里，和被测代码放在一起</text>
<text x="800.0" y="235.9" font-size="12.5" fill="#57606A" text-anchor="middle">部件与不变量；随机操作序列对照参照模型；故意注入错误，确认测试会失败</text>
<rect x="168.0" y="282.0" width="1264.0" height="110.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="800.0" y="319.9" font-size="16" fill="#0E6B4F" font-weight="600" text-anchor="middle">整机验收</text>
<text x="800.0" y="343.1" font-size="12.5" fill="#57606A" text-anchor="middle">五个单文件脚本，拷到目标机就能跑</text>
<text x="800.0" y="361.9" font-size="12.5" fill="#57606A" text-anchor="middle">59 项正确性检查、分档性能、并发、长跑；故意不抽公共模块</text>
<rect x="48.0" y="408.0" width="1504.0" height="110.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="800.0" y="445.9" font-size="16" fill="#8A5300" font-weight="600" text-anchor="middle">补充用例与开发工具</text>
<text x="800.0" y="469.1" font-size="12.5" fill="#57606A" text-anchor="middle">20 个用例 + 诊断工具箱</text>
<text x="800.0" y="487.9" font-size="12.5" fill="#57606A" text-anchor="middle">生命周期竞争、文件系统边界、时间与 CPU、串口、故障注入、提交点后失败、和原生快照的组合</text>
<text x="48.0" y="554.0" font-size="14" fill="#1F2328" text-anchor="start">几条约定：打 RPM 包时不跑单元测试；正确性和性能分开跑；都在宿主上以 root 跑。</text>
<line x1="48.0" y1="584.0" x2="1552.0" y2="584.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="610.0" font-size="13" fill="#8C959F" text-anchor="start">注：正确性可以远程验，性能必须在宿主上测，因为条件标签只能在宿主上读到（第 16 篇）。</text></svg>