<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">2 GiB 沙箱、HDBSS、ext4；内存 : 文件 = 3 : 1。128 MiB 以内两项都在参考线内；256 MiB 读档 105.6 ms，开始超线；512 MiB 极限档两项都超。折线只连接已测档位，看趋势用，不是连续区间的保证。</text>
