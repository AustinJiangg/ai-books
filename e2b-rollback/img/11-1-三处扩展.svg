<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="772" viewBox="0 0 1600 772" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs></defs><rect width="1600" height="772" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">Firecracker 的三处扩展，各在哪一步被调用</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">扩展一是已有快照接口上的一个新字段，写快照时同时写出位图；扩展二在暂停时导出活跃脏页，不清零；扩展三是原地回滚。Firecracker 只做机械动作，不知道存档树。</text>
<rect x="48.0" y="156.0" width="722.0" height="330.0" rx="14" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="68.0" y="186.0" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="start">存档</text>
<rect x="72.0" y="216.0" width="674.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="409.0" y="241.1" font-size="13.5" fill="#57606A" text-anchor="middle">暂停</text>
<rect x="72.0" y="268.0" width="674.0" height="42.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="409.0" y="293.1" font-size="13.5" fill="#57606A" text-anchor="middle">仅全量：导出活跃位图  ←  扩展二 save-dirty-bitmap</text>
<rect x="72.0" y="320.0" width="674.0" height="42.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="409.0" y="345.1" font-size="13.5" fill="#57606A" text-anchor="middle">写快照  ←  扩展一 dirty_bitmap_path</text>
<rect x="72.0" y="372.0" width="674.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="409.0" y="397.1" font-size="13.5" fill="#57606A" text-anchor="middle">封存写层</text>
<rect x="72.0" y="424.0" width="674.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="409.0" y="449.1" font-size="13.5" fill="#57606A" text-anchor="middle">恢复</text>
<rect x="830.0" y="156.0" width="722.0" height="330.0" rx="14" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="850.0" y="186.0" font-size="15" fill="#1D4F91" font-weight="600" text-anchor="start">读档</text>
<rect x="854.0" y="216.0" width="674.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1191.0" y="241.1" font-size="13.5" fill="#57606A" text-anchor="middle">暂停</text>
<rect x="854.0" y="268.0" width="674.0" height="42.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1191.0" y="293.1" font-size="13.5" fill="#57606A" text-anchor="middle">导出活跃脏页  ←  扩展二 save-dirty-bitmap</text>
<rect x="854.0" y="320.0" width="674.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1191.0" y="345.1" font-size="13.5" fill="#57606A" text-anchor="middle">物化回滚集</text>
<rect x="854.0" y="372.0" width="674.0" height="42.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1191.0" y="397.1" font-size="13.5" fill="#57606A" text-anchor="middle">原地回滚  ←  扩展三 PUT /snapshot/rollback</text>
<rect x="854.0" y="424.0" width="674.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1191.0" y="449.1" font-size="13.5" fill="#57606A" text-anchor="middle">换磁盘、恢复</text>
<rect x="48.0" y="516.0" width="1504.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="538.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">扩展</text>
<text x="358.0" y="538.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">做什么</text>
<text x="918.0" y="538.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">为什么这样设计</text>
<line x1="48.0" y1="598.5" x2="1552.0" y2="598.5" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="581.1" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">dirty_bitmap_path</text>
<text x="358.0" y="581.1" font-size="13.5" fill="#1F2328" text-anchor="start">写差分快照的同时写出这一代位图</text>
<text x="918.0" y="581.1" font-size="13.5" fill="#1F2328" text-anchor="start">不能拆成两次调用：写完快照就清零了；先取位图又会让快照拿不到这些页</text>
<line x1="48.0" y1="640.8" x2="1552.0" y2="640.8" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="623.3" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">save-dirty-bitmap</text>
<text x="358.0" y="623.3" font-size="13.5" fill="#1F2328" text-anchor="start">暂停时导出“自上次清零以来”的位图，不清零</text>
<text x="918.0" y="623.3" font-size="13.5" fill="#1F2328" text-anchor="start">读档要事先知道 Firecracker 会写回哪些页，才能准备好内容</text>
<line x1="48.0" y1="683.0" x2="1552.0" y2="683.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="665.6" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">rollback</text>
<text x="358.0" y="665.6" font-size="13.5" fill="#1F2328" text-anchor="start">把位图指定的页从文件写回内存，恢复 CPU、GIC、设备</text>
<text x="918.0" y="665.6" font-size="13.5" fill="#1F2328" text-anchor="start">orchestrator 总是传“回滚完先别恢复运行”：磁盘还没换</text>
<line x1="48.0" y1="706.0" x2="1552.0" y2="706.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="732.0" font-size="13" fill="#8C959F" text-anchor="start">注：快照和位图都不 fsync：读它们的只有同机的 orchestrator 和 Firecracker，存档本来就不承诺扛过宿主崩溃。</text></svg>