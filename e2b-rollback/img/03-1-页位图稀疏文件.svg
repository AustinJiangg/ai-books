<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">内存按 4 KiB 一页管理，2 GiB 是 524288 页；位图一页一个比特，只有 64 KiB；稀疏文件把每个脏页写在它自己的偏移上，逻辑上 2 GiB，实际只占写过的那几页。</text>
