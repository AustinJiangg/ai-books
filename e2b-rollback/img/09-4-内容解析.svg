<text x="48.0" y="578.0" font-size="13" fill="#8C959F" text-anchor="start">注：树根默认存全量、位图全 1，所以一定找得到，读档只读本地文件；缺位图、读短了都直接报错，不悄悄全量回滚或填 0。</text></svg>