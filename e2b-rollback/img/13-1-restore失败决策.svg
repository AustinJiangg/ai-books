<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="582" viewBox="0 0 1600 582" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m8C959F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#8C959F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="582" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">读档的四档失败：按失败发生在哪里分级</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">提交点把失败切成两半：之前没动客户机，沙箱原样可用；之后动了，就是撕裂。再加上树解析不了的情形和客户机不应答的情形，一共四档，每一档调用方的应对都不同。</text>
<rect x="48.0" y="171.0" width="220.0" height="70.0" rx="10" fill="#F4F5F7" stroke="#57606A" stroke-width="1.3"/>
<text x="158.0" y="211.1" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">读档失败了</text>
<rect x="348.0" y="156.0" width="286.0" height="100.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="491.0" y="198.1" font-size="14.5" fill="#1D4F91" font-weight="600" text-anchor="middle">存档树解析不了</text>
<text x="491.0" y="220.7" font-size="12" fill="#57606A" text-anchor="middle">没有磁盘描述、祖先缺失、丢过纪元</text>
<rect x="432.4" y="273.0" width="117.2" height="26.0" rx="13.0" fill="#F4F5F7" stroke="#57606A" stroke-width="1"/>
<text x="491.0" y="290.7" font-size="13" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">chain_broken</text>
<rect x="348.0" y="316.0" width="286.0" height="64.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="491.0" y="352.5" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="middle">原样，继续可用</text>
<rect x="348.0" y="396.0" width="286.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="491.0" y="445.1" font-size="13.5" fill="#57606A" text-anchor="middle">不要原样重试：先存一个新档，再读档</text>
<path d="M491.0 132.0 L491.0 152.0" fill="none" stroke="#8C959F" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8C959F)"/>
<rect x="654.0" y="156.0" width="286.0" height="100.0" rx="10" fill="#EDF4FD" stroke="#5B9BE6" stroke-width="1.3"/>
<text x="797.0" y="198.1" font-size="14.5" fill="#1D4F91" font-weight="600" text-anchor="middle">提交点之前的其他失败</text>
<text x="797.0" y="220.7" font-size="12" fill="#57606A" text-anchor="middle">装配视图、物化、Firecracker 校验不过</text>
<rect x="754.3" y="273.0" width="85.4" height="26.0" rx="13.0" fill="#F4F5F7" stroke="#57606A" stroke-width="1"/>
<text x="797.0" y="290.7" font-size="13" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">internal</text>
<rect x="654.0" y="316.0" width="286.0" height="64.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="797.0" y="352.5" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="middle">虚机原样恢复运行</text>
<rect x="654.0" y="396.0" width="286.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="797.0" y="445.1" font-size="13.5" fill="#57606A" text-anchor="middle">换目标重试，或先存一个新档</text>
<path d="M797.0 132.0 L797.0 152.0" fill="none" stroke="#8C959F" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8C959F)"/>
<rect x="960.0" y="156.0" width="286.0" height="100.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1103.0" y="198.1" font-size="14.5" fill="#9A3215" font-weight="600" text-anchor="middle">提交点之后失败，或回滚调用超时</text>
<text x="1103.0" y="220.7" font-size="12" fill="#57606A" text-anchor="middle">客户机一部分在目标、一部分在现在</text>
<rect x="1076.1" y="273.0" width="53.7" height="26.0" rx="13.0" fill="#F4F5F7" stroke="#57606A" stroke-width="1"/>
<text x="1103.0" y="290.7" font-size="13" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">torn</text>
<rect x="960.0" y="316.0" width="286.0" height="64.0" rx="10" fill="#FCEDE8" stroke="#D6603D" stroke-width="1.3"/>
<text x="1103.0" y="352.5" font-size="14" fill="#9A3215" font-weight="600" text-anchor="middle">撕裂：虚机保持暂停留作分析</text>
<rect x="960.0" y="396.0" width="286.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1103.0" y="445.1" font-size="13.5" fill="#57606A" text-anchor="middle">只能销毁重建</text>
<path d="M1103.0 132.0 L1103.0 152.0" fill="none" stroke="#8C959F" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8C959F)"/>
<rect x="1266.0" y="156.0" width="286.0" height="100.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1409.0" y="198.1" font-size="14.5" fill="#8A5300" font-weight="600" text-anchor="middle">回滚完成，envd 45 秒内不应答</text>
<text x="1409.0" y="220.7" font-size="12" fill="#57606A" text-anchor="middle">宿主侧已完成，虚机在目标时刻</text>
<rect x="1326.6" y="273.0" width="164.7" height="26.0" rx="13.0" fill="#F4F5F7" stroke="#57606A" stroke-width="1"/>
<text x="1409.0" y="290.7" font-size="13" fill="#1F2328" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" text-anchor="middle">guest_unresponsive</text>
<rect x="1266.0" y="316.0" width="286.0" height="64.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="1409.0" y="352.5" font-size="14" fill="#8A5300" font-weight="600" text-anchor="middle">不是撕裂</text>
<rect x="1266.0" y="396.0" width="286.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1409.0" y="445.1" font-size="13.5" fill="#57606A" text-anchor="middle">按业务决定：稍后重试命令，或重建</text>
<path d="M1409.0 132.0 L1409.0 152.0" fill="none" stroke="#8C959F" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8C959F)"/>
<path d="M272.0 206.0 L318.0 206.0 L318.0 132.0 L1409.0 132.0" fill="none" stroke="#8C959F" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48.0" y="354.0" font-size="14" fill="#57606A" font-weight="600" text-anchor="start">沙箱状态</text>
<text x="48.0" y="446.0" font-size="14" fill="#57606A" font-weight="600" text-anchor="start">调用方该怎么做</text>
<line x1="48.0" y1="516.0" x2="1552.0" y2="516.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="542.0" font-size="13" fill="#8C959F" text-anchor="start">注：45 秒刻意低于 SDK 默认的 60 秒超时，让服务端先说清发生了什么；撕裂按 Firecracker 进程这一代记，不按沙箱 ID 记。</text></svg>