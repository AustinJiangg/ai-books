<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="562" viewBox="0 0 1600 562" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="m1F9E77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#1F9E77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m5B9BE6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#5B9BE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="562" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">写层叠在只读底座上：写只落最上层，读从上往下找</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">客户机的所有写都进写层，底座不动；读一个块先看写层，没有再往下找。存档时把写层“封”成只读层，再换一个新的空写层，这一代的磁盘改动就整个留在了被封存的那一层里。</text>
