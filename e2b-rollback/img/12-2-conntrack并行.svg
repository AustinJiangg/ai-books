<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="672" viewBox="0 0 1600 672" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif"><defs><marker id="mD9922B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8" fill="none" stroke="#D9922B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="672" fill="#FFFFFF"/><text x="48.0" y="58.0" font-size="28" fill="#1F2328" font-weight="600" text-anchor="start">连接跟踪清理与回滚并行：暂停后开始，恢复前等它结束</text>
<text x="48.0" y="92.0" font-size="15" fill="#57606A" text-anchor="start">约束只要求“表项在客户机恢复运行之前清完”，不要求“回滚已经完成”。所以暂停一到就在后台开清，和导出、物化、Firecracker 回滚、换盘并行；恢复前等一下，通常早就清完了。</text>
<rect x="48.0" y="166.0" width="1504.0" height="280.0" rx="12" fill="#EAF3FF" stroke="#9CC3F0" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="64.0" y="192.0" font-size="14" fill="#1D4F91" font-weight="600" text-anchor="start">冻结窗口：虚机暂停</text>
<rect x="78.0" y="226.0" width="92.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="124.0" y="258.5" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">暂停</text>
<rect x="178.0" y="226.0" width="152.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="254.0" y="258.5" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">导出脏页</text>
<rect x="338.0" y="226.0" width="252.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="464.0" y="258.5" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">物化</text>
<rect x="598.0" y="226.0" width="292.0" height="56.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="744.0" y="258.5" font-size="14" fill="#8A5300" font-weight="600" text-anchor="middle">Firecracker 回滚</text>
<rect x="898.0" y="226.0" width="152.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="974.0" y="258.5" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">换磁盘</text>
<rect x="1058.0" y="226.0" width="132.0" height="56.0" rx="10" fill="#E3F5EE" stroke="#1F9E77" stroke-width="1.3"/>
<text x="1124.0" y="258.5" font-size="14" fill="#0E6B4F" font-weight="600" text-anchor="middle">等清理</text>
<rect x="1198.0" y="226.0" width="92.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#AEB6BE" stroke-width="1.3"/>
<text x="1244.0" y="258.5" font-size="14" fill="#1F2328" font-weight="600" text-anchor="middle">恢复</text>
<rect x="178.0" y="316.0" width="872.0" height="56.0" rx="10" fill="#FDF0D9" stroke="#D9922B" stroke-width="1.3"/>
<text x="614.0" y="335.6" font-size="14" fill="#8A5300" font-weight="600" text-anchor="middle">后台：清连接跟踪表</text>
<text x="614.0" y="358.9" font-size="12.5" fill="#57606A" text-anchor="middle">命名空间表整表清空 ∥ 宿主表只删本沙箱的表项（攒批，一次整表扫描）</text>
<path d="M182.0 286.0 L182.0 312.0" fill="none" stroke="#D9922B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
<path d="M1030.0 376.0 L1030.0 406.0 L1110.0 406.0 L1110.0 286.0" fill="none" stroke="#D9922B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mD9922B)"/>
<text x="1120.0" y="428.0" font-size="13" fill="#8A5300" font-weight="600" text-anchor="start">join</text>
<rect x="48.0" y="496.0" width="1504.0" height="38.2" rx="6" fill="#F4F5F7" stroke="#57606A" stroke-width="1.1"/>
<text x="58.0" y="518.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">本批地址数</text>
<text x="418.0" y="518.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">1</text>
<text x="778.0" y="518.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">2</text>
<text x="1138.0" y="518.8" font-size="13.5" fill="#1F2328" font-weight="600" text-anchor="start">≥ 3</text>
<line x1="48.0" y1="579.2" x2="1552.0" y2="579.2" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="58.0" y="561.5" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">让内核过滤更便宜的条件</text>
<text x="418.0" y="561.5" font-size="14" fill="#1F2328" text-anchor="start">宿主表 &gt; 约 7000 条</text>
<text x="778.0" y="561.5" font-size="14" fill="#1F2328" text-anchor="start">宿主表 &gt; 约 43000 条</text>
<text x="1138.0" y="561.5" font-size="14" fill="#1F2328" text-anchor="start">永不</text>
<line x1="48.0" y1="606.0" x2="1552.0" y2="606.0" stroke="#D8DEE4" stroke-width="1" stroke-linecap="round"/>
<text x="48.0" y="632.0" font-size="13" fill="#8C959F" text-anchor="start">注：清理代价和整张宿主表成正比；长跑中宿主表约 95% 是与沙箱无关的条目（本机 80 端口短连接残留、本机 DNS），所以宿主流量多时读档会变慢（第 18 篇）。</text></svg>